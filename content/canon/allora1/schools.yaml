- id: mag_hedge
  origin: allora1
  kind: school
  name: The Hedge-Arts
  icon: 🧿
  skills:
    - hedgecraft
  text: |-
    The oldest magic in Eintenn and the least respected. Charms is passed from wise-woman to apprentice, never written down: charms of knotted thread and herb, sympathies between like and like, the reading of a sick cow’s eye. Its practitioners are tolerated by the duke’s law so long as no one dies. Learned from Mother Brindl in the Grauwald; requires a grounding in Herbalism.

    Charms — its workings are charms. Learned: Heard, never written. Sit with a wise-woman and trade her a gift. A charm you do not use for two seasons is forgotten. Cost: No Will — a pinch of herbs, salt, thread or wax. Each charm once a day.
- id: mag_hermetic
  origin: allora1
  kind: school
  name: The Hermetic Art
  icon: ⚡
  skills:
    - evocation
    - warding
  text: |-
    The licensed, academic magic of the Collegium Arcanum, reconstructed from Allorese texts. Its spells are geometric proofs spoken in High Allorese; a misplaced angle can burn the caster as readily as the target. Hermetic mages must matriculate, swear the scholars’ oath and register with the ducal chancery. Evocation calls forth force and fire; Warding bars and binds.

    Evocation — its workings are proofs. Learned: Copied from the Collegium Arcanum’s library for a fee — but only by a matriculated student. Cost: Will and ink. A proof cast too near the edge of your skill can misfire and burn you.

    Warding — its workings are seals. Learned: Copied at the Collegium, or from the wardens of the Fondaco, the Salzmoor, Castroviejo, the Scorched School and Qartosh: parchment, ink and a fee. Cost: Will, salt and ink. Seals last days, not hours.
- id: mag_masque
  origin: allora1
  kind: school
  name: The Silvered Masque
  icon: 🪞
  skills:
    - illusion
  text: |-
    The mirror-magic of Marre. A Marrean illusionist does not make something from nothing: she catches light in a silvered glass and bends it, together with what her audience already expects to see, until the reflection steps out of the frame. The palaces of the City of Sea-Glass are walled with mirrors for this reason, and the Doge’s court is said to be half reflection. Practising Illusion requires a Marrean mirror, made only on the Glass Isles.

    Illusion — its workings are reflections. Learned: Caught in a Marrean mirror, each reflection at its own place in Marre. Cost: Will — and you must carry a Marrean mirror. A reflection sometimes lingers: your double wanders off for a day, and you hear what it got up to.
- id: mag_starward
  origin: allora1
  kind: school
  name: The Starward Reckoning
  icon: 🔮
  skills:
    - divination
  text: |-
    Divination by the heavens, inherited from Rabene astronomers by way of the polyglot court of Sarlon, and refined in the Collegium’s observatory. It can be practised only at night, and horoscopes can only be cast under a clear sky. A reading well made grants Foresight: for a day afterwards, everything you learn comes a little easier.

    Divination — its workings are readings. Learned: Observed: chart the heavens at an observatory, at night, under a clear sky. Cost: No Will — hours at the chart, and parchment and ink.
- id: mag_pact
  origin: allora1
  kind: school
  name: Pact-Calling
  icon: 🌑
  skills:
    - summoning
  text: |-
    The Allorese bound spirits by their true names, written in the dead imperial tongue on the thresholds of their houses. Pact-Callers revive the practice among the ruins of Vaelis. A summoner of the tenth degree keeps a bound spirit that labours at their side — in practice, a whole extra pair of hands.

    Summoning — its workings are pacts. Learned: Read off the lintels of Old Vaelis, in Allorese. Each pact is a name. Cost: Will to call — and a bound spirit holds a fifth of your Will for as long as it stays. Release it when you like.
- id: mag_grave
  origin: allora1
  kind: school
  name: Grave-Lore
  icon: 💀
  skills:
    - necromancy
  text: |-
    Necromancy is a hanging crime in six of the Seven Principalities — and in Grell, a matter on which the Perlin dukes prefer not to be asked. Its only surviving primer is the Black Codex, left behind in the cell of Grell’s last necromancer in the Nameless Charnel above the Nachtwald. Grave-Lore is practised only at night, and every working draws notice. Its great reward is knowledge: the dead remember everything.

    Necromancy — its workings are questions. Learned: Read page by page from the Black Codex, in the Nameless Charnel, at night. Cost: No Will — bones and candles, the notice of the watch, and grave-chill: a day of the cold in your bones.
- id: mag_green
  origin: allora1
  kind: school
  name: The Green Way
  icon: 🌳
  skills:
    - druidism
  text: |-
    Not so much a magic as a relationship. Druids of the Green Way learn to speak with the will of wild places, and the land answers with plenty: every level of Nature Magic increases what you gather in the wild. The Greenwife’s faithful learn it fastest.

    Nature Magic — its workings are asks. Learned: Sit a vigil at a sacred grove. Each ask can only be learned in its own season. Cost: No Will — offerings, and the land remembers. Every ask adds to your debt; a heavy debt makes the wild give less, until it fades or you give back.
- id: mag_stave
  origin: allora1
  kind: school
  name: Stave-Craft
  icon: 🪄
  skills:
    - runecraft
  text: |-
    The northern carvers of the Hohenkamm cut the Old Runic letters into staves of seasoned wood, and the runes, once cut, hold. A rune-stave carried on the person is a quiet blessing: each of the first five you keep makes all your learning 3% easier. Requires Old Runic and Carpentry.

    Runecraft — its workings are staves. Learned: Taught by the carvers of the Hohenkamm, to those who read Old Runic. Learning a stave teaches you to cut it. Cost: Nothing is cast. A stave is cut from wood at a workbench, and works while you carry it. Five staves work at once.
- id: mag_hollow
  origin: allora1
  kind: school
  name: The Hollow Lights
  icon: 🏮
  skills:
    - lanterncraft
  text: |-
    Grellish lantern-wrights catch will-o’-wisps in the Nachtwald and bind them into lanterns of glass and candle. The wisp is a fragment of the night itself; by its glow, it is always the hour of the dead. Light a wisp lantern and for a day you may do anything that can only be done at night. Light Magic is practised only after dark.

    Light Magic — its workings are lights. Learned: Caught: a wisp of the right colour, in the bogs of the Nachtwald, at night. It may get away. Cost: No Will — a wisp and a candle for each light.
- id: mag_fey
  origin: allora1
  kind: school
  name: Hill-Bargaining
  icon: 🧚
  skills:
    - feybargain
  text: |-
    In the Fairmeadows of Rolla the Gentry of the hills still deal with mortals, at dusk and at dawn, across the rings of mushrooms. A bargain is always kept — by their reckoning, which is not ours. A gift of wine opens the talks. What comes back may be gold, a blessing, a secret name, a rare treasure, or a dance that turns out to have lasted much longer than it seemed. Skill improves the odds; nothing removes the risk.

    Hill-Bargaining — its workings are bargains. Learned: Never learned — offered. Open the talks with wine at the rings at dusk or dawn, and the Gentry will offer you bargains. Cost: No Will. Every bargain has a price, and the Gentry collect it later, when they please: a memory, a name, a day, your luck, your voice.
- id: mag_soft
  origin: allora1
  kind: school
  name: The Soft Light
  icon: 🕯️
  skills:
    - lumencraft
  text: |-
    The theurgy of Dell’s clergy. A lamp lit with Light Magic casts a light in which people find it hard to lie and harder to hate: Dellian mediators work by it, and treaties are signed beneath it. Each level of Light Magic dims the notice your misdeeds draw, and its adepts kindle Lamps of Accord that make the watch forget you entirely. Taught in Dellmont to those versed in Theology and Mediation.

    Light Magic — its workings are lamps. Learned: Taught in Dell’s churches — Dellmont, Vescova, Valmonte and Ceraluce — to those in good standing with the Church. Cost: No Will — candles and lamp-oil. A lamp is set in one place, and only works while you are there.
- id: mag_grandeur
  origin: allora1
  kind: school
  name: La Grandeur
  icon: 🧌
  skills:
    - grandeur
  text: |-
    The giant-magic of the Phrell, recovered from the throne-script of Vérangue by those who have read every Phrellic text the University knows and mastered the tongue they were written in. Drunk at the Throne of the High Ones or worked anywhere by a master, la Grandeur swells the body: strength, endurance, a giant’s toughness and a giant’s reach. But every working leaves you a little larger, and largeness has its price — rooms that will not hold you, clothes that will not fit, people who will not meet your eye, and at the last a mind grown slow and vast. It ebbs, slowly, if you let it. The Phrell did not.

    La Grandeur — its workings are swellings. Learned: Read from the throne-glyphs at the Colossi of Vérangue. Cost: No Will — Bulk. Every working leaves you a little larger, with all that brings.
- id: mag_hush
  origin: allora1
  kind: school
  name: The Hush
  icon: 🤫
  skills:
    - hushcraft
  text: |-
    The whisper-magic of the Callum, learned in the Last Hush beneath Sotterra by those who have read the knot-tallies to their end and speak the hush-script fluently. A hushed working turns attention aside: watchmen look through you, locks are forgotten, ambushers wonder why they stopped. But the hush does not discriminate. Every working leaves you a little more forgotten — friends, patrons and faiths remember you less, and at the last you begin to forget yourself. It fades, slowly, if you let it. The Callum did not.

    The Hush — its workings are hushs. Learned: Whispered in the Last Hush beneath Sotterra. Cost: No Will — Fade. Every working leaves you a little more forgotten.
- id: mag_pyro
  origin: allora1
  kind: school
  name: Pyromancy
  icon: 🔥
  skills:
    - battlemagic
  text: |-
    The Sillenians came over the sea with fire in their hands, and Gallar has never forgotten it. Their pyromancy is a soldier’s art, not a scholar’s: fire called from the air, shaped by will and thrown at an enemy. It survives at the Scorched School of Drell, the oldest battle-mage college in Gallar, which teaches it from the old Sillenian treatises and hires its graduates to whichever Freehold pays. It needs Willpower and Literacy to begin; it is learned in the Burning Yard and proven in the Crucible.

    Pyromancy — its workings are callings. Learned: Drilled in the Burning Yard and proven in the Crucible of the Scorched School. A failed proof burns. Cost: Will — and scorch: sometimes the fire takes a little of you too. The great callings need scorch-salt.
- id: mag_dream
  origin: allora1
  kind: school
  name: The Dreaming of Nim
  icon: 💤
  skills:
    - dreaming
  text: |-
    Nimian dreaming is entered, not cast. Under a draught brewed from the fen-fungus ghostcap, a trained sleeper goes down into a deliberate dream and brings back something true: a judgement, for the Sleepers of Ripla; a glimpse of what is coming, for the recluses of Nim. It needs Meditation to begin, and the draughts that only the Nimians can brew.

    Dreaming — its workings are descents. Learned: Dreamt. Every descent may teach you another. Cost: No Will — dreaming refills it. A Nimian draught, and six hours asleep.
- id: mag_witchlore
  origin: allora1
  kind: school
  name: Witchlore
  icon: 🧿
  skills:
    - witchlore
  text: |-
    The Witch-Queens of Wocca work a magic fed on the dead: auras that cow and befuddle, and great slow workings that turn a region’s weather to killing winter. No outsider may learn it. Witchlore is the knowledge of how to see it coming and keep your wits within it — taught by those who have stood near it and lived, from the guest-hall below Wocca to Shella’s Watch-Line.

    Witchlore — its workings are countersigns. Learned: Told by those who stood near the Witch-Queens’ magic and lived: on the Watch-Line, at Waerstead, in Eorlhall and Hæringhythe. (Witch magic itself can never be learned.) Cost: Will.
- id: mag_geo
  origin: allora1
  kind: school
  name: Geomancy
  icon: 🔺
  skills:
    - geomancy
  text: |-
    Ahnara’s magic is drawn from perfect shapes. A true right angle holds a little power; a perfect solid holds a great deal — enough to hold a soul, or a river’s flood. The geomancers of the College of Angles survey, measure and build, and their tombs in the Valley of Solids hum at dusk with everything they hold. It needs Mathematics to begin. It is first learned by drafting and measuring at the College of Angles in Ahnara, at the Angle-Tower of Cedargate, and wherever the Ahnari lay out a field or a tomb.

    Geomancy — its workings are figures. Learned: Proven at the College of Angles: a proof in parchment that may not close. Cost: Materials — stone, star-lapis, clay. A figure is built into one of your homes, three to a home, and works whenever you are there.
- id: mag_names
  origin: allora1
  kind: school
  name: Name-Binding
  icon: 🗿
  skills:
    - namebinding
  text: |-
    In Raben a true name written on clay binds what it names. The winged bulls of Assar’s gates stand and bow because their names are kept in the Tablet-House; the Hanging Gardens hang because their names are cut in the foundation-stones. Name-Binding needs Rabena and Willpower to begin. It is first learned in the Tablet-House, copying the bulls’ names under a master scribe, and at the Bull-Gate of Assar, keeping the night-watch with the bull-keepers.

    Name-Binding — its workings are names. Learned: The names of the bulls are copied in the Tablet-House and at Assar’s gate. Your friends tell you their names when they come to trust you. Cost: Clay tablets. A binding holds until its tablet cracks.
- id: mag_red
  origin: allora1
  kind: school
  name: Red-Reading
  icon: 🩸
  skills:
    - redreading
  text: |-
    The Rephaim of Elissar read lives the way the living read scrolls: from a single drop of blood, freely given. Every borrower from the Library of the Long Night pays a drop into the Red Ledger, and the Ledger is, in its way, the most complete history of the west. A living reader can learn the art, slowly, from the Readers of the Long Night. It needs Insight and Willpower to begin; it is first learned by watching Gisgal read at the Red Ledger, by night. It sees much; it changes nothing; and it is never practised on blood that was not given.

    Red-Reading — its workings are readings. Learned: Paid in blood: watch Gisgal at the Red Ledger by night, and give your own drop. Cost: A drop of blood freely given — a friend’s, once a season each, or your own. It sees much and changes nothing.
- id: mag_corners
  origin: allora1
  kind: school
  name: Demonology
  icon: ⬛
  skills:
    - demonology
  text: "Demonology is summoning from the four unlucky corners, and it needs no worship. A summoner cuts or finds a square — the only shape with all four Corners — opens one, and bargains with the angular that comes through. The Hinge opens and binds; the Kiln transforms; the Maw grows and devours; the Unreckoned finds and loses. Every bargain has a price that is not coin: a promise collected later, a chill, a hunger, a memory. It is licensed in Plandor’s Round Courts and worshipped openly in the south, and the deeper the Hum, the stronger it works. Calder, Qo and the Voice in the Tent disapprove of it; Laishma and Gruma rather like it."
- id: mag_facets
  origin: allora1
  kind: school
  name: Facetcraft
  icon: 💠
  skills:
    - facetcraft
  text: "Facetcraft is crystal magic: cutting Seylon crystal so that it holds a working. Each facet holds one and is spent when used. The three Lapidary Houses of Khaderun each teach only their own cuts — Clear for wards and light, Veiled for hiding and keeping, Deep for weight and time — and only to their own sworn apprentices. Every House teaches the Vessel, which can catch a spell from any other tradition and release it later: the bridge between eastern magic and western. In the Murmur crystal sings and works the stronger; in the Drone it may crack; in the Choir it usually does."
- id: mag_verse
  origin: allora1
  kind: school
  name: Verse-Burning
  icon: 📜
  skills:
    - verseburning
  text: The Burning Hand school of Topila burns its poems into shell-wood with a sun-lens, so that every word costs heat and time — and its Verse-Wrights found that a verse burned true into a thing makes the thing what the verse says it is. Inscription is learned on the Table of the Burning Hand by day and on the Lantern Reach of the Lumbre by river-light. A few of its verses are read aloud for a day’s effect; most are burned into gear as enchantments, twenty of them, from the Single Line to the Laureate’s Verse, laid at a mirror-array with poem-banners and sun-glass.
- id: mag_hollowmasque
  origin: allora1
  kind: school
  name: The Hollow Masque
  icon: 🎭
  skills:
    - illusion
    - necromancy
    - alteration
  text: "Grell’s Mask-Wardens keep the death-masks of the great, and know that a mask of the dead, worn rightly, lends you a little of who they were. They lend masks only on the Hollow Nights, and only to Gruma’s Lantern-Bearers or those they honour. Each face you wear wears your own a little thinner; a Hollow Night gives it back. Disciplines: Illusion, Necromancy, Alteration."
- id: mag_crucible
  origin: allora1
  kind: school
  name: The Crucible Art
  icon: 🏺
  skills:
    - battlemagic
    - evocation
    - transmutation
  text: "The Collegium’s proofs were born in Sillenian fire. A handful of Scorched School masters, matriculated at Kesselhaven, reunite the two in a palm-sized crucible: a calling held inside a closed proof, so that it can be kept, measured and released later. Nobody is taught a crucible working outright. You must bring a proof and a calling you already know, near the new working’s depth, and the masters re-forge them into it. Disciplines: Pyromancy, Evocation, Transmutation."
- id: mag_skytablets
  origin: allora1
  kind: school
  name: The Tablets of the Sky
  icon: 🏺
  skills:
    - namebinding
    - divination
    - astrology
  text: "The priests of the Tell of Years hold that each Wanderer has a name, and that a name fired into star-clay at the right hour carries its Wanderer’s temper for as long as the tablet lasts. A tablet lasts until its Wanderer leaves the House it was fired in, and then it cracks. Disciplines: Name Magic, Divination, and Astrology."
- id: mag_lattice
  origin: allora1
  kind: school
  name: The Singing Lattice
  icon: 💠
  skills:
    - facetcraft
    - geomancy
    - humreading
  text: "In Khaderun some houses are built around crystal lattices that hum with the Murmur. A Lapidary House cuts the crystal and a Measurer of the Angles lays the figure; the lattice holds the hum and gives it back. Only someone who already knows a cut and a figure can learn to build one, and a lattice in the Drone cracks. Disciplines: Crystal Magic and Geomancy, with Hum-Reading."
- id: mag_shadewalk
  origin: allora1
  kind: school
  name: The Shade-Walk
  icon: 🌑
  skills:
    - illusion
    - sneaking
    - tracking
  text: "Under the jungle south of Therama live the Vessi, a small dark people who sleep in hammocks in the roots of the giant trees. To be seen by a giant is to be stepped on, so for longer than anyone remembers the Vessi have practised not being looked at. Their magic is the Shade-Walk: Illusion turned inside out. Marre’s masquers make the eye see something; a Vessi hunter makes it see nothing, and their elders can send their own shadows ahead of them to walk where they dare not. They write nothing down. Every working is taught on a hunt in the dark of the moon, by an elder, to one person at a time. Disciplines: Illusion, with Sneaking and Tracking."
- id: mag_rimewatch
  origin: allora1
  kind: school
  name: The Rime-Watch
  icon: ❄️
  skills:
    - alteration
    - warding
    - icecraft
  text: "The Deichmarsch is land taken from the sea, and in the winter storms the sea comes back for it. The Rime-Watch is a sworn watch of dike-reeves paid by the Republic of Luggen. On the worst nights they stand on the dike and change the water breaking over it, so that it stops and stands as ice. Nothing is taught: a working is granted, by the Watch, to those who have stood enough watches. Winter nights count double and the Surge five times over. They have never lost the Marsh. Disciplines: Alteration and Warding, with Ice-Craft."
- id: mag_longwake
  origin: allora1
  kind: school
  name: The Long Wake
  icon: 🪱
  skills:
    - transmutation
    - druidism
    - mycology
  text: "On Hobb’s Furrow the dead are not buried in churchyards. They are ploughed into the fields they worked, and the Great Wake at the end of autumn is a feast over the new graves. The furrow-folk say nothing dies; it only changes fields. Their magic is rot made useful, hurrying dead things into living ones, and it is not taught at all: a working is planted, in a bundle of rot, and dug up when it is ripe. Seronia’s Ringed call it grave-theft. Every farmer in Gramall loves it. Disciplines: Transmutation and Nature Magic, with Mycology."
