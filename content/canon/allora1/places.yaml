  icon: 🦉
  x: 34
  y: 30
  wild: true
  description: Black fir and moss-hung beech climbing the mountainsides above Perlinburg. Will-o'-wisps drift between the trunks at night, charcoal-burners leave bowls of milk on stumps, and on the Hollow Nights the Wild Hunt comes down from the peaks.
