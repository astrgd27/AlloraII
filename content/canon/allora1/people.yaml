- id: ppl_rc_steward
  origin: allora1
  kind: person
  name: Old Steward Ammaru
  title: Eldest of the Holdovers
  icon: 🗝️
  region: reach
  text: The eldest of the Holdovers is a tiny, very straight woman of ninety who keeps the rent-square at the edge of their village and leaves the year’s tithe in it with her own hands. She regards everyone from Thoolma as the grandchildren of tenants who left without settling their account, and treats them with the polite, exact courtesy of a landlady towards someone else’s guests.
  see: At the edge of the village a tiny old woman sets a bowl of grain in a stone square, cuts her thumb over it, and walks away without looking back.
