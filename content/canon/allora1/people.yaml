- id: ppl_albrecht
  origin: allora1
  kind: person
  name: Albrecht IV von Tennfels
  title: Duke of Eintenn
  icon: 🦅
  region: eintenn
  text: "The Salt-Duke is sixty, gouty, shrewd and very hard to kill: he has outlived two wives, one war and three conspiracies. As a young man he carried his father’s banner off Sankt Wendel’s Field after the Eintennish knights broke on the Sarlonese pikes, and he has distrusted cavalry, Sarlon and enthusiasm ever since. He taxes salt so heavily that the Salzmoor is thick with smugglers, hunts every morning the gout allows, and keeps a library of chronicles that he actually reads."
  see: The Salt-Duke rides out to hunt, wrapped in furs, his hounds baying around him. He looks straight at you for a moment, as if memorising your face.
- id: ppl_margarethe
  origin: allora1
  kind: person
  name: Margarethe von Tennfels
  title: Heiress of Eintenn
  icon: 🦅
  region: eintenn
  text: The duke’s only surviving child is twenty-four, an excellent falconer and a better accountant, and she studied two years at the Collegium Arcanum under an assumed name before her father found out. The barons of Eintenn have not decided how they feel about being inherited by a woman; Margarethe has decided not to wait for them. She corresponds with half the merchant houses of Luggen, and it is said in Kesselhaven that the Salt-Council already brings its real business to her.
  see: A hawking party trots out of the castle gate. At its head, a hooded falcon on her fist, rides the duke’s daughter, Lady Margarethe, arguing about tolls with a Luggish merchant who is struggling to keep up.
- id: ppl_hartwig
  origin: allora1
  kind: person
  name: Hartwig Kolbe
  title: Six-Year Prince of Luggen
  icon: ⛵
  region: luggen
  text: Hartwig Kolbe made his fortune in stockfish and his reputation by never once being caught short-weighting a barrel. The merchant houses elected him Prince four years ago because he was the one candidate every house trusted to be equally unhelpful to all of them. He has kept the Prince’s Hall as plain as a counting-house, cut the timber tolls, quarrelled with the Kontor League, and keeps a calendar on his desk with the days of his reign crossed off in red. They call him the Ledger, not unkindly.
  see: The Six-Year Prince, Hartwig Kolbe, walks to the Exchange in his fur-trimmed red with a single clerk and no guard at all, stopping to check the weight of a stockfish barrel on the way.
- id: ppl_rowan
  origin: allora1
  kind: person
  name: Rowan III
  title: King of Sarlon
  icon: 👑
  region: sarlon
  text: Rowan III is forty, tall, bookish and dangerous. He speaks five languages, keeps Rabene astronomers at his court and a troupe of players in his palace, and has never lost a war he started. His lords obey him because he is strong and fight one another because he lets them. He sends Sarlonese chancellors to Grell the way other kings send wedding gifts, and is said to read every report his envoy sends from the Dellian Diet twice.
  see: "Trumpets: King Rowan rides through Valmonte with his lords, bare-headed, reading a letter in the saddle as the crowd cheers."
- id: ppl_ocampo
  origin: allora1
  kind: person
  name: Baltasar de Ocampo
  title: Chancellor of Grell
  icon: 📜
  region: grell
  text: The third Sarlonese chancellor in a row to hold the seals of Grell is a soft-spoken, scrupulously courteous man of fifty who has learned excellent Grellish, attends every Hollow-Night procession masked, and reports to Valmonte by every post. The Grellish dislike him less than they expected. Duke Ottwin, who prefers masks to ministries, lets him run the duchy, and the two of them are seen walking together on the walls most evenings, talking about anything but politics.
  see: A black-clad man with a Sarlonese chain of office crosses the square under a parasol held by a page — Chancellor de Ocampo, bowing gravely to the Mask-Wardens as he passes.
- id: ppl_ottwin
  origin: allora1
  kind: person
  name: Ottwin Perlin
  title: Duke of Grell
  icon: 🐺
  region: grell
  text: The present Duke of Grell is a melancholy, kindly, faintly ghostly man of forty-five, a collector of masks and a patron of the University of Perlinburg, who leads the Hollow-Night procession wearing his grandmother’s face. His wife and two sons died of a spotted fever in one bad winter, and he has never remarried; his heir is a nephew he has not met. He pays tribute to Sarlon whenever asked and lets Chancellor de Ocampo govern, and the Grellish love him for the one thing he does well, which is grieve.
  see: At dusk a lone figure in an old woman’s mask walks the walls of Perlinburg, and the guards stand very straight as he passes. It is the duke.
- id: ppl_montfalco
  origin: allora1
  kind: person
  name: Casimir Montfalco
  title: Arch-Bishop of Dellian
  icon: 🏮
  region: dellian
  text: His Serenity the Arch-Bishop is seventy-four, blind in one eye and entirely clear-sighted in the other. Fifty years ago he was the junior notary who drafted the peace after Sankt Wendel’s Field; he has since served as legate at every court of the Seven and speaks all their languages better than their kings. He presides over the Diet from his chair a careful half-step outside the circle and has never, in twenty years, been caught favouring anyone. The question of who will succeed him is the most dangerous subject in Dellmont, and he knows it, and appears to enjoy it.
  see: "A procession of shaded lamps crosses the square: the Arch-Bishop, Casimir Montfalco, walking slowly on a notary’s arm, turns his good eye on you and inclines his head as if you had been introduced."
- id: ppl_twins
  origin: allora1
  kind: person
  name: Leto and Lia
  title: The Twin Kings of Rolla
  icon: 👑
  region: rolla
  text: The children of the vanished King Aurelio were crowned together at six, since nobody could agree which had been born first. Now nine, they sit side by side on two small thrones in Valdora and have strong opinions about calcio (opposing ones). Leto is loud, generous and lazy; Lia is quiet, watchful and keeps a list. The court has begun, very cautiously, to wonder which of them will be the real king.
  see: On the balcony above the piazza the Twin Kings are cheering for opposite calcio sides. Lia notices you watching, and writes something down.
- id: ppl_aurelio
  origin: allora1
  kind: person
  name: Aurelio
  title: The Lost King of Rolla
  icon: 🧚
  region: rolla
  text: Aurelio was a big, laughing, careless king who loved wine, horses, music and bargains, and was very good at three of them. Three years ago he rode out alone to the Fairmeadows at dusk, saying he had a bargain to keep, and his horse came home at dawn. The Hearth-Church holds that he is dead and has said the masses. Half of Rolla holds that he is merely busy, and a surprising number of travellers swear they have shared a cup with him at some country inn, late at night, under another name.
  see: ""
  alt:
    - aurelio_home
    - Aurelio was a big, laughing, careless king who loved wine, horses, music and bargains. He rode into the hill under the Fairmeadows three years ago to win back a shepherd’s child from the Gentry, and paid for her with his own freedom. He could leave tomorrow, and the child would be taken again; so he stays at the Lady’s table, drinking her wine and cheating at her dice, and has made you one of the very few people in the world who know why.
- id: ppl_valcorvo
  origin: allora1
  kind: person
  name: Beatrice Valcorvo
  title: Lady Regent of Rolla
  icon: ⛲
  region: rolla
  text: Contessa Beatrice Valcorvo is the lost king’s cousin, a widow of fifty with a famous vineyard, a famous temper and the presidency of the regency council that rules in the Twin Kings’ name. She fights the Marrean ambassador on the council the way Rollans play calcio — with no rules to speak of — and has so far kept Marre’s influence to advice, loans and three bridges. Everyone assumes she wants the crown. She says that if Aurelio walks out of the hill tomorrow she will be the first to hand him a cup.
  see: The Lady Regent sweeps out of the council-house in black silk, with the Marrean ambassador half a step behind her, still talking. She does not slow down.
- id: ppl_morvan
  origin: allora1
  kind: person
  name: Alvise Morvan
  title: Marrean Ambassador to Rolla
  icon: 🪞
  region: rolla
  text: Ser Alvise Morvan of the Ten Families is the Republic’s ambassador in Valdora and the only foreigner with a seat on the regency council. He is charming, patient, impeccably dressed and always reasonable, and somehow every reasonable thing he suggests ends with a Marrean loan, a Marrean bridge or a Marrean bride. The Rollans call him the Mirror, because whatever you say to him, you see yourself agreeing.
  see: A gondola-shaped carriage with mirrored windows rolls past. Through the glass you glimpse the Marrean ambassador, Ser Alvise, smiling at something only he can see.
- id: ppl_agathe
  origin: allora1
  kind: person
  name: Agathe of Valdora
  title: High Hearth-Mother
  icon: 🔥
  region: rolla
  text: The head of Ilvara’s Hearth-Church is a broad, floury, formidable woman who was a village baker until she was fifty and has run the most orderly church in the Seven for twenty years since. She keeps the Mother-Hearth in Valdora, preaches against the Pyre-Wardens with real heat, and has excommunicated two dukes for burning grain. She has also baked for the Twin Kings every Sunday since their father vanished, and is said to be the only person both of them obey.
  see: A white-aproned old woman with a key on her belt walks from the Mother-Hearth with a basket of loaves, blessing doorways as she goes. People kneel. It is the High Hearth-Mother.
- id: ppl_grimassi
  origin: allora1
  kind: person
  name: Ottaviano Grimassi
  title: Doge of Marre
  icon: 🪞
  region: marre
  text: The Doge is eighty-one and shows no sign of dying, which several of the Ten Families regard as a breach of etiquette. He was elected as a compromise candidate expected to last a year or two, nineteen years ago. He is very small, very old, very rich, and has outlived every rival by the simple method of being underestimated by each in turn. On the Feast of the Lagoon he casts a mirror into the sea, and every year the crowd bets on whether he will follow it in. He never has.
  see: The Doge’s gilded barge glides down the Grand Canal under its canopy of mirrors. A tiny, ancient figure inside raises one hand to the crowd without looking up.
- id: ppl_holle
  origin: allora1
  kind: person
  name: Ansgar Holle
  title: Master of Antiquities at Perlinburg
  icon: 🏺
  region: grell
  text: The Master of the University’s Department of Antiquities is a lanky, dust-coloured man of sixty who has spent forty years digging the giants’ ruins of the west, and believes — against most of his colleagues — that the Callum were real, that they hid from the Phrell, and that he will live to prove it. His predecessor tasted the residue of a Phrellic phial in 1312 and is buried in the Bone-Chapel in a coffin nine feet long; Holle keeps the phials locked in his own cabinet, and the key on a chain around his neck.
  see: ""
- id: ppl_matton
  origin: allora1
  kind: person
  name: Matton
  title: The Pheasant-King, bandit of Rolla
  icon: 🪶
  region: rolla
  text: Matton was King Aurelio’s chief huntsman, and the regency dismissed him a month after the king vanished — for insolence, the council said; for asking where the king had gone, Matton says. He took to the hills with forty of the royal foresters and a cloak of pheasant feathers, and now rules a small, cheerful, well-armed enclave in a cave behind a waterfall. He robs Marrean convoys and the regency’s tax-carts, never villages; he pays for his wine; he holds court like a king. Half of Rolla’s shepherds would hide him. It is said he knows exactly which hill Aurelio walked into, and has been waiting outside it for three years.
  see: ""
- id: ppl_zanetta
  origin: allora1
  kind: person
  name: Zanetta Brusà
  title: First of the Loop-Lords of Selino
  icon: 🪻
  region: marre
  text: Madonna Zanetta owns a third of the Lilac Loop outright and holds paper on most of the rest. She began as a ship’s cook on the eastern galleys, came ashore at thirty with a chest of Rabene pearls nobody asked about, and has spent thirty years since buying houses on the one road in Selino that goes round in a circle. She pays the Doge’s customs-men better than the Doge does, keeps the peace on the Loop with a light hand and a heavy doorman, and is godmother to half the island.
  see: "A small, plump old woman in lilac silk is carried round the Loop in a litter, nodding to doorkeepers and croupiers who straighten as she passes: Madonna Zanetta."
- id: ppl_vollrath
  origin: allora1
  kind: person
  name: Ottilie Vollrath
  title: Head of House Vollrath
  icon: 🏦
  region: luggen
  text: The matriarch of Luggen’s oldest banking house is seventy, deaf in one ear, and holds the deposit-ledgers of half the League in her head. The Vollraths were wool-factors when Luggen was a fishing village; they joined three lesser families into one house — an albergo, as the Marrean-trained clerks still call it — took one name and one strongbox, and have lent money to every Prince of Luggen since. Ottilie despises the Fiesch as gamblers who happen to own ships, and has been heard to say so in the Mother-Hall of Currents, which is not done.
  see: "An old woman in black wool with a silver ear-trumpet is helped down the Exchange steps by two clerks, and the whole floor goes quiet as she passes: Ottilie Vollrath."
- id: ppl_fiesch
  origin: allora1
  kind: person
  name: Lambert Fiesch
  title: Admiral of the League
  icon: ⚓
  region: luggen
  text: Admiral Lambert Fiesch commands the League’s galleys and owns most of them, which in Luggen counts as the same thing. Handsome, loud and fifty, he is the fourth Fiesch admiral in a row, rules the war-port of Grauhafen like a duke without the title, and pays the finest crossbowmen in Allora — the Grauhafen companies, who have fought for every power in the Seven at one time or another, under contract and in good order. He borrows from the Vollraths, outbids the Spindlers, and wants to be Prince. The merchant houses are determined he never will be.
  see: A galley rows into the harbour under the Fiesch black-and-gold; on the poop stands Admiral Lambert, waving his hat to the crowd as if he had won a battle on the way in.
- id: ppl_spindler
  origin: allora1
  kind: person
  name: Agathe Spindler
  title: Lamp-Prelate of the Circle
  icon: ⛵
  region: dellian
  text: Prelate Spindler was born into the Luggish banking house of the same name, gave her share of it to the poor at twenty, and has run the Curia’s alms and hospices ever since with a merchant’s eye for waste. She is brisk, plain and adored by the lamplighter-novices. Her family still sends her money; she still gives it away.
  see: ""
- id: ppl_gesche
  origin: allora1
  kind: person
  name: Gesche Brandt
  title: Mother of the Lights, Hungersand
  icon: 🕯️
  region: luggen
  text: On the sandbank island of Hungersand, where the wreckers live in houses built out of ships, Gesche Brandt decides on which nights the false lights are hung. She is a widow — her husband went down with a cog the year the Fiesch fleet would not stand by in a storm — and the wreckers swear she has never lit a lantern under a League flag that did not deserve it. The League has hanged three Mothers of the Lights in a hundred years. It has never found the fourth.
  see: ""
- id: ppl_gonzalo
  origin: allora1
  kind: person
  name: Gonzalo de Montaraz
  title: Count of Torrealba
  icon: 🐎
  region: sarlon
  text: The head of House Montaraz is sixty-six, lame from a lance-wound taken at Sankt Wendel’s Field, and still the finest horseman on the plateau. His house has held Torrealba for four hundred years by never once retreating and never once reading a contract properly. He breeds the best warhorses in Sarlon, keeps fifty knights at his table and a fire-mage in his tower, and has spent the last twenty years in a feud with the Ribadoros over a stretch of drove-road, a dowry and a dead hound, in that order of importance.
  see: "An old lord rides through the horse-fair on a grey stallion, stick across his saddle-bow, and every horse-coper in Torrealba takes off his hat: Count Gonzalo."
- id: ppl_ines
  origin: allora1
  kind: person
  name: Inés de Vela
  title: Battle-Mage of Torrealba
  icon: 🔥
  region: sarlon
  text: Maestra Inés de Vela studied the Hermetic Art at the Collegium Arcanum in Kesselhaven — the only Sarlonese woman ever to matriculate there — and came home to find no one in Valmonte would employ a fire-mage who had trained among the enemy. Count Gonzalo would. She has held Torrealba’s fire-tower for fifteen years, burned two Ribadoro siege-towers and one Grellish raiding-party, and drills the Montaraz knights in what she calls “standing still while I set things on fire behind you”.
  see: "From the top of Torrealba’s fire-tower a line of flame runs along the wall and goes out. Below, the knights at drill do not even look up: Maestra Inés is practising."
- id: ppl_alvaro
  origin: allora1
  kind: person
  name: Álvaro de Ribadoro
  title: Marquess of Castroviejo
  icon: 🦚
  region: sarlon
  text: "Don Álvaro is forty, thin, delicate, a patron of poets and King Rowan’s Treasurer, and the cleverest man in Sarlon after the king. His grandfather was a wool-merchant who bought a marquisate; his father bought the tolls of the Great Drove-Road; Álvaro bought the Crown’s debts, which is why the king listens to him. The Montaraz call him the Fleece. He has never held a sword in anger, and has never needed to: his star-reader guards his walls, and his ledgers guard everything else."
  see: "A pale man in black velvet is carried through Castroviejo’s wool-market in a curtained litter, reading. He looks up only to correct a toll-keeper’s arithmetic: the Marquess."
- id: ppl_marishtu
  origin: allora1
  kind: person
  name: Mar-Ishtu
  title: Star-Reader of Castroviejo
  icon: ✨
  region: sarlon
  text: Mar-Ishtu came from Assar in Raben with a chest of clay omen-tablets and a reputation, and House Ribadoro outbid the king for her. She reads the stars for battles, the livers of sheep for harvests and the faces of envoys for lies, and she has bound the walls of Castroviejo with Rabene wards that no one in Sarlon fully understands. The Montaraz say she is a witch. Maestra Inés, who has tried to burn those walls, says she is merely very good.
  see: ""
- id: ppl_osorio
  origin: allora1
  kind: person
  name: Fernán Osorio
  title: Captain of the Wolf’s Gate
  icon: 🚩
  region: sarlon
  text: Captain Fernán Osorio, called the Wolf, has held the Wolf’s Gate for the Crown for eighteen years without leave. He is a grim, fair, grey-bearded soldier who knows the name of every man in his garrison and of every smuggler on the pass, lets the second sort through when it suits him, and regards the Grellish across the border with something between contempt and affection. He reports to King Rowan directly, which annoys every lord between the Gate and Valmonte.
  see: "A grey-bearded captain walks the walls of the Wolf’s Gate at dusk, stopping at every sentry: Captain Osorio."
- id: ppl_nabu
  origin: allora1
  kind: person
  name: Nabu-iddin
  title: Royal Astronomer of Sarlon
  icon: 🔭
  region: sarlon
  text: The Royal Astronomer is a Rabene of Tarsena, the twelfth of his family to hold the post, and the observatory on Monte Claro is more or less his family’s house. He is courteous, unhurried and seventy, reads the tablets his ancestors brought from Assar as easily as a ledger, and casts the king’s horoscope every new year — a document so carefully worded that it has never once been wrong. He is said to have predicted Rowan’s every war, and to have advised against all of them.
  see: ""
- id: ppl_ninsar
  origin: allora1
  kind: person
  name: Ninsar Bar-Parod
  title: Rabene Consul in Tarsena
  icon: 🌴
  region: sarlon
  text: "The consul of the Rabene merchants in Tarsena is a big, bearded, beautifully dressed Spear-Brother of fifty, chief of a lodge of a hundred, owner of eleven ships, and the man every Sarlonese official in Tarsena must go through to get anything done in the Old Quarter. He calls King Rowan “my brother”, which Rowan finds amusing and the Sarlonese lords do not. His name means that his father was dedicated to Parod, and Ninsar has kept the dedication: he leads the storm-feasts on the headland himself."
  see: "A great bearded man in a fringed robe strides down the Old Quarter with a dozen Spear-Brothers at his back, handing out coins to children: Ninsar Bar-Parod, the consul."
- id: ppl_shalumtu
  origin: allora1
  kind: person
  name: Shalumtu
  title: First of the Coils
  icon: 🐍
  region: sarlon
  text: The high priestess of the Serpent-House is small, old and very still, and wears a live adder around her throat on holy nights. She has been bitten, by her own count, a hundred and forty times. She speaks seldom, in Rabena only, and the physicians of Valmonte send her their hopeless cases. Those who come back say she asked them only one question — what are you afraid of? — and listened to the answer for a very long time.
  see: ""
- id: ppl_querzi
  origin: allora1
  kind: person
  name: Marin Querzi
  title: Capo of the Cerdans
  icon: 🔍
  region: marre
  text: The head of the Republic’s investigators is a small, neat, soft-spoken man of fifty who has never been seen to hurry or to forget a face. He came up from the Arsenal as a carpenter’s son, joined the Cerdans as an informer at fifteen, and has sent two senators of the Ten Families to the Leads — a feat no Capo before him managed even once. The Families fear him. The Doge, it is said, keeps him precisely because the Families fear him.
  see: "A small man in plain black walks across the Piazza with two constables a step behind, and conversations stop as he passes: Capo Querzi."
- id: ppl_vianel
  origin: allora1
  kind: person
  name: Orsola Vianel
  title: The Blind Mirror, chief scryer of the Cerdans
  icon: 🪞
  region: marre
  text: Madonna Orsola lost her sight in a silvering accident on the Glass Isles at nineteen, and found that she could see in mirrors anyway — clearly, and further than anyone living. She runs the Cerdans’ Mirror-Room, where scryers watch the city in angled glasses and see through every illusion the Masque can weave. Illusionists in Marre lower their voices when they say her name.
  see: ""
- id: ppl_piero
  origin: allora1
  kind: person
  name: Piero Grimassi
  title: Head of Ca’ Grimassi
  icon: 🪞
  region: marre
  text: The Doge’s nephew runs the family while his uncle runs the Republic. He is sixty, careful, devout, deeply boring and very effective, and has spent twenty years making sure that when Ottaviano finally dies the Golden Book will choose another Grimassi. His great obstacle is the Morvans, and he regards them with the patient hatred of a man who has never once lost his temper.
  see: "A grey-haired senator in crimson walks to the Council with a crowd of clients, nodding to each by name: Ser Piero Grimassi."
- id: ppl_isotta
  origin: allora1
  kind: person
  name: Isotta Morvan
  title: Head of Ca’ Morvan
  icon: 🌹
  region: marre
  text: Madonna Isotta, Ser Alvise’s mother, governs Ca’ Morvan from a palazzo full of roses and mirrors. She is seventy, magnificent and frank; she married into the Golden Book from a family of Glass Isles silverers, and has spent fifty years making the Morvans the boldest of the Ten Families. Her son works on Rolla. Her grandsons work on the Doge’s council. She works on everyone.
  see: "A gondola heaped with roses passes down the Grand Canal; in it, an old woman in a scandalous amount of scarlet is laughing at something: Madonna Isotta."
- id: ppl_benedetto
  origin: allora1
  kind: person
  name: Benedetto Loredel
  title: Head of Ca’ Loredel
  icon: 🧭
  region: marre
  text: Ser Benedetto has made the voyage to Thoolma eleven times and seen the Wind-up Emperor twice, which is twice more than any other living Marrean. He is weather-beaten, cheerful and enormously rich; his house holds Morena, the eastern galleys and the Thoolma trade, and he wants nothing to do with the quarrel between the Grimassi and the Morvans — except to win it.
  see: ""
- id: ppl_bembel
  origin: allora1
  kind: person
  name: Ermolao Bembel
  title: Prior of the Lazaretto
  icon: ⚕️
  region: marre
  text: The Prior of the Lazaretto is a gaunt, tireless physician who has lived on the plague island for thirty years and had the Pestilence twice. He believes diseases are carried by seeds too small to see, insists on vinegar, fire and distance, and has kept the Pestilence out of Marre for a generation. The Republic thinks him slightly mad and does whatever he says.
  see: ""
- id: ppl_emperor
  origin: allora1
  kind: person
  name: Stefos Quinallia, the Wind-Up Emperor
  title: Sovereign of the Key
  icon: ⚙️
  region: plandor
  realm: realm_thoolma
  text: "The Emperor of Thoolma has reigned for two hundred and eleven years. He sits on a golden throne between golden lions that roar, on a dais that rises into the air when ambassadors kneel, and he does not speak: his ministers speak for him. Each dawn, in a ceremony no foreigner has seen, the Keeper of the Key winds him with a golden key. Whether there is a man inside the golden casing — or ever was — is the most dangerous question in the world, and nobody in Thoolma has asked it aloud in two centuries."
  see: At dawn, through a crack in a door of the Palace of Faces, you glimpse gold, and a hand that does not move, and an old man with a key.
- id: ppl_fiammetta
  origin: allora1
  kind: person
  name: Fiammetta Doni
  title: Capocomica of Lucenza
  icon: 🎭
  region: rolla
  text: The leading lady and manager of the Company of the Comici is forty, quick, fearsome and adored. She can improvise a three-act comedy from a single word shouted from the pit, sings the new sung plays the conservatory composes, and has twice been banned from Valdora for satirising the regency — and twice invited back by the Twin Kings, who think she is the funniest person alive.
  see: "A woman in a harlequin cloak jumps up on a cart in the piazza and the whole square turns to watch: Fiammetta Doni."
- id: ppl_lapo
  origin: allora1
  kind: person
  name: Fra Lapo
  title: Guardian of the Little Brothers
  icon: 🕊️
  region: rolla
  text: The head of the friary in the hills is a round, beaming, barefoot old friar who nurses the sick poor for nothing, keeps bees, argues theology with the Hearth-Mother and with Matton (with whom he is on suspiciously good terms), and has never, as far as anyone knows, said no to anyone.
  see: ""
- id: ppl_gentry_queen
  origin: allora1
  kind: person
  name: The Lady of the Hill
  title: Queen of the Gentry
  icon: 🌸
  region: rolla
  text: Under the tallest hill in the Fairmeadows the Gentry keep their court, and the Lady of the Hill keeps the Gentry. She is very beautiful in a way that is hard to remember afterwards; she keeps her bargains to the letter; and she has a guest at her table who rode in one evening three years ago with a bargain of his own, and has not yet finished his supper.
  see: ""
- id: ppl_kranach
  origin: allora1
  kind: person
  name: Ursel Kranach
  title: First Mask-Warden of Perlinburg
  icon: 🎭
  region: grell
  text: The senior Mask-Warden of the capital is a broad, quiet woman of sixty, a joiner’s widow, who carves the masks of the dead for every parish in the valley and has led the silent procession thirty times. She knows the name behind every mask in the Bone-Chapel and will tell you none of them. The Duke defers to her about the dead; the Chancellor defers to her about everything else to do with Grell, which is a great deal.
  see: "A broad woman in a carver’s apron walks down the Lantern Streets and the children stop playing: Mother Kranach."
- id: ppl_gundel
  origin: allora1
  kind: person
  name: Gundel of the Moor
  title: The Moor-Wife of the Nachtwald
  icon: 🌿
  region: grell
  text: The Moor-Wife is very old, very small and very sharp, and lives in a hollow of the Wisp-Bogs with a copper, a goat and a great many jars. Sixty years ago the Pyre-Wardens came over the pass to burn her for a witch, and the town of Perlinburg — which will not burn even its dead — closed its gates on them. She has never come down to thank anyone. She does, however, still cure the Lantern-Watch’s chilblains for nothing.
  see: ""
- id: ppl_salcedo
  origin: allora1
  kind: person
  name: Íñigo Salcedo
  title: Secretary of the Sarlonese Chancery
  icon: 📜
  region: grell
  text: Chancellor de Ocampo’s secretary is a pale, precise young man from Valmonte who writes the Chancery’s letters in four hands and its dispatches home in a fifth, of his own invention. Everyone at Trauerfels knows he reports on the Chancellor as well as for him. The Chancellor knows it too, and finds it restful to know exactly who is reading his letters.
  see: ""
- id: ppl_aurach
  origin: allora1
  kind: person
  name: Konstanze Aurach
  title: Prosector of the Anatomy School
  icon: 🔪
  region: grell
  text: Doctor Aurach is the only woman ever to hold a chair at Perlinburg, and holds it because nobody else will do the midnight dissections. She is cheerful, short-sighted and unshockable, keeps a skeleton named Wenzel in her study, and is writing a great book on the Grey Death from the bones in the plague-pits, which the Mask-Wardens permit on condition that every bone goes back exactly where it was.
  see: ""
- id: ppl_uhl
  origin: allora1
  kind: person
  name: Gebhard Uhl
  title: Master of the Death-Clocks
  icon: 💀
  region: grell
  text: The head of the Uhrental clock-guild is a gentle, stooping man of seventy who has made death-clocks for three dukes, two Arch-Bishops and the Wind-up Emperor’s ambassador, who asked very particular questions about the springs. His masterpiece, in the guild hall, strikes every hour with a skeleton, a mourner and a little Gruma who blows out a candle at midnight.
  see: ""
- id: ppl_moll
  origin: allora1
  kind: person
  name: Severin Moll
  title: Kurarzt of Kaltbrunn
  icon: ♨️
  region: grell
  text: The spa physician of Kaltbrunn is a sleek, kindly, fashionable doctor who prescribes the waters for everything, believes in them completely, and is right about half the time, which is a better record than most physicians in the Seven. Princes come to him from every realm; so do their spies, which he knows, and which he regards as good for business.
  see: ""
- id: ppl_arnhold
  origin: allora1
  kind: person
  name: Ilse von Arnhold
  title: Lamp-Prelate of the Circle
  icon: ⚖️
  region: dellian
  text: Prelate von Arnhold is a tall, grey, unsmiling canon-lawyer from an old Eintennish family, the Curia’s great authority on the Diet’s procedure, and the only person in Dellmont the Arch-Bishop is said to consult before he decides. Eintenn trusts her. So, more surprisingly, does everyone else — she has never been known to bend a rule, including in Eintenn’s favour.
  see: "A tall grey woman in a lamp-stole walks to the Curia with a book under each arm: Prelate von Arnhold."
- id: ppl_alcaraz
  origin: allora1
  kind: person
  name: Rodrigo de Alcaraz
  title: Lamp-Prelate of the Circle
  icon: 👑
  region: dellian
  text: Prelate de Alcaraz is a handsome, worldly Sarlonese nobleman who has been legate to four courts, speaks six languages beautifully and keeps the best table in Dellmont. He is the Curia’s great negotiator and its great charmer, and the Sarlonese crown pays for a great deal of his charm.
  see: ""
- id: ppl_mocenni
  origin: allora1
  kind: person
  name: Benvenuto Mocenni
  title: Lamp-Prelate of the Circle
  icon: 🪞
  region: dellian
  text: Prelate Mocenni is a plump, witty Marrean of the Ten Families who collects glass, paintings and favours, and is said to own a portrait of every elector of the Diet — and to know what each of them would do for its return. He is enormously good company. Nobody has ever been sure what he believes.
  see: ""
- id: ppl_rennwald
  origin: allora1
  kind: person
  name: Jost Rennwald
  title: Captain of the Lamp-Guard
  icon: 🦺
  region: dellian
  text: The captain of Dellian’s only soldiers is a big, scarred Grellish pikeman who fought at three battles for three different princes before he took Dell’s lamp-oath. He runs the Lamp-Guard like a monastery with halberds, and is proud that in his eleven years his men have drawn steel in Dellmont exactly twice.
  see: "A big scarred man in yellow-and-white livery inspects the palace guard with a lantern in his hand: Captain Rennwald."
- id: ppl_ferrant
  origin: allora1
  kind: person
  name: Aldo Ferrant
  title: Keeper of the Strongrooms
  icon: 🏦
  region: dellian
  text: The Keeper of the Strongrooms is a mild, round, forgetful-seeming lay-brother who holds the keys to the deposits of every crown in the Seven — and to the sealed treaties they have signed with one another. He has refused bribes from four kings and a Doge. He keeps a list of them, in case anyone should ask, and nobody ever does.
  see: ""
- id: ppl_ysolde
  origin: allora1
  kind: person
  name: Mother Ysolde
  title: Abbess of the Cloisters of Lake Lumen
  icon: 🪷
  region: dellian
  text: The Abbess of the lake cloisters has kept a vow of silence for thirty years and runs the largest scriptorium in the Seven with a slate, a hand-bell and a look. Every treaty the Diet has ever made has passed through her copyists’ hands. It is said that she has read them all, and that this is why she stopped talking.
  see: ""
- id: ppl_brunhild
  origin: allora1
  kind: person
  name: Lady Brunhild Vollrath
  title: Hostage of the Diet
  icon: 🗝️
  region: dellian
  text: The most famous guest of the Villa of the Hostages is a sharp, bored, elegant daughter of the Luggish Vollraths, held under the Diet’s seal as surety for a debt her house owes the Sarlonese crown. She has been there six years, plays chess with every visitor, corresponds with half the bankers of Allora, and has turned the villa garden into the best-informed salon in Dellmont.
  see: "In the hostage-villa garden a lady in black velvet sets up a chessboard and looks up at you expectantly: Lady Brunhild."
- id: ppl_lamplighter
  origin: allora1
  kind: person
  name: The Lamplighter
  title: Master of the Quiet Office
  icon: 🔏
  region: dellian
  text: Nobody knows who runs the Quiet Office. Its master signs nothing and is called only the Lamplighter; its agents meet him (or her) one at a time, at dusk, in a room with a single shaded lamp. Some say it is the Arch-Bishop himself, some say the Abbess, and some say it is whoever you least suspect, which in Dellmont is a very short list.
  see: ""
- id: ppl_rp_rollo
  origin: allora1
  kind: person
  name: King Rollo Doll
  title: King of Ripla, Head of House Doll
  icon: ⭐
  region: ripla
  text: King Rollo is a big, slow-spoken, weather-beaten man of fifty who sailed his own ships as a younger son and never quite lost the habit of looking at the sky before he answers a question. He is the fourth Doll to rule Ripla in a row, which in Gallar counts as an ancient dynasty. He has twice been judged against by the Sleepers, and twice paid without complaint, and says that is why his house is still here.
  see: "A big man in a sea-cloak sewn with silver stars stands on Trollin’s wall, looking at the weather: King Rollo."
- id: ppl_rp_ellery
  origin: allora1
  kind: person
  name: Maud Ellery
  title: First Sleeper of the Court
  icon: 💤
  region: ripla
  text: The eldest of the Sleepers is a small, white-haired, very upright woman who has dreamed some nine hundred judgements in forty years and had three of them voided under the Waking Code — a record no living Sleeper approaches. She drinks the Nimian draught as though it were medicine, which she says it is, and has never once been seen in the Nimian temple.
  see: "A small white-haired woman in grey is helped onto a couch in the Dreaming-Hall, and the whole Court goes silent: the First Sleeper."
- id: ppl_rp_isaut
  origin: allora1
  kind: person
  name: Lady Isaut Doll of Merrow
  title: Head of the Merrow Dolls
  icon: ✴️
  region: ripla
  text: King Rollo’s second cousin keeps Merrow House on the edge of the fens with fifty servants, a pack of decoy-dogs and a genealogy of the Dolls she has had copied in Harrowgate, with her own branch underlined. She is charming, patient and witty, she writes to every court in the Freeholds, and she is entirely loyal to her cousin, as she will tell anyone who has not asked.
  see: ""
- id: ppl_rp_fane
  origin: allora1
  kind: person
  name: Magister Oriel Fane
  title: Keeper of Trollin’s Lantern
  icon: 🔥
  region: ripla
  text: The battle-mage who keeps the Lantern lit is a lean, burn-scarred graduate of the Scorched School of Drell, hired by House Doll twenty years ago on a contract renewed every spring. Every stormy night he climbs to the top of the tower and calls up the flame. He is the only man in Ripla the King cannot afford to offend, and the only man in Ripla who knows exactly what a Freehold would pay him to let it go out.
  see: ""
- id: ppl_rp_sallow
  origin: allora1
  kind: person
  name: Mother Sallow
  title: Queen of the Drowned Stairs
  icon: 🌊
  region: ripla
  text: Nobody on the Drowned Stairs remembers Mother Sallow young. She sits in a dry room at the top of the flooded levels with a pipe, a ledger and a view of every landing, and nothing comes ashore in Ripla by night without her knowing whose it is. The Sleepers have judged her four times and found her guilty twice; she paid both fines in ghostcap, which the Court could not refuse.
  see: ""
- id: ppl_rp_vasse
  origin: allora1
  kind: person
  name: Teodor Vasse
  title: A Currentist of the Portico
  icon: 🌊
  region: ripla
  text: "Master Vasse is a cheerful, threadbare old scholar who read the books of Horro’s Currentists off a foreign ship forty years ago and has been arguing about them on the same portico ever since. Ripla has no Hall of Currents and wants none, and he likes it that way: a philosophy, he says, should be talked about in the rain by people who could be doing something more useful."
  see: ""
- id: ppl_fd_farris
  origin: allora1
  kind: person
  name: Farris Chandice
  title: Lord of Drell, Head of House Chandice
  icon: 🍷
  region: findrell
  text: Young Farris is twenty-two, quick, restless and very clever, and has ruled Drell for three years from a castle so small his own soldiers have to sleep in a gate. He calls himself Farris Casagna in letters that Fin will never see, keeps the best battle-mages in Gallar on retainer, and plays the Great Old Game as if it were a dice-game in a cup-house — boldly, and with one eye on the door.
  see: "A quick, thin young man in a chalice-badged coat strides through the crowd with two battle-mages at his back: Lord Farris."
- id: ppl_fd_nolan
  origin: allora1
  kind: person
  name: Nolan Greer
  title: Lord of Fin, Head of House Greer
  icon: ☸️
  region: findrell
  text: Young Nolan is twenty-four, broad, courteous and slow to anger, and loves his flower-fields more than anything in the Freeholds except the argument with his cousin across the river. He also signs himself Casagna, in letters Drell will never see. He rides his own rents, knows every florist by name, and has never once crossed the Old Bridge in the Bridge-Fight, though he watches it every year from Yollin with a glass.
  see: "A broad young man in a plain green coat walks the river terrace at Yollin, looking across at Drell: Lord Nolan."
- id: ppl_fd_venn
  origin: allora1
  kind: person
  name: Coralie Venn
  title: Archmagister of the Scorched School
  icon: 🔥
  region: findrell
  text: "The head of the Scorched School is a tall, bald, eyebrowless woman of sixty who lost her hair to the fire at nineteen and her left hand at forty, in a war she was paid to fight for the other side. She has hired her graduates to every Freehold in Gallar and is proud that none has ever broken a contract. Asked whose side the School is on, she says: the side of the next contract."
  see: ""
- id: ppl_fd_marle
  origin: allora1
  kind: person
  name: Dame Ysenne Marle
  title: Mistress of the Guild of Florists
  icon: 🌺
  region: findrell
  text: The Mistress of the Florists is a small, sharp-eyed widow who bred the Casagna Black in her own seed-house thirty years ago and has been the most powerful woman in Fin ever since. She sells her roses to Seronia’s Bride-House, to Lord Nolan and — through an intermediary — to Lord Farris, and she has never told anyone how the Black is made.
  see: ""
- id: ppl_fd_tollan
  origin: allora1
  kind: person
  name: Hobb Tollan
  title: Master-Keeper of the Grand Menagerie
  icon: 🐻
  region: findrell
  text: The Master-Keeper is a huge, gentle, scarred man who was born in the Menagerie, the son of the old bear-keeper, and has never slept more than a mile from it. He knows every beast by name and temper, and most of their mothers. He is the only man in Drell who has walked a loose bear back to its cage through the Crowd-Streets, holding its ear.
  see: ""
- id: ppl_fd_tapster
  origin: allora1
  kind: person
  name: The Tapster
  title: Master of the Cup-Cutters
  icon: 🗡️
  region: findrell
  text: Nobody knows the Tapster’s name. He keeps a cup-house under the Old Bridge’s Drell end, pours the stout himself, and listens. Every purse cut in Drell pays him a coin in ten. He has been arrested twice, both times on the bridge, both times by men who had forgotten that nothing can be called on the bridges; the second of them is still apologising.
  see: ""
- id: ppl_gm_tamlin
  origin: allora1
  kind: person
  name: Tamlin Brall
  title: Lord of Gramall
  icon: 🐎
  region: gramall
  text: "Old Lord Tamlin is eighty, lean as a fence-rail, and still rides out once a year at the head of the Ride, strapped into the saddle by two grooms who pretend they are adjusting his stirrups. He has outlived three wives, two sons and four Freehold kings, and has never once gone near the Balm: he does not need to. When a bad harvest comes, the price of bread in Ripla is set at his table."
  see: "An old man in a riding-coat sits very straight at the head of the long table, and the whole hall waits for him to eat: Lord Tamlin."
- id: ppl_gm_orla
  origin: allora1
  kind: person
  name: Orla Brall
  title: Captain of the Ride
  icon: 🏇
  region: gramall
  text: "Lord Tamlin’s grand-niece commands the Ride: a broad, sunburnt woman of forty with a voice that carries across a mile of grass. She has broken bandits on the marches, raided three Freeholds in the Great Old Game, and will not ride at night, ever, for any reason — which everyone in Gramall understands and nobody says aloud."
  see: "A sunburnt woman in a dusty Ride-coat bellows a squadron into line without looking round: Captain Orla."
- id: ppl_gm_hobbe
  origin: allora1
  kind: person
  name: Annis Hobbe
  title: Stud-Mistress of Brall
  icon: 🐴
  region: gramall
  text: The keeper of the Stud-Book was born a serf in Hobb’s Furrow and rode before she could walk, like every Gramall child; she was freed at fifteen for gentling a stallion that had killed two grooms. She knows the dam and sire of every horse in Brall’s studs back nine generations, and talks to the horses more kindly than to the lords.
  see: ""
- id: ppl_gm_lisle
  origin: allora1
  kind: person
  name: Corbin Lisle
  title: Bread-Warden of the Great Granaries
  icon: 🌾
  region: gramall
  text: The Bread-Warden is a soft-spoken, round-shouldered man with ink on his cuffs and the most dangerous ledger in Gallar. He answers only to Lord Tamlin. In a good year he is a clerk. In a bad one, envoys from four Freeholds wait in his antechamber, and he gives each of them the same small biscuit and the same price.
  see: ""
- id: ppl_gm_nan
  origin: allora1
  kind: person
  name: Old Nan Thresher
  title: Nine Times Wake-Queen
  icon: 👑
  region: gramall
  text: A tiny, toothless serf-woman of Hobb’s Furrow who has been crowned Wake-Queen nine times, more than anyone living. By day she gleans the lord’s stubble. By night, crowned in wheat, she once told a visiting fief-knight exactly what his wife said about him, word for word, in front of three hundred people, and he had to laugh because the custom says he must.
  see: ""
- id: ppl_gm_jackstraw
  origin: allora1
  kind: person
  name: Jack Straw
  title: The Hopper Nobody Can Name
  icon: 🎭
  region: gramall
  text: Every Hopper band on the prairie claims Jack Straw rides with it. He is a tall figure in a chaff mask with a horn at his belt, seen leaping a hedge in the moonlight a dozen miles from where he was seen an hour before. The bailiffs say he is a story. The serfs say that is exactly what he is, and that anyone may wear him.
  see: ""
- id: ppl_sh_namere
  origin: allora1
  kind: person
  name: Namere Joix
  title: Queen of Shella
  icon: 🐟
  region: shella
  text: Queen Namere is a tall, grey-eyed woman of fifty who hunted the behemoth in her youth and still wears the scar of a bull’s horn along her jaw. She has held Shella’s frontier for twenty years with no help from any other Freehold, and has stopped asking. When her only son lay dying of a fever the physicians could not name, she brought a country prophet of the white serpent into Onore; the boy lived, and the prophet has stood at her side ever since.
  see: "A tall grey-eyed woman with a horn-scar on her jaw listens to a hunter’s report as if nothing else in the world mattered: Queen Namere."
- id: ppl_sh_jonell
  origin: allora1
  kind: person
  name: Jonell
  title: Prophet of Qo
  icon: 🐍
  region: shella
  text: Jonell was a goatherd’s son from the forest villages, the voice of a small rustic cult of the white serpent that most of Shella had never heard of. Now he is the Queen’s closest confidant and the head of a church newly grand in Onore. He is slight, soft-spoken and unnervingly calm, dresses in plain white, and decides alone what the faithful should fear. The court is careful of him. So, it is said, is the Queen.
  see: "A slight man in plain white walks beside the Queen and says nothing, and the courtiers lower their voices as he passes: the prophet Jonell."
- id: ppl_sh_edrin
  origin: allora1
  kind: person
  name: Edrin Joix
  title: Heir of Shella
  icon: 🌱
  region: shella
  text: "The Queen’s son is nineteen, pale and quick, and was three days from death two years ago. He does not remember the fever, only waking with the prophet’s hand on his forehead and the smell of snow. He has thrown himself into life since: he rides, hunts, quarrels with his tutors and asks everyone what they think the dark quell is. Nobody has given him the same answer twice."
  see: ""
- id: ppl_sh_hrodna
  origin: allora1
  kind: person
  name: Hrodna Kell
  title: Master of the Great Hunt
  icon: 🐂
  region: shella
  text: The Master of the Hunt is a weathered woman of sixty who has led forty behemoth hunts and lost nine hunters doing it, and keeps their names cut on her spear-shaft. She killed a ghost leopard at twenty-two and has never hunted one since. Ask her why and she will tell you that one is enough for anybody, and that the leopards agree.
  see: "A weathered old woman runs her thumb along the names cut on her spear-shaft before she speaks: Hrodna Kell, Master of the Hunt."
- id: ppl_sh_sigrun
  origin: allora1
  kind: person
  name: Sigrun Vey
  title: Warden of the Watch-Line
  icon: 🔥
  region: shella
  text: "The Warden of the Line is a lean, silent veteran who has served on the frontier for thirty winters, half of them in the years when the Witch-Queens sent killing frosts over the Neck. She reads the sky the way other people read letters. The quiet of these last years worries her more than war did: the witches are defending, she says, and nobody defends forever."
  see: ""
- id: ppl_sh_ulla
  origin: allora1
  kind: person
  name: Ulla Fordwife
  title: Keeper of the Frozen Fords
  icon: 🧊
  region: shella
  text: Nobody admits that the fords are a market, so nobody admits that Ulla runs it. She is a broad, cheerful trapper’s widow who keeps a fire on the Shellan bank, knows every Praen carver by name and half of them by blood, and has a cousin in the Molster, a cousin in the Watch-Line and a cousin, it is said, in the Queen’s own kitchens.
  see: ""
- id: ppl_lm_brace
  origin: allora1
  kind: person
  name: King Brace of House Renne
  title: King of Lomma
  icon: 🗼
  region: lomma
  text: Brace is a big, careful man of forty who was a merchant’s son until his father bought, bullied and bargained his way to the cliff-top and took the crown from the mad King Peller. He has worn it nine years without once looking comfortable in it. He is a fair judge, a slow speaker and a tireless worker; he is also, as everyone in Lomma knows, the son of an upstart, and he hears the word in every silence. He keeps the Ironmasters and Captain Varr close and honoured, because he knows exactly how his father got in.
  see: "A big man in a plain dark coat walks the cliff-top terrace alone, hands behind his back, looking down at Lower Lomma: King Brace."
- id: ppl_lm_peller
  origin: allora1
  kind: person
  name: Peller of House Frond
  title: The Mad King
  icon: 🗡️
  region: lomma
  text: King Peller is seventy, thin as a lath and quite sure he is still king. Twenty years ago he began hearing the faces in the Carved Halls speak; ten years ago he began answering them, and hanging people they named. He lives now under guard in a shuttered manor at Ashcombe, in the ash-woods, where he writes letters to every court in Gallar insisting that his Golden Seal was never revoked. Some days he is courteous, witty and heartbreakingly lucid. On the others the guards keep the doors locked.
  see: ""
- id: ppl_lm_varr
  origin: allora1
  kind: person
  name: Ysolt Varr
  title: Captain of the Road-Fort
  icon: 🛡️
  region: lomma
  text: Captain Varr is a lean, grey-eyed woman of fifty with a soldier’s limp and a soldier’s patience. On the night of the turning she led King Peller’s own guard against him, and it was her sword at his door when the Rennes came up the Stair. She was offered a lordship and took a fort. She is honoured at every royal feast and seated beside the King, and she has never once been heard to say who she thinks really brought the Fronds down. She does not need to.
  see: "A lean grey woman with a limp inspects the gate-guard at the road-fort without a word, and every back straightens: Captain Varr."
- id: ppl_lm_carrow
  origin: allora1
  kind: person
  name: Hild Carrow
  title: First of the Ironmasters
  icon: ⚙️
  region: lomma
  text: The head of the mine-owning families is a stout, cheerful, terrifying widow who owns a third of the pits and holds the mortgages on most of the rest. It was her husband who drew the bolts on the Ironmasters’ Gate the night the Fronds fell, and she has had the gate taken off its hinges and set up in her garden, with the names of every family that helped carved on it. The Rennes are kings, she will tell you, because the Ironmasters chose to let them in.
  see: ""
- id: ppl_lm_vellam
  origin: allora1
  kind: person
  name: Aud Vellam
  title: Colour-Master of the Bronze-Wrights
  icon: 🟫
  region: lomma
  text: The master of the closed guild is a small, burned, silent woman of sixty-five who has smelted vorpal bronze for fifty years and is said to be able to tell the temper of a melt by the colour it throws on the ceiling. She has made eleven swords for four kings. She will not discuss the twelfth, which went missing from the Proving-Yard in the confusion of the turning, and which the Fronds’ last loyalists are said to keep.
  see: ""
- id: ppl_lm_rook
  origin: allora1
  kind: person
  name: Tamsy Rook
  title: Lift-Mother of the Cages
  icon: ⛓️
  region: lomma
  text: Old Tamsy has worked the cages for fifty years and run the Lift-Men’s Guild for twenty. She rides the great cage to the cliff-top every morning, knits on the way, and knows who has gone up to the Royal Quarter at night, who came down early, who wept in the cage and who paid to have it stopped between levels. She has never been known to tell anyone anything — for free.
  see: "An old woman knits placidly in a swaying iron cage halfway up the cliff, nodding to everyone she passes: Tamsy Rook."
- id: ppl_mc_hereward
  origin: allora1
  kind: person
  name: Hereward Osgar’s-son
  title: Ealdor of the Praen, Lord of Eorlhall
  icon: 🦌
  region: mearc
  text: The Praen ealdor is a tall, grey, slow-spoken hunter of fifty winters who carries his father’s thigh-bone, carved with forty deeds, on his belt. He keeps the greatest hall on the peninsula and the best-fed hearth-troop, and he greets the Tithe’s envoys at Eorlhall’s door with perfect courtesy and a face like a shut gate. His people say he has never once let a Praen dead go north without a fight over the price.
  see: "Under the antler-crowned roof a tall grey man with a carved bone at his belt is listening to three elders at once: Ealdor Hereward."
- id: ppl_mc_saethryth
  origin: allora1
  kind: person
  name: Mother Sæthryth
  title: Ealdor of the Khilns
  icon: 🪶
  region: mearc
  text: The Khilns are led by a tiny, bent woman of more than eighty who lives in a stilt-house at Heronstead and can walk the mud-pits blind. She is said to know the name and the sinking-place of every one of the Sunken Kin, and to have hidden more dead from the Larder than anyone alive. The Tithe knows it. The Tithe also knows that the Khilns would follow her into the bog, and has never pressed the point.
  see: ""
- id: ppl_mc_brand
  origin: allora1
  kind: person
  name: Brand Gull-Eye
  title: Ealdor of the Molster
  icon: 🐟
  region: mearc
  text: The Molster ealdor is a broad, cheerful, one-eyed fisherman who lost the other eye to a whale’s fluke and keeps the socket covered with a disc of carved whalebone. He reckons everything in herring — debts, wergild, dowries, insults — and his reckoning is trusted from the Neck to Ice-Bay. He is the most open of the three ealdors in hall and, the other two say, the hardest to read.
  see: "On the quay a one-eyed man with a whalebone eye-disc is arguing the price of a boat in lasts of herring: Brand Gull-Eye."
- id: ppl_mc_wynflaed
  origin: allora1
  kind: person
  name: Wynflæd the Carver
  title: Eldest of the Bone-Wrights
  icon: 🦴
  region: mearc
  text: The greatest bonecrafter on the peninsula is a Praen widow with hands like knotted roots, who carved the antler-crown of Eorlhall’s roof as a girl and has refused ever since to carve anything she considers beneath her. Her ancestor-heirlooms are passed down as the most precious things a family owns. Shellan hunters cross the Neck in secret to buy her combs; the Witch-Queens, it is whispered, once sent for her and she would not go.
  see: "At the carving-ground an old woman holds a comb up to the light, frowns, and snaps it in half: Wynflæd."
- id: ppl_mc_cuthwine
  origin: allora1
  kind: person
  name: Cuthwine the Scop
  title: Riddle-Master of Eorlhall
  icon: 📜
  region: mearc
  text: Eorlhall’s scop is a lean, ink-fingered man with a voice like a bell, who knows the names of every Praen ealdor back to the coming of the Sillenians and a thousand riddles besides. At the Dread-Nights he leads the reciting of the ancestors, and it is said that no name he has once spoken aloud has ever been taken by the Larder. He does not say whether he believes this. He does keep speaking.
  see: ""
- id: ppl_mc_leofric
  origin: allora1
  kind: person
  name: Leofric Holdfast
  title: Warden of the Neck
  icon: 🔥
  region: mearc
  text: The Warden of the Neck is a Molster by birth, a Praen by fostering and a Khiln by marriage, which is why all three tribes trust him with the watch-fires. He has a Shellan cousin across the fords and a sister in the Hornhall, and speaks of neither. In thirty winters he has lit the great beacon only twice.
  see: "A heavy man in a scorched leather coat walks the line of watch-fires, counting them under his breath: Leofric Holdfast."
- id: ppl_kn_hrae
  origin: allora1
  kind: person
  name: Hrae
  title: Eldest of the Striga
  icon: 🦌
  region: knuckle
  text: No one outside Wocca knows how old the eldest sister is. Her hood carries so many horns — ibex, musk-ox, reindeer, a single great elk-palm — that she must be helped through doors, and her aura reaches the outer gates on a still day, so that travellers on the Tithe-Road find themselves weeping without knowing why. She speaks rarely, slowly, and in Woccan only. It was Hrae, the tales say, who turned the summer of the Sillenian invasion to winter, and Hrae who has lately counselled the councils to wait.
  see: ""
- id: ppl_kn_wolk
  origin: allora1
  kind: person
  name: Wolk
  title: Krona of the Frost
  icon: ❄️
  region: knuckle
  text: The Krona of the Frost is tall, spare and always cold to stand near; frost forms on her veil from her own breath. She keeps the Frost’s great ledger of weather going back four hundred years and can tell, from the colour of a winter dawn, what a working begun a week ago will do. Her sisters say she is the most patient of them all. Shella’s watch-captains, who have seen what her patience does to an army, agree.
  see: "On the walls of Wocca a tall horned figure stands quite still in the wind, and the air around her glitters: Krona Wolk."
- id: ppl_kn_skeg
  origin: allora1
  kind: person
  name: Skeg
  title: Krona of the Larder
  icon: 🦴
  region: knuckle
  text: The Krona of the Larder is small, soft-voiced and courteous, and knows a great deal more than any one woman could have learned. She speaks the dialects of all three tribes like a native of each, carves bone like a Praen master and reckons like a Molster ealdor, and those who have spoken with her come away certain that she has borrowed every one of those gifts from someone. She thanks the tithe-carriers personally. They would rather she did not.
  see: ""
- id: ppl_kn_brund
  origin: allora1
  kind: person
  name: Brund
  title: Krona of the Tithe
  icon: ⚖️
  region: knuckle
  text: "The Krona of the Tithe rules the three tribes in the Striga’s name, and does it like a hard, fair reeve: she knows every ealdor’s debts, every kin’s dead and every feud on the peninsula, and her judgements are dreaded chiefly because they are just. She is broad and heavy, wears musk-ox horns and an apron of carved knuckle-bones, and has been known to remit a Khiln village’s tithe in a famine year without explaining why."
  see: "In the Tithe’s hall a broad horned figure in an apron of knuckle-bones turns the page of a tithe-roll and the whole room holds its breath: Krona Brund."
- id: ppl_kn_yrr
  origin: allora1
  kind: person
  name: Yrr
  title: Krona of the Veil
  icon: 🧕
  region: knuckle
  text: The Krona of the Veil decides who is taken in, who is veiled, who is horned and who is punished. She is younger than any other Krona and stricter than all of them, and she was, the Hornhall whispers, a Molster herring-girl once, before she gave up her name. She has never been seen to look at the sea. Deserters fear her more than they fear the Waste.
  see: "At the Hornhall a straight-backed horned sister inspects a line of veiled novices without a word, and one of them begins to shake: Krona Yrr."
- id: ppl_kn_daeg
  origin: allora1
  kind: person
  name: Daeg
  title: Krona of the Hearing
  icon: 👂
  region: knuckle
  text: "The Krona of the Hearing runs Wocca’s spies, envoys and listeners, and is the only sister who speaks every tongue of the Freeholds. She is said to have sat unveiled at a Hide-Lord’s table in Shella, as a guest, and left with his secrets and without his knowing her. Her aura is the gentlest in Wocca, which is the most frightening thing about it: people simply find themselves telling her things."
  see: ""
- id: ppl_kn_thrin
  origin: allora1
  kind: person
  name: Thrin
  title: Horned Sister of the Hearing, Keeper of Waerstead
  icon: 🦌
  region: knuckle
  text: Thrin keeps the guest-hall at Waerstead where outsiders wait for Wocca’s leave. She wears the first small horns of a Horned sister, speaks Shellan with a Shellan accent and the Freehold tongues with every accent, and is unfailingly hospitable. Envoys from the south find her charming. They find, later, that they told her everything.
  see: "A horned sister at the guest-hall door bids you welcome in your own tongue: Thrin."
- id: ppl_kn_hunfrith
  origin: allora1
  kind: person
  name: Hunfrith Tally-Hand
  title: Chief Reeve of the Tithe-Road
  icon: 📯
  region: knuckle
  text: The chief of the Tithe-Reeves is a Praen who has kept the road for twenty-two years, counted the dead of three tribes into the tithe-houses and been spat at by all of them. He is honest, unbribable and very lonely, and keeps his own tally of every name that passes him, on knotted cords in his house. Nobody asked him to. He says someone should.
  see: "At the first tithe-house a grey man with a horn on a cord counts sledges, lips moving: Hunfrith Tally-Hand."
- id: ppl_kn_ottar
  origin: allora1
  kind: person
  name: Ottar Seal-Father
  title: Headman of Ice-Bay
  icon: 🦭
  region: knuckle
  text: Ice-Bay’s headman is an enormous, gentle old fisherman who has never been further south than Wocca and sees no reason to go. He speaks Woccan and very little else, trades seal-fat with the witches as calmly as with anyone, and is said to be the only man alive who has refused the Striga something and been thanked for it.
  see: "An enormous old man sits by a fishing-hole with a pipe, a harpoon and a seal-pup asleep on his boots: Ottar Seal-Father."
- id: ppl_hg_aumery
  origin: allora1
  kind: person
  name: Lord Aumery Vane
  title: Keyholder of Harrowgate
  icon: 🗝️
  region: harrowgate
  text: The head of House Vane is a narrow, courteous, unhurried man of sixty who can recite his ancestors back to the first Sillenian keel that grounded on the coast, and frequently does. He counts the toll himself on the first day of every month, believes Sarlon’s road would be the ruin of Gallar, and is quite right that it would be the ruin of House Vane. Every upstart king in the Freeholds owes him a pedigree. He has never let any of them forget it.
  see: "On the Toll-Stair a thin old lord in grey stops to count the wagons waiting below: the Keyholder himself."
- id: ppl_hg_ide
  origin: allora1
  kind: person
  name: Ide Vane
  title: Mistress of the Archive
  icon: 📜
  region: harrowgate
  text: "Lord Aumery’s widowed sister keeps the Archive: twelve hundred years of charters, genealogies, oaths and treaties in Old Sillenian and every tongue since. She is small, dry and very kind to students. She can also, it is whispered, write a ten-generation pedigree in a dead king’s hand in an afternoon — but only for her brother, and only for a great deal of money."
  see: ""
- id: ppl_hg_brannoc
  origin: allora1
  kind: person
  name: Captain Brannoc Harl
  title: Captain of the Grey Lances
  icon: 🛡️
  region: harrowgate
  text: A grey, rope-thin veteran who has sold lances to every Freehold in Gallar, Vane’s enemies included, and says so cheerfully at Vane’s own table. He pays his tax to the Keyholder on time and in full, which is the only reason Varnholt still stands. His company is the best-drilled in the west. His word, once he has been paid for it, is the most reliable thing in Gallar.
  see: "A rope-thin grey captain reads the contract board at Varnholt with his spectacles on the end of his nose: Brannoc Harl."
- id: ppl_hg_fadrique
  origin: allora1
  kind: person
  name: Don Fadrique de Lerma
  title: Sarlonese Ambassador to Gallar
  icon: 👑
  region: harrowgate
  text: King Rowan’s man at Harrowgate is a handsome, patient Sarlonese grandee who has been trying for eleven years to persuade House Vane to widen the road, lower the toll and let the trade of the world pour over the Tyer. He keeps the best wine in Gallar, entertains every Hide-Lord who passes, and writes home every month that the breakthrough is very near.
  see: ""
- id: ppl_hg_morwen
  origin: allora1
  kind: person
  name: Morwen Ash
  title: Queen of the Tyer Runners
  icon: 🎒
  region: harrowgate
  text: The smugglers of the high passes answer to a soft-spoken woman of forty with two fingers missing from each hand — frostbite, from the Hag’s Saddle, the winter she carried a whole fortune in Rabene saffron over it alone. She says she has crossed the Saddle thirty-one times. The Wardens say twenty-nine. Nobody has ever caught her on it.
  see: ""
- id: ppl_hg_gorm
  origin: allora1
  kind: person
  name: Toll-Master Gorm
  title: Master of the Customs-House
  icon: ⚖️
  region: harrowgate
  text: The Toll-Master is enormous, slow and incorruptible, and thus the despair of every smuggler in the Tyer. His clerks are none of those things. Gorm knows it, and lets Vane know it, and Vane, which takes its cut of everything, does nothing at all.
  see: ""
- id: ppl_gl_jonell
  origin: allora1
  kind: person
  name: Jonell
  title: Voice of Qo, Prophet of the White Serpent
  icon: 🐍
  region: shella
  text: The prophet is a quiet, raw-boned man of fifty, once a goatherd, with very pale eyes and a hoarse voice from years of preaching in the cold. Queen Namere believes he saved her son’s life and keeps him at her side. He is gentle with children and fearless with lords, and there is something in his face, when he thinks no one is watching, that looks very much like grief.
  see: "In the Church of Qo a pale-eyed man in white listens to a frightened girl’s confession, nodding slowly: the prophet Jonell."
- id: ppl_gl_ysmay
  origin: allora1
  kind: person
  name: Ysmay of the Ring
  title: Veil-Keeper of the Bride-House
  icon: 💍
  region: findrell
  text: The senior priestess of Seronia is a tall, merry woman of sixty who has married four thousand couples and buried twice as many people, and enjoys both. She is one of the few who have seen the Bride’s face. Asked what she saw, she says “my husband”, and laughs, and changes the subject.
  see: ""
- id: ppl_gl_sunwarden
  origin: allora1
  kind: person
  name: Corvin the Sun-Warden
  title: Master of the Eyrie
  icon: 🦅
  region: lomma
  text: The Sun-Warden of Phorn is lean, sun-blackened and nearly blind from staring into the dawn for forty years; his eagles are his eyes. He has sealed three kings and refused two, and every house in the Freeholds would like to know what he thinks of them. He thinks very little of any of them, and says so to the sun.
  see: ""
- id: ppl_gl_eldest
  origin: allora1
  kind: person
  name: Old Mother Wren
  title: Eldest of the Nimians
  icon: 💤
  region: ripla
  text: The eldest recluse of the Temple of Nim has not spoken aloud in thirty years. She communicates by tapping on the reed walls, and the younger Nimians understand her perfectly. She brews the strongest draughts in Gallar, and it is said the Sleepers’ verdicts have been bent, once or twice, by how strong she made them.
  see: ""
- id: ppl_sexton
  origin: allora1
  kind: person
  name: Old Wigand
  title: Sexton of the Nameless Charnel
  icon: 🔔
  region: grell
  text: The charnel’s only keeper is a tiny, cheerful, half-deaf old man who rings a hand-bell at its gate every evening for the dead who have no names, because, he says, somebody ought to. He knew Ansgar Kahl, brought him bread for twenty years, and watched him hanged. He will tell you anything about the place except where the book is.
  see: "At the charnel gate a tiny old man rings a hand-bell for nobody in particular: Old Wigand."
- id: ppl_rb_nabu
  origin: allora1
  kind: person
  name: Nabu-shar-ilani
  title: The Shepherd-King of Raben
  icon: 🐂
  region: raben
  text: The Shepherd-King is a heavy, soft-voiced man of fifty with a curled black beard and a herdsman’s crook of star-lapis, who has ruled Raben for twenty-two years and has never once been refused a bow by the bulls of the gate. Every night he goes down to the Fold of Tokens and counts his clay flock — one little sheep for every subject in the empire — by lamplight, alone. He says a shepherd who cannot count his sheep should not be surprised when wolves can. His ministers find this very tiring. His subjects, who know he has counted them personally, find it oddly comforting.
  see: "In the Fold of Tokens a heavy man in plain wool sits on a stool among ten thousand clay sheep, counting under his breath: the Shepherd-King."
- id: ppl_rb_ummi
  origin: allora1
  kind: person
  name: Ummi-abzu
  title: Chief Keeper of the Tablet-House
  icon: 📜
  region: raben
  text: The Chief Keeper is a tiny, blind old woman who reads tablets with her fingertips faster than most scribes read with their eyes, and who has walked the Upper Stacks so long she navigates them by the smell of the clay. She claims to have been down to the Lower Stacks once, as a girl, and to have read there a tablet in her own hand recording her own death. She will not say when it was dated. She does say she is in no hurry.
  see: ""
- id: ppl_rb_ilukabti
  origin: allora1
  kind: person
  name: Ilu-kabti
  title: Name-Warden of the Gate
  icon: 🗿
  region: raben
  text: The Name-Warden is a gaunt, hoarse scribe who has spent thirty years reading aloud, at every dawn, the long names of the winged bulls of Assar — names that take an hour each to say and must not be stumbled on. His voice is going. Everyone at court knows it and nobody mentions it, because the question of who reads the names after him is the most dangerous question in Raben.
  see: "At first light a gaunt old scribe stands between the winged bulls with a tablet in each hand, reading in a cracked voice: the Name-Warden."
- id: ppl_rb_belushezib
  origin: allora1
  kind: person
  name: Bel-ushezib
  title: First Star-Priest of Etemen
  icon: ✨
  region: raben
  text: The First Star-Priest has lived on the summit of the Tongue-Tower for twenty years, where every language is understood, and has not come down, because below the top terrace nobody understands him any more — he has forgotten which tongue is his. Up there he talks with Ahnari geometers, Arumi caravan-masters, birds and the occasional wind, and reads the sky as a sheet of seal-impressions rolled out by the gods. His omen-reports reach the King every morning, and are said to be the only honest documents in Assar.
  see: ""
- id: ppl_rb_ningubla
  origin: allora1
  kind: person
  name: Nin-gubla
  title: Mistress of the Court of Horns
  icon: 🐂
  region: raben
  text: The greatest bull-leaper in Raben is a small, scarred, laughing woman of forty from a family of reed-cutters, who has vaulted more winged calves than anyone alive and claims to know nine syllables of the names of bulls not yet born. The Tablet-House would very much like to know how. She will tell them, she says, when they let a leaper into the Hall of Bull-Names. They have not, yet.
  see: ""
- id: ppl_rb_ashureriba
  origin: allora1
  kind: person
  name: Ashur-eriba
  title: Master of the Lion-Wheels
  icon: 🛞
  region: raben
  text: "The King’s nephew commands the chariot corps and leads the hunt in the Dream-Park, where the star-priests pen the Shepherd-King’s nightmares in the shape of lions. He is handsome, reckless and kind to his onagers, and claims to have killed every bad dream his uncle has had for eleven years. He has one rule for new drivers: never ask what the lion was before. Several have. None of them sleep well."
  see: "A chariot comes out of the reed-beds at a gallop, a young lord at the reins with a lion-skin that is fading, already, to smoke: Prince Ashur-eriba."
- id: ppl_sl_utnapishtim
  origin: allora1
  kind: person
  name: Ezkalu, the Seventh Teacher
  title: Last of the Fish-Cloaked Sages
  icon: 🐟
  region: sealands
  text: In the first age, the Rabene say, seven sages came up out of the sweet deep wearing the skins of great fish, and taught the people of the Two Rivers to write, to build, to measure a field and to keep a law; then six of them went back into the sea. The seventh, Ezkalu, lay down in a tidal cave under a small island at the edge of the dawn and went to sleep, like a king under a hill, promising to wake whenever he was truly needed. He wakes — for one hour, at the lowest tide of each month — to correct a single mistake that people have made in what he taught them. He is enormous, silver-scaled, gentle, short-sighted and very old, and he has no patience at all for questions he has already answered.
  see: In the cave under the island something vast and silver stirs in its sleep, and the whole hill sighs.
- id: ppl_sl_wife
  origin: allora1
  kind: person
  name: Kesh-ara the Tide-Warden
  title: Keeper of the Questions
  icon: 📜
  region: sealands
  text: The Teacher’s waking is kept by an old woman who has never told anyone where she came from, and who decides — every month, alone — which single question will be put to him at the low tide. Petitioners leave their questions with her on clay. She reads every one. She is brisk, warm and merciless, keeps a shelf of the questions she has refused that runs the whole length of the island, and says the hard part of her work is not choosing the best question, but finding one he has not already answered and everybody forgot.
  see: ""
- id: ppl_sl_sursunabu
  origin: allora1
  kind: person
  name: Pagir the Poler
  title: Ferryman of the Mirror Shallows
  icon: 🛶
  region: sealands
  text: The ferryman of the Mirror Shallows does not take coins. He takes poles — a great many of them, cut by your own hand — for the Shallows may not touch skin, and each pole may touch the water only once before its reflection takes hold of it and it must be let go. He has crossed so often, he says, that there are a hundred Pagirs standing in the water by now, and on calm evenings they all wave at him. He is huge, sad and patient, and says the crossing is the easy part. Coming back, he says, is where people go wrong.
  see: ""
- id: ppl_sl_amadrift
  origin: allora1
  kind: person
  name: Ama-Ushumgal
  title: Mother of the Drifts
  icon: 🌾
  region: sealands
  text: The chieftainess of the reed-folk is a vast, laughing woman who has never set foot on solid ground — she was born on a drift, married on a drift, and intends to be buried in one. Her guest-hall is the largest reed building in the world and is never in the same place two nights running. The King of Raben counts her as his subject. She counts the King of Raben as a rumour, and has told his tax-collectors that if they can find her they are welcome to dinner.
  see: "In the circle of the guest-hall a huge old woman laughs at something, and the whole reed building creaks with it: the Mother of the Drifts."
- id: ppl_sl_lunanna
  origin: allora1
  kind: person
  name: Old Lu-Nanna
  title: Singer of the Divers
  icon: 🎶
  region: sealands
  text: Every pearling boat has a singer who sings its divers up from the deep, and the greatest of them is a blind, barrel-chested old man who has sung for the fleet sixty years. The rule of the singers is that they must never look over the side while a diver is coming up, or he will not. Lu-Nanna says he lost his eyes to keep that rule more easily, and laughs, and nobody on the boats has ever been sure if it is a joke.
  see: ""
- id: ppl_sl_abisimti
  origin: allora1
  kind: person
  name: Abi-simti
  title: Pilot-Mother of Kuara
  icon: 🐋
  region: sealands
  text: The head of the Beast-Pilots lives in the Pilot-House on the Beast’s spine and claims to know every sleeping monster in the gulf by the shape of its back. She has counted the breaths of the Beast under Kuara since she was a girl, and says that in all that time it has turned in its sleep only once. Asked what happened, she says that is why the old town is underwater and the new one is on the other shoulder.
  see: ""
- id: ppl_ah_meritahn
  origin: allora1
  kind: person
  name: Merit-Ahn the Ninth
  title: Apex of Ahnara
  icon: 🔺
  region: ahnara
  text: The Apex of Ahnara is a small, upright woman of fifty with a geometer’s calloused fingers and the stillest face in Qoul. She took the Angle-Throne at nineteen, proved her first theorem before the College at twenty, and at thirty announced that her tomb would be a dodecahedron — the shape of the heavens, which no Apex in thirty generations has dared, because a solid holds what it is shaped like, and a dodecahedron would hold the year itself. Eleven faces are finished. She walks the twelfth every evening and says nothing to anyone about why it will not close.
  see: "On the ramp of the great unfinished solid a small woman in white stands quite still, measuring the sunset with her hand: the Apex."
- id: ppl_ah_khaba
  origin: allora1
  kind: person
  name: Khaba-Sen
  title: Holder of the Chair of the Right Angle
  icon: 📐
  region: ahnara
  text: The head of the College of Angles has been blind for twenty years and has not drawn a crooked line in that time. He surveys by ear — a true angle, he says, has a sound, and a false one has a worse one — and he can tell from the hall door whether a student’s proof is wrong. He taught the Apex. He has told her, privately and more than once, that the dodecahedron cannot be closed by a living hand.
  see: ""
- id: ppl_ah_tuya
  origin: allora1
  kind: person
  name: Tuya
  title: First Folder of the House of Folding
  icon: ⚱️
  region: ahnara
  text: The First Folder is a brisk, cheerful, enormous woman who has folded two Apexes, eleven High Readers and more than a thousand lesser dead into their shapes, and who sets the bones of living labourers between funerals because, as she says, she knows the inside of a person better than any physician alive. She has already measured the Apex for an icosahedral shroud. She has not been asked to, and keeps the measurements in her apron.
  see: A huge woman in resin-stained linen laughs in the doorway of the House of Folding, a fold of linen in each hand.
- id: ppl_ah_ankhor
  origin: allora1
  kind: person
  name: Ankh-Hor
  title: Eldest Reader of the Stair
  icon: 🌊
  region: ahnara
  text: The Eldest Reader has gone down the Stair of Halves further than anyone living — far enough that the steps beneath him were narrower than a hair — and came back up after three days unable to explain where he had been. He reads the flood with his feet, standing in the water on the step where the river will stop, and in forty years he has never been wrong by more than a finger. Lately he says the river is rising a little higher every year, as if something were missing from the balance.
  see: ""
- id: ppl_ah_ipi
  origin: allora1
  kind: person
  name: Ipi
  title: Master of the Twelve Faces
  icon: 🧱
  region: ahnara
  text: The master-mason of the Apex’s tomb is a lean, silent, grey-skinned man from the cataract quarries who has spent twenty-two years on the dodecahedron and lost two fingers and a son to it. Eleven faces stand true. The twelfth has been raised three times, and three times the stones have been found in the morning lying neatly on the sand, unbroken, as if the shape had politely declined them.
  see: ""
- id: ppl_rl_nebamun
  origin: allora1
  kind: person
  name: Nebamun the Level
  title: First Weigher of the Hall of Two Truths
  icon: ⚖️
  region: redland
  text: The First Weigher is a tall, heavy, slow-spoken man who has sat at the beam of the Hall for twenty-six years and has been weighed on it himself every New Year, publicly, because he says a scale that has never judged its keeper is only furniture. His verdicts are law; the Apex has never once overturned one, and it is said she has asked to be weighed and he has declined, very politely, on the grounds that the Hall has not yet built a pan that large.
  see: "At the great beam a heavy man in white sets the Least Solid on its pan with both hands, as if it were very heavy: Nebamun the Level."
- id: ppl_rl_khay
  origin: allora1
  kind: person
  name: Khay of the Crooked Line
  title: Robber-Mistress of the Valley
  icon: 〰️
  region: redland
  text: Khay was a geomancer of the second rank until the College caught her proving that every solid in the Valley has a flaw — one angle, somewhere, a hair out of true, through which it can be opened. The College expelled her. The tomb-robbers made her their mistress. She is thin, courteous and amused, wears a veil with a single crooked thread, and has never been caught inside a tomb; she says she leaves the shapes better than she found them, having shown them where to mend.
  see: ""
- id: ppl_rl_tjaru
  origin: allora1
  kind: person
  name: Tjaru the Listener
  title: Eldest of the Hum-Guides
  icon: 🐪
  region: redland
  text: The eldest guide of the Nine Wells has been blind since a sandstorm took his eyes forty years ago, and has led more caravans across the Red Land since than he did before it. He steers by the hum of the tombs, which he says is a map in thirty voices, and by the silence that lies over the Shadow, which he says is not an absence of sound but the sound of something too large to hear. He has walked into the Shadow twice. He will not go a third time.
  see: "At the Nine Wells a blind old man tilts his head towards the west, listening, and says: ‘The Ninth Cube is flat tonight.’"
- id: ppl_rl_hunro
  origin: allora1
  kind: person
  name: Hunro
  title: Overseer of the Pale Mines of Hu
  icon: ⛏️
  region: redland
  text: The Apex’s overseer at the electrum mines is a short, deaf, ferocious woman who went deaf from forty years of listening to veins sing and claims she can still feel them through her feet. She keeps the Pale Gangs honest with a whip she has never used and a ledger she uses constantly, and she is the only person in Ahnara who addresses the Apex by her childhood name, because they were children together, and because Hunro sends her the electrum.
  see: ""
- id: ppl_rl_sitre
  origin: allora1
  kind: person
  name: Old Sitre
  title: Keeper of the Empty Sphere
  icon: ⚪
  region: redland
  text: In the far corner of the Valley stands the tomb of the only Apex who rejected the doctrine of solids — the Heretic, whose name has been chiselled off everything — and it is a sphere, with no angle anywhere, which therefore holds nothing at all. Sitre has kept it for fifty years. She is tiny, cheerful and nearly deaf, and says the Sphere is the most restful place in the world because it is the only tomb in the Valley that is not working.
  see: ""
- id: ppl_ba_malkat
  origin: allora1
  kind: person
  name: Malkat Shalmath
  title: Lady of the Columns of Tadmor
  icon: 🐪
  region: betharum
  text: The richest woman in Qoul is a stout, grey, laughing widow of sixty who owns a third of the camels in Tadmor and a seventh of everything they carry. Her husband’s bronze stands on the tallest bracket of the Colonnade; on the Night the Fathers Step Down he climbs off it to dine with her, and she gives him the household accounts and listens very carefully to what he says about them. The Judges consult her about roads. The Shepherd-King and the Apex both send her presents. She sends them both a bill.
  see: "Under the Colonnade a stout grey lady in purple argues prices with a bronze statue, and seems to be winning: the Lady of the Columns."
- id: ppl_ba_hoshaiah
  origin: allora1
  kind: person
  name: Hoshaiah ben Elnathan
  title: Warden of the Tent
  icon: ⛺
  region: betharum
  text: The chief of the Keepers is a tall, stooped, short-sighted Levite who has walked behind the Wandering Tent for fifty-one years and has never once been inside it. Nobody has; the Tent is empty, and that is the point. He is famous for knowing, an hour before anyone else, that the Tent is about to move — he says it is the way the ropes sigh — and for the speed with which the whole Following Camp can be packed onto camels at his word.
  see: "A tall stooped Levite stands at the Tent’s threshold with his head cocked, listening to the guy-ropes: Hoshaiah the Warden."
- id: ppl_ba_atarah
  origin: allora1
  kind: person
  name: Judge Atarah bat Hanun
  title: Eldest of the Twelve Judges this Halting
  icon: ⚖️
  region: betharum
  text: "The presidency of the Twelve passes, by custom, to whichever Judge’s court is nearest the Tent when it halts, and this season it is Atarah’s: a small, fierce, dry-voiced woman of the southern hills who has winnowed testimony on the evening wind for thirty years. She can tell grain from chaff, they say, before the wind does. She does not rule kings — no Judge does — but no hill-king of the Twelve Kingdoms has ever defied one of her verdicts twice."
  see: "On the Threshing-Floor a small fierce woman in a striped mantle holds up a hand, and the wind seems to wait for her: Judge Atarah."
- id: ppl_ba_mahalath
  origin: allora1
  kind: person
  name: Mahalath the Written
  title: Prophetess of the Voice
  icon: 📢
  region: betharum
  text: "For forty years every word the Voice has given Mahalath has been inked onto her skin as she received it, and now there is no room left: her face, her palms, the soles of her feet and the lids of her eyes are scripture. She has not spoken aloud for nine years, because everything she might say is already written on her. The students of Naioth read her, with permission, by lamplight. What will happen when the next word comes, nobody at Naioth is willing to guess."
  see: "In the lamplight of the caves sits a woman written over from brow to heel, who turns her palm to you so that you may read it: Mahalath."
- id: ppl_ba_kedemah
  origin: allora1
  kind: person
  name: Old Kedemah
  title: Singer of the Forty Roads
  icon: 🎶
  region: betharum
  text: The eldest of the Road-Singers is blind, toothless and very possibly a hundred, and she knows all forty of the sung roads of the Wilderness by heart — including the three that have not existed since her grandmother’s time and the one that does not exist yet. Caravan-masters from Tadmor bring her kumis and silver and sit at her feet to learn a single verse. She charges more for the verses that are still true.
  see: ""
- id: ppl_ba_yaudiel
  origin: allora1
  kind: person
  name: King Ya’udi-El of Hamath
  title: Hill-King of Hamath, of the Twelve Kingdoms
  icon: 👑
  region: betharum
  text: "The king of Hamath is one of the twelve hill-kings of the covenant: a big, gentle, anxious man who loves his wheels more than his crown and can be found most mornings up to his waist in a sluice, arguing with an engineer. Like every hill-king he rules his own city and answers to the Judges in anything touching the covenant, which he finds restful. He has a fine bass voice and sings with the Wheel-Choir on feast days, slightly flat."
  see: ""
- id: ppl_cd_kidinsin
  origin: allora1
  kind: person
  name: Kidin-Sin
  title: Bull-Captain of the Rabene Third
  icon: 🐂
  region: cedars
  text: Raben’s commander at Cedargate is a square, bearded, punctilious officer who has every log that leaves the fort tallied on clay, sealed, filed and sent down to the Tablet-House, so that in some vault in Assar there is a record of every stick of cloud-cedar Raben has ever not quite owned. He regards the other two garrisons as a clerical error that will one day be corrected. He has been waiting nineteen years.
  see: "A square bearded officer reads a clay tally by the gate, and frowns at a log that is a finger shorter than it was yesterday: Kidin-Sin."
- id: ppl_cd_hornakht
  origin: allora1
  kind: person
  name: Hor-Nakht
  title: Commander of the Angle-Tower
  icon: 🔺
  region: cedars
  text: Ahnara’s commander is a thin, courteous geometer-soldier who would much rather be measuring the forest than holding a fort in it, and does both. Every dawn she climbs the Angle-Tower and sights along its perfect corners to see how far the cedars have walked in the night; her charts of the forest’s wanderings fill a whole room. She is the only person at Cedargate whom all three garrisons trust to settle a boundary. She insists this is because geometry has no flag.
  see: ""
- id: ppl_cd_yoash
  origin: allora1
  kind: person
  name: Yo’ash ben Ahiram
  title: Captain of the Tent-Third
  icon: ⛺
  region: cedars
  text: Beth-Arum’s captain is a cheerful, enormous camel-trooper who keeps the peace of the Common Hall with a laugh like a landslide and a Levite at his elbow to remind him of the covenant’s rules on hospitality. He trades incense for timber-rights, wins at knucklebones and is almost certainly letting the Flagless use his gate on alternate Tuesdays. Nobody has proved it. Nobody has tried very hard.
  see: "An enormous trooper in a striped headcloth roars with laughter in the Common Hall and slaps a Rabene spearman on the back: Captain Yo’ash."
- id: ppl_cd_ilshu
  origin: allora1
  kind: person
  name: Ilshu of the Flume
  title: First of the Flagless
  icon: 🏴
  region: cedars
  text: The smugglers of the Cedar Mountains answer to a lean, grey, soft-spoken man who was once a Rabene timber-scribe, and knows to the shekel what the Bull-Third’s clay tallies say. He built the Long Flume over three winters with forty men and no permission, and has sent more cloud-cedar down it than all three garrisons together. He flies no flag. He says the forest flies none either, and that he is merely keeping it company.
  see: ""
- id: ppl_cd_lugalkisal
  origin: allora1
  kind: person
  name: Lugal-Kisal
  title: Chief of the Woodcutter Pairs
  icon: 🪓
  region: cedars
  text: "The chief of the Pairs is a vast, slow, scarred old woodcutter who has felled more cloud-cedars than any man living and lost two watchers to the forest doing it. She still works every day — with her granddaughter watching, and her eyes on her granddaughter. She has the pay of three garrisons and the respect of none of them, and it troubles her not at all: the forest is the only power on the mountain she takes seriously."
  see: ""
- id: ppl_cd_huwawa
  origin: allora1
  kind: person
  name: The Resin Mother
  title: Keeper of the Cedar Forest
  icon: 🔶
  region: cedars
  text: "Nobody has seen the whole of the Resin Mother. She is the oldest thing on the mountain: a slow vastness of living amber lying under the forest floor at its heart, as a mother sleeps under her children, and the cloud-cedars are the trees that have grown up out of her. When the forest is cut she bleeds, and what she bleeds walks. Inside her, golden and perfect and very still, is everything and everyone she has ever kept — a moth, a lion, a Rabene prince in his armour, a whole timber-camp at its supper. They are not dead, the shrine-keepers say. They are only being kept, until she is sure of them."
  see: ""
- id: ppl_aq_salt
  origin: allora1
  kind: person
  name: Yadamilk the Noonday
  title: The Salt King of Ashqel
  icon: ☀️
  region: ashqel
  text: The Salt King is a lean, sunburnt, restless man of fifty who was a ship’s captain before the island lords chose him, and still runs the Hall of Two Thrones like a deck. He reigns from first light until the sun touches the sea, and spends the last hour of every day writing long letters to the Sand King, which a blindfolded page carries across the causeway at dusk. He has never seen the man he shares a city with. He says he imagines him as a short, fat, sleepy fellow, and hopes very much he is right.
  see: "On the island throne a lean sunburnt man in salt-white reads a ledger and snaps his fingers for the next petitioner: the Salt King."
- id: ppl_aq_sand
  origin: allora1
  kind: person
  name: Ahirom the Midnight
  title: The Sand King of Ashqel
  icon: 🌙
  region: ashqel
  text: The Sand King is a soft-spoken, heavy-lidded caravan-lord who reigns from dusk to dawn in the glass-lit hall of Ushq and sleeps through every afternoon. His answers to the Salt King’s letters are short, courteous and frequently very funny, and the scribes of both courts read them aloud. He has a portrait of his fellow king in his bedchamber, painted from descriptions, which he is fairly sure is wrong. The two of them have ruled Ashqel together for eleven years without a quarrel the city could see.
  see: "In the glass-lit hall of Ushq a heavy-lidded man in night-blue listens to a caravan-master without moving at all: the Sand King."
- id: ppl_aq_mint
  origin: allora1
  kind: person
  name: Tabnit-Sela
  title: Mint-Mistress of the True Weight
  icon: 🪙
  region: ashqel
  text: "The Mint-Mistress is a small, deaf, terrifying old woman who can hear a false coin anyway. She holds the star-iron dies — cut, the Mint says, from a stone that fell burning into the harbour in the founding year — and she alone knows which of them struck which year’s silver. Merchants from Assar to Meret-Ahn settle their disputes by having both parties hold the same Ashqeli shekel: it rings true in an honest palm and false in a liar’s. She says this is not magic, only good silver. Nobody believes her, and she prefers it that way."
  see: ""
- id: ppl_aq_dyer
  origin: allora1
  kind: person
  name: Arish of the Vats
  title: Dye-Lord of the Many-Hued Snail
  icon: 🟣
  region: ashqel
  text: "The greatest of the Dye-Lords is stained every colour to the elbows, smells permanently of rotting shellfish, and owns more ships than the Salt King. His own cloak is the one piece of unfixed multi-color in Ashqel that nobody can read: it shifts through every colour at once, like oil on water, and he says that is simply what a merchant feels. He sells fixed calm to ambassadors, fixed joy to brides and fixed grief to heirs, and has opinions on all three."
  see: "A big man stained every colour to the elbows walks the vat-galleries holding a scented cloth to his nose: Arish of the Vats."
- id: ppl_aq_coiner
  origin: allora1
  kind: person
  name: Mute Abdo
  title: First of the Dumb-Coiners
  icon: 🤐
  region: ashqel
  text: The head of the Dumb-Coiners has not spoken a word in twenty years, by choice, so that no coin can ever be tested against anything he says. He communicates with his hands, his eyebrows and, when it matters, a small sharp knife. His silent shekels — struck from good silver, but with no truth in them either way — are worth less than real ones and more than false ones, and half the smugglers of Qoul prefer them.
  see: ""
- id: ppl_el_queen
  origin: allora1
  kind: person
  name: Elishat the Undying
  title: Queen of Elissar, First of the Rephaim
  icon: 👑
  region: elissar
  text: "The founder of Elissar is a small, upright woman who looks perhaps thirty-five and has not breathed in four hundred years. She climbed her own pyre rather than marry a king she did not want, and her people would not let her go: they set bread and wine for her at every threshold in the city, every new moon, until one night she came back up the hill to eat it. She is grave, gracious, very well-read and quite without mercy where her city is concerned, and she has never once forgiven her brother. He has been dead for three hundred and ninety years. She still writes to the Salt Throne each spring, and the Salt Kings of Ashqel still, very politely, do not reply."
  see: At the top of the Hill of the Thread, as the lamps are lit, a small woman in purple looks out over her city. She casts no shadow on the wall behind her.
- id: ppl_el_magonim
  origin: allora1
  kind: person
  name: Lord Magonim the Pale
  title: Of the Hundred and Four, Author of the Treatise
  icon: 🫒
  region: elissar
  text: The greatest agronomist in the world died three hundred years ago in the middle of writing his treatise on farming, and has been revising it ever since. It is in four hundred and twelve books. He walks his estates every night with a lamp, tasting the soil and scolding the overseers, and writes a new chapter every month on whatever went wrong. The Rabene, the Ahnari and the Arumi all send scribes to copy it, and he is said to be furious that none of them ever waits for the final version.
  see: ""
- id: ppl_el_arishat
  origin: allora1
  kind: person
  name: Arishat, Mother of Elephants
  title: First of the Mahouts
  icon: 🐘
  region: elissar
  text: The head of the Mahouts of the Double Wall is a broad, weather-black, grey-haired woman who has slept in the elephant-stalls more nights than in a bed, and has buried more elephants than husbands — three of those. She is the only person in Elissar who speaks to the Queen without lowering her eyes, because the Queen cannot come within a stone’s throw of her beasts and both of them know it. She says the elephants smell the dead the way men smell smoke, and remember every one of their own, which is more than the Rephaim can say of theirs.
  see: In the stalls of the Double Wall a grey-haired woman sits on an upturned bucket, singing to an elephant that is leaning its whole forehead against her.
- id: ppl_el_gisgal
  origin: allora1
  kind: person
  name: Gisgal the Reader
  title: Keeper of the Library of the Long Night
  icon: 📜
  region: elissar
  text: "The Library’s keeper has read every scroll in it — three hundred thousand of them — and has started again from the end. There is no written catalogue, because there is Gisgal: ask him for a book and he will tell you its shelf, its scribe, its errors and what he thought of it in the year he first read it. He is courteous, dry, enormously learned and quite dead. He lends scrolls for a drop of blood each, which he records in the Red Ledger, and he says it is not the blood he wants. It is the record of who has read what."
  see: ""
- id: ppl_gh_grieve
  origin: allora1
  kind: person
  name: Captain Mordaunt Grieve
  title: Captain of the Grim Hawks
  icon: 🦅
  region: harrowgate
  text: The Captain of the Grim Hawks is a narrow, grey, courteous man of sixty with a goshawk on his fist and a voice he never raises. He has commanded the company for twenty-two years and has never once let it stay a second season anywhere, though he has been offered lordships to do so. He keeps the company’s accounts himself, writes to the families of every Hawk who falls, and cuts their names into the pole with his own knife.
  see: "At the foot of the hawk-pole a grey man with a goshawk on his fist reads a ledger by the last of the light: Captain Grieve."
- id: ppl_pl_keeper
  origin: allora1
  kind: person
  name: Orrin Vasilant
  title: Keeper of the Key
  icon: 🗝️
  region: plandor
  text: The Keeper of the Key is a small, stooped man of seventy with a winder’s calloused thumbs and a voice so soft that ministers lean in to hear him. Every dawn for thirty-one years he has walked alone into the Winding Chamber with the golden Key on a chain round his neck, and walked out again a quarter of an hour later, and said nothing about it to anyone. He eats alone, sleeps alone, and is said to have a garden of clockwork flowers on a roof of the Palace that nobody else is allowed to wind. When asked what the Emperor is like, he says, “Punctual.”
  see: At dawn a small old man crosses the Court of Ministers with a golden key on a chain, and every minister in the court stops talking until he has passed.
- id: ppl_pl_proctus
  origin: allora1
  kind: person
  name: Proctus Ammar
  title: First Minister of Petitions
  icon: 📜
  region: plandor
  text: The First Minister is a vast, soft, beautifully dressed eunuch of sixty who has read every petition to the Emperor for twenty years — four hundred thousand of them, he says, and he remembers the worst ones. He speaks for the Emperor in the first form of address, and nobody has ever caught him putting words in the Emperor’s mouth, because nobody knows what the Emperor’s mouth would say. He is the most powerful man in Thoolma who does not hold a key. He collects badly spelled petitions and reads them to his cats.
  see: ""
- id: ppl_pl_ysolt
  origin: allora1
  kind: person
  name: Ysolt Brask
  title: Grand Winder of the Guild
  icon: ⚙️
  region: plandor
  text: The Grand Winder is a broad, grey, impatient woman with a jeweller’s loupe screwed permanently into one eye and burn-scars to the elbow. She commands the Winders’ Guild, tends the Varndum Guard, and is the only person in Plandor permitted to open a battle-golem and look inside. There are a thousand golems in the Guard and a thousand and one warrants in the Archive. She will not discuss the extra one. She will discuss, at length, everyone else’s escapements.
  see: In the Standing Ranks a broad grey woman with a loupe in one eye has a battle-golem’s chest-plate open and is swearing at it, affectionately.
- id: ppl_pl_hebe
  origin: allora1
  kind: person
  name: Hebe Sarrantine
  title: Mistress of Colour
  icon: 🟣
  region: plandor
  text: The Mistress of the Mint of Colour is a tall, thin, elegant woman with violet-stained fingernails who can tell imperial purple from a forgery by smell. She licenses every shade between mauve and the true purple, and employs a judge whose only work is to rule on disputes over lilac. She has had three dyers exiled for a colour she described, in court, as “insinuating”. She dresses entirely in grey, so that nobody can accuse her of anything.
  see: ""
- id: ppl_pl_anatole
  origin: allora1
  kind: person
  name: Anatole Vey
  title: First Copyist of the Exemplar
  icon: ⭕
  region: plandor
  text: The First Copyist is a gentle, absent-minded scholar of fifty who leads the state faith and is privately, everyone suspects, a little Faceless. He has had the Icon Screen of the great Dome restored three times, and each time the restorers have found the Emperor’s face painted over by someone, and painted it back. He does not ask who. He preaches that every made thing is a copy of the Pattern, and that the Pattern is pleased by good copies — which is why the Copyists are the best craftsmen in Plandor.
  see: ""
- id: ppl_pl_tullo
  origin: allora1
  kind: person
  name: Old Mother Crab
  title: Matriarch of the Crab-Teams
  icon: 🦀
  region: plandor
  text: Nobody in the Crescent Bay remembers her real name. The matriarch of the crab-teams is a tiny, ancient, ferocious woman who has hauled barges along the bay floor since she was eight and now owns forty teams of sledge-crabs and the moulted shells of six hundred more, which she rents to the poorest families as cottages. She sits on an upturned crab-shell at the end of the strand and settles every dispute among the haulers with a walking-stick, swiftly.
  see: ""
- id: ppl_sy_gorvan
  origin: allora1
  kind: person
  name: Gorvan IV, the Gilded Guest
  title: King of Seylon
  icon: 👑
  region: seylon
  text: "Seylon’s king is a soft-spoken, heavy-eyed man of forty-one who was crowned at twenty in the Dome of the Exemplar and has spent nine years of his reign as a guest in Plandor. He signs nothing the Resident of the Key has not signed after him, and has one power nobody disputes: he names the day of the apricot harvest. He takes it very seriously. Every year the whole kingdom waits for the word, and every year it is, people say, exactly the right day."
  see: "On the palace balcony over the crater lake a heavy-eyed man in gold tastes an apricot, considers it for a long time, and shakes his head: not yet."
- id: ppl_sy_resident
  origin: allora1
  kind: person
  name: Minister Caspar Velloe
  title: Resident of the Key in Seylon
  icon: 🗝️
  region: seylon
  text: The Resident is a dry, thin, courteous Thoolman of sixty who has lived in the king’s palace for fourteen years and signs every royal document a finger’s breadth below the king’s name. He speaks perfect Seylonese and pretends not to, so that people talk in front of him. He plays Kalazt in the Old Dorum every week and loses, carefully, exactly as much as he can afford to learn from.
  see: ""
- id: ppl_sy_abbess
  origin: allora1
  kind: person
  name: Mother Anahid of the Lamp
  title: Abbess of the Monastery of the Lamp
  icon: 🕯️
  region: seylon
  text: The abbess of Seylon’s oldest monastery is a tiny, upright woman of eighty who has climbed down into the dark under the mountain every night for sixty years to keep a vigil beside a light nobody else has seen. She accepts that the Lamp is, officially, a Lesser Copy of the Exemplar. She says so to Thoolman visitors, word-perfect, and then offers them tea, and they leave feeling they have lost an argument.
  see: ""
- id: ppl_th_grandfoundress
  origin: allora1
  kind: person
  name: Foundress Ilka Varr
  title: Mistress of the Vel Ossira Foundries
  icon: 🔥
  region: therama
  text: The foundress is a red-faced, deafened, enormous woman who has cast golem-frames for forty years and speaks in a shout that carries over a pouring. She tests every new golem on the Proving Ground herself, standing in front of it with a hammer. None has knocked her down yet. She regards this as a fault in the golems.
  see: On the Proving Ground a huge red-faced woman stands in front of a new golem with a hammer, shouting at it to try harder.
- id: ppl_tp_laureate
  origin: allora1
  kind: person
  name: Abbot-Laureate Seferin Oll
  title: Ruler of Topila
  icon: 📜
  region: topila
  text: "The Abbot-Laureate won the last decade’s contest with a poem in the Single Line school: one line, revised daily for forty years, which nobody outside the school has ever been allowed to hear in full. He is a thin, sun-blackened man of seventy who rules Topila from a roast-house chair and drinks eleven cups of chorro a day. He writes the tribute poem for Plandor himself, every year, and has never once been rejected — partly, the Unwritten School say, because the Ministry of Petitions cannot quite tell what it means."
  see: In the corner of a roast-house an old man with a sun-blackened face crosses out one word in a single line of verse, and writes it back in again.
- id: ppl_gr_grandheadsman
  origin: allora1
  kind: person
  name: Grand Master Orsola Venn
  title: Grand Master of the Clean Stroke
  icon: ⚔️
  region: gramanna
  text: The head of Gramanna’s Guild of executioners is a calm, grey-eyed, slate-coated woman of sixty who was taken as an orphan at seven, trained for nine years, and has carried out four hundred sentences in eleven realms. She rings one bell after each and has never rung it a moment too long. She keeps the Book of Last Words herself, reads in it every night, and has never let anyone else read the page about the journeyman who spared a woman — the Guild’s founding scandal and its founding saint.
  see: In the Guild yard a slate-coated woman rings a single bell once, listens to it die away completely, and walks back inside.
- id: ppl_st_child
  origin: allora1
  kind: person
  name: King Pell the Seventh-Year
  title: Child King of Dapilla
  icon: 🍐
  region: southtribes
  text: "Dapilla’s king is eight, chosen by dream a year ago, and rules from a chair carved for a much larger king, with his feet on a footstool of oranges. He takes his duties seriously: he names the fruit of each week, settles disputes between children, and has twice refused the Stipend with a single word, which Thoolman law cannot argue with because he is eight. He will reign until his first dream he cannot tell from waking."
  see: Under a tree hung with golden fruit, a small boy in a crown of leaves listens gravely to two quarrelling farmers, and then tells them both to share.
- id: ppl_st_prefect
  origin: allora1
  kind: person
  name: Prefect Lucan Ardesh
  title: Prefect of the Stipend Stone
  icon: 🧂
  region: southtribes
  text: "The Prefect of the Stipend Stone is a heavy, sun-blackened Thoolman of fifty who has carried the Stipend south for twenty springs, speaks Stipend-Talk better than Thoolmic, and keeps two ledgers: one of who came to take the salt, and one of who should have. He has never once been paid what the Ministry promised, and has never once failed to pay the tribes what Thoolma promised them."
  see: ""
- id: ppl_st_nodarius
  origin: allora1
  kind: person
  name: The Nodarius of the Teira
  title: Master of the Velatores
  icon: 🤫
  region: southtribes
  text: Nobody outside the Greza knows the name or face of the master of the Velatores. Contracts are agreed with a veiled figure in the contract-hall who signs only in Velator Hand, inside the sleeve; three Thoolman ministers have claimed to have met the Nodarius, and each described someone different. The Greza say there has been a Nodarius as long as there has been silk.
