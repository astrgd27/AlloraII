    - Once a month Ebbe walks out to Ashcombe with a loaf and leaves it at the Guard-Post for the Shuttered Manor. He worked King Peller’s private cage for nine years before he hauled up the men who took him down. He doesn’t know which part he is sorry for.
    - "The Shuttered Manor sent the loaf-cloth back last month, folded, with one word stitched into the corner in an old man’s careful hand: Ebbe. Mad or not, the king remembered his lift-man. Ebbe has given you the cloth to keep, because, he says, he cannot keep it himself and still go to work in the morning."
