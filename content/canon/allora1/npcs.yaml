  talk:
    - Brisa can tell ghostcap from deathveil by the smell of the mud it grows in, and tells you which Low Water dealers cut their fen morels with plain field mushrooms.
    - “Everyone in Ripla wants to know what I dream,” Brisa says. “I tell them mud. It’s mostly true.”
  tiers:
    - Brisa has never dreamed. Not once, not as a child, not on the Nimian draught every fen-child is given at twelve. In Ripla that is a kind of disgrace, and she has told almost no one.
    - The Nimians have heard about Brisa. Old Mother Wren’s recluses want her in the dream-cells on the strongest draught they brew, to see what an empty sleep is made of, and they are offering a year’s ghostcap money. She asks you to come and sit by the couch.
    - "Brisa woke in the dream-cells laughing. She will not tell the recluses what she saw, and they are furious. She tells you: the fens at dawn, and you, and nothing else. “Mud,” she says, “and you. I told you it was mostly true.”"
