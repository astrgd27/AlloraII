  meet: The woman on the branch drops down beside you without a sound and signs something inside her sleeve, then laughs — silently, with her hand. “Sorry,” she whispers. “That was a joke. You will learn.” She looks you over with frank professional interest. “Nodaria Vel. I am between contracts. That is not a threat. It is just true. Shall we be friends?”
  talk:
    - Nodaria has never once told you what her last contract was, and has never once lied about it either. She simply changes the subject, beautifully.
    - “A Velator owns a cord, a cloak and a contract,” Nodaria whispers. “Between contracts, she owns a cord and a cloak, and is very bored. You are not boring. Yet.”
  tiers:
    - Nodaria took her Velator’s knot at nineteen and has fulfilled eleven contracts in nine years, every one of them woven into her cloak and unpicked again. She is between contracts now, which in Greza means she is free, and she has decided to spend her freedom finding out what free people do. So far, she says, it is mostly you.
    - A new contract has come for her, woven by the Nodarius — and the name in it is someone she knows. Not you; she is quick to say so, smiling. She cannot refuse a contract once it is in her cloak. She can, she says, take a very long time over it, if someone helps her find a reason it should be unpicked instead.
    - "The reason was found: the contract had been bought with forged silk, and a contract on false silk is no contract at all. The Nodarius unpicked it herself, in front of the whole hall, without a word. Nodaria has stopped taking contracts. She weaves silk now, and says she has never been more bored, or happier, and she signs it inside her sleeve so only you can see."
