  meet: The young woman breaks off her argument mid-word and points at you. “You,” she says. “You were at the siege of the Ninth Table, weren’t you? No? Good. Neither was I. Neither was anyone, there wasn’t one. I’m writing a poem about it.” She pushes a cup of chorro towards you. “Ilari Quen. Misremembering School. I get everything wrong, on purpose, very carefully.”
  talk:
    - Ilari has memorised four hundred poems of the Misremembering archive and can tell you, for each one, exactly which mistake was the honest one.
    - “Every true history was written by someone who was there,” Ilari says. “And everyone who was there was frightened, or proud, or drunk. We just leave the mistakes in where you can see them.”
  tiers:
    - Ilari is the youngest teacher in the Misremembering School, holding a table in a roast-house so small that her students sit on the stairs. She writes only from things remembered wrongly, because, she says, error is where the truth leaks through — and she has a gift for finding exactly which wrong memory hides the true thing.
    - A scholar from Plandor has come for one true fact about the vanished Anquerrans, and the School has given the job to Ilari, because nobody else will. She is frightened of getting it right. She asks you to read the archive with her, and to tell her, afterwards, if she was honest.
    - The fact you found together was small and very strange — that the Anquerrans left their doorsteps swept — and the Plandor scholar did not believe it, and went home. Ilari wrote a poem about it anyway, in which she got everything wrong except that, and it won the season’s contest. She swept nobody’s roast-house. She has asked you, in the eleventh tense, whether you remember the day you met. You do not, quite. She says that is how she knows it was real.
