  meet: The chestnut-seller on the Old Bridge hands you a twist of nuts and waves away your coin. “Owe me,” he says cheerfully. “Everyone does. I owe everyone. It all comes out even on the bridge.” He bows from the waist. “Lew Fallon. Resident.”
  talk:
    - Lew knows the debts of half of Fin and Drell, because the debtors all come and stand on the bridge with him whenever the bailiffs are out.
    - “No arrest, no duel, no debt on the bridges,” Lew says. “Oldest law in the Twin Cities. Some of us take it more seriously than others.”
  tiers:
    - Lew has not stepped off the three bridges in eleven years. He sleeps under the arches of the Chain Bridge, washes at the Maiden’s Landing and sells chestnuts on the Old Bridge, and the bailiffs of both cities wait at either end with his papers, and wave.
    - Lew tells you the debt was never his. His younger brother lost a fortune at dice in the Cup-Houses and took ship from Ripla, and Lew put his own name to the papers so the boy could get away. The brother has written once since, from somewhere across the sea.
    - Lew’s brother sent the money, every pf of it, up the Balm by a bargeman who would only say his name was Joss. Lew paid both bailiffs in the middle of the Old Bridge, where they could not arrest him for being early, then stepped off onto the Fin bank holding your arm, and stood there a long time, and said the ground was softer than he remembered.
