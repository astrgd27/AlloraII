  talk:
    - Ennodo has never once missed a day’s sighting. He has had the same cold for eleven years because he will not go indoors to get over it.
    - “It is not a sloth,” Ennodo says firmly. “The Ministry calls it a sloth because the Ministry has a form for sloths. It is the Ombudsman. It is three hundred feet long and it is very, very patient.”
  tiers:
    - Ennodo’s great-grandfather was sent to the edge of the trees by the Ministry of Magnates to record one day’s movement of a giant in the canopy, and never went home. Four clerks later, the record runs to nine hundred volumes, and Ennodo knows it by heart. He has never been into the trees. Nobody in his family has.
    - The Ombudsman has moved two miles in one night, the first time in a hundred and forty years it has moved more than a few yards. Ennodo has written to the Ministry three times and been told, three times, that his figures must be wrong. He needs a second witness who can climb.
    - The second witness’s name is in the nine-hundred-and-first volume, beside a sighting taken from three hundred feet up, in the crown of the Raizon, by a clerk who had never been into the trees before and now, he says, will never quite be out of them. The Ministry accepted the figures. The Ombudsman has not moved since. Ennodo says it was looking for something, and found it, and he does not mean the two of you. Probably.
