    - A family of apricot-farmers has owed the Dorum one debt for six generations. Their youngest daughter wants it played for, once, at the Rounds, and Tazmir, who has refused every such offer for fifty years, has said yes — on condition that he plays, and that someone he trusts sits beside her.
    - He lost. Everyone in the Dorum swears they felt the card’s hum change before he laid it down, and that he could have held it, and did not. The family’s cord was cut at the High Table and burned under the one lamp. Tazmir says he has not lost a hand of the Rounds since the old king died, and that this was not a hand of the Rounds, it was a gift, and you are not to tell anyone the difference.
