  talk:
    - Lady Sapanit has read every scroll of Ashqeli poetry in the Library of the Long Night four times, and has opinions on each reading.
    - “The living think we are hungry,” Sapanit says. “We are not. We are fed. It is being remembered that we cannot do without.”
