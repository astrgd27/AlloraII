    - "A Hopper judgement has fallen on a bailiff with a noble cousin, and the old bargain is broken: the Ride is ordered out at night for the first time in nine years, and Hal’s troop has drawn Hobb’s Furrow. He asks you, very quietly, what he owes to whom."
    - On the night, Hal’s mare threw a shoe on the Lance Gate road, by no accident, and he walked her home and did not ride. He has told the Captain of the Ride that he is a lance by day and a son of the Furrow by night, and she has, astonishingly, let it stand. He gives you a braided hair from the mare’s tail, which in Gramall is a sworn thing.
