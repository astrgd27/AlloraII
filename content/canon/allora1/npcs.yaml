    - At the Great Wake the Furrow crowned Jennet Wake-Queen. For one night she could say anything about anyone, lords and all, and she stood on a hay-cart and told the whole Wake what you had done for them on the dark-moon night — and then that you had beautiful eyes, and that the reeve smelled of pigs.
