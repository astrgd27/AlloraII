    - “The witches leave the far-north kin alone, mostly,” Orri says. “We’ve nothing they want. Except our dead. Except that.” He plays a quick tune to chase the quiet off.
  tiers:
    - Orri has never been further south than Waerstead. He wants to see a tree that drops its leaves, and a city, and the sea when it is not frozen, and he asks you about all three, every time.
    - Orri’s grandmother is dying in the hide-tents, and the far-north kin give their dead to the Tithe like everyone else. She is the one who taught him the songs. He asks you, very quietly, whether there is anywhere in the world the Larder cannot reach.
    - "Orri’s grandmother went into the Khiln bog, not up the Tithe-Road: carried south by night on a reindeer-sledge to meet a peat-cutter from the Moss, with Orri playing her the old songs all the way. He has made you a fiddle-bow of sinew and antler. “She said to give it to whoever told me where,” he says. “That’s you.”"
