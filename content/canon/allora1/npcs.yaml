  talk:
    - Ennam can hold his breath for longer than it takes to sing the Divers’ Song twice through, and has, for a bet, in the springs of Dilmun.
    - “Every pearl’s somebody’s last dream,” Ennam says. “I don’t listen to them. I don’t want to know who.”
  tiers:
    - Ennam’s father was a diver, and his father, and all of them went down on stones until one day they did not come up. Ennam has gone deeper than any of them. He says he is not looking for them. Lu-Nanna, the blind singer, says he is.
    - Ennam has found the place on the Deep Banks where his father’s stone still lies, roped, in thirty fathoms. He wants to bring the stone up and set it on the mound-field, and he wants someone in the boat who will not look over the side while he is coming up.
    - You did not look. Ennam came up with the stone, and with a pearl that had grown round his father’s diving-knife, and he held it to his ear, at last, and listened, and told you only that the dream inside it was a good one.
