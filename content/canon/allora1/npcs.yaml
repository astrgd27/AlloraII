  meet: The Sarlonese clerk counts the wagons through the toll, writes the number down, and only then looks at you. “You paid the full toll. Nobody pays the full toll. Either you’re honest or you’re new.” She takes a pen from behind her ear. “Inés Ferrer, of the Embassy. Let’s find out which.”
  talk:
    - Inés knows exactly what every wagon through Harrowgate paid in toll this year, and exactly how much of it Toll-Master Gorm declared.
    - “My brother copies treaties in the Chancery of Five Tongues,” Inés says. “He thinks every war begins with a bad translation. He’s never met House Vane. Here the translation is perfect. That’s the trouble.”
  tiers:
    - Inés has spent four years at the Embassy-House counting wagons for a road Sarlon dreams of and House Vane will never allow. She writes home every week to her brother Gonzalo, the copyist, who writes back in verse, which she has asked him repeatedly not to do.
    - Inés confesses she has been softening the Ambassador’s despatches. When Don Fadrique writes that Lord Aumery is a thief, the Harrowan copy calls him “a prudent steward of his tolls”. Twice it has kept the peace. If it comes out she will be sent home in disgrace, and Gonzalo would understand, she says, which is the worst of it.
    - Inés told Don Fadrique herself. He read every softened despatch in silence, then made her Second Secretary, on the grounds that she had evidently been running the Embassy for two years already. She has written to tell Gonzalo he was right about translation after all, and has asked you, next time you are in Sarlon, to watch his face when he reads it and tell her exactly what it did.
