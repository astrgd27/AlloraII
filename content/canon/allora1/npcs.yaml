  meet: The clerk looks up from the Registry ledger and corrects the clause you have just quoted, word for word, from memory. “Book nine, article forty, and it says ‘shall’, not ‘may’. Lives have turned on less.” He blots his pen. “Osric Penn. Sit, if you can sit quietly.”
  talk:
    - Osric can recite the whole Waking Code from memory, all eleven books, and does so, if allowed, in a voice like a slow river.
    - “A Sleeper dreams the truth,” Osric says, “and then I have to find it a clause. You’d be amazed how often the truth won’t fit.”
  tiers:
    - Osric has studied fourteen years to be a Novice Sleeper. Every year he drinks the draught at the trial, and every year he lies wide awake on the couch counting the beams, while younger clerks sink into Nim’s dream beside him.
    - "Osric has found a hole in the Waking Code: a widow of the Drowned Stairs whose house no dream can save, because the Code has no clause for her. He means to plead her case himself, which a clerk may do exactly once in his life. He asks you to help him find a witness."
    - Osric won. The Sleeper dreamed, the clause was found — the very one he argued for — and the widow kept her house above the tide. He has given up the couch for the Pleading-Floor, and says he was never meant to sleep through anything that mattered.
