    - A valley’s tax-cord has come back from the palace with three times the harvest knotted on it, and Ani did not tie it. The Resident’s clerks say Cord-Readers misremember. Ani has never misremembered anything in her life — except, sometimes, on purpose, for the valley. She asks you to help her find the false knot before anyone asks which kind this is.
    - The false knot was tied by a palace steward skimming the difference, and the Resident of the Key, who signs after the king and dislikes being made a fool of, dealt with the steward very quietly. He then asked Ani, in perfect Seylonese, whether she had ever misremembered anything. She said no, word-perfect, and offered him tea. He drank it. She has tied a new cord for you, which she will not let you read.
