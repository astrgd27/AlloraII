    - Elsabet has paid off the last of her ransom and could leave the Grey Lances tomorrow. She has signed another year instead, and had your name written in the company book beside hers, as the one to be told if she falls. “Somebody has to be,” she says. “I wanted it to be someone who’d mind.”
