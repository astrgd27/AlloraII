    - Joss has fed Tobit Rook’s IOU to the Shared Fire on the ford-ice, in front of you. “Any man who can talk me out of my boots has earned them,” he says. “If you see him in the Seven, tell him Joss Ambry says he still owes me a story.” Then he puts his fox-cap on your head, and will not take it back.
