    - "Merewyn has begun to dream a case that nobody has brought: the Court of the Sleepers against Merewyn Sallow. The draught has been creeping her waking hours down. She asks you to sit by her couch every day for a season and wake her at the fourth bell, whatever she says in her sleep — and she warns you that she says some very persuasive things."
    - "You woke her every day, and she said some very persuasive things. At the end of the season she dreamed the verdict: the Court must give back one hour. The Sleepers, who cannot argue with a dream, have done it. Merewyn has five waking hours now. She has given one of them, by name, in writing, in the Registry, to you."
