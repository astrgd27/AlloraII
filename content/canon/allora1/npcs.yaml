    - The cedar Shiru was born in is walking. Slowly, as they do, but it has crossed half a valley this year, away from the others, and the bridges to it are stretching. If she stays with it, she will be alone. If she leaves it, she must cross a rope no one has strung yet. She asks you to help her string it.
    - You strung the rope, and Shiru crossed — and then, halfway, stopped, and climbed down it, all the way, and put one bare foot on the ground. She stood there a long while. Then she climbed back up and told the Crown-Folk that the oath had never said anything about visiting.
