    - Pell’s daughter Ama crossed the ford-ice nine years ago and married a Praen hunter. Onore calls it treason and the Line calls it nothing. Pell has a grandson on the other side of the Neck he has never seen, and he looks north every night for more than one reason.
    - You walked Pell out across the Frozen Fords to the Shared Fire, where neither side’s rulers look, and a boy of eight with Pell’s own chin sat down beside him and asked about the beacons. Pell answered every question. On the way back he said nothing at all, and stamped his feet the whole way, and was happy.
