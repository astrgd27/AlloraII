    - Ezzaret was born on the Summit of Tongues to a star-priest and a mother nobody below ever saw. She grew up understanding everything — men, hawks, winds — and was eight before she learned that the rest of the world does not. Below the middle terraces her words come out as birdsong. She has never been down.
    - "The winds have been saying something about the river, and the Shepherd-King wants it interpreted in Assar, before his council. Ezzaret cannot speak below the tower. She asks you to come down with her and be her words: by gesture, by guessing, by whatever you have learned of her."
    - "You went down the endless ramp together. In Assar she spoke and nobody understood her — except you, slowly, a little more each day. The King had his omen: the winds said the flood would come late, and it did. Ezzaret has gone home to the summit. But every evening now she comes down to the Babbling Terrace, where nobody understands anybody, and says it is the first place she has ever felt ordinary."
