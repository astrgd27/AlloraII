  talk:
    - Kidin knows the name of every winged bull in Assar, which is a crime, and says it to them, which is a worse one, and nobody has ever dared report him.
    - “They’re not statues,” Kidin says. “They’re asleep standing up. Like soldiers. Like me, by the end of a watch.”
  tiers:
    - Kidin’s bull — the left-hand bull of the Gate, Shepherd-of-the-Threshold — turned its head an inch towards him on the night his wife died, nine years ago, and has stayed that way. The Tablet-House says the name has worn. Kidin has never let them re-cut it.
    - The Tablet-House has ordered the name re-cut at the next new moon, which will turn the bull’s head back to the palace, where it belongs. Kidin asks you to stand the watch with him on the last night, so that someone besides him will remember which way it looked.
    - The scribes re-cut the name and the bull’s head turned back to the palace — and then, at dawn, an inch towards Kidin again. The Tablet-House has filed it as an error. Kidin has filed nothing. He laughs, for the first time you have heard, and tells you the bull has decided.
