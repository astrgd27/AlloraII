  meet: The old woman at the helm turns it a quarter-turn, for no reason, and looks round. “You’ve the look of someone who’s been told to bow,” she says. “Don’t. I was elected. Anyone can be elected. It’s much worse than being born to it.” She holds out a hand like a knot of rope. “Jacira. Queen, pilot, and eighty-one. I steer on feast days. The rest of the year I listen.”
  talk:
    - Jacira has piloted every river in the Raizon and has been Queen for thirty-two years. She still takes the helm of the royal boat on feast days, and still will not let anyone else touch the sounding-line.
    - “Plandor thinks it owns us,” Jacira says. “Plandor’s fleet cannot leave harbour without a Gramannan aboard. Which of us owns which is a question for a very long afternoon, and a great deal of wine.”
  tiers:
    - "Jacira was a river-pilot for fifty years before the Lodge elected her, and she treats the crown as a sounding-line: something you lower carefully and listen to. She has negotiated every treaty with Plandor for three decades by the simple method of making the fleet sail a little slower whenever she wanted something."
    - Her own floating garden has drifted in a flood and fetched up against the house of the poorest ferryman in Campanara, and by law it is his. Jacira agrees. Her children do not. She asks you to stand beside her in the Court of Hammocks while she loses on purpose.
    - The judge stood up, which no judge has done for a queen in a hundred years, and gave the garden to the ferryman. Jacira laughed so hard she had to be helped back into her boat. She has had the law cut into the Lodge door in letters a foot high, and your name, very small, at the bottom, as a witness.
