    - "Linnet has been set her proof: one blade of vorpal bronze, poured, forged and edged alone. If it holds, she is a Wright. If it fails, the ore is gone and so is she. She has not slept, and she has taken the first gem of her seam down to Seronia’s Deep Chamber, which she swears she doesn’t believe in."
    - Linnet’s proof-blade parted a falling silk scarf on the Proving-Yard, and then a bar of iron, and the Guild-Hall rang its bell for her. She has made you a little knife from the offcut, no longer than your finger, that shifts from bronze to violet to green as you turn it. “The first thing I made as a Wright,” she says. “I wanted you to have it.”
