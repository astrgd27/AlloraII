    - The Apex’s geometers want to re-inscribe Ninety-Four with a new owner’s name, which would make it a double again and nothing more. It does not ask you to stop them. It asks you to remember what it said, so that someone does.
    - You remembered, and said it before the College — and the Apex, who has nineteen hundred doubles of her own, decreed that a double whose owner is dead and whose name is lost may keep the name it gives itself. Ninety-Four has chosen to keep its number. It says it is the only thing it has that it did not inherit.
