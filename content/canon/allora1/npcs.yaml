    - Last spring Wenna’s wing folded over the Split Crag and she came down in the Wing-Graveyard, among the broken frames of better gliders than her. She walked away with a cracked rib. She has not jumped from the Crag since, only from the Wing-Post, and she does not want anyone to notice.
    - Wenna jumped the Split Crag again at dawn, with you at the Launch holding her satchel, and rode Bellor’s Cleft out on the updraught so high the Eyrie’s eagles came up to look at her. When she landed she gave you her old cracked wing-spar, signed. “For luck,” she says. “Mine ran out. Now I’ve got yours.”
