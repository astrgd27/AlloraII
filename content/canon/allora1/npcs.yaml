    - Sapanit died at thirty-one, in childbirth, and her family set bread for her in the niche every new moon for sixty years, until there was no one left of them. She came back up the hill before the last of them died, to thank her. She has never said what her name was before she was fed.
    - The last house of Sapanit’s living line — a fishwife in the Round Harbour, the great-granddaughter of the child she died bearing — has stopped setting bread. Sapanit cannot cross that threshold, and would not if she could. She asks you to go in, and to find out why.
    - The fishwife had simply never been told. You told her, and she set bread in the niche that night, and Sapanit crossed her threshold for the first time — and sat in her kitchen until dawn, being shown the grandchildren. She says it was the best night she has had in three hundred years. She has not been back. She says she does not need to.
