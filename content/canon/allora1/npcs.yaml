  meet: The smith does not move until the noon light has shifted the width of a finger. Then he steps back, pushes up his hood, and blinks at you with eyes that are slightly too pale. “Sorry,” he says. “You don’t stop at noon. Nobody would.” His hands are a map of old burns. “Tevo Arrasol. Sun-Smith. If you want to see something made, come back tomorrow at the same time, exactly.”
  talk:
    - Tevo can tell the hour to the minute by the colour of the light on steel, and has never once been late to noon.
    - “A furnace is a fire you feed,” Tevo says. “The sun feeds itself. All you do is hold still, and point, and not flinch. That’s the whole art. It takes twenty years.”
  tiers:
    - Tevo has worked the noon point on the Table of Mirrors for eighteen years and is the best blade-temperer in Topila. His hands are scarred to the wrist, and his eyes have gone a little pale from the light. He says he would not trade a single noon for them back.
    - For nine days the noon point has wandered, cracking every pane of sun-glass and spoiling every blade, and the Smiths are blaming the Murmur. Tevo thinks someone has set a mirror wrong on purpose, and he thinks he knows which, and he does not want to be right. He asks you to help him re-aim the array, frame by frame.
    - The mirror had been set wrong by his own apprentice, who wanted one noon’s light for a blade of his own and was too proud to ask. Tevo taught him at the point himself the next day, standing beside him with his hand over the boy’s on the tongs. Then he forged you a little blade in the same light, and would not say whether he meant it as a gift or as a promise.
