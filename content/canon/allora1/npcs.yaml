  talk:
    - Ysabet can light a candle across the Burning Yard with a look, and spends her evenings in the Cup-Houses lighting other people’s pipes for a penny.
    - “Every Freehold hires the Scorched School,” Ysabet says. “Sometimes both sides of the same field. We all sit at the same table at midsummer and pretend we didn’t.”
  tiers:
    - "Ysabet graduated top of her year. Her first contract was for a Gramall reeve: to burn a Wake-barn in Hobb’s Furrow, with the serfs’ harvest-masks inside. She got as far as the barn door, closed the fire in her fist, and rode home. The School has fined her every contract since."
    - "The School has given Ysabet a choice: take the next contract on the board, whatever it is, or give back her mantle. The next contract is a toll-fort on the Balm, full of toll-clerks. She asks you what you would do, and then asks you not to answer."
    - "Ysabet kept her mantle and turned the contract down, and the Archmagister — who once refused a contract of her own, it turns out — has given her the Bridge-Fight fire to keep: the great bonfire on the Old Bridge that burns all night and harms no one. She lit it this year with you beside her, and it did not singe a single hair."
