    - “The Magnates read the squares,” Ruro says. “Everybody says so. I have never seen one stop to read mine.” He shrugs. “Maybe it is not interesting enough. I keep trying.”
  tiers:
    - "Ruro cuts the truest squares on the Ayermar and reads tomorrow’s fish in yesterday’s water better than anyone in the tribe. He is happy, cheerful and entirely without ambition, except for one: he wants, once in his life, to see a Magnate stop and read one of his squares."
    - A migration is coming down the Ayermar. Ruro means to cut the biggest square of his life in its path — a mile across, in three days — and wants someone who can count and swing a machete beside him.
    - The square was a mile across and true to the hair. The Magnate came through on the fourth morning, and stopped at its edge, and stood still for an hour, and the whole camp held its breath. Then it walked on. Ruro will not say what he thinks it read. He has cut you a small square of your own beside the river, a yard across, and says you will owe the tribe one a year from now on.
