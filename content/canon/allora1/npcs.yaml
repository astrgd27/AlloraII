    - “We lay our dead in barrows, and lift them in the seventh year, and carve their deeds on them,” Swithun says. “That way the bone remembers. That way Wocca cannot eat what it remembers.”
  tiers:
    - "Swithun lifted his father Cola’s bones from the Barrow-Downs this spring, as a son must in the seventh year, and has been carving his deeds into the thighbone for the family: the hunts, the hall-feasts, the wedding. Then he stopped."
    - Cola was a tithe-reeve. For twenty years he carried other families’ dead up the Tithe-Road to the Larder, and the Praen called him necessary and would not sit with him. Those are his deeds too. Swithun does not know whether to carve them, and cannot finish the bone until he does.
    - Swithun carved it all — the hunts and the feasts and the long road north, and the name of every family his father carried, small and true along the bone. At the Dread-Night in Eorlhall he read the names aloud, and the hall was silent, and then the families stood up one by one. He has carved you a comb from the offcut. “So someone outside the Mearc knows,” he says.
