  talk:
    - Amaro was named for the figs that were ripe the week he was born, and still cannot eat one without being, very briefly, seven.
    - “I reigned six years,” Amaro says. “Then one night I dreamed I was awake, and could not tell. In the morning I was twenty-six. That is not how it happened, but it is how it feels.”
  tiers:
    - Amaro was chosen by dream at seven and reigned until he was thirteen, when he dreamed a dream he could not tell from waking and became an Elder of Yesterday. Since then he has sat on the porch and waited to be asked something. He is very good at waiting. He is less good at not caring that nobody comes.
    - "Plandor’s lawyers have found a new argument: that an Elder of Yesterday, being an adult who was once king, may sign for the realm. They have sent a treaty to Amaro. He cannot give advice unless a child asks — and no child has asked him anything in fourteen years. He asks you to help him find one who will."
    - A girl of six asked him, in front of the whole Gardeners’ council, whether he should sign the Thoolman paper. He said no, with great relief, and explained why for an hour, and she fell asleep halfway through. The treaty went back to Plandor unsigned. Children ask Amaro things all the time now. He has started keeping a list of the questions, and reads you the best ones at night.
