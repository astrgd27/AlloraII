  talk:
    - Kaia was born on the left foot of Corolla’s stride, which in Kilopa means she will never be content where she is. She says it is true, and that it is a very good thing in an archer.
    - “On flat ground,” Kaia says, “I feel like the world has died. Everything is so still. How do you sleep?”
  tiers:
    - Kaia has never stood on flat, still ground for a whole day, and is fiercely proud of it. She is the best archer on Corolla and the worst at being on the ground, where she staggers, goes pale and has to sit down. She watches the sun every afternoon from the lookout, and does not like what she sees.
    - The Kilopa need someone to go to the Stipend Stone, which does not move, and argue for a bigger share of salt this year, and stay a whole week. Kaia has been chosen, because she is the best speaker. She is terrified. She asks you to come with her and stand beside her on the still ground.
    - She stayed the week. She was sick on the second day, and on the fourth, and on the sixth she stood up in front of the Prefect and argued the Kilopa’s share up by a fifth, swaying on her feet, and won. She came back to Corolla and kissed the shell. She says she will never do it again, and that she would, for you.
