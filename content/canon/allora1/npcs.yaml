    - Seventy years ago, in a famine winter, twenty-year-old Fiammetta went into the rings to bargain for her village. The Gentry agreed that it would never go hungry again, so long as she danced for their court every night. It never has. She has not aged a day, and everyone who knew her name is buried in the churchyard at Castelvento.
    - King Aurelio, under the hill, has offered to let Fiammetta see one sunrise above ground — the first in seventy years — if someone takes her place in the dance for that one night, and does not stop until dawn. She asks you, and then tells you not to, and then asks you again.
    - "You danced the whole night through under the hill, and Fiammetta watched the sun come up over the Fairmeadows and cried until it was full day. She went back at dusk, by her own choice. But the Gentry, who honour any bargain to the letter, have let her keep the sunrise: every day she now spends above ground, she ages one day. She says she has never been so glad to grow old."
