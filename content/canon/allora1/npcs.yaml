    - The smuggler whose boat it was is Momolo Scarpa. Cael ran off with a cargo of the Loop-Lords’ silk to buy his way over the mountain, and Momolo took the blame and the beating for it. Cael has been saving the price of that silk for seventeen years. He asks whether you ever go to Selino.
    - Cael has given you a purse of Gallar silver and a letter that says only “Paid. — C.”, to carry to Momolo Scarpa of Selino, and has shown you his own unrecorded way over the Saddle, which no warden of Vane has ever seen. “There,” he says. “Now nobody owes anybody.”
