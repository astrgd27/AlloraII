    - Osgyth walks the kipper-road north every season — Eorlhall, the Neck, the Tithe-Road, Ice-Bay — though the money is no better there than at home. She says she likes the walk. She always stops longest at Waerstead.
    - Osgyth’s daughter was taken in at the Hornhall at twelve, in a lean year when the Tithe chose one girl from every third Molster boat. Osgyth sells kippers at Waerstead because the veiled sisters of the Hearing pass through it, and once, three years ago, one of them stopped at her creel and stood there a long while, and bought nothing, and went.
    - "This year at Waerstead, while Osgyth’s back was turned, a gloved hand left a little swan-bone fish on her creel: the kind every Molster child is given at birth. Osgyth wears it under her shawl now. She has not tried to find out whose hand it was, and asks you not to. She says she has nothing more to ask of the gods."
