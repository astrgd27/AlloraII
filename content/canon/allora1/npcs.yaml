  meet: The young man stops counting and turns. He looks at you for a long time, politely, as a landlord’s son looks at someone else’s guest. Then he says something exact and formal in Old Anquerran, and, seeing your face, says it again in careful Stipend-Talk. “You are welcome for the term of your visit. I am Anquel. I keep the count. Will you be staying long?”
  talk:
    - Anquel learned to count from the fireflies, like every Holdover child, and still moves his lips when they blink.
    - “My people stayed when the others left,” Anquel says. “We pay the rent. The jungle leaves us alone. You think that is a sad story. It is a contract. They are not the same.”
  tiers:
    - "Anquel is the youngest keeper of the count among the Holdovers: he records the rent his people leave in the square each year, and checks it against the ledgers in the counting-houses, which are always already written. He has never been further north than the Stair. He has never wanted to, until lately."
    - Anquel wants to know who writes the new page in the ledger each year. No Holdover has ever tried to see. The eldest has said he may, if a stranger sits up with him, so that whatever is seen will have been seen by someone who does not owe the rent.
    - "You saw nobody. At dawn the page was written, and Anquel read it, and was quiet a long time. Then he laughed — the first time you have heard him laugh — and showed you a second line under the rent: “Noted: a visitor, and the count-keeper, together.” He has not explained why that made him so happy. He has started, on clear nights, to teach you the numerals in the fireflies."
