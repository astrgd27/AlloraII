  meet: The dream-scribe blows on a damp tablet to dry it, looks up, and asks what you dreamt last night — out of habit, and then, apologising, out of interest. “I take down three hundred a dawn. I never get to hear the good ones twice.” She wipes clay from her fingers. “Belili. Belili-ummi, on the tablets.”
  talk:
    - Belili can tell from a citizen’s handwriting whether a dream was really dreamt or made up in the queue, and says nine in ten are at least a little made up.
    - “The star-priests read the whole empire’s sleep,” Belili says. “I just read Mudbrick Street’s. Mudbrick Street dreams mostly about bread.”
  tiers:
    - Every night for three years Belili has dreamt of the sea — a grey, endless sea with no ships on it — and every morning she has filed a different dream under her own name. In the omen-books, the sea without ships means the empire’s end.
    - The star-priests have noticed that the whole of Mudbrick Street has begun to dream of the sea. Belili thinks she taught it to them, in the queue at dawn, by listening too kindly. She asks you whether a dream can be catching, and then whether she ought to confess.
    - Belili filed her real dream at last, under her own name, and the star-priests read it, and declared the sea without ships to mean only peace — no fleets, no war. She does not believe them, and neither do they. She has stopped dreaming of it anyway, and dreams instead, she tells you, of somewhere with you in it.
