    - "You went out on the Moss with Brytha at midnight, an old bog-smith of Heronstead on a hurdle between you, and helped her sink him deep and gentle among the Sunken Kin. Afterwards she sat in the reeds and wept, once, and then washed her face in black water and said: “Now he keeps.” She has told the Moss your name, she says, so it will know you."
