    - Amat was born in the green twilight under the terrace and grew up catching what fell. She climbed the first rope at nine and has not willingly stood on the ground since. Her mother still lives below, and will not look up.
    - The Tablet-House has decided the gardens’ underside is a hazard to the street, and means to net it off — which would end the falling fruit, and the only food some of the shade’s families get. Amat asks you to help her argue it at the palace gate, in front of her mother.
    - The nets went up — but with a gap every hundred cubits, “for inspection”, which the shade’s children know exactly how to use. Amat’s mother came to the palace gate and looked up, at last, at her daughter hanging there in her harness, and waved.
