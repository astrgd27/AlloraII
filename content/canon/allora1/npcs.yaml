    - Haeth has been given her first horns. The rite needed a meal from the Larder, and she does not say whose. But since the winter she reads the sea-ice like a Molster pilot of fifty years, which she never learned to do, and twice you have seen her stop and stare at her own gloved hands as if they belonged to someone else.
    - There is a herring-wife who sells kippers at Waerstead every season, and Haeth has never once let herself buy one. This year she left a swan-bone fish on the woman’s creel when no one was looking. Then she told you her old name, very quietly, once. “Someone outside should have it,” she says. “Say it at the boat-graves, if you are ever there. Not to me. Never to me.”
