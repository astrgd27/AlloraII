    - Benedo was taken by the Guild at six and has never been anywhere but the yard, the Book and the courts he is sent to. He has read every page of the Book of Last Words but one.
    - “We are forbidden mercy,” Benedo says. “Not kindness. Nobody ever told us we were forbidden kindness. I asked.”
  tiers:
    - Benedo is a journeyman of nine years’ training who carries out the empire’s sentences without flinching and rings the One Bell afterwards, every time, a little too long. The masters have warned him. He says the bell should ring until the person is all the way gone, and that some people take longer.
    - A page has been cut from the Book of Last Words — the page about the journeyman who spared a woman — and Benedo is the one the Guild suspects, because he is the one who rings too long. He did not take it. He asks you to help him find who did, before the Grand Master has to decide whether to believe him.
    - The page was taken by the Grand Master’s own copyist, who meant to burn it so no other journeyman would ever be tempted. Orsola Venn read the page aloud to Benedo, alone, for the first time in the Guild’s history, and then put it back in the Book. He still rings the bell too long. Nobody warns him any more.
