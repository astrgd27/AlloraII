  meet: The young priest closes the dead man’s eyes and says the Bride’s words over him, and only then turns to you. “You sat the whole death-watch and didn’t look away. Most can’t.” He wears the Ringed’s black and white, the dark-gemmed ring and, somehow, stubble. “Ancel Dray. Mourner. Lowest of the Ringed. Thank you.”
  talk:
    - Ancel tells you that a wedding and a funeral are the same rite to Seronia, and that the only difference in Gramall is who brings the beer.
    - “The Ringed tell the story of Bellor’s last trick at every wedding,” Ancel says. “As a warning. The congregation always cheers in the wrong place.”
  tiers:
    - Ancel was a younger son given to the Ringed because his family could not feed him. He loves Seronia truly, he says, the way you love a cold, beautiful, faraway thing. He also goes to the Lucky Man every night, which is not forbidden, exactly.
    - On a dare at the Lucky Man, Ancel slept a night on Bellor’s Headstone and woke with a beard that will not stay shaved. The Ringed call it the first sign of the Mantle and the worst kind of theft, and if it has not faded by the Unveiling he will be put out of the Bride’s service. He asks you to keep the death-watches with him until then.
    - "Ancel shaved on the last night of autumn and it stayed shaved, and the Veil-Keeper has kept him. He chose the Bride. But he still drinks one cup at the Lucky Man each week, and at every death-watch now he sets out two: one for Seronia, who is patient, and one for you, who sat with him when it mattered."
