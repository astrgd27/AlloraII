    - Her father means her to swear the family oath before the Keeper of the Key, and the oath must be witnessed by someone outside the family who has no stake in it. She asks you, because you are the least interested person she knows in Plandor, which is a compliment.
    - In the oath-room there was a mirror, and in the mirror, for the length of a breath, Ismene saw a gate in a wall of jungle, and a keyhole. You saw it too. Afterwards she said she was no longer sure of anything, and found that a great relief. The Orestals still keep the secret. Ismene has stopped arguing about whether it is true.
