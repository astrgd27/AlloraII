    - “Every door in Perlinburg is a question,” Ruprecht says, rubbing his forehead. “The answer is always no.”
  tiers:
    - Six years ago the University needed the long bones of the last giant-lord lifted out of the ossuary, and no crane could reach. Ruprecht, a promising student of the Grandeur, held the working for nine days to do it. When he let go, he did not shrink. He has lived in the giants’ halls ever since, because they are the only rooms in Grell that fit him.
    - Ruprecht has found an inscription in the Long Bones that he believes tells how the giants made themselves small enough to die out — or how to undo the Grandeur in a man. It must be read aloud, at night, by the bones. He asks you to hold the lamp, and to stop him if he starts to grow.
    - "The inscription was a lullaby: the song giant-mothers sang to make their children small enough for the world. Ruprecht sang it all the way through, in a voice like a cellar door, and shrank — by about a hand’s breadth. He laughed until the vault rang. He says he has decided to stay roughly as he is. The halls fit him, and the world can learn to stoop."
