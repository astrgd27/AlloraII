  talk:
    - Ennuk-Tal was born in the Pilot-House on the Beast’s spine and has never once set foot on dry land, which he says does not breathe and cannot be trusted.
    - “Every reef in the gulf is something asleep,” Ennuk says. “The trick of piloting is not to wake any of them. The trick of living on Kuara is not to mind if you do.”
  tiers:
    - Ennuk-Tal was born on the Beast’s back in the great storm when it rolled, and his mother lashed him to the Pilot-House to keep him from going over with the old town. He has never set foot on dry land. He can tell the weather three days off by the Beast’s breathing, and the mood of the gulf by its dreams.
    - The breath-priests have counted the Beast’s breaths slowing for three years, and the town is afraid it is dying. Ennuk thinks it is only dreaming more deeply. He wants to dive to its eye, which no one has seen open in a hundred years, and he asks you to dive with him.
    - "The eye opened. It was the size of a house, and it looked at the two of you for exactly the length of one breath, and closed. The breathing has steadied since. Ennuk will not tell the priests what he saw in it. He tells you: “It knows we are here. It has always known. It does not mind.” The next week he set foot on Dilmun for an hour, to see what land was like. He was not impressed."
