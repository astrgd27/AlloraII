    - Two hundred years ago Edric rode with the Freehold lances into the White Waste, and the Frost caught the whole army in a single breath. Last spring a crew digging grave-goods out of the Frozen Host saw his eyes move under a yard of ice. They cut him out. Old Pell of the Watch-Line, who lost his own brother to the Frost, took him in. Edric is twenty-seven, and everyone he ever knew is dead.
    - Edric cannot stop wondering whether anyone else in the Host is still breathing. Nobody will cross the Working-Circles with him, and the Tithe-reeves say the ice is not to be cut. He asks you to come out to the Host with lamps and blankets, and to help him look into every face.
    - There was no one else. You looked into two hundred faces, and Edric said the name of every one he knew — his captain, his cousins, his horse — and then he turned his back on the Host and walked home. He keeps the beacon with Pell now. He says he left the war under the ice, where it belongs, and he means to spend the rest of his life somewhere warm.
