    - Batnoam can hear a false coin across a crowded court, and claims she can hear a false smile, which nobody has ever dared test.
    - “A coin of Ashqel rings false in a liar’s hand,” Batnoam says. “People think that’s the magic. The magic is how few of them ever stop lying.”
  tiers:
    - Batnoam’s father was a Dumb-Coiner. He struck silent shekels under the causeway for twenty years, and was taken by the Ringers when she was twelve. She became a Ringer the year he died in the salt-gaol. She has never told the Mint.
    - "Mute Abdo has sent Batnoam a message, in his way: a silent coin with her father’s mark on it, newly struck. Someone is still using her father’s die. She asks you to come under the arches with her, at night, and find out who."
