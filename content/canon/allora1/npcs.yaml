  meet: The reeve checks your sledge against his tally-stick, notch by notch, and then looks up, startled, when you thank him. “Nobody thanks a reeve,” he says. “Cenhelm, Wada’s son. Sit by the fire. There’s room. There’s always room by a reeve.”
  talk:
    - Cenhelm can reckon a tithe-sledge’s load to the pound by eye, and tell you which tithe-house is short this year, and why, and for how many winters it has been short.
    - “My father was a reeve, and his father,” Cenhelm says. “The Tithe asks for one son from every reeve’s house. It never asks which one wanted it.”
  tiers:
    - Cenhelm keeps two tallies. One goes up the Tithe-Road to the Hall of the Tithe in Wocca. The other he keeps in knots on a cord under his shirt, and it is slightly longer.
    - "The knotted cord is every family who has hidden their dead from the Larder and asked Cenhelm to count wrong: a grandmother short here, a smith there. If Brund’s council ever sets his count beside the Khilns’ burials, he will go up the Road himself, on a sledge."
    - Cenhelm has cut one knot from the cord and given it to you, with the name of a family that will never need to fear him. “If they take me up the Road,” he says, “I want something of me outside the Larder.” Then he laughs, the first time you have heard him laugh, and asks you to drink with him at Waerstead as if he had said nothing at all.
