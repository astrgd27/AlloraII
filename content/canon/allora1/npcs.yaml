    - The First Copyist has posted a watcher in the Faceless Gallery for the Day of Petitions. Theoda cannot stop painting and cannot be caught. She asks you to keep watch with her — on the watcher.
    - "The watcher was the First Copyist himself. He looked at Theoda’s brush for a long time, then handed her a better one and said only, “Better copies.” Now she paints one icon a year both ways: the Emperor’s face on the front, and on the back, the same icon faceless. Anatole has hung it where it can be turned."
