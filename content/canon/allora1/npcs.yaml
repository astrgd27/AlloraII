    - A sister of the Veil came to Ice-Bay this winter, asking after a woman of Ketta’s height. You stood at the hole beside Ketta with your Witchlore up like a shield, and talked herring prices at the sister until she went away. Ketta has carved you a little seal of bone, the first thing she ever made with her own hands that was not for Wocca. “You and the ice,” she says. “That’s who knows. That’s enough.”
