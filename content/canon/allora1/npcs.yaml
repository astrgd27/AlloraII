    - He gave the speech, badly, and in the middle of it his father, the Gilded Guest, wept in front of the whole court. Nothing changed about who rules Seylon, or who keeps whom. But father and son now talk once a week, in a mixture of both languages that nobody else understands, and Haverun has started losing at Kalazt on purpose, to keep the traders talking.
