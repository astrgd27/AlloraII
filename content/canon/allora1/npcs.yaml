  meet: The fortune-teller beckons you into her tent without a word and turns a card. “The Traveller. Of course. I am Madame Zora, and I have been forty for thirty years. Sit.”
  talk:
    - Madame Zora tells your fortune. It is uncannily accurate about your past and suspiciously vague about your future.
    - “Every town thinks it’s the centre of the world,” Zora says. “The carnival knows better.”
  tiers:
    - Madame Zora was born in Thoolma, or Raben, or a ditch outside Valmonte, depending on the day you ask.
    - Zora admits she has real sight only one time in ten, and has no idea which time it will be.
    - Zora has turned your card one last time and refused to tell you what it was. She smiles, though, which she never does.
