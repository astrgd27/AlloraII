  meet: The bargeman watches you leave a coin for the Maiden at the river-shrine, then sets one of his own beside it. “She likes copper,” he says. “Silver makes her nervous.” He considers you a while. “Joss. I go up and down. You’ll see me again.”
  talk:
    - Joss tells you which toll-chain keepers on the Balm can be talked down, which can be drunk down, and which must be paid in full and then prayed for.
    - “Everyone asks how Norrae came to the Balm,” Joss says. “I reckon she walked. Rivers go somewhere. So does she.”
  tiers:
    - Joss leaves a copper at every shrine of the Maiden from the delta to the springs, and has since he was a boy on his father’s barge. He knows them better, he says, than his own cousins.
    - "Joss has counted Norrae’s shrines on the Balm forty times, and there is always one more than the priests know of: a ring of stones on a reed island in the delta that drowns at every spring tide and comes back clean. He thinks it is older than the Sillenians. He has told no one but you."
    - Joss took you out to the reed island at the lowest tide of the year. The stones are carved with a woman walking out of water — the same shape, a traveller once told him, as the Maiden at the source of the Tenn, in the Seven, a world away. Joss says nothing for a long time. Then he leaves a copper, and then he leaves one for you.
