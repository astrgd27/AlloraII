# Change it only by re-running the extractor, or in a PR labelled canon-change.
- id: lore_allora
  origin: allora1
  kind: lore
  name: The World of Allora
  icon: 🌍
  text: Allora is a world of kingdoms, republics and bishoprics, of guilds and feuds and pilgrimages. Humankind is its only people. Magic is real, but rare, regulated and feared; the gods are many, and some of them answer. This chronicle begins in the north, in the Duchy of Eintenn.
- id: lore_seven
  origin: allora1
  kind: lore
  name: The Seven Principalities
  icon: 👑
  text: "Seven realms share the heartland of Allora: the Duchy of Eintenn, the Kingdom of Sarlon, the Republic of Luggen, the Republic of Marre, the Duchy of Grell, the Bishopric of Dellian and the Kingdom of Rolla. Three of them — Sarlon, Marre and Dellian — are great powers; the rest survive by trade, by alliance, or by being too much trouble to conquer. All seven send electors to the Dellian Diet, which settles disputes among them when it can. Geography, exploration and talk with travellers reveal the other realms, and each realm you learn of can be reached by road or by sea."
- id: lore_reckoning
  origin: allora1
  kind: lore
  name: The Allorese Reckoning
  icon: 📅
  text: Years in the Seven are counted Anno Ruinae — from the fall of Vaelis and the Allorese Empire with it. The present year is 1347 AR. Scholars still date their letters in High Allorese, and the Dellian Diet keeps its records in it, so that no living principality’s tongue is favoured.
- id: lore_harvest
  origin: allora1
  kind: lore
  name: Harvest Customs of Ostwick
  icon: 🌾
  text: The last sheaf of the harvest is dressed as a woman — the Grain-Wife — and carried to the hearth-shrine. A village of the Hearth keeps her by the fire until spring; a village of the Pyre burns her that same night. Ostwick keeps her, but old people remember when it did not.
- id: lore_wild_hunt
  origin: allora1
  kind: lore
  name: The Wild Hunt
  icon: 🌑
  text: "On the darkest nights of winter, they say, a hunt rides through the forests of the north: hounds with ember eyes, riders who were once men. To meet it is to be taken. Woodcutters hang iron over their doors at midwinter, and no one fells a yew. In Grell, they say the Hunt comes down from the peaks on every Hollow Night, and that Gruma alone can turn it back."
- id: lore_kesselhaven
  origin: allora1
  kind: lore
  name: Kesselhaven
  icon: ⚓
  text: "Kettle-Haven, after its round deep harbor. The city holds a charter of partial liberties from the duke: its Salt Council of merchant patricians rules the streets, while the duke rules the tolls. Twenty thousand souls, a dozen guilds, a Luggish Kontor, a Marrean Fondaco, a Hall of Currents, and an Undercroft no one admits exists."
- id: lore_galleys
  origin: allora1
  kind: lore
  name: The Sea-Glass Galleys
  icon: 🚢
  text: "Twice a year the great galleys of Marre arrive in convoy: long low ships rowed by free oarsmen, their sterns glittering with sea-glass, bristling with crossbows, their holds full of spice, silk and mirrors. Their arrival is a festival; their departure empties half the city’s purses."
- id: lore_guilds
  origin: allora1
  kind: lore
  name: The Guilds of Kesselhaven
  icon: 🏛️
  text: No one may practise a craft in Kesselhaven without the leave of its guild. An apprentice serves seven years, a journeyman wanders, and a master must submit a masterpiece and pay a fee that keeps the number of masters small. The guilds sit on the Salt Council and quarrel endlessly with the merchants.
- id: lore_duke
  origin: allora1
  kind: lore
  name: The Salt-Duke
  icon: 🦅
  text: Albrecht IV von Tennfels is sixty, gouty and shrewd. He has outlived two wives, one war and three conspiracies, and he taxes salt so heavily that the Salzmoor is thick with smugglers. His heir is his daughter Margarethe, which the barons of Eintenn have not yet decided how to feel about. His elector at the Dellian Diet votes with Luggen on trade, with Dellian on everything else, and never, ever with Sarlon.
- id: lore_sankt_wendel
  origin: allora1
  kind: lore
  name: Sankt Wendel’s Field
  icon: ⚔️
  text: Forty years ago a Sarlonese army crossed the mountains into Eintenn and met the ducal host at Sankt Wendel’s Field. The Eintennish knights charged the Sarlonese pike squares and were broken. Their retreat was saved by one knight, Calder, who held the bridge over the Tenn until nightfall. His shield hangs in the chapel at Tennfels, and the Dellian Diet brokered the peace that followed.
- id: lore_fondaco
  origin: allora1
  kind: lore
  name: The Marrean Fondaco
  icon: 🦁
  text: A walled compound in Kesselhaven where Marrean merchants live, store goods and do business under their own laws. Its gates are locked at curfew from the outside, by the city — an arrangement both sides find reassuring.
- id: lore_qadir_trade
  origin: allora1
  kind: lore
  name: The Spice Road
  icon: 🐫
  text: Pepper, cinnamon and saffron travel from the far south by caravan to the Rabene ports, by Marrean galley to the lagoon, and by Luggish cog to Kesselhaven. Each stage multiplies the price. A sack of pepper in the Salzmarkt costs more than the ship that carried it.
- id: lore_masque
  origin: allora1
  kind: lore
  name: Behind the Mirror
  icon: 🪞
  text: The stage of the Teatro della Maschera is walled with angled mirrors. The players wear the stock masks of Marrean comedy — the miser, the doctor, the braggart captain, the lovers — and the illusionist among them works through the glass, so that the miser’s gold glitters in his hands and the captain’s ship sails across the back wall.
- id: lore_undercroft
  origin: allora1
  kind: lore
  name: The Undercroft
  icon: 🐀
  text: The Rats are less a gang than a guild, with ranks, dues and a Night-Master who settles disputes. They pay the watch, they pay the Salt Council, and they pay the Night-Master. In return, nobody goes into the old salt-cellars uninvited.
- id: lore_collegium
  origin: allora1
  kind: lore
  name: The Collegium Arcanum
  icon: 🎓
  text: Founded by ducal charter two centuries ago to keep the Hermetic Art where the duke could see it. The Collegium teaches the seven liberal arts to anyone who can pay, but only matriculated students may study the Hermetic faculty, and every licensed mage’s name is entered in the ducal register.
- id: lore_schism
  origin: allora1
  kind: lore
  name: The Schism of the Two Flames
  icon: 🔥
  text: "A century ago the High Hearth-Mother in Rolla declared that Ilvara’s true aspect was the gentle fire of the household, and forbade the old harvest-burnings. The Pyre-Wardens refused. The Schism has never healed: the Hearth calls the Pyre a death-cult, the Pyre calls the Hearth a tax-collector with an oven."
- id: lore_pyre
  origin: allora1
  kind: lore
  name: The Burning of Aschau
  icon: 🔥
  text: "Each autumn the Pyre-Wardens set the stubble fields of Aschau alight and walk barefoot across the embers, casting offerings into the flames: grain, cloth, iron, silver. Whatever the Red Reaper takes, they say, she returns tenfold in the spring."
- id: lore_hedge
  origin: allora1
  kind: lore
  name: Mother Brindl
  icon: 🛖
  text: No one knows how old Mother Brindl is. She was old when the duke was a boy. She teaches the hedge-arts in exchange for work, gossip and the occasional jar of honey, and she has opinions about everyone, including the gods.
- id: lore_greenwife
  origin: allora1
  kind: lore
  name: The Ribboned Oaks
  icon: 🌳
  text: Each ribbon on the oaks is a promise, a thanks or a plea. The faithful of the Greenwife tie them in spring and come back in autumn to see whether the ribbon has been taken by the wind — an answer — or left to rot — a refusal.
- id: lore_storm
  origin: allora1
  kind: lore
  name: Storms of the Hohenkamm
  icon: ⛈️
  text: Storms in the High Comb come up from nothing in an hour, with lightning that strikes the same peaks again and again. Herders say Orthun is choosing; the Collegium says it is the iron in the rock. Both may be right.
- id: lore_staves
  origin: allora1
  kind: lore
  name: The Stave-Carvers
  icon: 🪄
  text: In the mountain villages the old Runic letters are still cut into lintels, cradles and walking-sticks. A stave cut with the right runes, in the right order, by a carver who means it, will carry a blessing for as long as it is carried.
- id: lore_thunder
  origin: allora1
  kind: lore
  name: Lightning-Glass
  icon: ⚡
  text: "Where lightning strikes sand or ash, it fuses tubes and knots of glass: fulgurite. The Cave-Sworn gather it during storms, at terrible risk, and Marrean glassmakers pay well for it."
- id: lore_silver
  origin: allora1
  kind: lore
  name: The Silver of Silberhalde
  icon: 🥈
  text: Silver was found at Silberhalde two hundred years ago by a goat-herd who noticed his animals’ hooves were shining. The mines have made the dukes rich and the miners poor. Every ingot carries the Bergmeister’s stamp.
- id: lore_salt_wars
  origin: allora1
  kind: lore
  name: The Salt Wars
  icon: 🧂
  text: Three times in the last century the duke has tried to tax Salzmoor salt, and three times the salt-rakers rose. The last rising ended with hangings along the causeway. Since then the rakers pay the tax and smuggle twice as much as they declare.
- id: lore_vaelis
  origin: allora1
  kind: lore
  name: The Fall of Vaelis
  icon: 🏛️
  text: Vaelis was a provincial capital of the Allorese Empire. The inscriptions speak of a plague, then of a night when every door in the city opened at once. After that they stop. The Empire fell within the decade; the years of the Seven are counted from that Ruin.
- id: lore_black_codex
  origin: allora1
  kind: lore
  name: The Black Codex
  icon: 💀
  text: A book of Grave-Lore in High Allorese, bound in leather that is not calfskin, its margins crowded with the notes of Ansgar Kahl. Possessing it is a hanging offence. Reading it opens the study of Necromancy — practised only at night, and at the risk of the watch’s notice.
- id: lore_threshold
  origin: allora1
  kind: lore
  name: The Threshold
  icon: 🚪
  text: Every door painted on the Sanctum’s walls has a name, and initiates learn them grade by grade. The open doors, they say, are the ones the god has already passed through. The shut ones are waiting.
- id: lore_luggen_prince
  origin: allora1
  kind: lore
  name: The Six-Year Prince
  icon: ⛵
  text: Every six years the merchant houses of Luggen elect a Prince from among their aldermen. For six years he lives in the Prince’s Hall, wears the fur-trimmed red, sits as Luggen’s elector at the Diet and is forbidden to trade on his own account. Then he goes home and opens his ledgers again. The system produces princes who are honest, careful, and in a great hurry to finish. The present Prince, Hartwig Kolbe, a stockfish-merchant the quays call the Ledger, is four years into his six and has the remaining days crossed off on a calendar on his desk.
- id: lore_horro
  origin: allora1
  kind: lore
  name: The Philosophy of the Current
  icon: 🌀
  text: "The first Currentist was a Luggish mint-master who, the story goes, watched a single silver mark pass through forty hands in a day and realised that it had fed, clothed and housed more people than any saint. Coin, he taught, is not wealth but the motion of wealth: energy made countable. The divine is not in the coin but in its flowing. Hoarding is sin; circulation is prayer; and a deposit in a Hall of Currents is not a vault but a channel."
- id: lore_fur_fairs
  origin: allora1
  kind: lore
  name: The Fur Fairs
  icon: 🦫
  text: Each winter the trappers of the Pine-March bring sable, marten, ermine and fox down the frozen rivers to the fur fairs of Luggen. The best pelts go to Sarlon and Marre, where sumptuary law reserves ermine for princes. The rest line the cloaks of everyone else.
- id: lore_timber
  origin: allora1
  kind: lore
  name: The Timber Fleets
  icon: 🪵
  text: "Luggish timber-lords float whole forests to the sea: rafts of lashed logs the size of villages, with huts, kitchens and even chapels on them, steered by crews of raftsmen for weeks down the great rivers. At the coast the rafts are broken up and the logs sold for masts, beams and barrels to half of Allora."
- id: lore_perlin
  origin: allora1
  kind: lore
  name: The Perlin Dukes
  icon: 🐺
  text: The Perlins have ruled Grell for eleven generations by marrying well, fighting little and paying tribute to Sarlon whenever asked. The present duke, Ottwin, is a melancholy scholar of masks who leads the Hollow-Night procession wearing his grandmother’s face. His chancellor, Baltasar de Ocampo, is Sarlonese, as was the last one, and the one before that.
- id: lore_hollow_nights
  origin: allora1
  kind: lore
  name: The Hollow Nights
  icon: 🕯️
  text: At the end of every season the year grows thin, and on the last two nights the dead of Grell come home. Households set out bread and beer and a chair by the fire, a single candle burns in every window, and the chapel bells toll once for every name in the parish book. The living wear the carved masks of their dead in a silent procession so that the dead may walk among them unafraid. Strangers are welcome, provided they wear a mask too, and do not ask whose it was.
- id: lore_wisps
  origin: allora1
  kind: lore
  name: Will-o’-Wisps
  icon: 🏮
  text: "The pale lights of the Nachtwald lead travellers into bogs and off cliffs, and the Grellish catch them in return. A wisp in a lantern burns without fuel and never quite matches the hour: by its light it is always midnight. The lantern-wrights of Perlinburg sell them, at a price, to scholars, thieves and necromancers alike."
- id: lore_rowan
  origin: allora1
  kind: lore
  name: King Rowan of Sarlon
  icon: 👑
  text: Rowan III is forty, tall, bookish and dangerous. He speaks five languages, keeps Rabene astronomers at his court and a troupe of players in his palace, and has never lost a war he started. His lords obey him because he is strong, and fight one another because he lets them. He is said to read every report his envoy sends from the Dellian Diet, twice.
- id: lore_chancery
  origin: allora1
  kind: lore
  name: The Chancery of Five Tongues
  icon: 📜
  text: The royal chancery at Valmonte issues its decrees in Sarlonese, Rabene, High Allorese, Marrean and Eintennish, and its clerks are the best-paid translators in Allora. A clerk who can render a Rabene poem into Sarlonese verse without losing the rhyme can name his price.
- id: lore_errantry
  origin: allora1
  kind: lore
  name: Knights-Errant of Torrecas
  icon: 🏇
  text: Sarlon has more knights than it has wars, and the surplus rides the roads of the Torrecas plateau looking for wrongs to right. Some are genuine champions of the weak. Some are bandits with better manners. One famously spent a year besieging a windmill he believed to be a sorcerer’s tower. The innkeepers love them all, for they pay in stories when they cannot pay in coin.
- id: lore_tower_castles
  origin: allora1
  kind: lore
  name: The Tower-Castles
  icon: 🗼
  text: King Rowan’s grandfather forbade his lords to build walls; they built upward instead. Every hill of Torrecas carries a square tower of three, five or seven storeys, and the lords who hold them feud, intermarry and besiege each other with the enthusiasm of men who have nothing better to do.
- id: lore_diet
  origin: allora1
  kind: lore
  name: The Dellian Diet
  icon: 🏮
  text: In the Hall of the Diet at Dellmont, the electors of the seven principalities sit in a circle under shaded lamps, with the Arch-Bishop’s chair a careful half-step outside it. The Diet sets common tolls, arbitrates borders, ransoms prisoners and, very occasionally, prevents a war. Every elector suspects the Arch-Bishop of favouring someone else, which is how the Arch-Bishop knows the balance is right.
- id: lore_lamps
  origin: allora1
  kind: lore
  name: The Lamps of Dellmont
  icon: 🕯️
  text: "Dellmont is never dark: thousands of shaded lamps burn in its streets all night, tended by lamplighter-novices, so that no one is ever hidden and no one is ever dazzled. Visitors find it restful. Thieves find it impossible. The lamps are relit by hand at dusk and dawn, the hours sacred to Dell."
- id: lore_twin_kings
  origin: allora1
  kind: lore
  name: The Twin Kings
  icon: 👑
  text: Leto and Lia, children of the vanished King Aurelio, were crowned together at the age of six, since no one could agree which was born first. They are now nine, sit side by side on two small thrones in Valdora, and have strong opinions about calcio. The regency council rules in their name, and the Lady Regent, Beatrice Valcorvo, presides over it, and the Marrean ambassador, Ser Alvise Morvan, sits on it, smiling.
- id: lore_gentry
  origin: allora1
  kind: lore
  name: The Gentry of the Hills
  icon: 🧚
  text: Rollans do not say “fairies”; they say the Gentry, or the Neighbours, or nothing at all. The Gentry live under the hills of the Fairmeadows and come out at dusk and dawn to dance in the mushroom rings. They keep every bargain to the letter. Mortals who join their dances sometimes return the next morning, and sometimes in the next century.
- id: lore_lost_king
  origin: allora1
  kind: lore
  name: The Lost King of Rolla
  icon: 🧚
  text: Three years ago King Aurelio rode out alone to the Fairmeadows at dusk, saying he had a bargain to keep. His horse came home at dawn. Shepherds swear they still hear him laughing under the tallest hill on Midsummer night. The Hearth-Church holds that he is dead; half the kingdom holds that he is merely busy.
- id: lore_ten_families
  origin: allora1
  kind: lore
  name: The Ten Families
  icon: 🪞
  text: "Marre is ruled by the Ten Families, whose names are written in the Golden Book: from them alone is the Doge chosen, for life, and from them the councils that watch him. They intermarry, poison each other occasionally, and between them own most of the southern sea. The present Doge, Ottaviano Grimassi, is eighty-one and shows no sign of dying."
- id: lore_sea_glass
  origin: allora1
  kind: lore
  name: The City of Sea-Glass
  icon: 🌊
  text: Marre’s first palaces were faced with sea-glass gathered from its own beaches; now the Glass Isles make it by the ton, and every façade in the city glitters green and blue. On the Feast of the Lagoon the Doge casts a mirror into the sea to wed the city to the waters, and the reflection, it is said, stays behind.
- id: lore_glass_isles
  origin: allora1
  kind: lore
  name: The Glass Isles
  icon: 🏝️
  text: Marre’s glassmakers are among the richest artisans in Allora, their daughters marry into the Ten Families, and they may never leave the Isles. Those who flee abroad with the secrets of crystal and mirror are pursued by the Republic’s agents. Few are found alive; their furnaces are.
- id: lore_university
  origin: allora1
  kind: lore
  name: The University of Perlinburg
  icon: 🏛️
  text: "Founded by the third Perlin duke to keep his nephews out of trouble, the University of Perlinburg perches on the Crag of Owls above the town: a warren of black timber, chained books and cold stone stairs. It teaches theology, law, physick and natural philosophy like any other university, and also subjects nobody else teaches — the folklore of the dead, the anatomy of the plague-years, the optics of wisp-lanterns. Above all it is famous for its Department of Antiquities, whose diggers have spent two centuries in the giants’ ruins of the west, and whose Long Gallery holds a giant’s thigh-bone longer than a man."
- id: lore_grey_death
  origin: allora1
  kind: lore
  name: The Grey Death
  icon: 🦴
  text: Twice in living chronicle the Grey Death has come over the mountains into Grell, and twice it took one in three. The dead were too many to bury, and the Grellish, who will not burn their dead, laid them in pits under the terraces and, when the pits were full, in the vaults of the chapels. In time the bones were cleaned and set in order — arches, chandeliers, a coat of arms in thigh-bones — so that the dead would be tidy and close. Visitors find the Bone-Chapel of Perlinburg horrifying. The Grellish find it comforting, and are puzzled by visitors.
- id: lore_peñagris
  origin: allora1
  kind: lore
  name: The Peñagris Highlands
  icon: ⛰️
  text: "The grey highlands of western Sarlon are poor in everything but stone, and rich in the stones that matter: garnet, beryl and the blue Peñagris sapphire. The highlanders are the most devout people in Sarlon and the least interested in its king. Their villages are built around pits — shafts sunk into the mountain for no purpose but to give things back — and their weddings, funerals and vintages are all made at the pit’s edge, in the names of Ulna and her husband Tiln."
- id: lore_selino
  origin: allora1
  kind: lore
  name: Selino
  icon: ⚓
  text: Selino is where Marre’s eastern voyages begin and end. Every spring the galleys gather in its roads to take on water, biscuit, pilots and marines for the long run east to the spice-coasts; every autumn they come back low in the water with pepper, silk, pearls and men who have not been paid in eight months. Selino’s Proveditor answers to the Doge, its customs-house to whoever pays it most, and its people to Madonna Zanetta.
- id: lore_lilac_loop
  origin: allora1
  kind: lore
  name: The Lilac Loop
  icon: 🪻
  text: "The Lilac Loop is the only road in Selino that goes round in a circle, and everything on it is for sale: wine, dice, silk, secrets, company, ship’s papers, and men to look the other way. Its houses hang lilac lamps over their doors, which is where it gets its name. The Loop-Lords who own it keep a peace of sorts — no knives, no dead sailors, no trouble that would bring the Doge’s marines — and anyone who breaks it is walked once round the Loop and put on the next galley east."
- id: lore_pheasants
  origin: allora1
  kind: lore
  name: The Pheasants
  icon: 🪶
  text: When the regency dismissed King Aurelio’s huntsman, forty of the royal foresters went with him. They took the king’s horses, the king’s bows and, it is said, the king’s best wine, and they went into the northern hills and became the Pheasants. They rob Marrean convoys and tax-carts and pay the villages for their bread. The regency has sent three companies after them. Two came back without their boots; the third joined.
- id: lore_palio
  origin: allora1
  kind: lore
  name: The Palio of Castelvento
  icon: 🏇
  text: Three times round the Campo, bareback, on a course of packed earth laid over the cobbles, for a painted silk banner and the honour of your ward. The jockeys may whip each other but not each other’s horses; that is the only rule, and it is not always observed. The race takes ninety seconds, the celebrations three days, and the arguments a year. The riders are all Honna’s, and a horse that wins without its rider is counted the winner — Honna’s faithful say that is the purest victory of all.
- id: lore_kranzholm
  origin: allora1
  kind: lore
  name: The Herring Towns
  icon: 🐟
  text: Luggen’s wealth began with herring. Every autumn the great shoals come down the coast so thick that a spear stuck in the water stands upright, and the fleets of Kranzholm put out to meet them. Salted in barrels with Eintennish salt — the Salt-Duke’s whole fortune rests on this — the herring feed half of Allora through Lent, and the merchant houses of Kranzholm, who will tell you they are all humble fishermen, own most of the Kontor League.
- id: lore_vescova
  origin: allora1
  kind: lore
  name: Vescova and its Relics
  icon: ⛪
  text: Saint Lucent was a lamp-lighter of Dell who walked into a burning city to keep a peace-conference lit, and Vescova keeps her finger-bone in a crystal lamp in the basilica. Forty thousand pilgrims a year come to see it. Over the centuries the town has also come to sell, by conservative estimate, eleven thousand of her other fingers. The Church of Dell regards the trade with weary tolerance; the Dellian magistrates fine the worst offenders; the pilgrims go home happy.
- id: lore_alberghi
  origin: allora1
  kind: lore
  name: The Houses of Luggen
  icon: 🏦
  text: "Luggen’s merchant families learned from Marre that a family alone is weak. Over the centuries the lesser ones merged into great houses — alberghi, the clerks still call them, in the Marrean way — sharing one name, one strongbox, one quarter of the city and one set of enemies. Three now dominate the League: the Vollraths, who lend; the Fiesch, who sail and fight; and the Spindlers, who own what everyone else needs to eat and build with. They elect the Six-Year Prince between them, and arrange very carefully that he should never be one of them."
- id: lore_crossbows
  origin: allora1
  kind: lore
  name: The Crossbowmen of Grauhafen
  icon: 🎯
  text: "The Luggish crossbowman behind his great painted pavise is the best-paid soldier in Allora. The Grauhafen companies are raised by House Fiesch, trained on the strand, and hired out under contract to anyone who can pay: they have fought for Marre against Raben’s galleys, for Eintenn against Sarlon, and once — the contract was very well written — for both sides of the same battle."
- id: lore_dikes
  origin: allora1
  kind: lore
  name: The Great Drowning
  icon: 🌊
  text: "Two hundred years ago a winter storm drove the sea over the old dikes of Luggen and drowned thirty villages in a night; their church-towers still stand out of the mudflats at low tide. Since then the Deichmarsch has been ruled by its dike-reeves, every farm owes its yards of dike, and the old law runs: whoever will not dike must leave. Peat, milk, cheese and very stubborn people are its only harvest."
- id: lore_wreckers
  origin: allora1
  kind: lore
  name: False Lights
  icon: 🕯️
  text: "Out on the sandbank island of Hungersand they hang lanterns on the dunes on stormy nights, where a captain will take them for the lights of Grauhafen. The ships come in onto the sands, and the wreckers come out to meet them. Wreck-right, the islanders say, is older than the League: what the sea gives, the sea gives. The League says otherwise, and hangs wreckers when it catches them, which is seldom, because Hungersand is very hard to find."
- id: lore_frost_market
  origin: allora1
  kind: lore
  name: The Frost-Market
  icon: ⛸️
  text: "In a hard winter the Lugg freezes a yard thick, and all Luggen comes to Eisholt: a village of forty houses that, for six weeks, has a hundred stalls, skating-races, sledges, ice-curling, roast chestnuts, gingerbread, mulled wine and the best fur-bargains in the north, all on the ice. When the thaw comes the stalls are carried ashore in a hurry, and every few years one of them is not."
- id: lore_tarsena
  origin: allora1
  kind: lore
  name: Tarsena and the Old Quarter
  icon: 🌴
  text: "Tarsena was the Rabene governors’ southern capital for two hundred years, and when the northern knights took Sarlon they took Tarsena’s walls and left its people alone. The Old Quarter still speaks Rabena, brews date-beer, writes contracts on clay, and keeps two temples the rest of Sarlon pretends not to see: Laishma’s serpent-house at the landward end of the harbour and Parod’s storm-altar on the headland at the seaward end — as far apart as the city allows, because their gods have been at war since before the world."
- id: lore_feud
  origin: allora1
  kind: lore
  name: The Tower and the Fleece
  icon: ⚔️
  text: House Montaraz has held Torrealba for four hundred years by the sword. House Ribadoro has held Castroviejo for sixty by the ledger. Twenty years ago a stretch of drove-road, a broken betrothal and a dead hound turned their rivalry into a feud, and it has since cost both houses a fortune in burned barns, impounded horses, lawsuits and quietly paid bravos. King Rowan could end it with a word. He finds it much more useful to let two of his great houses watch each other than to have either watching him.
- id: lore_wolfgate
  origin: allora1
  kind: lore
  name: The Wolf’s Gate
  icon: 🚩
  text: "There is one good road from Grell into Sarlon, and the Crown built a fortress across it after the Grellish War: four towers, a curtain wall and a gate the Grellish call the Wolf’s Mouth. It has not been attacked in forty years. It keeps the Crown’s eye on the duchy, its tolls on the trade and its soldiers out of trouble — mostly."
- id: lore_observatory
  origin: allora1
  kind: lore
  name: The Observatory on Monte Claro
  icon: 🔭
  text: The Rabene governors built a stepped brick temple-tower on the hill of Monte Claro outside Valmonte, and their star-priests read the sky from its top for two hundred years. The Sarlonese kings put a bronze dome on it, a great armillary sphere inside, and a Rabene family in charge. Its tablet-room holds star-records older than the Allorese Empire, and its astronomers still count in sixties.
- id: lore_canada
  origin: allora1
  kind: lore
  name: The Great Drove-Road
  icon: 🐑
  text: "La Cañada Real runs the length of Sarlon, ninety paces wide and older than the kingdom: a green road of its own laws, its own courts and its own guards, along which a million merino sheep walk north to the summer pastures every spring and south again every autumn. The Honourable Council of the Flocks owns most of them and the law protects all of them; a farmer who ploughs the Cañada can be hanged for it, and occasionally is."
- id: lore_san_caldero
  origin: allora1
  kind: lore
  name: San Caldero of the Road
  icon: 🛡️
  text: "In Sarlon there is no Order of the Oathbound, but there is San Caldero. The Sarlonese have quietly forgotten that he held a bridge against their grandfathers, and remember only that he was a knight who kept his word: he is the patron of knights-errant, and every errant on the High Road keeps vigil at one of his roadside hermitages before swearing a road-vow — to right one wrong a year, or die trying."
- id: lore_lattice_lamps
  origin: allora1
  kind: lore
  name: The Latticed Lamps
  icon: 🏮
  text: "Dell is worshipped in Sarlon as the Lady of the Lattice. The Rabene governors veiled their lamps in pierced brass so that the light fell in patterns, and the Sarlonese Church of Dell kept the habit: in Valmonte’s lamp-chapel the vespers are sung in five tongues at once, under lamps that throw stars on the walls, and treaties are signed in their speckled light."
- id: lore_cerdans
  origin: allora1
  kind: lore
  name: The Cerdans
  icon: 🔍
  text: "The Republic of Marre does not trust its own nobles, and two centuries ago it created the Cerdans to watch them — and everyone else. The Cerdans are a state department of investigators: informers, constables, inquirers and scribes who keep files on every forger, fence, poisoner and conspirator in the lagoon, and a Mirror-Room of scryers who can see through the illusions of the Masque. Their office faces the Doge’s Palace across the Piazza. Their prison, the Leads, is under the palace roof, and very hot."
- id: lore_golden_book
  origin: allora1
  kind: lore
  name: The Golden Book
  icon: 📖
  text: "Marre is ruled by its Great Council, and the Great Council by the Golden Book: the register of the Ten Families from whom alone councillors, procurators and Doges may be chosen. A Doge is elected by a process of ballots and lots so complicated that no single family can rig it — though every single family tries. The present Doge was the compromise of nineteen years ago; the race to succeed him is between Ca’ Grimassi and Ca’ Morvan, with Ca’ Loredel watching from the east."
- id: lore_feast_lagoon
  origin: allora1
  kind: lore
  name: The Feast of the Lagoon
  icon: 🪞
  text: "On the first day of every spring the Doge rows out into the lagoon in Dolma’s golden barge, followed by every boat in Marre, and casts a mirror into the sea with the words: we wed thee, sea, in sign of true and perpetual dominion. Then the whole city dives for it. Whoever brings it up keeps it, and is said to be lucky for life."
- id: lore_calder_bones
  origin: allora1
  kind: lore
  name: The Bones of Saint Calder
  icon: 🦴
  text: Two hundred years ago, Marrean merchants took the bones of Saint Calder from a poorly guarded Dellian hospice and brought them home to Marre in a barrel of salt pork, so that the customs men would not look. So say the Marreans, who keep the bones in a reliquary beside the Doge’s Palace. The Oathbound of Eintenn say Calder’s bones lie at Tennfels and the Marreans stole a pig. The argument has lasted two centuries and caused one war.
- id: lore_scuola
  origin: allora1
  kind: lore
  name: The Scuola of the Current
  icon: 🌀
  text: "Marre invented double-entry book-keeping, and Marreans take a certain pride in having worshipped Horro, in their own way, before Luggen ever heard of him. The Scuola Grande of the Current is less a temple than a confraternity of bankers: they keep their ledgers on the altar, sing the balance at vespers, and regard the Luggish Halls of Currents as well-meaning provincials."
- id: lore_lazaretto
  origin: allora1
  kind: lore
  name: The Lazaretto
  icon: ⚕️
  text: Every ship that comes into Marre from the east must first anchor off the Lazaretto for forty days. Its cargo is aired, its sick are taken ashore, and its dead are burned. The Proveditors of Health who run the plague island have the most advanced physick in Allora — fumigation, isolation, vinegar, theriac and the fever-bark of the Raizon, which comes through Thoolma — and the Pestilence has not reached the city in a generation.
- id: lore_terraferma
  origin: allora1
  kind: lore
  name: The Terraferma
  icon: 🌾
  text: "When the lagoon grew rich, the Ten Families bought the mainland behind it: rice-fields, mulberry groves for the silkworms, and white villas with porticoes where they spend the summers away from the smell of the canals. The villas are beautiful; the rice-fields breed fever; the Families have never seen any contradiction."
- id: lore_morena
  origin: allora1
  kind: lore
  name: Morena, the Halfway Isle
  icon: 🏰
  text: "Morena lies halfway between Marre and Thoolma: a rocky island with a castle, a harbour, a Marrean factory, a Thoolman quarter and the mastic groves that make it rich. Ca’ Loredel governs it for the Republic. Every Thoolman ship bound west must stop here; every Marrean galley bound east takes on water and news. It is the most valuable piece of rock in the eastern sea, and both empires know it."
- id: lore_lucenza
  origin: allora1
  kind: lore
  name: Lucenza
  icon: 🎭
  text: "Lucenza is Rolla’s second city and its liveliest: a hill-town of arcaded streets and student taverns around the oldest university in the Seven, the Studio, which teaches law, medicine and music. Its players invented the masked comedy that the whole of Allora now copies, and its music-school is beginning to set whole plays to song. The Studio claims to be eight hundred years old. The Collegium of Kesselhaven says six hundred, and is not invited to the anniversaries."
- id: lore_reggenza
  origin: allora1
  kind: lore
  name: The Regency Council
  icon: ⛲
  text: "Rolla is ruled for the Twin Kings by a council of nine: the Lady Regent, three lords, two bishops of the Hearth, two citizens of Valdora and the Marrean ambassador. Five votes win. The Regent can usually count on four; the Marrean ambassador can usually buy one. Every session is a calcio match played with ballots."
- id: lore_tenuta
  origin: allora1
  kind: lore
  name: The Vintage at Valcorvo
  icon: 🍇
  text: "The Regent’s estate makes the best wine in Rolla, and in autumn the whole valley comes to pick: grape-pickers, treaders, coopers, fiddlers, priests to bless the must and Pecutto’s players to bless it again. The Valcorvo riserva lies seven years in oak and costs more than the horse that carries it to Valdora."
- id: lore_little_brothers
  origin: allora1
  kind: lore
  name: The Little Brothers
  icon: 🕊️
  text: The Little Brothers are mendicant friars of the Hearth who own nothing, beg for their bread, and nurse the sick poor in their infirmary in the hills for nothing at all. The Hearth-Church is not entirely sure what to make of them; the poor of Rolla are.
- id: lore_king_hill
  origin: allora1
  kind: lore
  name: The King Under the Hill
  icon: 🌸
  text: Under the tallest hill in the Fairmeadows the Gentry hold their court, where a night lasts a year and supper never ends. At the Lady’s right hand sits a big, laughing man in a crown of hawthorn. He rode in three years ago with a bargain to keep — he will not say what — and he has not yet finished keeping it.
  alt:
    - aurelio_home
    - "Under the tallest hill in the Fairmeadows the Gentry hold their court, where a night lasts a year. At the Lady’s right hand sits King Aurelio, in his crown of hawthorn. You have supped at his table and heard his bargain, and you know why he stays: as long as he sits there, a shepherd’s child sleeps safe in a Rollan bed. He laughs a great deal. He does not look at the door."
- id: lore_king_returns
  origin: allora1
  kind: lore
  name: The King’s Bargain
  icon: 👑
  text: Three years ago the Gentry took a shepherd’s child from the Fairmeadows, and King Aurelio — who had drunk a good deal and was fond of the shepherd — rode into the hill to win her back. He played the Lady at dice for the child, and won; then he played her for his own way home, and lost. The child walked out at dawn. The king stays, and as long as he keeps his chair at the Lady’s table, the child stays free. He has told no one in Valdora, because he knows his sons would try to fetch him, and that the Gentry would take the child again. He told you over supper, laughing, and asked you to carry a letter home that says only that he is well and that they must mind their mother. The Twin Kings keep their regency, the Regent keeps her council, and Rolla keeps its Lost King exactly where he is.
- id: lore_medicine
  origin: allora1
  kind: lore
  name: Physick and Pestilence
  icon: ⚕️
  text: "Disease is everywhere in the Seven: fever in the marshes and rice-fields, coughs in the crowded winter towns, flux in camps and on ships, pox on the Lilac Loop, and the Pestilence that comes in on eastern ships. A sickness lasts weeks if left alone. The poor go to the friars, the hospices and the wise-women, who ask nothing; the rich pay barber-surgeons and university doctors; the faithful pray at the shrines of their gods; and the desperate go to the Lazaretto, where the best physicians in Allora cure what no one else can."
- id: lore_trauerfels
  origin: allora1
  kind: lore
  name: Schloss Trauerfels
  icon: 🏰
  text: "The Perlin dukes live on the Trauerfels, the Mourning Rock, in a tall grey castle above the gorge whose every window is hung with black. Duke Ottwin keeps his court there in perpetual half-mourning: the courtiers wear black, the musicians play only viols, and in the Long Gallery hang the masks of eleven generations of Perlin dead, which the Duke visits every evening. In the east wing, in rooms painted in warm Sarlonese colours, Chancellor de Ocampo and his clerks govern Grell. The two halves of the castle are polite to each other in the way of people who share a kitchen."
- id: lore_uhrental
  origin: allora1
  kind: lore
  name: The Death-Clocks of Uhrental
  icon: 💀
  text: "In the high valley of Uhrental, where the snow lies half the year, the farmers carve clocks through the winter: cuckoo-clocks, weather-houses, and the famous Grellish death-clocks, in which a little carved skeleton strikes each hour and a mourner bows. Grellish households keep one in the room where they keep their masks, so that the dead may know the time. Foreigners buy them as curiosities. The Grellish find this mildly upsetting."
- id: lore_kaltbrunn
  origin: allora1
  kind: lore
  name: Kaltbrunn
  icon: ♨️
  text: "The hot springs of Kaltbrunn come up steaming and sulphurous in a cold mountain valley, and for a century the sick of the Seven have come to take the waters: consumptives, gout-ridden princes, melancholy poets and invalids of every description. There is a Kurhaus, a sanatorium, a pump-room and a long promenade where people walk very slowly and talk about their health. It is the most fashionable place in Grell and, the Grellish point out, the most cheerful sanatorium in the world is still a sanatorium."
- id: lore_kohlgrund
  origin: allora1
  kind: lore
  name: The Charcoal-Folk
  icon: 🔥
  text: "Deep in the Nachtwald live the charcoal-burners, who build great smoking meilers of stacked wood and turf and watch them for weeks, sleeping in bark huts beside them. They smelt bog-iron in clay bloomeries, marry among themselves, and keep customs older than any god in the Seven: a bowl of milk on the Milk-Stone every evening, iron over every door at midwinter, and never, ever a yew in the fire. When the Wild Hunt rides in the dark of winter, it is the charcoal-folk who hear it first."
- id: lore_unburned
  origin: allora1
  kind: lore
  name: The Witch Who Was Not Burned
  icon: 🌿
  text: "Sixty years ago, when the Pyre-Wardens of Ilvara were burning witches across the north, they came over the Hanged Man’s Pass with a warrant for the Moor-Wife of the Nachtwald. The town of Perlinburg — which will not burn even its own dead — shut its gates on them, and the old Duke sent word that in Grell, fire is for hearths. The Pyre-Wardens went home. They have not forgotten, and neither has Grell: there is still no Pyre-chapel in the duchy, and the Moor-Wife is still in her bog."
- id: lore_grey_pits
  origin: allora1
  kind: lore
  name: The Plague-Pits
  icon: 🩶
  text: Under the cabbage terraces of Perlinburg lie the pits where the Grey Death’s dead were laid when the chapels were full. The Mask-Wardens tend them; the anatomy school studies them, with permission; and nobody else goes near them, because the Grey Death is not quite gone. Every generation or so someone digs where they should not, and the old grey cough comes back to a street or two.
- id: lore_ambros
  origin: allora1
  kind: lore
  name: The Hospice of Saint Ambros
  icon: 🐕
  text: On the high col between Grell and Dellian, where the snow never quite melts, the canons of Dell keep the Hospice of Saint Ambros for travellers. Their great shaggy dogs carry brandy and blankets into the drifts after every storm, and have dug out more pilgrims than anyone has counted. The canons are Dellian; the dogs, the Grellish say, are Grellish, and the argument is conducted every year over a very good dinner.
- id: lore_election
  origin: allora1
  kind: lore
  name: The Election of an Arch-Bishop
  icon: 🏮
  text: When an Arch-Bishop of Dell dies, the four Lamp-Prelates of the Curia and the electors of the Diet are shut into the Cathedral of Soft Light with a single shaded lamp, and may not come out until they agree. The last election took forty-one days. Every crown in the Seven has its favourite among the Prelates and pretends it has not, and every Prelate pretends not to be a candidate. Casimir Montfalco has now reigned twenty years, and shows no sign of obliging any of them.
- id: lore_burning_city
  origin: allora1
  kind: lore
  name: The Burning City
  icon: 🔥
  text: Two hundred years ago the envoys of three warring princes met to make peace in the city of Sennacre, and the city caught fire on the second night. Lucent, a lamp-lighter of Dell, kept the lamps of the conference-room lit and its doors open while the envoys signed, and walked out of the fire with the treaty in her hands and her own hand burned to the bone. The peace held for sixty years. The Church of Dell made her a saint; Vescova got her finger.
- id: lore_peace_notary
  origin: allora1
  kind: lore
  name: The Peace Notary
  icon: 📜
  text: After Sankt Wendel’s Field, when the armies of the north and south had broken each other at Calder’s bridge, the treaty that ended the war was drafted overnight by a junior notary of the Diet, twenty-four years old, who wrote it in four languages so that no prince could claim to have misunderstood it. His name was Casimir Montfalco. The treaty is still in force. So is he.
- id: lore_strongrooms
  origin: allora1
  kind: lore
  name: The Strongrooms of Dellmont
  icon: 🏦
  text: Because Dellian will never be conquered — everyone needs it too much — every crown in the Seven keeps a reserve of gold in the Strongrooms of Dellmont, under the cathedral rock, and every treaty the Diet makes is sealed into the Treaty Vault beside it. The Strongrooms take deposits from private citizens too, at a modest fee, and have never been robbed. They have, however, been tried.
- id: lore_lampguard
  origin: allora1
  kind: lore
  name: The Lamp-Guard
  icon: 🦺
  text: "Dellian has no army, only the Lamp-Guard: three hundred foreign pikemen, mostly Grellish and Luggish, in yellow-and-white livery, who take an oath to Dell to defend the Diet, the palace and the Strongrooms and to draw steel only when the lamps are threatened. They are the best-paid soldiers in the Seven and the least used, and they like it that way."
- id: lore_hostages
  origin: allora1
  kind: lore
  name: The Villa of the Hostages
  icon: 🗝️
  text: "When princes make a bargain they cannot trust, the Diet keeps the surety: a son, a daughter, a nephew, held in the Villa of the Hostages on the lake shore until the debt is paid or the treaty kept. The hostages live well, study, marry occasionally and escape almost never, because the Lamp-Guard watches the gates and because a hostage who escapes breaks the treaty that keeps their own family safe."
- id: lore_quiet_office
  origin: allora1
  kind: lore
  name: The Quiet Office
  icon: 🔏
  text: "Dell’s neutrality is kept by knowing things. The Quiet Office collects the secrets of every legation on the Street of Legations, of every prince, prelate and banker, and uses them for one purpose only: to make sure nobody can use them against anybody else. Its agents are lamplighters, couriers, footmen and nuns. Its master is called the Lamplighter. It pays well for secrets, and much less well than the legations do, and that is the whole moral difficulty of the profession."
- id: lore_legations
  origin: allora1
  kind: lore
  name: The Street of Legations
  icon: 🏛️
  text: Every realm of the Seven keeps a legation in Dellmont for the Diet, and they all stand on one street under the cathedral, because the Arch-Bishop prefers to have them where he can see them. Eintenn and Luggen share the north end, Sarlon and Grell the west — which the Grellish resent — and Marre and Rolla the south, which both resent. Between them are the Courier-House of the Diet and a tavern called the Whispering Gallery, where everyone drinks and nobody is ever quite drunk.
- id: lore_ceraluce
  origin: allora1
  kind: lore
  name: Ceraluce
  icon: 🕯️
  text: "Dellmont burns more light than any city in the world, and Ceraluce makes it: a lakeside town of bee-gardens, wax-chandlers, lamp-glass furnaces and colza oil-mills, with vineyards running up the slopes behind it. Its chandlers have supplied the Cathedral of Soft Light for four hundred years, and consider the Arch-Bishop a valued customer."
- id: lore_carnival
  origin: allora1
  kind: lore
  name: The Travelling Carnival
  icon: 🎪
  text: Nobody knows how old the Carnival is. It goes from capital to capital between the thaw and the first frost — Kesselhaven, Luggen, Perlinburg, Dellmont, Valmonte, Marre, Valdora — and winters in the barns outside Lucenza. It carries a bear, two camels, an ape, a calliope, a fortune-teller called Madame Zora who has been forty for thirty years, a cabinet of wonders containing at least one genuine mermaid, and a troupe of tumblers who take on a few new apprentices every winter and lose a few every summer to towns they liked.
- id: lore_tourney
  origin: allora1
  kind: lore
  name: The Tourney Circuit
  icon: 🏇
  text: "From the thaw to midsummer the knights of the Seven ride the circuit: Tennfels, Valmonte, Torrealba, Castelvento, Valdora and, at last, the Duke’s Midsummer Tourney at Kesselhaven, where the prizes are doubled and the Salt-Duke watches from a gouty chair. The heralds keep the rolls, the ladies give the favours, and the surgeons follow the circuit as faithfully as the knights."
- id: lore_players
  origin: allora1
  kind: lore
  name: Pecutto’s Wandering Players
  icon: 🍷
  text: There have always been players on the roads of the Seven, and they have always been Pecutto’s. They travel in painted carts from small town to small town, play wherever they are fed, bless the road they take, and never stay more than two nights. Their plays are rude, their music is loud, and the god of the open road rides on the tailboard.
- id: lore_herring_fleet
  origin: allora1
  kind: lore
  name: The Herring Fleet
  icon: 🐟
  text: "Every autumn the herring fleet of Kranzholm comes home low in the water, and the whole town goes down to meet it: gutters, salters, coopers, wives and children, the priest of Horro to bless the barrels and a band to play them ashore. The night ends with the Herring Ball, which no one has ever left sober or without smelling of fish."
- id: lore_clock_fair
  origin: allora1
  kind: lore
  name: The Clock Fair
  icon: 🕰️
  text: In the dead of winter Uhrental opens its great barn for the Clock Fair. Buyers come up the valley on sledges from Perlinburg, Dellmont and Luggen, and once, memorably, from Thoolma. The guild judges the year’s best death-clock, and the winner’s skeleton strikes the hour in the guild hall for a year.
- id: lore_flocks
  origin: allora1
  kind: lore
  name: The Flocks in the Streets
  icon: 🐑
  text: By a privilege older than the crown, the great drove of the Mesta passes through Valmonte twice a year, and the city must make way. For three days a river of sheep fills the Calle Mayor, drovers sleep in the cathedral porch, and the royal toll-clerks count fleeces until their eyes cross.
- id: lore_long_watch
  origin: allora1
  kind: lore
  name: The Night of the Long Watch
  icon: 🔭
  text: "On the two shortest nights of summer the astronomers of Monte Claro keep the Long Watch: every instrument turned to the sky from dusk to dawn, every sighting written down, and anyone who can hold a pen welcome to help. The Rabene star-readers of Castroviejo come up for it every year, and argue with everyone."
- id: lore_student_riot
  origin: allora1
  kind: lore
  name: The Student Riot
  icon: 🎓
  text: Every spring the students of the Studio of Lucenza riot against the townsmen. The original grievance — a tavern bill, or a girl, or a dead dog, depending on who tells it — was settled four hundred years ago. The riot was not. It lasts two days, by long agreement nobody is killed, and the town council budgets for the windows.
- id: lore_carnevale
  origin: allora1
  kind: lore
  name: Carnevale
  icon: 🎭
  text: For the last four days of winter, Marre goes masked. Patrician and gondolier, nun and courtesan, Cerdan and cutpurse wear the bauta alike, and by ancient law no one may be asked who they are. The Masque is everywhere. So, quietly, are the Cerdans’ scryers.
- id: lore_regatta
  origin: allora1
  kind: lore
  name: The Regatta
  icon: 🚣
  text: Every summer the gondoliers of Marre’s six sestieri race the length of the Grand Canal, standing, in boats built for the purpose and nothing else. The Ten Families bet fortunes on it. The losers buy the wine, and the winners are carried home by their sestiere and not expected to work for a week.
- id: lore_comet
  origin: allora1
  kind: lore
  name: Comets
  icon: ☄️
  text: Comets come to the Seven every few years. Astrologers say they foretell the deaths of princes, and are sometimes right; hedge-witches say they make every working come easier, and are always right. While a comet hangs in the sky, the arts of the stars are open to anyone who will sit up and look.
- id: lore_bandit_season
  origin: allora1
  kind: lore
  name: Bandit Season
  icon: 🗡️
  text: Every few years a hard winter or a disbanded company fills some realm’s roads with robbers. The crown posts a bounty, the merchants hire guards, travellers go armed, and for a few weeks the ambush is a real danger. Then the bounties are paid, the bandits are hanged or hired, and the roads go quiet again.
- id: lore_wolf_winter
  origin: allora1
  kind: lore
  name: Wolf Winters
  icon: 🐺
  text: In a hard enough winter the wolves come down from the heights to the valleys. Flocks are lost, a child goes missing, the roads at dusk are no place to be, and every village pays for pelts. The old say a wolf winter is the Wild Hunt’s hounds running ahead of it.
- id: lore_shipwreck
  origin: allora1
  kind: lore
  name: The Law of the Coast
  icon: ⚓
  text: By the old law of every coast in the Seven, what the sea brings ashore belongs to whoever carries it away — unless the owner is alive to claim it, or the lord of the shore is quicker. Wrecks are rare, and terrible, and very profitable, and the coast-folk pray against them without much conviction.
- id: lore_progress
  origin: allora1
  kind: lore
  name: Royal Progresses
  icon: 👑
  text: The princes of the Seven visit one another on progress more often than they go to war, which everyone agrees is an improvement. A progress brings a train of hundreds — courtiers, guards, cooks, players, petitioners and pickpockets — and a city it visits is en fête for days, and in debt for months.
- id: lore_rp_stilts
  origin: allora1
  kind: lore
  name: The City on Stilts
  icon: 🏘️
  text: "Ripla stands on the marsh where the Balm meets the ocean, and nothing in it touches the ground. The houses stand on piles of fen-oak driven deep into the mud, the streets are walkways strung between them, and as the city grew it grew upward: level on level of criss-crossing galleries, stairs and bridges, until the richest houses look out over the sea from the High Walks and the poorest look up at them from the water. Every year some of the old piles rot, and every year the pile-drivers sink new ones, so that Ripla is never quite the same city twice."
- id: lore_rp_sleepers
  origin: allora1
  kind: lore
  name: The Sleepers
  icon: 💤
  text: Ripla judges by dreaming. When a cause comes before the Court, advocates plead it and witnesses swear to it; then a Sleeper drinks the Nimian draught, lies down on a hard couch in the Dreaming-Hall, and sleeps. Ripla believes that in the trance Nim himself shows the Sleeper the true reading of the facts. When the Sleeper wakes, the judgement is given — and it binds merchants, nobles and the King himself. Sleepers train in law for twenty years before they are allowed to dream a single case, and are the most respected people in Gallar.
- id: lore_rp_waking_code
  origin: allora1
  kind: lore
  name: The Waking Code
  icon: ⚖️
  text: Whatever a Sleeper dreams must be found within the Waking Code, or the dream is void. The Code is the oldest body of law in Gallar, kept and added to since before the Sillenians came, and written in Riplese, which has more words for ownership, obligation and fault than any other tongue in the Freeholds. It is rigid, enormous and complete. Clerks spend their lives copying it, advocates their lives arguing it, and Sleepers their lives learning it so thoroughly that they dream in it.
- id: lore_rp_ghostcap
  origin: allora1
  kind: lore
  name: Ghostcap and the Draught
  icon: 🍄
  text: The Sleepers’ trance-draught is brewed from ghostcap, a pale fungus that grows only in the darkest beds of the Ripla Fens and glows faintly on moonless nights. The Fen-Gatherers pick it; the Nimian recluses brew it; and only the Nimians know the full recipe. Some Nimians call the Sleepers’ trance a profanation, Nim’s voice bent to clerks’ work. Some Sleepers suspect the temple of shading judgements through the strength of the draught. Neither can do without the other, and the Court’s accounts show that it pays for its potions promptly, and never argues the price.
- id: lore_rp_lantern
  origin: allora1
  kind: lore
  name: Trollin’s Lantern
  icon: 🔥
  text: Castle Trollin stands on the seaward cliff above the city, and its tower is both a battle-mage’s tower and the harbour’s lighthouse. On dark and stormy nights the Lantern is lit — not with oil, but with a battle-mage’s flame, called up from the Sillenian fire the Scorched School of Drell still teaches. Ripla says that as long as the Lantern burns, House Doll holds the city. House Doll, which pays the mage, makes sure it never goes out.
- id: lore_rp_drowned
  origin: allora1
  kind: lore
  name: The Drowned Stairs
  icon: 🌊
  text: "The lowest walkways of Ripla flood at every spring tide and every great storm, and nobody who could afford to live higher lives there. The Drowned Stairs are the city of the poor: bailers, eel-wives, pile-drivers’ families, and the smugglers, who like a street that goes underwater twice a month and a harbour-watch that will not follow them into it. Whatever comes into Ripla without paying the Sea-Gate comes in through the Stairs."
- id: lore_rp_tombwalks
  origin: allora1
  kind: lore
  name: The Tomb-Walks
  icon: 💍
  text: "Nobody in Ripla can be buried; the ground is water. The poor go to the sea. The rich go to the Tomb-Walks: raised stone tombs on causeways through the fens, each with its family’s name and jewels, kept by Seronia’s Ringed, who tend the dead as the brides of their goddess. Robbing a tomb is the worst crime in Gallar. In the Ripla Fens, where the ground can swallow a man and the will-lights lead him off the causeway, it is also the most dangerous."
- id: lore_rp_merrow
  origin: allora1
  kind: lore
  name: The Merrow Dolls
  icon: ✴️
  text: Three generations ago a younger son of House Doll was given the manor of Merrow on the edge of the fens to keep him out of the city. His grandchildren are still there, and still counting. The Merrow Dolls are rich, well-connected and perfectly loyal to their cousin the King; they also keep a pedigree from Harrowgate that shows exactly how close they stand to the throne, and a dinner-table at which every enemy of the main line is made very welcome.
- id: lore_rp_sea
  origin: allora1
  kind: lore
  name: Ripla’s Sea
  icon: ⛵
  text: "Ripla is the only Freehold with a coast, and the only door Gallar has to the ocean — but the door is barely used. A few foreign ships a season come in under the Lantern: traders from far coasts with spices, glass and strange coin, who leave with ghostcap, salt and fen-herbs. No great fleet comes. The ocean beyond the delta is wide and the delta shoals shift with every storm, and only Ripla’s own pilots can bring a ship through them alive."
- id: lore_rp_startide
  origin: allora1
  kind: lore
  name: The Star-Tide
  icon: 🌟
  text: At the highest spring tide of the year, the sea comes up through the Drowned Stairs and floods the city’s lowest levels to the second landing. Ripla makes a feast of it. Everything the Stairs own is carried up to the High Walks, the King lights star-lanterns along the walkways, skiffs race through the flooded streets, and at midnight the whole city sets candles adrift on the ebb, one for every soul the sea has taken.
- id: lore_fd_twins
  origin: allora1
  kind: lore
  name: The Twin Cities
  icon: 🌉
  text: Fin and Drell face each other across the upper estuary of the Balm, a mile of brown tidal water apart. They speak one language, Drellic, in two accents, and have spent four hundred years making jokes about each other’s. The conquest split them, and they have refused every chance to unite since. Yet when any other Freehold threatens either one, both cities close ranks at once, which is why the rest of Gallar counts them as a single Freehold and treats them, cautiously, as one.
- id: lore_fd_casagna
  origin: allora1
  kind: lore
  name: The Heirs of Casagna
  icon: 🍷
  text: "The Sillenian lords who first took the estuary were the Casagnas, and they ruled both banks until a quarrel between two brothers split the house in two. Their descendants are House Chandice in Drell (sigil: a chalice) and House Greer in Fin (sigil: a wheel), and both young lords, Farris and Nolan, claim to be the true heir of Casagna. Drell’s little castle still bears the name. Both houses have a pedigree from Harrowgate proving their claim; the Archive of House Vane was paid twice."
- id: lore_fd_bridges
  origin: allora1
  kind: lore
  name: The Three Bridges
  icon: 🌉
  text: "Three great bridges join the cities: the Old Bridge, of Sillenian stone; the Toll Bridge, where each city taxes the other’s goods; and the Chain Bridge, whose middle span is raised every night. By old custom the bridges are neutral ground. No arrest, no duel and no debt can be called on them, and every fugitive, debtor and eloping couple in the Twin Cities knows it. Some people have lived on the Old Bridge for years."
- id: lore_fd_bridgefight
  origin: allora1
  kind: lore
  name: The Bridge-Fight
  icon: 🦯
  text: Once a year, at midsummer, the young men and women of both cities meet on the Old Bridge with blunt ash poles and fight a mock battle for it, from either end, until one side holds the middle arch. The winners keep the Old Bridge — in honour, at least — until the next year, and their city hangs its banner from the central arch. Bones are broken most years, and heads; nobody has died since the poles were padded, a reform both cities claim credit for.
- id: lore_fd_scorched
  origin: allora1
  kind: lore
  name: The Scorched School
  icon: 🔥
  text: "The Sillenians brought battle-magic over the sea, and the Scorched School of Drell is where it survived: the oldest battle-mage college in Gallar, a blackened tower and yard in the middle of the city where students call fire, shape it and throw it. The School hires its graduates to every Freehold in the Great Old Game, whichever side pays, and so it has fought on both sides of every war in Gallar for three hundred years. Its contracts are never broken. That, it says, is the only loyalty a mage can afford."
- id: lore_fd_menagerie
  origin: allora1
  kind: lore
  name: The Grand Menagerie
  icon: 🐻
  text: "The lords of Drell keep beasts for prestige: bears and behemoth calves, ghost-leopard cubs that never live long in a cage, prairie wolves, great eagles, and a few things from beyond the sea that came on Ripla’s foreign ships and have no names in Drellic. The Grand Menagerie is the pride of House Chandice and the terror of the Crowd-Streets, because something escapes from it most years."
- id: lore_fd_florists
  origin: allora1
  kind: lore
  name: The Florists of Fin
  icon: 🌺
  text: "Fin’s soil is the richest on the Balm and its Guild of Florists the greatest flower-growers in Allora. They breed named varieties — the Casagna Black, the Bride’s Blush, the Widow Marle, the Drell-Will-Envy-It — and guard them like secrets: a new bloom can be worth a farm, and a stolen cutting has started more than one feud. Every wedding and every funeral in the Freeholds is dressed with flowers from Fin."
- id: lore_fd_archgate
  origin: allora1
  kind: lore
  name: The Arch-Gate
  icon: 🛡️
  text: "Castle Casagna is a small, compact Sillenian fort, more tower than castle, and far too small to quarter an army. So Drell’s soldiers live in the Arch-Gate: a great triumphal gate on the landward road, its two piers and its span hollowed into barracks, armouries and stables. Its crown is the highest point in Drell, and on midsummer morning the sun comes up exactly through the arch."
- id: lore_fd_maiden
  origin: allora1
  kind: lore
  name: The Maiden on the Balm
  icon: 🌊
  text: At the middle of the Old Bridge a stair runs down to a stone landing on the water, and there, kept exactly as her shrines are kept in the Seven — the white cloth, the floating lamps, the cup of river-water — is a shrine of Norrae, Maiden of the River. Nobody in Fin or Drell knows who first set it there. Her keepers say the Balm is her body, as every river is, and smile when asked how she crossed the mountains.
- id: lore_gm_city
  origin: allora1
  kind: lore
  name: Gramall, the Castle on the Grass
  icon: 🏰
  text: "Gramall rises alone out of the Dorrian prairie, so big that travellers see it for a day before they reach it: tower on tower, wall within wall, a whole city inside one castle. Nobody would choose to build there, and nobody did — not first. Under the inner ward stands a ring of grey standing stones, and under the stones run buried halls that no one now remembers cutting. The Sillenians found the strongest place on the prairie and built on it. The stones are still there in the middle of the castle, and the lords of Brall have learned to leave them be."
- id: lore_gm_ride
  origin: allora1
  kind: lore
  name: The Ride
  icon: 🏇
  text: "Brall’s cavalry is the best-trained in Gallar, and it never stops moving. Each season the Ride goes out on circuit through the fiefs of the prairie — Caddon Market, the Furrows, Wyvel on the marches — to show the lance: to hear complaints, hang bandits, take recruits, buy horses and remind every fief-knight and every serf exactly who rules. When the Great Old Game calls, the same riders go raiding. Gramall children play at the Ride before they can read."
- id: lore_gm_bread
  origin: allora1
  kind: lore
  name: Bread as Power
  icon: 🌾
  text: "Gramall’s fields of wheat and barley feed half of Gallar, and its Great Granaries hold the surplus of good years against bad ones. In a fat year that makes Brall rich. In a lean year it makes Brall a player in the Great Old Game without ever going near the Balm: the price of bread in Ripla, Drell and Lomma is decided at the Bread-Warden’s desk, and a Freehold that has offended Lord Tamlin may find its carts at the back of a long queue."
- id: lore_gm_horse
  origin: allora1
  kind: lore
  name: By Horse and Sky
  icon: 🐎
  text: Every Gramall child rides before they walk far. Horses are named at birth, bred by bloodline and traded with pedigrees longer than most noble houses’; a family’s wealth is counted in horse-brasses on the mantel. An oath in Dorric is sworn “by horse and sky”, and a man who breaks one may find that nobody will sell him a horse again, which on the prairie is much the same as being dead.
- id: lore_gm_porceps
  origin: allora1
  kind: lore
  name: Porceps’ Blood
  icon: 🐴
  text: "Before there were saddles there was Porceps, the first and greatest of horses, whom Bellor the Lucky tricked onto a bridle — the Bellings tell a dozen versions of how. The spring-fed hollow where Porceps stamped in fury is still called the Hoofprint, and the wild horses of his line still come down to drink there: the best mounts in Gallar and the hardest to break. Brall’s studs pay a fortune for a Porceps colt, and a broken neck is the usual price of trying to catch one."
- id: lore_gm_prairie
  origin: allora1
  kind: lore
  name: The Dorrian Prairie
  icon: 🌾
  text: "The prairie is flat enough to see a storm a day before it comes: a black wall on the horizon that grows all afternoon while the farmers race to bring in the sheaves. In late summer the long grass burns, and the fire-lines run faster than a horse can gallop downwind. In hard winters the wolves come down from the north and the folds are watched all night. There is one hill on the whole prairie, and on its top stands the Sun-Stone."
- id: lore_gm_wakes
  origin: allora1
  kind: lore
  name: The Night Wakes
  icon: 🔥
  text: "Gramall’s serfs are among the most subjugated people in Gallar, bound to the soil and worked from dawn to dark. By day the lords rule. By night the serfs have the Wakes: bonfires in the stubble, dancing in the barns, songs, ale, tales and older rites, all of it unpoliced. House Brall knows the Wakes exist and does not ride at night. It is an unspoken bargain, and it keeps the serfs working by day. When a Hopper judgement touches a noble, the bargain breaks for a season."
- id: lore_gm_hoppers
  origin: allora1
  kind: lore
  name: The Hoppers
  icon: 🎭
  text: "The Hoppers are masked bands who deal out the serfs’ own justice without asking any lord: to a thief, a cruel bailiff, a miller with a thumb on the scale. They come over the hedges and ditches in long leaps and are gone the same way before the riders arrive. A judgement begins with rough music — pots, horns and rattles at the guilty one’s door at midnight — and worse follows only if the warning is ignored. Their masks are woven from straw and chaff after the harvest and burned before the next, so that no mask ever survives to name its wearer."
- id: lore_gm_muster
  origin: allora1
  kind: lore
  name: The Harvest Muster
  icon: 🌾
  text: At harvest the whole Freehold turns out. Every cart on the prairie is loaded and sent rolling to the Great Granaries, and Brall’s riders guard the roads in long lines so that not a sheaf goes astray — or to a rival Freehold. In Gramall the gates stand open for three days, the carts are tallied in at the Lance Gate, and the Ride parades through the castle-city with the first sheaf on a lance.
- id: lore_gm_greatwake
  origin: allora1
  kind: lore
  name: The Great Wake
  icon: 👑
  text: "When the last sheaf is in and the riders have gone home, the serfs hold the Great Wake: the greatest of the Night Wakes, in the stubble outside Hobb’s Furrow, with a bonfire you can see from Gramall’s walls. New chaff masks are woven by the fire. At midnight the serfs crown a Wake-Queen or a Wake-King for one night, who may say anything about anyone, lords included, without punishment — and the lords, who are listening from the dark, have always kept that custom."
- id: lore_sh_onore
  origin: allora1
  kind: lore
  name: Onore, the Blue Castle
  icon: 🏰
  text: "Onore is a Sillenian tower-castle built entirely of Shella’s native blue marble: a cluster of tall pale-blue towers above the headwaters of the Balm, with the leaping fish of House Joix carved over every gate. In winter sunlight the whole castle glows like ice, and travellers coming out of the forests have been known to stop and stare until their horses get cold. It is the most beautiful fortress in Gallar, and it was built to hold off the north."
- id: lore_sh_alone
  origin: allora1
  kind: lore
  name: Alone on the Frontier
  icon: 🛡️
  text: "Shella stands between the Freeholds and the Witch-Queens, and it stands there by itself. There is no common defence: the other Freeholds are too busy with the Great Old Game to coordinate, and quite content to let a powerful rival bear the brunt of the north. Shella has paid for its frontier in blood, frostbite and failed harvests for generations. Lately the Witch-Queens have been defensive rather than aggressive, and the frontier is quiet. Nobody in Shella calls it peace."
- id: lore_sh_qo
  origin: allora1
  kind: lore
  name: The White Serpent in Onore
  icon: 🐍
  text: Until a few years ago the cult of Qo, the white heavenly serpent, was a small rustic faith of forest villages, which held that in each generation Qo chooses one person to be his voice against the dark quell. Then the Queen’s son fell deathly ill, and his mother, past hope, sent for the serpent’s prophet. The prince lived. Since then Jonell has stood at Queen Namere’s side, the church of Qo has risen in blue marble in Onore, and Shella has been learning — carefully — to fear what the prophet says it should.
- id: lore_sh_ox
  origin: allora1
  kind: lore
  name: The Behemoth Ox
  icon: 🐂
  text: "North of Shella the forests thin into tundra, and there the behemoth oxen roam: shaggy cattle the size of mammoths, with horns a man can stand between. A single ox feeds a village through a winter, its hide roofs a hall and its bones are dense enough to carve into armour. Hunting one takes a whole lodge, weeks of tracking and a cold nerve, and the bulls do not always agree to be the hunted."
- id: lore_sh_leopard
  origin: allora1
  kind: lore
  name: The Ghost Leopard
  icon: 🐆
  text: "In the pale pine-woods east of Skarra lives the ghost leopard: a great cat so white and so quiet that hunters see only its tracks, and then only the tracks it lets them see. It easily hunts those who hunt it. A ghost-leopard pelt is the rarest trophy in Gallar, and the leopards seem to know who has killed their kin: hunters who have taken one find tracks circling their camps for years afterwards."
- id: lore_sh_marble
  origin: allora1
  kind: lore
  name: Blue Marble
  icon: 🧊
  text: Shella’s blue marble lies under ground that is frozen half the year, and it is cut in winter, when the frost holds the blocks firm; in summer the thawing mud slides and the faces crack. The quarrymen of Hask fire-set the frozen face, drive wedges into the seams and haul the blocks to Onore on ox-sledges over the snow. It is the hardest work in Shella, and the stone is renowned across Gallar for its beauty and the quality of what it builds.
- id: lore_sh_watchline
  origin: allora1
  kind: lore
  name: The Watch-Line
  icon: 🔥
  text: A chain of timber forts and beacon-towers runs along Shella’s western edge, facing the Neck where the crooked finger meets Gallar. The Watch-Line patrols it in every weather, reads the sky for the slow great workings of the Witch-Queens — a winter come too early, a killing frost laid over one valley — and lights the beacons when it sees one coming. It is here that most Shellans first meet the witches’ power, and learn that the cold can be made to hate you.
- id: lore_sh_fords
  origin: allora1
  kind: lore
  name: Cousins Across the Ice
  icon: 🧊
  text: "Shellans and the tribes of the Mearc share songs, hunting customs and even family names: half the households along the Neck have a grandmother who was Praen, or a cousin who went over the ice and stayed. In quiet years, when the rivers freeze, they meet at the fords to trade Shellan furs for peninsula bonecraft. Queen Namere does not admit it happens. Neither do the Witch-Queens. Both, it is generally supposed, know exactly what changes hands."
- id: lore_sh_springs
  origin: allora1
  kind: lore
  name: Where the Balm Rises
  icon: 💧
  text: The Balm, Gallar’s one great river, begins in a valley south of Onore as a hundred springs that never freeze, steaming faintly in the coldest winter. At the Wellhead stands a little shrine of the Maiden of the River, kept exactly as her shrines are kept in the Seven, a world away over the Tyer. Nobody in Shella knows how Norrae came here, or when; the shrine’s carvings are older than the Sillenian castle, and they do not say.
- id: lore_sh_oxfeast
  origin: allora1
  kind: lore
  name: The Ox-Feast
  icon: 🐂
  text: When the first behemoth of winter is brought in, the Great Hunt drags it to Onore on a sledge and roasts it whole in the square below the blue towers. The Queen cuts the first slice; the new hide is raised over the Hunt’s banner; the hunters sing the names of the dead, the old songs that the tribes across the ice sing too; and for three days nobody in Shella goes hungry.
- id: lore_lm_faces
  origin: allora1
  kind: lore
  name: The Faces That Look Up
  icon: 🗿
  text: "Long before the Sillenians came over the sea, someone cut a city into the cliff above the ravine: halls, stairs, cisterns and galleries, and everywhere faces — hundreds of them, carved into the walls and lintels and pillars, every one turned up to look at the sky. The Lommish say the city was named for them; the word means something like “they who wait above”. Nobody knows who the builders were, what they waited for, or why the oldest faces, deep in the ravine, have their eyes shut. The Sillenians took the city. They did not make it, and the Lommish never let them forget it."
- id: lore_lm_cages
  origin: allora1
  kind: lore
  name: The Stair and the Cages
  icon: ⛓️
  text: "There are two ways up the cliff-city. One is the Great Stair, eleven hundred steps cut into the rock, which the poor climb and the proud climb on feast-days to show they can. The other is the Cages: rope-lifts in iron cages hauled by winches on every level, worked by the Lift-Men’s Guild. A lift-man knows who goes where, when, and with whom, on every level of the city, and the guild has made a quiet fortune out of knowing it. It is said in Lomma that the King rules the cliff and the lift-men rule the space in between."
- id: lore_lm_fall
  origin: allora1
  kind: lore
  name: The Fall of the Fronds
  icon: 🗡️
  text: "House Frond (sigil: a sword) held Lomma for four generations, and the last of them, King Peller, went mad in the Carved Halls: he heard the faces speak, and hanged the people they named. Nine years ago a rich upstart called Aldous Renne made his move. The Ironmasters drew the bolts on their gate and let his men into the pit-roads; Captain Ysolt Varr turned the King’s own guard against the King; and Renne came up the Great Stair at dawn and took the crown. His son Brace (sigil: a tower) rules now. Lomma agrees that the Fronds had to go. It does not agree on who deserves the credit. The Ironmasters say they opened the door; the guard says it held the sword; both are honoured at every feast, and neither is king."
- id: lore_lm_vorpal
  origin: allora1
  kind: lore
  name: Vorpal Bronze
  icon: 🟫
  text: "In the deepest galleries of Lomma’s pits run thin veins of an ore that will not hold its colour: blue in lamplight, green in shadow, red when it is struck. The Bronze-Wrights, a closed guild older than the Sillenians, smelt it into vorpal bronze, which shifts colour in the light and takes an edge like nothing else in the world. Nobody outside the guild knows the whole of the smelt, and nobody inside it has ever told. A single vorpal blade is worth a manor, and kings in Gallar wait years for one."
- id: lore_lm_gliding
  origin: allora1
  kind: lore
  name: The Wings of Lomma
  icon: 🪂
  text: "A hundred years ago a Lommish carter’s boy, tired of the Great Stair, stretched waxed silk over a frame of ash and jumped. He broke both legs. His brother made a better wing, and did not. Now the cliff-gliders of Lomma leap from the Split Crag on wings of waxed silk and ride the updraft out of the ravine: it began as a quicker way down than the Stair, and now it carries the Wing-Post’s letters, the sun-god’s faithful and every show-off in the Freehold. The Wing-Wrights build the wings in their lofts on the western cliff. Lower Lomma has a tavern called the Broken Wing, and nobody there finds the name morbid."
- id: lore_lm_splitcrag
  origin: allora1
  kind: lore
  name: Bellor’s Jump
  icon: 🍺
  text: Bellor the Lucky, so the story goes, once bet a Lommish king that he could jump from the cliff-top and land on his feet in the ravine. The king took the bet. Bellor jumped — and the cliff, unwilling to be outdone, gave way under him and came down too, so that he rode a falling crag all the way to the bottom and stepped off it on to the riverbank, dry-shod, and collected his winnings. The Split Crag still stands where the rock tore away. Gliders launch from its lip, and doing so in Bellor’s name is counted one of his Twelve Deeds.
- id: lore_lm_firstgem
  origin: allora1
  kind: lore
  name: The First Gem of the Vein
  icon: 💎
  text: "At the bottom of the pits, below the last iron gallery, is the Deep Chamber: a natural cave with a black pool where the miners of Lomma leave Seronia the first gem from every new vein. Everything in the earth is the Dark Bride’s, they say, and a miner who keeps her first gem will not keep his own life long. The Ironmasters, who are not sentimental people, have never once taken a stone out of the Deep Chamber, and do not employ anyone who would."
- id: lore_lm_longdark
  origin: allora1
  kind: lore
  name: The Mouth of the Long Dark
  icon: 🌊
  text: Below the Deep Chamber the oldest galleries are drowned. Somewhere beyond the flooded sumps they join old workings and natural caves that run east for days, under the Tyer Mountains, and come out again in the Seven. The pitmen call it the Long Dark. A few people come through it every year, half-drowned and wholly lost, and the pit-bosses who find them want a coin to keep quiet about it. Sometimes, they say, if you listen at the lowest sump, you can hear someone on the far side, swimming.
- id: lore_lm_peller
  origin: allora1
  kind: lore
  name: The King at Ashcombe
  icon: 🌳
  text: When the Rennes took Lomma they did not kill King Peller. A dead king is a martyr, and a mad one is merely sad; and the Eagle had sealed him, which no new house wishes to be seen to forget. So Peller lives at Ashcombe, a shuttered manor in the ash-woods where the Wing-Wrights cut their frames, under the guard of Renne soldiers who are changed every month so that he cannot charm them. He writes letters to every court in Gallar insisting that his Golden Seal was never revoked. Most of them are burned unread. Not all of them.
- id: lore_lm_wings
  origin: allora1
  kind: lore
  name: The Day of Wings
  icon: 🪂
  text: "When the spring thermals first come up the ravine strong enough to carry a grown man, all Lomma turns out for the Day of Wings: the Wing-Wrights show their new wings, the Wing-Post flies a race from the Split Crag to the Landing-Market, the Bellings jump in Bellor’s name, and Lower Lomma sells pasties and ribbons to everyone who has climbed the cliff to watch. The winner is carried up the Great Stair on the crowd’s shoulders. The losers are carried down to the Broken Wing."
- id: lore_mc_eorlhall
  origin: allora1
  kind: lore
  name: Eorlhall
  icon: 🦌
  text: "The great hall of the Praen stands on a hill above the forests, a hundred paces of black oak under a roof crowned with antlers: every stag a Praen ever killed in a famous hunt has its tines nailed to the ridge, so that from a distance the hall looks like a beast lying down to sleep. All three tribes meet here, under the truce of the hall, to settle feuds, swear oaths and hear what the Witch-Queens want this year. No blade may be drawn under the antlers. Many have been drawn just outside."
- id: lore_mc_bonetithe
  origin: allora1
  kind: lore
  name: The Bone-Tithe
  icon: ⚖️
  text: "Every year the Tithe council of Wocca reckons what the tribes owe, and part of it is paid in their dead. The Larder takes the remains of the honoured and the skilled — a great hunter, a fine carver, a wise elder — because a witch who consumes them takes something of what they knew. It is the deepest dread of the peninsula, and it shapes everything: why the Khilns sink their dead in the bog, why the Praen carve their ancestors’ bones into heirlooms, why the Molster give theirs to the tide, and why no one in the Mearc ever praises the dead too loudly."
- id: lore_mc_sunken
  origin: allora1
  kind: lore
  name: The Sunken Kin
  icon: 🪶
  text: "The Khilns sink their honoured dead in the sacred mud-pits, weighted with stones and pinned with hazel, where the Larder cannot reach them and the bog keeps them whole. Some have lain there for centuries: leathery, dark, perfect to the eyelash, a braid still tied, a last meal still in them. The Khilns call them the Sunken Kin and say they are not dead but waiting. To dig one up is the worst thing a person can do in the Mearc, and scholars, robbers and — it is whispered — the Larder itself have all tried."
- id: lore_mc_wergild
  origin: allora1
  kind: lore
  name: Wergild
  icon: 🪙
  text: "Every life on the peninsula has a price: a thane’s so much, a carver’s so much, a fisherman’s so much, paid in herring, bone and silver. When one kin kills another, the feud runs until the wergild is paid, and then it is over as if it had never been. The reckoning is done in hall before the elders, and it is an art: rank, kin, deeds, the circumstances of the killing and the insults since all go into the price. The Witch-Queens’ Tithe sets the wergild of a witch. No one has ever been asked to pay it."
- id: lore_mc_herring
  origin: allora1
  kind: lore
  name: Silver of the Sea
  icon: 🐟
  text: Herring is the peninsula’s bread and its coin. A last of herring is a measure of wealth; dowries, debts and the wergild of a thane are reckoned in barrels; children are paid in kippers. The great shoals come down the west coast in autumn and the whole Molster nation goes out after them. In the old riddles herring is “the sea’s silver” and “the whale’s road-bread”, and the smoke of Hæringhythe can be seen from Eorlhall on a still day.
- id: lore_mc_boatgraves
  origin: allora1
  kind: lore
  name: The Boat-Graves
  icon: ⛵
  text: The Molster lay their dead in small boats with their nets and knives, push them out on the ebb at dusk and let the tide take them. Sometimes the tide brings a boat back, and then it is drawn up on the shore at Hæringhythe and left to rot among the others, with the dead still in it, for the sea has refused them and the kin will not. Some say the Larder’s sisters walk the boat-graves on winter nights. The Molster leave the boats alone and say nothing.
- id: lore_mc_barrows
  origin: allora1
  kind: lore
  name: The Barrow-Downs
  icon: ⛰️
  text: The Praen raise their dead under long green barrows on the downs below the forest, with their weapons and their grave-gold. After a generation the bones are lifted, washed in mead, named, and given to the bonecrafters to carve into heirlooms, so that the dead go home again in their grandchildren’s hands. Until then the barrows are watched — against grave-robbers in fact, and in the tales against the wights, the barrow-dead who will not lie still and whose touch is cold as Wocca.
- id: lore_mc_neck
  origin: allora1
  kind: lore
  name: The Neck
  icon: 🔥
  text: Where the crooked finger joins Gallar the land narrows to a few miles of marsh, dyke and ford between the two seas. Here the tribes broke the Sillenian advance in the first years of the conquest, and here their watch-fires burn still, one in sight of the next, from coast to coast. In hard winters the fords freeze and Shellan hunters cross to trade furs for bonecraft on the ice, which neither side’s rulers admit, and which the Fire-Wardens watch with their arms folded.
- id: lore_mc_riddles
  origin: allora1
  kind: lore
  name: Riddles and Kennings
  icon: 📜
  text: "Mearcish speech loves a hidden name. The sea is the whale-road, a sword the wound-tooth, a ship the wave-horse, the sun the sky-candle, a witch the horned one or simply “her”, never her name. Riddles are traded at every mead-bench and fought over at every feast: a good riddler is as honoured as a good hunter, and a riddle no one can answer is a kind of treasure. The oldest riddles, the scops say, are about the dead, and their answers are names."
- id: lore_mc_dreadnights
  origin: allora1
  kind: lore
  name: The Dread-Nights
  icon: 🕯️
  text: "In the darkest weeks of winter, when the sun barely clears the forest, the kin gather in the mead-halls and sit up through the long night together: fires on every hearth, riddles on every bench, and at midnight the scop rising to recite the names of the ancestors, back and back, so that no one is alone in the dark and no name is forgotten. The tribes say the cold is thickest then and the Witch-Queens’ workings walk abroad. Whatever the truth, nobody in the Mearc sleeps alone on the Dread-Nights."
- id: lore_kn_wocca
  origin: allora1
  kind: lore
  name: Wocca
  icon: 🧊
  text: "Wocca stands at the bend of the crooked finger where the land turns east into the ice: a fort-city of timber and frozen earth, its walls glazed with ice that is never allowed to melt, its streets roofed against the snow. At its heart, in halls older than the Sillenian conquest, the Striga meets; around them the five councils keep their halls, and around those live the sisters, the novices and the servants. Outsiders who come without the wit to resist the sisters’ auras leave confused, weeping, or not at all. Wocca does not hide. It does not need to."
- id: lore_kn_councils
  origin: allora1
  kind: lore
  name: The Striga and the Five Councils
  icon: ⚖️
  text: "The Witch-Queens are not queens, and have no queen. They govern together, through five councils of senior sisters each with its own work: the Frost (the great weather-workings), the Larder (the remains of the dead, and the knowledge taken from them), the Tithe (rule and tribute over the Khilns, the Molster and the Praen), the Veil (initiation, rank and discipline) and the Hearing (spies, envoys and the aura). Above them sits the Striga, the eldest sisters, who decide what the councils cannot. Outsiders may serve any council, and earn its trust. None may ever join."
- id: lore_kn_ranks
  origin: allora1
  kind: lore
  name: Veil and Horn
  icon: 🧕
  text: "A girl taken into the order is a Novice, and goes bare-faced. At her veiling she covers herself from head to foot, and becomes Veiled. When she is first trusted with power she is given horns, sewn to the crown of her hood, and becomes Horned; and with every step of rank the horns grow — reindeer, then ibex, then musk-ox — until a Krona of a council wears a crown of them and the eldest of the Striga can barely pass a door. At full initiation each sister gives up her name and takes a new one: a single syllable with no meaning, Hrae or Skeg or Yrr, so that nothing of who she was remains to be called."
- id: lore_kn_larder
  origin: allora1
  kind: lore
  name: The Larder
  icon: 🦴
  text: "Witch-magic is fed on the dead. When a sister consumes what remains of a person — a little, with ceremony, in the Larder’s cold halls — she takes on something of their skill and knowledge: not their memories, but the knack, the eye, the sure hand. That is why the Larder takes the honoured dead of the tribes as tithe, and why a Krona may speak three dialects and carve like a master she never met. The Larder keeps its stores in ice, in order, by name. The tribes do not speak of it at all."
- id: lore_kn_aura
  origin: allora1
  kind: lore
  name: The Aura
  icon: 👁️
  text: "Every sister has an aura, faint in a novice and vast in the eldest, that presses on the minds of those around her: a weight of dread, a fog of confusion, an urge to kneel or to tell the truth. Most people simply give way. Those who have learned the signs — Witchlore, the tribes call it, the knowing — can hold their minds steady, and see the working behind the feeling. It is not magic, and it teaches no magic. It is only a way of not being swept away."
- id: lore_kn_great_spells
  origin: allora1
  kind: lore
  name: The Great Workings
  icon: ❄️
  text: "Witch-magic is slow. A great working takes days to gather and days to land, but when it lands it lands on a whole country: a summer turned to winter, a winter day turned to killing frost, a valley buried in snow from wall to wall. Three times Hide-Lord armies have marched up the Neck, and three times the Frost has let them come, then closed the sky behind them. The survivors walked home without fingers, toes or horses. Lately, Wocca has worked no great spells against the south at all, and the south does not know whether to be glad or afraid."
- id: lore_kn_tithe_road
  origin: allora1
  kind: lore
  name: The Tithe-Road
  icon: 📯
  text: "The road north from the Mearc to Wocca is marked by horn-posts every mile and lined with tithe-houses, low and long and cold, where the tribes deliver what they owe: herring, bone, furs, silver, and their dead. The Tithe-Reeves keep the road and count the tribute, and the sledges go north in silence. The tribes call it the Grey Way, or the Last Road. It is the best-kept road on the peninsula."
- id: lore_kn_hornhall
  origin: allora1
  kind: lore
  name: The Hornhall
  icon: 🦌
  text: "Girls come to the Hornhall from all three tribes: some chosen, some given, a few — more than Wocca admits — who walk up the Tithe-Road of their own will. Here they are taken in, given up their names in all but the Hornhall’s own books, and veiled, and here, years later, the first horns are sewn to their hoods. Leima’s great idol stands in the hall, her stag-antlered face turned to the novices, the other two faces left in shadow."
- id: lore_kn_frozen_host
  origin: allora1
  kind: lore
  name: The Frozen Host
  icon: ⚔️
  text: "Beyond Wocca, out on the White Waste, an army of the Freeholds still stands where the cold caught it two hundred years ago: men, horses and banners under the ice, the snow blown clear of them in places so that a face looks up through a yard of glass. The Frost tests its workings over them, as if to remind itself. Robbers come for the grave-goods. Few come twice."
- id: lore_kn_long_tithe
  origin: allora1
  kind: lore
  name: The Long Tithe
  icon: 📯
  text: "Each autumn, when the year’s tithe is reckoned, the tribes bring it north all at once: a procession of sledges and carts that fills the Tithe-Road for three days, with the dead of the year among the herring and the furs. The kin walk beside their own as far as the last tithe-house, saying their names, and then turn back. The reeves light fires all the way to Wocca. No one sings."
- id: lore_gl_gallar
  origin: allora1
  kind: lore
  name: Over the Tyer
  icon: 🏔️
  text: "West of Grell and Sarlon the Tyer Mountains rise like a wall, and beyond them, the traders say, lies Gallar: a land of horses, rivers, bone-carvers and witches, rich and poor at once. One road crosses the Tyer, from Sarlon’s Wolf’s Gate to the Pass-Hold of Harrowgate, and the house that holds it charges whatever it pleases. King Rowan’s diplomats want that road widened. So far they have only made the toll go up."
- id: lore_hg_toll
  origin: allora1
  kind: lore
  name: The Toll of the Tyer
  icon: 🗝️
  text: "Everything that crosses the pass pays: wagons by the wheel, beasts by the head, travellers by the soul. The rates are written in Old Sillenian on a bronze tablet at the Customs-House, which almost nobody can read, and they go up whenever the Keyholder has a daughter to marry. Friends of House Vane pay less. Everyone else pays, bribes, or goes over the Saddle."
- id: lore_hg_archive
  origin: allora1
  kind: lore
  name: The Archive of House Vane
  icon: 📜
  text: "House Vane alone in Gallar can trace its line straight back to the Sillenian invasion, and it has kept every record since: charters, oaths, treaties, marriage-rolls and genealogies of every house in the Freeholds. Every upstart king needs Vane to prove his pedigree. Every rival needs Vane to disprove it. The Archive does both, for a fee, and has been accused of writing a royal line from nothing at least four times. It has never been proven."
- id: lore_hg_varnholt
  origin: allora1
  kind: lore
  name: Varnholt
  icon: 🛡️
  text: "The Grey Lances’ camp stands in Vane’s hill country on the road below the pass: stone barracks, a drill-yard, a stable for three hundred horses and a board where every Freehold’s contracts are pinned side by side. Captain Harl pays his tax to Vane and sells lances to Vane’s enemies, and both parties find the arrangement too useful to end."
- id: lore_hg_saddle
  origin: allora1
  kind: lore
  name: The Hag’s Saddle
  icon: 🏔️
  text: North of Harrowgate the Tyer rises to a glacier saddle where the wind never stops. Smugglers cross it to avoid the toll, and some of them come back. It takes four days, a good cloak, crampons and rope, and more nerve than sense. You have crossed it. The Runners say that once is luck and twice is a habit.
- id: lore_hg_longdark
  origin: allora1
  kind: lore
  name: The Long Dark
  icon: 🕳️
  text: "Under the Tyer run old flooded workings and natural caves no map has ever held: the Long Dark, from an abandoned Sarlonese mine-mouth near the Wolf’s Gate to the lowest galleries of Lomma’s pits. Three days without the sun, swimming sumps in the pitch black, breathing air that has been waiting a thousand years for you. You have come through it. The pit-bosses of Lomma were not surprised to see you. They never are."
- id: lore_hg_tankard
  origin: allora1
  kind: lore
  name: Bellor’s Tankard
  icon: 🍺
  text: Below the Hag’s Saddle lies a round pool, deep and cold, that Bellor dug with his own hands to win a bet that he could make a cup big enough for his thirst. He won; he drank it dry; the mountain refilled it out of pity. Bellings who come this way drink a cup of it and toast him, and the bravest try to finish what he started.
- id: lore_hg_embassy
  origin: allora1
  kind: lore
  name: The Sarlonese Dream
  icon: 👑
  text: Sarlon has no sea-trade to speak of and envies the republics theirs. A land road to Gallar — wide, safe and cheaply tolled — would make Valmonte the market of half the world. For eleven years King Rowan’s embassy at Harrowgate has wined, dined and bribed House Vane towards it. The road is exactly as narrow as it was.
- id: lore_hg_monastery
  origin: allora1
  kind: lore
  name: The Monastery of the Storm
  icon: ⛈️
  text: High above the Hag’s Saddle, on a peak no map names, the Cave-Sworn of Orthun keep a monastery that does not officially exist. Its brothers and sisters take in no strangers, keep no records and ring no bells; they live among the lightning and come down to nobody. Those of Orthun’s own who are high enough in the god’s regard find the door open, and a fire, and a night’s safety on the Saddle.
- id: lore_gl_dream_1
  origin: allora1
  kind: lore
  name: "The Dreamfuture: First Teaching"
  icon: 💤
  text: "Five dreams in the cells, and the first teaching comes on its own, the way the Nimians said it would: you are not seeing the future. You are seeing the dream from nearer to the one who dreams it. Things happen in the waking world because they have already been dreamed; to dream deeply is only to stand closer to the loom."
- id: lore_gl_dream_2
  origin: allora1
  kind: lore
  name: "The Dreamfuture: Second Teaching"
  icon: 💤
  text: Fifteen dreams, and you notice that in all of them there is a quiet place at the edge, like a held breath. The old Nimians say that is Nim himself, asleep at the heart of his own dream, and that if he ever woke the world would not end — it would simply never have been.
- id: lore_gl_dream_3
  origin: allora1
  kind: lore
  name: "The Dreamfuture: Third Teaching"
  icon: 💤
  text: "Thirty dreams. You have stopped being sure which side of the draught you are on. The eldest recluse tells you this is the last teaching and the only one that matters: it does not make any difference. Be kind in both."
- id: lore_gl_qo_1
  origin: allora1
  kind: lore
  name: The First Revelation of Qo
  icon: 🐍
  text: Qo is the white serpent of heaven, who coils in the sky and fights the dark quell. Every generation he chooses one voice to speak against it. This is what the hymns teach, and what every child in Onore knows.
- id: lore_gl_qo_2
  origin: allora1
  kind: lore
  name: The Second Revelation of Qo
  icon: 🐍
  text: The quell is not out there, beyond the stars. It is the dark water beneath everything, and the world floats upon it like a leaf on a cistern. When the ground shakes, when a well goes bad, when a child dreams of drowning, that is the quell, moving below.
- id: lore_gl_qo_3
  origin: allora1
  kind: lore
  name: The Third Revelation of Qo
  icon: 🐍
  text: The world is made of the quell. Stone, flesh, wood and water are quell that has forgotten itself. Only what Qo has touched is light, and he cannot touch everything. Jonell watches your face as he tells you this, to see whether you understand what it means about your own hands.
- id: lore_gl_qo_4
  origin: allora1
  kind: lore
  name: The Fourth Revelation of Qo
  icon: 🐍
  text: Qo does not fight the quell to destroy it. He coils around the world to keep it asleep, and the world is its dream. The Nimians say the world is Nim’s dream; the church says Nim is only the quell’s dreaming face, and that the recluses are drinking its sleep.
- id: lore_gl_qo_5
  origin: allora1
  kind: lore
  name: The Fifth Revelation of Qo
  icon: 🐍
  text: Every healing is a debt. What Qo withholds from the quell, the quell is owed elsewhere. The Queen’s son lived. You ask Jonell who paid for it, and he does not answer, and he does not look away either.
- id: lore_gl_qo_6
  origin: allora1
  kind: lore
  name: The Sixth Revelation of Qo
  icon: 🐍
  text: Qo and the quell are one serpent eating its own tail; the light and the dark are its two ends, and there is no third thing. To be saved is to be swallowed last. Jonell says you are ready to hear this because you have stopped hoping it is not true.
- id: lore_gl_bride_face
  origin: allora1
  kind: lore
  name: The Face of the Bride
  icon: 👁️
  text: You looked. Under the veil the statue has the face of someone you have loved, and then the face of someone you will, and then your own face, very old and very calm, smiling at a joke you have not heard yet. The Ringed are already turning towards you. You will not be welcome in her house for a season, and you will not forget it for the rest of your life.
- id: lore_gl_seal
  origin: allora1
  kind: lore
  name: The Golden Seal
  icon: 🦅
  text: At noon on midsummer the Eyrie looses a sacred eagle over the cliff at Lomma, and whoever it comes down to may be sealed in gold wax as a lawful ruler of the Freeholds. In practice the claimants are few, the archive at Harrowgate has already decided who may stand, and the eagles are well trained. The Eyrie says the eagles are trained by the sun. Everybody else says the same thing, more quietly.
- id: lore_gl_bellor
  origin: allora1
  kind: lore
  name: The Last Trick of Bellor
  icon: 🍺
  text: Bellor courted Seronia herself, and to everyone’s astonishment — hers included — she said yes. He went down to her on the wedding night, and before dawn he slipped out of the underworld the way he had slipped out of every other bed in Gallar, leaving his body behind under a great stone on the Gramall prairie. The Ringed say he is with her still and the bride’s chair is not empty. The Bellings say he is out riding. Both tell the story at weddings.
- id: lore_gl_mantle
  origin: allora1
  kind: lore
  name: Bellor’s Mantle
  icon: 🍺
  text: "Every few generations one of Bellor’s admirers follows his footsteps so far that the god follows theirs: they grow his beard, his height, his laugh, his luck and his trouble, and at the last a mortal portion of his power. There is only ever one Mantle. You are wearing it. You feel twenty-five and ready for anything, and you cannot remember the last time you refused a dare. You are exactly as tall as Bellor was and exactly as famous: the Phrell’s Grandeur cannot swell you and the Callum’s Hush cannot make the world forget you."
- id: lore_gl_wildwoman
  origin: allora1
  kind: lore
  name: The Wild Woman
  icon: 🐺
  text: "In the deep groves of the north the Greenwife is worshipped as the Wild Woman: shaggy, antlered, fanged, with the eyes of a wolf and hands that are almost hands. The Shellan hunters leave her the first cut of every kill and tie no ribbons. Ask her faithful whether she is the same goddess as the gentle lady of the Ribboned Oaks, and they will tell you that a wolf and a dog are the same animal too."
- id: lore_gl_balm
  origin: allora1
  kind: lore
  name: Norrae of the Balm
  icon: 💧
  text: "Along the Balm there are shrines of Norrae kept exactly as the river-sisters keep them in the Seven — the same clean water, the same white stones, the same vows — and the faithful here worship the Balm as her body. Nobody can say how she came over the Tyer. The sisters of the Balm say she did not have to: every river is her, and she was here first."
- id: lore_gl_horncrown
  origin: allora1
  kind: lore
  name: Horn-Fall
  icon: 🦌
  text: "In the last weeks of winter the stags of the peninsula shed their antlers, and the tribes go out into the holts to gather them: for the bonecrafters, for the idols, and for the honour of bringing in the year’s great crown. At the Bone-Moot the carvers compete, and the best antlers of the year are hung on Shure’s idol, where they stay until they crumble."
- id: lore_gl_necropolis
  origin: allora1
  kind: lore
  name: The Necropolis of the First Keels
  icon: ⚰️
  text: "The first Sillenian lords who crossed the sea were buried below Harrowgate in the old way: in stone ships, under barrows, with their swords, their gold and their genealogies cut into the walls. House Vane keeps the key, Seronia’s Ringed keep the watch, and the Tyer Runners keep a map of the ways in. Every upstart house in Gallar would give a fortune to be descended from someone buried here. Some of them have paid Vane for exactly that."
- id: lore_gl_bridgehouse
  origin: allora1
  kind: lore
  name: The Bridge-House
  icon: ♟️
  text: On the Old Bridge between Fin and Drell, where by ancient custom no arrest, no duel and no debt can be called, stands a narrow house with a door at each end. The Bridge-Brokers who keep it will carry a message between any two houses in Gallar, find a ransom’s price, arrange a marriage, quietly end a feud or quietly begin one. They are on everyone’s side, which is to say no one’s. The Great Old Game could not be played without them.
- id: lore_gl_guides
  origin: allora1
  kind: lore
  name: The Saddle-Guides
  icon: 🧊
  text: "For those who will not pay Vane and cannot cross the ice alone, there are the Saddle-Guides: a handful of hard, quiet people at the foot of the Hag’s Saddle who will take a party over for a price, and bring most of it back. Vane’s Wardens call them smugglers. The Runners call them amateurs. The pilgrims who climb to the Storm call them the only reason they are alive."
- id: lore_vaelis_lights
  origin: allora1
  kind: lore
  name: The Lights of Vaelis
  icon: 🏛️
  text: "For a century treasure-hunters said that something waited in the sealed tombs of Vaelis. Whatever it was, someone took it long ago: the tomb holds nothing now but dust, a broken seal, and the outline on the stone of a book that is no longer there."
- id: lore_charnel
  origin: allora1
  kind: lore
  name: The Nameless Charnel
  icon: 💀
  text: When the Grey Death came to Grell the second time, the dead outran the parish books. Thousands were laid in a cave-charnel above the Nachtwald without a name to be tolled for them, and Gruma’s bells have never rung for them since. The Mask-Wardens will not go there. The charcoal-folk leave it alone. And for forty years, until the Duke’s men came for him, a man named Ansgar Kahl lived among those bones and taught himself to ask them questions.
- id: lore_kahl
  origin: allora1
  kind: lore
  name: Ansgar Kahl
  icon: 💀
  text: Grell’s last necromancer was a Perlinburg physician who lost his whole family to the Grey Death and went up to the Nameless Charnel to ask them why. He stayed thirty years. He carried the Black Codex there from somewhere in the south — the tomb at Vaelis, the antiquaries say — and filled its margins with his own hand. The Duke’s men hanged him at the charnel gate. They burned his notes. They did not find the book, because none of them would go into his cell in the dark.
- id: lore_rb_bulls
  origin: allora1
  kind: lore
  name: The Winged Bulls of Assar
  icon: 🗿
  text: At every gate of Assar stand colossal bulls of stone with the wings of eagles and the bearded faces of kings, and they are alive. Each was bound, long ago, by a name written on clay; the name-tablets are kept in the Tablet-House, and every dawn the Name-Warden reads the names aloud at the gate so that the bulls remember what they are. A king of Raben rules only while the bulls of the gate bow to him. They have bowed to Nabu-shar-ilani every morning for twenty-two years. The court watches them every morning anyway.
- id: lore_rb_tablethouse
  origin: allora1
  kind: lore
  name: The Tablet-House
  icon: 📜
  text: Raben’s archive began as a room of royal letters and has never stopped growing. Its Upper Stacks hold every contract, census, omen and lawsuit of the empire, filed so precisely that a good scribe can find any tablet in a day. Below them, the stacks go down further than anyone has measured, and in the lowest of them scribes who have never seen daylight are still writing — tablets of things that have happened, things that have not happened yet, and things that never will. Nobody knows who feeds them. The Tablet-House treats the question as a matter of filing.
- id: lore_rb_etemen
  origin: allora1
  kind: lore
  name: Etemen, the Tongue-Tower
  icon: 🗼
  text: "Seven terraces of glazed brick step up into the sky beside the river, and on each the gift of tongues is different. On the lowest, nobody understands anybody — not even themselves, after a while — and trade is done by gesture. On the middle terraces words cross half the distance, and interpreters make a living from the other half. On the summit every language is understood: the Ahnari geometer’s, the Arumi merchant’s, the hawk’s and the wind’s. The star-priests live there. Envoys of the three powers meet there, because it is the one place in Qoul where nobody can claim to have been misunderstood."
- id: lore_rb_flock
  origin: allora1
  kind: lore
  name: The Fold of Tokens
  icon: 🐑
  text: "Before there was writing in Raben there were tokens: little clay sheep, one for each sheep in a flock, sealed in a clay ball. The Shepherd-King still keeps one token for every subject in his empire in the Fold below his palace, and counts them every night. A child born is a token made; a death is a token broken; a subject whose token is lost is, in law, nobody at all — no taxes, no lawsuits, and no protection. The Fold is the best-guarded room in Assar."
- id: lore_rb_dreamlions
  origin: allora1
  kind: lore
  name: The Dream-Park
  icon: 🦁
  text: The kings of Raben have always hunted lions, from the war-car, with the bow; it is what a king is for. But there are no wild lions left between the rivers, so the star-priests make them. Each night the Shepherd-King’s bad dreams are caught on a tablet by his bed, and in the morning the priests bind each one into a lion in the reed-beds of the royal park. The Lion-Wheels hunt them down so that the King may sleep. A dream-lion’s pelt fades into smoke within a year unless it is sealed. A great many of them are very large.
- id: lore_rb_calves
  origin: allora1
  kind: lore
  name: The Calf-Fields of Kar-Alap
  icon: 🐂
  text: Winged bulls are not carved. They are bred, in the water-meadows of Kar-Alap, from calves that have wings but no names, and try to fly, and cannot. The Court of Horns vaults them, as the old leapers of the western isles vaulted ordinary bulls; a leaper who clears a calf’s horns is said to hear one syllable of the name it will be given. When a calf is grown and named it folds its wings, turns to stone, and is dragged to a gate. The leapers weep at every naming. They are not supposed to.
- id: lore_rb_sluices
  origin: allora1
  kind: lore
  name: The Twenty Sluices of Kesh
  icon: 🌊
  text: Every village of the Two Rivers wants the flood on its fields and nobody else’s, and since the oldest days the quarrel has been settled at Kesh by the Game of Twenty Squares — played on a board the size of a field, whose squares are real basins and whose pieces are real sluice-gates. When a village’s piece moves, its water moves. The Sluice-Wardens umpire. A good game takes a whole season; a great one is remembered for a century and sung at weddings.
- id: lore_rb_tell
  origin: allora1
  kind: lore
  name: The Tell of Years
  icon: ⛰️
  text: "East of Assar stands a mound of ruined cities, one on top of another, each built on the levelled bricks of the last. The diggers of the Tablet-House have cut a trench down through it, and found that the lowest layers have not quite finished: dig deep enough and you step into a year that is still going on, under a sun four hundred years old, among people who do not know they are history. The Tablet-House files what you bring back. It asks you not to bring back anyone."
- id: lore_rb_fishcloaks
  origin: allora1
  kind: lore
  name: The Fish-Cloaks
  icon: 🐟
  text: "Under Port Abzu, under the salt harbour, lies the sweet deep: fresh water older than the sea. At dusk, the harbour-folk say, sages come up out of it wearing the skins of great carp, take them off on the rocks, and walk the quays as men and women, teaching whoever will listen how to build, write, brew and sow. If you hide a Fish-Cloak’s skin it must teach you a craft before it can go home. It will. It will also remember your face for a thousand years."
- id: lore_rb_unsealed
  origin: allora1
  kind: lore
  name: The Unsealed
  icon: 💔
  text: "In Raben a person is a tablet in the Tablet-House and a token in the Fold. Break the one and lose the other, and the person is not merely outlawed but nonexistent: no court can try them, because there is nobody to try. The Unsealed live in the diggers’ camp at the Tell of Years and in the alleys behind the bazaar, trade in what falls between the records, and pay very well to have a tablet misfiled. The Tablet-House would like to stop them. It is not clear, legally, that there is anyone to stop."
- id: lore_rb_bowing
  origin: allora1
  kind: lore
  name: The Bowing of the Bulls
  icon: 🐂
  text: On the first days of every year the Shepherd-King lays down his crook and crown at the Serpent-House, and the High Priestess of Laishma strikes his face until he weeps, because a king who cannot weep for his flock is no shepherd. Then he walks alone, bareheaded, out through the Gate of the Winged Bulls while the whole city reads the bulls’ names aloud from copies on clay. If the bulls bow, he is king for another year. They always have. Nobody in Assar breathes until they do.
- id: lore_sl_dilmun
  origin: allora1
  kind: lore
  name: Dilmun, the Clean Island
  icon: 💧
  text: "Dilmun rises out of the salt gulf green with palms, watered by sweet springs that come up from under the sea — each, the islanders say, the rain of a different year, stored in the deep since the gods were young. Here, they say, the raven does not croak and the lion does not kill. Here, too, nobody may be born and nobody may die: the Purifiers row the labouring and the dying across the lagoon before dusk, so that the island stays as clean as the morning it was made. Visitors find it the most peaceful place in Qoul, and the most watched."
- id: lore_sl_mounds
  origin: allora1
  kind: lore
  name: The Mound-Field
  icon: ⛰️
  text: "Since nobody may die on Dilmun, the islanders die across the lagoon, on a long low shore that is legally not Dilmun at all. There they are buried, and have been for a thousand years, in mounds: tens of thousands of them, rank on rank, so many that from the sea the shore looks like a frozen swell. The dead of Dilmun are buried facing the island they were not allowed to die on. The Purifiers say this is a comfort to them."
- id: lore_sl_pearls
  origin: allora1
  kind: lore
  name: The Pearls of the Gulf
  icon: ⚪
  text: "The gulf’s divers say every pearl is a dream: the last dream of someone who drowned, which the oyster closed around and kept. The small ones are brief and sweet. The great gulf pearls hold whole lives, and a diver who holds one to his ear at night can hear them. The Rabene factors pay more for pearls that hold sweet dreams, and the Pearl-Exchange of Dilmun grades them accordingly. What becomes of the pearls that hold nightmares, the divers do not say."
- id: lore_sl_drifts
  origin: allora1
  kind: lore
  name: The Drifting Isles
  icon: 🌾
  text: "Where the Two Rivers die into the gulf there are no fields, only reed: reed taller than three men, and the marsh-folk build everything from it — boats, mats, houses, the great arched guest-halls, and the islands themselves, which are mats of cut reed piled on reed until they float. The islands are anchored loosely, and they wander. A village is not a place but a company; the King of Raben’s tax-collectors have never found the same one twice."
- id: lore_sl_kuara
  origin: allora1
  kind: lore
  name: Kuara-on-the-Beast
  icon: 🐋
  text: The Sealands’ only town of any size is built on the back of a sea-beast so vast that its spine is a ridge and its blowhole a temple. It has slept in the gulf mouth longer than anyone remembers. Its people fish, tar boats, read the Beast’s breathing for weather and pilot ships through the shoals, where other sleeping monsters lie like reefs. Once in a long while the Beast turns over in its sleep. The old town, on the far shoulder, is under twenty fathoms of water. The new one has very good drainage.
- id: lore_sl_waters
  origin: allora1
  kind: lore
  name: The Mirror Shallows
  icon: 🪞
  text: Beyond the last shoal the gulf turns so still and so thick with salt that it holds a reflection as a mirror holds a face — and keeps it. A boat that crosses leaves its reflection behind, sitting on the water; a gull that flies over leaves a gull. A man who touches the Shallows with his skin leaves his reflection too, and it is the reflection that wades ashore and walks away, while the man stays behind on the shingle as a pillar of salt, looking back. The shore is lined with them. The only way across is Pagir’s ferry, poled with poles each of which may touch the water once.
- id: lore_sl_faraway
  origin: allora1
  kind: lore
  name: The Isle of the Sleeping Teacher
  icon: 🐟
  text: At the edge of the dawn, past the Mirror Shallows, lies a small island with a shingle beach, a reed house, a shelf of clay questions that runs its whole length, and the vast shed fish-skin of the Seventh Teacher spread over a hill like a silver tent. Under the hill, in a cave the tide fills twice a day, the last of the sages who taught the world to write lies asleep. Once a month, at the lowest tide, he wakes for an hour, answers one question — the one his warden has chosen — and corrects one mistake. Petitioners come from all over Qoul to sit the low-tide watch at the cave-mouth, hoping it will be theirs. Most go home with nothing but the watching. Some say that is the lesson.
- id: lore_sl_plant
  origin: allora1
  kind: lore
  name: Remembering-Coral
  icon: 🪸
  text: On the floor of the gulf, where the sweet springs rise through the salt, grows a thorned red coral the divers call Remembering. It does not make you young. A sliver dissolved in wine makes you remember being young — completely, for a day — which most people who have tried it say is worse. Divers reach it with stones tied to their feet. A serpent of Laishma’s brood lies coiled among the branches and guards them as a dragon guards a hoard, counting every branch, over and over; it sheds its skin each season on the shelf above, and the divers gather the skins while it is busy counting.
- id: lore_sl_qafal
  origin: allora1
  kind: lore
  name: The Lantern-Qafal
  icon: 🏮
  text: When the pearling season ends the fleet comes home to Dilmun all at once, and the island, which may hold no death, makes room for one night for the drowned. Every pearl that nobody has claimed is set on a little reed boat with a lamp and pushed out onto the lagoon, so that the dream inside it can go home. The boats drift out past the mound-field towards the edge of the dawn. The divers sing them out. Nobody on Dilmun will say where they go.
- id: lore_ah_meret
  origin: allora1
  kind: lore
  name: Meret-Ahn
  icon: 🔺
  text: The capital of Ahnara stands on the west bank of the Iteru, laid out on a grid so true that its geometers can find the day of the year by which streets are in shadow. Every house is built to an angle the College approves; every sunshade is reset each morning by the court geomancers, so that the city is never quite the same shape two days running. At its centre is the Angle-Throne — a seat cut from one block of granite at exactly the slope of the Apex’s first theorem — and beside it the Temple of Hetet, the god who is a perfect solid.
- id: lore_ah_solids
  origin: allora1
  kind: lore
  name: The Doctrine of Solids
  icon: 💠
  text: "Every Ahnari child learns it: a true shape holds what it is shaped like. A tetrahedron, sharpest of solids, holds heat; a cube holds ground and boundaries; an octahedron holds wind; an icosahedron, the roundest, holds water. When an Apex dies she is folded into a tomb of the shape she chose, and that shape goes on holding its share of the world for ever: the tetrahedra keep the summer off the fields, the cubes remember where every field ends, the octahedra fill the sails that go upriver, and the icosahedra hold back the flood. Together, across thirty generations, the tombs keep the river in balance. Nobody has built a dodecahedron, which is the shape of the heavens, because nobody knows what it would hold — and the present Apex is building one."
- id: lore_ah_angles
  origin: allora1
  kind: lore
  name: The Picture-Angles
  icon: ✍️
  text: "Ahnari is written in pictures that are also angles: an owl, a reed, a hand, each drawn so that its lines meet at the angle of the sound it makes. The College teaches that every word is a shape and that a sentence correctly written is a small solid, which holds its meaning. This is why Ahnari contracts are never broken, and why Ahnari poetry is so very hard to translate."
- id: lore_ah_folding
  origin: allora1
  kind: lore
  name: The House of Folding
  icon: ⚱️
  text: The Ahnari dead are not wrapped but folded. The embalmers of the House of Folding dry the body in natron for forty days, take out the four parts of the self and set them in four nested solids, and then fold the body in resined linen along the net of the shape its family has bought — a tetrahedron for a craftsman, a cube for a landowner, an icosahedron for the great — until the linen closes into a perfect solid with the dead inside it. A good fold hums very faintly at dusk. A bad one is unfolded and done again, and the family is not charged.
- id: lore_ah_stair
  origin: allora1
  kind: lore
  name: The Stair of Halves
  icon: 🌊
  text: "Where the Iteru runs past Meret-Ahn, a stair goes down into the river: each step half the height of the one above, so that the stair never reaches the bottom but goes on, ever finer, into the dark water. The Readers of the Stair read the flood on it, and by the step where the river stops each summer they set the water-tax of every field in Ahnara. The steps below the waterline are cut so fine that a man walking down them may walk for ever. Some have."
- id: lore_ah_dodeca
  origin: allora1
  kind: lore
  name: The Apex’s Dodecahedron
  icon: 🏗️
  text: "On the desert edge east of the capital the Apex Merit-Ahn the Ninth is building her tomb: a dodecahedron of white limestone and black granite, twelve pentagonal faces, larger than any solid in the Valley. Plato’s heirs across the sea would call it the shape of the cosmos; the College calls it the shape of the year. Eleven faces stand. The twelfth will not close: three times the masons have raised it, and three times its stones have been found on the sand in the morning, neatly laid out, unbroken. The Readers say the river has risen a little higher every year since the work began."
- id: lore_ah_college
  origin: allora1
  kind: lore
  name: The College of Angles
  icon: 📐
  text: The geomancers of Ahnara train for twenty years at the College of Angles, a great white courtyard of drafting-halls around a gnomon taller than any obelisk. They learn the true angles, the solids and the proofs of the dead Apexes; they learn to survey with electrum, which holds an angle better than any other metal; and the best of them learn to draw a line that holds something. Every tomb in the Valley of Solids was drawn here first. So was every canal.
- id: lore_ah_fields
  origin: allora1
  kind: lore
  name: The Triangle-Fields
  icon: 🌾
  text: Every summer the Iteru floods and every field-boundary in Ahnara vanishes under black silt. Every autumn the surveyors come out with electrum rods and draw them again — not from maps, but from the Cubes in the Valley of Solids, which remember the ground. A good surveyor standing in the mud can feel where the boundary was. Ahnari fields are triangles, because a triangle cannot be argued with.
- id: lore_ah_natron
  origin: allora1
  kind: lore
  name: The Natron Lakes
  icon: 🧂
  text: West of the river, in a dry valley of white crust, lie the lakes that give Ahnara its natron. The salt crystallises there in perfect cubes, which the College says is the land itself remembering the doctrine of solids; and the College sends its failed models out to the lakes to be dissolved, since a broken shape left lying about holds the wrong things.
- id: lore_ah_cataract
  origin: allora1
  kind: lore
  name: The Cataract of the Southern Angle
  icon: 🪨
  text: Where the Iteru comes down into Ahnara out of the south it breaks over black rocks in a white roar. Here are the granite quarries, cut along seams the geomancers find with electrum, and the obelisk-yards, where the needles are raised that pin the sky to the land so that the sun cannot slip. The fort on the island is the Apex’s southern frontier, and its chariots patrol the desert both sides of the water.
- id: lore_ah_rising
  origin: allora1
  kind: lore
  name: The Night of the Rising
  icon: 🌊
  text: On the night the flood reaches the Stair of Halves, every tomb in the Valley of Solids hums at once, and the Readers drop an electrum plumb into the river from the top step. Ahnara keeps the night awake on the riverbanks, singing the note of the tombs, racing flood-boats, and watching the plumb-line for the moment it goes still.
- id: lore_rl_valley
  origin: allora1
  kind: lore
  name: The Valley of Solids
  icon: 💠
  text: "Thirty generations of Apexes lie east of the Iteru in a long red valley, each folded into a tomb of the shape she chose: tetrahedra and square pyramids, cubes, octahedra, icosahedra, prisms, stellated stars whose points throw shadows like sundials, and the great Twin Cubes of the Fourth Dynasty that face each other like a pair of dice. Each holds its share of the world — heat, ground, wind, water — and together they hold the river in balance. Between them live the Keepers in a village of tomb-builders, painters and stonecutters whose families have served the same shapes for six hundred years."
- id: lore_rl_hum
  origin: allora1
  kind: lore
  name: The Hum
  icon: 🎵
  text: "At dusk, when the stone cools, every tomb in the Valley hums — each on its own note, which depends on its shape and on what it holds. The Keepers know them all. A tomb whose note slips is holding badly, and must be retuned by geomancers before the thing it holds gets out: a flat tetrahedron means a hot summer, a sharp icosahedron means a flood. On the longest night of the year the thirty generations hum as one chord."
- id: lore_rl_hall
  origin: allora1
  kind: lore
  name: The Hall of Two Truths
  icon: ⚖️
  text: "In the Hall of Two Truths the dead of Ahnara are weighed before they are folded: on one pan of a great electrum beam lies the shadow of their heart, on the other the Least Solid, a tetrahedron of something like light that weighs exactly as much as one true thing. The forty-two assessors sit each at an angle of the hall, and each asks one question. What sets the Hall apart is that it weighs the living too. Any Ahnari may ask to be weighed, and its verdicts are law: a merchant found heavy loses his licence, a lord found light is believed in every court in the land."
- id: lore_rl_electrum
  origin: allora1
  kind: lore
  name: The Pale Mines of Hu
  icon: ⛏️
  text: Electrum runs under the Red Land in veins that follow the lines between the tombs, as if the metal were drawn to the angles. Close to a true angle the ore sings, very faintly, and the Pale Gangs of Hu follow the singing through the dark with picks and their ears against the rock. Electrum holds an angle better than any metal, so every geomancer’s rod, every reliquary’s edges and the great beam of the Hall are made of it. The mines belong to the Apex. Most of the electrum reaches her.
- id: lore_rl_crooked
  origin: allora1
  kind: lore
  name: The Crooked Line
  icon: 〰️
  text: "Every perfect shape, the tomb-robbers say, has one flaw: an angle somewhere a hair out of true, through which a patient person may go in. They call themselves the Crooked Line, they learn geomancy backwards in a tunnel-school in the dunes, and they take from the tombs only the grave-goods, never the dead, because a robbed solid still holds but an emptied one does not, and they have to live in the same world as everyone else. The Keepers hunt them. The Hall weighs those they catch. Many are found lighter than you would expect."
- id: lore_rl_shadow
  origin: allora1
  kind: lore
  name: The Shadow of the Shape
  icon: 🌑
  text: "Far out in the Red Land the guides will take you to a line in the sand, as straight as a ruled edge and running out of sight both ways, where the colour of the desert changes. The mirages of the Red Land, the College says, are not tricks of heat: they are the shadow of a shape too large to see, standing over the desert, and this is the edge of it. Inside the line there is no hum, no wind and no echo. The guides say it is the tomb of whoever built the world, and that whatever it holds, it is holding it very well."
- id: lore_rl_oasis
  origin: allora1
  kind: lore
  name: The Oasis of the Mirror
  icon: 🌴
  text: Where the springs come up under the palms on the edge of the deep desert, there is a pool so still that the mirages lie on it like reflections, and at dusk you can see in it the edge of the great shadow, far off, as a bright line. Caravans stop here from every road in Qoul; the caravanserai is never empty; and the date-wine of the oasis tastes, to everyone who drinks it, of somewhere else.
- id: lore_rl_wells
  origin: allora1
  kind: lore
  name: The Nine Wells
  icon: 🐪
  text: The guides of the Red Land live at the Nine Wells, a ring of stone wellheads in the sand west of the Valley, and every caravan into the deep desert hires one. They steer by the hum of the tombs, which carries for days across the sand, and by the stars they see at noon in the Star-Well, which is so deep that it is always night at the bottom.
- id: lore_rl_sphere
  origin: allora1
  kind: lore
  name: The Empty Sphere
  icon: ⚪
  text: In the far corner of the Valley stands the tomb of the Heretic Apex, who taught that the world should not be held but let go, and had herself buried in a sphere. A sphere has no angles; it holds nothing; it does not hum. Her successors chiselled her name off everything and left the tomb standing as a warning. The Keepers will tell you, quietly, that the flood was gentler in her reign than in any other.
- id: lore_rl_longhum
  origin: allora1
  kind: lore
  name: The Night of the Long Hum
  icon: 🎵
  text: On the longest night of winter the thirty generations of the Valley hum together in one chord, loud enough to feel in the teeth. The Keepers set lamps at every tomb’s corners, the Hall of Two Truths weighs any living soul who asks, for nothing, and the Crooked Line, who like a noise to work under, are out in force.
- id: lore_ba_covenant
  origin: allora1
  kind: lore
  name: The Voice in the Tent
  icon: ⛺
  text: "Beth-Arum has no idol, no temple and no name for its god. It has a Tent of black goat-hair and linen, empty but for a lamp that is never filled and never goes out, and from inside it, very rarely, a Voice. The twelve hill-kingdoms and the caravan cities are bound to that Voice by a covenant older than any of their kings: they keep its law, and the Tent stays among them. The Tent moves by itself — its shadow swings round to point the way a day before it goes — and the capital of Beth-Arum is wherever it has stopped. The Keepers follow it. So do the Judges, the prophets, the singers, half the merchants of Qoul, and anyone else who wants to be near the centre of things."
- id: lore_ba_tadmor
  origin: allora1
  kind: lore
  name: Tadmor of the Columns
  icon: 🐪
  text: "Tadmor stands in an oasis where every incense road in Qoul crosses, and it has grown rich enough to build a street a mile long lined with columns. Halfway up each column is a bracket, and on each bracket stands the bronze likeness of the caravan-master who paid for it. The statues are not quite still: they turn their heads to watch their own caravans come home, and their descendants climb ladders to ask them for advice. The Caravan-Fellowships rule the city in all but name, and keep the covenant with the meticulous piety of people who know exactly what it is worth."
- id: lore_ba_tariff
  origin: allora1
  kind: lore
  name: The Tariff-Stone
  icon: 📜
  text: "Every duty Tadmor charges is carved in Arumi on a basalt slab twice a man’s height in the agora: so much on a camel-load of myrrh, so much on a slave (nothing — the covenant forbids it), so much on a jar of oil if the jar is goatskin. When a Judge rules on a toll anywhere in Beth-Arum, the letters of the Stone crawl overnight into their new order, and in the morning the clerks copy the changes. Nobody carved the Stone this way. Nobody has ever successfully argued with it, either."
- id: lore_ba_judges
  origin: allora1
  kind: lore
  name: The Twelve Judges and the Threshing-Floor
  icon: ⚖️
  text: "Beth-Arum’s kings rule cities; its Judges rule the covenant. There are always twelve, one raised from each hill-kingdom, and they follow the Tent from halting to halting with their courts, scribes and advocates. They hear cases on threshing-floors, because on a threshing-floor the evening wind does what no advocate can: testimony spoken over the floor is winnowed, and the lies blow away as chaff while the truth falls like grain at the Judge’s feet. The chaff is swept up and burned each night. Some of it is not, and is sold, and that is a separate kind of case."
- id: lore_ba_inked
  origin: allora1
  kind: lore
  name: The Inked
  icon: 📢
  text: "When the Voice gives a prophet a word, the word must be kept exactly, and the prophets of Beth-Arum keep it on the only page they always have with them: they have it tattooed on their skin, in prophet’s ink, as soon as they have received it. A young prophet bears a phrase on the wrist. An old one is more scripture than flesh. The School of the Inked at Naioth trains the inkers who do the work and the students who read the results, and keeps the shroud-rubbings of the written dead in its deepest caves."
- id: lore_ba_wheels
  origin: allora1
  kind: lore
  name: The Singing Wheels of Hamath
  icon: 🎡
  text: "Hamath stands on a river too low to drink from, so its people built wheels: great water-wheels of timber, twenty men high, that lift the river in buckets and pour it into aqueducts for the city’s gardens. Every bucket is lettered with a psalm, and as each one tips over the top it sings — the groan of the axle, the Hamathi say, is only the Voice clearing its throat. The Wheel-Choir sings the hours to their pitch. Visiting singers find the pitch impossible; Hamathi children learn it before they can talk."
- id: lore_ba_wells
  origin: allora1
  kind: lore
  name: The Sworn Wells
  icon: 💧
  text: In the south of Beth-Arum, where the shepherd-kings of old quarrelled over every spring, a covenant was sealed by digging a well, and the water of such a well remembers the oath. Ein-Shevu has seven, each sealing a peace between tribes long since merged. Drink from one and the water is sweet if the oath it seals is still kept, and bitter if anyone bound by it has broken faith. The Judges send for well-tasters the way other courts send for physicians.
- id: lore_ba_songroads
  origin: allora1
  kind: lore
  name: The Sung Roads
  icon: 🎶
  text: "East of Tadmor lies a wilderness where the dunes walk and the roads walk with them: a track that ran north on Monday will run north-east by Friday, and a landmark you passed in spring may be three days off in autumn. The only maps are songs. The Road-Singers know forty, one for each road, and the verses change as the roads do; a caravan without a singer walks into the sand and is not seen again. A sung road is sung, never written down — the singers say ink cannot keep up."
- id: lore_ba_groves
  origin: allora1
  kind: lore
  name: The Groves of Hadra-Mor
  icon: 🌳
  text: The best frankincense in the world bleeds from small twisted trees in the far south of Beth-Arum, and the trees are guarded. Little winged serpents, bright as enamel, nest in every grove and fly at anyone who comes near; their bite is not always fatal. The harvesters drive them off with the smoke of burning storax, which the serpents cannot abide, and tap the trees while the smoke lasts. A Fellowship caravan carries the tears north. The serpents, the harvesters say, are the incense’s idea.
- id: lore_ba_willows
  origin: allora1
  kind: lore
  name: The Harp-Willows
  icon: 🌿
  text: "A Judge’s heaviest sentence short of death is exile: to walk outside the covenant for a term of years, belonging to no city and drinking at no sworn well. The exiles gather on the slow river at Ga’ash, under willows in which they hang their harps when they arrive, because they have sworn not to play until they go home. The wind plays them instead, night and day, and it plays very well. Travellers come a long way to hear the willows. The exiles find this hard to forgive."
- id: lore_ba_fathers
  origin: allora1
  kind: lore
  name: The Night the Fathers Step Down
  icon: 🗿
  text: Once a year, in spring, on the night the first caravan of the year comes home, the bronze fathers of Tadmor climb down from their brackets. They walk the Colonnade, stiff and ringing, and sit down at the tables their families have laid for them, and eat nothing, and talk until dawn — about roads, prices, marriages, debts and who has been selling short. At sunrise the Wheel-Choir’s singers sing them back up. Their descendants then have a year to act on what they were told.
- id: lore_cd_condominium
  origin: allora1
  kind: lore
  name: The Fort of Three Flags
  icon: 🏰
  text: "Every power in Qoul wants the Cedar Mountains, and none can hold them alone, so all three hold the same fort. Cedargate is a timber stockade of cloud-cedar shared in thirds: Raben’s winged bull, Ahnara’s triangle and Beth-Arum’s tent each have a gate, a tower and a barracks, and a rota carved on the gatepost says whose flag flies over the whole on which day. The three garrisons eat together in the Common Hall under a truce older than any of their commanders. The fort itself is the trouble: cloud-cedar never quite dies, and every spring the palisade puts out green shoots and has to be trimmed back before it walks off."
- id: lore_cd_huwawa
  origin: allora1
  kind: lore
  name: The Amber Tides
  icon: 🔶
  text: Every cloud-cedar bleeds resin when it is cut, but the cedars of the deep forest bleed the Resin Mother’s amber, and it does not stay where it falls. It gathers in the hollows and moves out between the trunks in slow golden tides, glassy and warm, a hand’s breadth deep or a man’s height, sealing whatever it flows over. Woodcutters caught by a tide are found standing in clear amber with their eyes open, still holding their axes; a hundred years later they are standing there yet, and their faces have not changed. The Pairs say a tide is only the forest closing a wound. The Rabene, who have lost more men to it than anyone, call it the Mother’s Collection.
- id: lore_cd_walking
  origin: allora1
  kind: lore
  name: The Walking Cedars
  icon: 🌲
  text: "The cloud-cedars are the Resin Mother’s children, and they move. Not while anyone is looking — a cedar that is watched stands as still as any tree — but turn your back and it will take a step, and in a night a grove can close a path, surround a camp or wander a mile downhill. So the woodcutters of the mountains work in pairs: one cuts, and one watches every tree in sight without blinking. A woodcutter whose watcher looks away is not usually found."
- id: lore_cd_door
  origin: allora1
  kind: lore
  name: The Door of Oaths
  icon: 🚪
  text: "In a high pass above the forest stands a door: a single plank of cloud-cedar sixty cubits tall, in a frame with no wall on either side. The Crown-Folk say it was made by a carpenter whom all three powers once hired, together, to build a wall across the mountain; he built a door instead, and told them a wall only keeps a war out, while a door can be shut on one. Ever since, when the three powers swear a truce, their envoys climb up and close the door together, and while it stays shut there is peace on the mountain. A power that wants war has only to send someone up to open it. That is not why most people climb up. Walk round the door and you are still on the mountain; open it — if you can — and you step through somewhere else: a ridge in Ahnara, a well in Beth-Arum, a street in Assar, or a place nobody has a name for. Envoys and adventurers carve their oaths on the frame. The cairns below are for those who opened it and did not like what was on the other side."
- id: lore_cd_flume
  origin: allora1
  kind: lore
  name: The Long Flume
  icon: 🏴
  text: "Ilshu of the Flagless built it over three winters: a trough of split cedar a league long, running down a gorge from a hidden felling-ground to a river no garrison watches, iced every night so that a log sent down it arrives at the bottom faster than a falling stone. Riding a log down the Flume is a Flagless initiation. Most survive it. The three garrisons have each tried to burn it, and found it too wet, too steep, and too useful to the other two garrisons to be worth the trouble."
- id: lore_cd_girdled
  origin: allora1
  kind: lore
  name: The Girdled Cedars
  icon: 🪢
  text: Above the forest, on a high place of bare rock, stand the oldest cedars in the world, too old to walk. Their keepers girdle each one with a rope of twisted straw as thick as a man, hung with zigzag streamers of white clay-paper, and ring wind-bells under them; no axe may touch a girdled tree, and no amber tide has ever crossed the rope. The keepers worship no god anyone in Qoul can name — only the mountain, the snow-spring and the trees — and they take in the frostbitten of every flag without asking which.
- id: lore_cd_crowns
  origin: allora1
  kind: lore
  name: The Crown-Folk
  icon: 🌲
  text: "Four generations ago a quarrel at Cedargate ended with a Rabene captain’s daughter climbing a cloud-cedar and swearing never to come down. She kept her word. Her children and their children live up there still, among the crowns in the cloud: rope-bridges between the trees, nests of woven branches, clay ovens slung in the forks, falcons, cone-harvests and a cloud-well from which they drink. They have never touched the ground. They regard it as a foreign country, and not one they think much of."
- id: lore_cd_rafts
  origin: allora1
  kind: lore
  name: The Raft-Road
  icon: 🪵
  text: "Cloud-cedar too great for camels goes down the mountain the only way anything that size can go: by water. At the landing of Kur-Erin the drivers lash the trunks into rafts and ride them down the gorges to the plain and on to Raben, dancing on the rolling logs to keep them from jamming. Across the river at the landing hangs the Toll-Boom of Three Flags, a chain of cedar logs that opens only when all three garrisons have each been paid."
- id: lore_cd_truce
  origin: allora1
  kind: lore
  name: The Caber-Truce
  icon: 🪵
  text: "Once a year, at the end of autumn, when the last timber of the season has gone down the Raft-Road, the three garrisons of Cedargate hold a truce-feast in the fort yard: one long table, three flags flying at once, and contests between the thirds — tossing the trimmed shoots of the palisade end over end, pulling ropes, wrestling — with a judge chosen by lot from among the woodcutters. It began as a way of settling a quarrel over which flag should fly on a day that was not on the rota. It has settled nothing since, and everyone looks forward to it all year."
- id: lore_aq_thrones
  origin: allora1
  kind: lore
  name: The Two Thrones
  icon: ⚖️
  text: Ashqel has had two kings for as long as it has had a causeway. The Salt King reigns on the island by day; the Sand King on the shore by night; and no law, treaty or death-sentence is good until it bears the noon seal and the midnight seal both, which means every law of Ashqel takes at least half a day to pass, and the city is proud of it. By the founding custom the two kings may never look upon each other — the old story is that the first two were brothers who loved the same woman, and agreed never to meet rather than quarrel. A curtain of fixed mood-cloth hangs across the middle of the causeway to make sure. If their eyes ever meet, both reigns end within the hour, and the island and the shore each choose again.
- id: lore_aq_shekel
  origin: allora1
  kind: lore
  name: The Shekel of True Weight
  icon: 🪙
  text: "Ashqel’s coins are the best in the world: true silver, true weight, struck with dies of star-iron cut from a stone that fell into the harbour in the city’s founding year. Every scale in Qoul trusts them. And they have a second property, which the Mint-Mistress denies and every merchant relies on: an Ashqeli shekel rings true in an honest palm and false in a liar’s. Contracts from Assar to Tadmor are sealed by both parties holding the same coin and saying the terms aloud. The Dumb-Coiners of the causeway strike a third kind — silent coins, good silver with no truth in them either way — for the people who would rather not be asked."
- id: lore_aq_purple
  origin: allora1
  kind: lore
  name: Mood Multi-Color
  icon: 🟣
  text: "Ashqel’s mood multi-color is boiled out of a sea-snail in vats that can be smelt a league out to sea, and it is worth more than gold by weight, because it does not stay any one colour. Worn, it takes the colour of what its wearer feels: violet for calm, crimson for anger, gold for joy, green for envy, black for grief, and a sick yellow for fear. The Dye-Houses sell it two ways. Fixed multi-color has been steeped in the Fixing-House until it shows one feeling only — ambassadors wear fixed calm, brides fixed joy, and heirs at a funeral fixed grief, whatever they actually feel. Unfixed multi-color is worn by those who have nothing to hide, or who are made to: in Ashqel’s courts every witness testifies in an unfixed robe."
- id: lore_aq_causeway
  origin: allora1
  kind: lore
  name: The Causeway of Even Weight
  icon: 🌉
  text: A mile of cut stone joins the island to the shore, broad enough for four carts, lined with stalls, shrines, counting-tables and the public scales where any coin may be rung. Halfway along, the mood-cloth curtain hangs between two towers from parapet to parapet, and the Salt and Sand courts each keep a gate on their own side of it. By day the causeway trades towards the island; at dusk the stalls turn round and trade towards the shore. Under its arches, where the tide sucks, the Dumb-Coiners keep their forges.
- id: lore_aq_hippos
  origin: allora1
  kind: lore
  name: The Hippos
  icon: 🐴
  text: Ashqeli ships carry a carved horse’s head on the prow, and are called hippos for it. The figureheads are cut from the heart of a single cloud-cedar, painted in fixed mood-colours, and given a name; the shipwrights say a good one will neigh before a storm. Ashqeli captains go where nobody else goes — round the south cape to the Western Gulf, where Ashqel’s exiled princess founded Elissar, and some say beyond.
- id: lore_aq_weighing
  origin: allora1
  kind: lore
  name: The Night of Even Weight
  icon: ⚖️
  text: "Once a year, on the one night when the day and the night are of even length, both kings come to the middle of the causeway, blindfolded, with the curtain drawn back between them, and the year’s silver is weighed on the great scale in their presence: one pan for the island, one for the shore. The pans have never balanced exactly, and the difference is given to the poor. The kings may speak to each other that night, through their blindfolds, and nobody else may listen. The whole city stays up."
- id: lore_el_thread
  origin: allora1
  kind: lore
  name: The Oxhide Thread
  icon: 🧵
  text: Offered as much land as an oxhide would cover, Elishat cut the hide into a thread so fine it would pass through a ring, and walked it round the whole hill. The thread still lies there, in a groove cut along the top of the city’s inner wall, under a bronze grille; the priests of the Hill re-oil it every year. It is the boundary of the New City and of the Queen’s power. Nothing that means the city harm has ever crossed it uninvited — and in Elissar, an invitation means bread set in the threshold-niche.
- id: lore_el_rephaim
  origin: allora1
  kind: lore
  name: The Rephaim, the Fed Dead
  icon: 🦇
  text: "All over the old west of Qoul the living feed their dead: every new moon, bread and wine are set in a niche beside each threshold, and the household drinks to its ancestors by name. Neglected dead wander and do harm. Beloved dead rest. In Elissar the beloved dead were fed so faithfully, for so long, that some of them came back up the hill to eat. They are the Rephaim, the Hundred and Four who rule the city at night: grave, courteous, deeply learned, very old and very hungry. They do not age, cast no shadow, cannot cross a threshold where no bread has been set for them, and cannot bear the presence of an elephant. Each new moon the citizens give them the Red Cup — a cup of their own blood each, freely, at the House of the Cup — in return for the city’s laws, its memory and its peace. Most citizens think it a fair bargain. The mahouts do not."
- id: lore_el_cup
  origin: allora1
  kind: lore
  name: The Red Cup and the Marzeah
  icon: 🍷
  text: The Rephaim do not hunt. They are fed, as the dead are fed, and they consider anything else barbarous. At each new moon the citizens of Elissar go to the House of the Cup and give a cup of their own blood into a bronze basin, and are given bread, wine, a token and the thanks of the Hundred and Four. The blood goes to the marzeah — the old funeral-feast of the west — which the Rephaim keep every night in the House of the Cup, reclining on ivory couches and drinking to the living by name. To be named at the marzeah is the highest honour in the city. To refuse the Cup is legal, but it is noticed.
- id: lore_el_elephants
  origin: allora1
  kind: lore
  name: The Elephants of the Double Wall
  icon: 🐘
  text: "Inside the great double wall of Qartosh are stalls for three hundred war-elephants, with granaries above them and barracks for their mahouts. Elephants remember everything, and they mourn: when one dies the others stand over the body for days, touching it with their trunks, and they visit the bones for years afterwards. The Rephaim cannot come near them. The mahouts say an elephant smells a dead man walking as other beasts smell fire, and remembers him, and will not let him pass — which is why every gate of Elissar has an elephant beside it at night, and why the Hundred and Four, who rule everything else in the city, have never once been able to give an order to the Double Wall."
- id: lore_el_library
  origin: allora1
  kind: lore
  name: The Library of the Long Night
  icon: 📜
  text: Elissar’s library opens at dusk and shuts at dawn, because most of its readers are dead. It holds three hundred thousand scrolls on Ahnari papyrus — histories, sea-charts, farming treatises, the whole literature of Ashqel and most of Raben’s — and every one of them has been read, many times, by the same eyes over four hundred years. Its margins are crowded with the notes of readers who never die. There is no catalogue; there is Gisgal. A living reader may borrow any scroll for a single drop of blood, which is recorded in the Red Ledger against their name. The Ledger is the oldest book in the Library, and the Rephaim say it is the most interesting.
- id: lore_el_treatise
  origin: allora1
  kind: lore
  name: The Treatise of Magonim
  icon: 🫒
  text: The greatest book ever written about farming is four hundred and twelve books long and not finished. Lord Magonim began it in life and has gone on revising it for three centuries, a chapter a month, from what his estates teach him by night. Every empire of Qoul copies it. None of them can agree which version is current.
- id: lore_el_graveyard
  origin: allora1
  kind: lore
  name: The Place of Bones
  icon: 🦴
  text: Far out in the dry hills beyond the estates is a valley where the elephants of Elissar go to die. Nobody taught them to; they simply walk there when they are old, sometimes for days, and the mahouts walk with them. The valley floor is white with bones and ivory, a thousand years deep. The Rephaim cannot go there at all, and do not ask what is there. Ivory-hunters who go there do not, as a rule, come back with ivory.
- id: lore_el_pyre
  origin: allora1
  kind: lore
  name: The Night of the Pyre
  icon: 🔥
  text: On the anniversary of the night she climbed her pyre, Queen Elishat comes down from the Hill of the Thread and walks through her city, and every household in Qartosh sets bread and wine in its threshold-niche and stands in its doorway with a lamp. It is the one night she may enter any house she likes. She enters very few. Fires are lit on the hill, the elephants are walled into their stalls, and the marzeah spills out of the House of the Cup into the streets until dawn.
- id: lore_rb_census
  origin: allora1
  kind: lore
  name: The Dream-Census
  icon: 💤
  text: "Every subject of the Shepherd-King owes the crown three things: tax, labour and dreams. Each dawn, in every ward of every Rabene city, the dream-scribes go door to door with wet clay and take down what each household dreamt before it fades; the tablets are carried to the House of Dreams Received in Assar and filed by ward, by night and by omen. The star-priests read the empire’s sleep as they read the sky. A ward that dreams of floods digs its canals deeper. A province that dreams of a stranger on the throne is quietly garrisoned. Failing to report a dream is an offence; reporting a false one is a worse one; and there is a thriving trade in both."
- id: lore_rb_gardens
  origin: allora1
  kind: lore
  name: The Hanging Gardens of Assar
  icon: 🌴
  text: Above the south quarter of Assar a terrace of glazed brick as wide as a city ward hangs in the air a hundred cubits up, held there by names cut into the tablets of its foundations — the greatest single act of Name-Binding in Raben’s history, made by a Shepherd-King for a homesick queen from the mountains. The gardens grow on its underside. Palms, pomegranates and mountain roses hang root-upward into the brick, their fruit dangling towards the street, watered by rain caught in great nets as it falls past. The gardeners work them upside-down in harness. Beneath, the poor of Assar live in a permanent green twilight, and are pelted in season with dates.
- id: lore_ah_shabti
  origin: allora1
  kind: lore
  name: The Shabti-Doubles
  icon: 🗿
  text: "Every Ahnari of standing has a double: a clay figure in their exact proportions, shaped by a geomancer and inscribed with their name and an answering-spell, which stands up and goes in their place whenever they are called to labour on the dykes, the canals or the Apex’s tombs. The rich have hundreds. The doubles do half the work of Ahnara, in perfect silence, in perfect rows. Lately they have begun to gather in the fields at night, standing in geometric ranks under the stars, and the overseers say — quietly, because nobody wants to say it loudly — that they have chosen a speaker."
- id: lore_ah_hours
  origin: allora1
  kind: lore
  name: The House of Kept Hours
  icon: ⏳
  text: Ahnara’s embalmers learned long ago to keep what the dead leave behind. The guild of the House of Kept Hours learned to keep what the living do. A perfect hour — a wedding-morning, a child’s first word, a cool evening on the river — can be drawn out of the day it happens in, packed in natron, wrapped in linen and sealed in a jar, and opened years later to be lived again, whole, for exactly an hour. The rich of Meret-Ahn keep cellars of them. The poor sell theirs, and remember afterwards only that something good happened once. Thieves steal them, and there is no crime in Ahnara worse than opening someone else’s wedding.
- id: lore_ba_refuge
  origin: allora1
  kind: lore
  name: The Cities of Refuge
  icon: 🛡️
  text: "Six cities of Beth-Arum are cities of refuge. Anyone who has killed by accident may run to one, and while they stay within its walls the avenger of blood may not touch them — and not only by law. Within a refuge city no blade will leave its sheath: swords stick, knives will not draw, arrows will not leave the string. The Voice said so when the cities were founded, and the iron listened. The roads to them are kept broad and are marked at every fork, by law, so that no one running for their life need stop to ask the way. Inside the walls every quarrel is settled bare-handed or with words, and the elders of Kedem are the finest judges of manslaughter in Qoul."
- id: lore_ba_laden
  origin: allora1
  kind: lore
  name: The Laden Goats
  icon: 🐐
  text: Once a year, on the Day of Lading, the people of Beth-Arum confess their wrongs aloud over a goat, and the goat is led out into the wilderness and let go, carrying them. It does not die. The laden goats wander the wilderness south of the hills for years, growing larger and darker with what they carry — black-fleeced, red-eyed, as big as oxen, their horns grown into knots — so that the people who laded them stay as they were. Herds of them graze where nothing else will. Kill one and its burden comes back to whoever is nearest. The Goatwardens, who are mostly old penitents, keep the herds away from the wells and roads, and on quiet nights they listen to what the goats are carrying.
- id: lore_hiyam
  origin: allora1
  kind: lore
  name: Hiyam, the Horse of the Waves
  icon: 🐴
  text: The Ashqeli say the sea is a white horse that has never been broken, and that every ship is a rider it has agreed, for now, to carry. Hiyam is that horse. He has no temple, only a harbour-shrine with a bronze bridle hung on the wall that no one has ever been able to lift, and a tithe-chest into which every captain who comes home pays a tenth. Every captain who does not come home, the priests say, was simply owed. He loves a bargain struck at sea, a new port, and a long voyage; he despises a ship that stays in harbour. Like the kelpie of the north, he will carry anyone; unlike it, he usually brings them back.
- id: lore_niche
  origin: allora1
  kind: lore
  name: The Mother at the Threshold
  icon: 🍞
  text: "Every house in the old west of Qoul has a small niche cut beside its door, and in it, every new moon, bread and wine for the household’s dead. The Mother at the Threshold is the goddess of that niche: of the dead who are remembered and the living who remember them. She asks very little — a crust, a cup, a name said aloud — and she asks it every day. Those who keep her niche are never alone; the dead whose names they say stand quietly behind them, and keep off the dead who have no one. Those who let it go empty are followed home by something hungry. In Elissar her cult is the oldest in the city. The Rephaim, who owe their existence to it, attend her rites very respectfully, and never sit at the front."
- id: lore_qo_khamsin
  origin: allora1
  kind: lore
  name: The Khamsin
  icon: 🌪️
  text: Once or twice a year a hot wind comes out of the Red Land for days on end, full of red sand and, the Ahnari say, the dust of shapes that were never finished. Doors are sealed with clay, the doubles are brought in from the fields, and the embalmers do a great trade in kept hours of cool evenings.
- id: lore_qo_bulls
  origin: allora1
  kind: lore
  name: When the Bulls Stir
  icon: 🐂
  text: Every few years one of the winged bulls of Assar’s gates shifts its weight, or flexes a wing, or turns its head an inch towards the palace. It means a name on one of the bull-tablets has worn, and until the Tablet-House finds and re-cuts it, the bull is half-awake, and the city holds its breath.
- id: lore_qo_bells
  origin: allora1
  kind: lore
  name: The Caravan of a Hundred Bells
  icon: 🐘
  text: "Every second year Queen Elishat sends an embassy round the courts of Qoul: forty elephants hung with bronze bells, mahouts, Readers of the Long Night with gifts of copied scrolls, and a pale lord of the Hundred and Four travelling by night in a closed howdah. It is the most magnificent thing on any road in Qoul, and it can be heard a league away."
- id: lore_grimhawks
  origin: allora1
  kind: lore
  name: The Grim Hawks
  icon: 🦅
  text: "The Grim Hawks are a free company of about three hundred, and they have one rule that every freehold of Gallar knows: a season, never two. They come to a freehold at the start of a season, pitch their grey tents round a hawk-pole outside the walls, stand its guard, hunt its bandits and drill its militia until the farm-lads can hold a line — and at the season’s end, paid or unpaid, they strike camp and march on to the next. Captain Grieve says a company that stays two seasons becomes somebody’s army, and an army becomes somebody’s war. Every Hawk carries a hooded hawk on the march, and the names of the company’s dead are cut into the hawk-pole, which is now taller than any banner in Gallar."
- id: lore_hawkrest
  origin: allora1
  kind: lore
  name: Hawk’s Rest
  icon: 🦅
  text: Every company has to put its old men somewhere. The Grim Hawks put theirs at Hawk’s Rest, a walled farm in the hills below Harrowgate, where retired Hawks keep the company’s depot, breed its hawks, mend its harness, train its recruits, and bury its dead under a row of hawk-poles in the orchard. Recruits who want to join must first spend a season at the Rest. Most of them, the old men say, leave wiser. Some stay.
- id: lore_hawkpole
  origin: allora1
  kind: lore
  name: The Hawk-Pole
  icon: 🪶
  text: "The Grim Hawks plant their standard in the middle of every camp: a pole of ash as thick as a man’s thigh, carved from foot to crown with the names of every Hawk who has fallen in the company’s hundred and twelve years, and topped with the iron perch of the Captain’s own bird. When the pole runs out of room, a new length is pegged onto the top. The Hawks say that the day it becomes too tall to raise, the company will have to stop. They say it cheerfully."
- id: lore_seaseal
  origin: allora1
  kind: lore
  name: The Sea-Seal
  icon: 🐂
  text: "No Rabene ship will carry a foreigner to Qoul without the Sea-Seal: a clay tablet sealed with the winged bull, issued by the Consulate of the Winged Bulls in Tarsena. The Consulate once made petitioners climb its four terraces for months; a new Sealbearer swept that away. Now the clerks want only proof that you can make a living in Qoul, eight skills at level 45, and the fee for the clay. The empty terraces are still there. Some petitioners live on them out of habit."
- id: lore_crossing_qoul
  origin: allora1
  kind: lore
  name: Six Days on the Southern Sea
  icon: ⛵
  text: "The voyage between Tarsena and Port Abzu takes six days: round-bellied Rabene ships with star-priests at the stern, reading the course from the sky each night. Storms, calms, pirates and the children of Laishma all keep the passengers busy. The fare is five hundred pounds of silver each way, and every passenger must show the Sea-Seal at both ends. From Dilmun in the Sealands, Sealands galleys also run east to Plandor in four days, for those who carry Thoolma’s papers too."
- id: lore_hetet
  origin: allora1
  kind: lore
  name: Hetet, Who Is Exact
  icon: 📐
  text: "Hetet has no face because a face is not a perfect shape. The Ahnari say their god is a solid so true that the world bends slightly around it: a point that became a line that became a plane that became the first solid, and stopped. Everything true in Ahnara — a right angle, a level floor, a fair balance, a straight canal — is a little of Hetet. Everything crooked is merely unfinished."
- id: lore_voice
  origin: allora1
  kind: lore
  name: The Voice in the Tent
  icon: ⛺
  text: The god of Beth-Arum has no name, no image and no altar except an empty Tent that wanders by itself across the hills. Inside it there is nothing at all, and from the nothing a Voice speaks. Each season the Voice gives the covenant one Word — a command for the season — and those who keep the Word are kept in turn. The Twelve Judges follow the Tent with their courts. The prophets carry what it says on their skin.
- id: lore_pl_wards
  origin: allora1
  kind: lore
  name: The Wards of Plandor
  icon: 🏛️
  text: Plandor is not one city but four hundred wards, each a dome or a cluster of domes with its own water, its own climate, its own bakers and its own clock. The clocks disagree by a few minutes, so tradesmen carry two watches and contracts say which ward’s time they mean. A citizen is born “of” a ward and is buried from it; ward loyalties decide marriages, guild places and riots. Skyways — arched bridges carrying whole streets — join the domes, and under them run the canals. Under the domes it never rains, so umbrellas are carried indoors as parasols against the glare of the gold.
- id: lore_pl_winding
  origin: allora1
  kind: lore
  name: The Winding
  icon: 🗝️
  text: Each dawn the Keeper of the Key enters the Winding Chamber of the Palace of Faces alone, and turns a golden Key in the back of the Emperor’s casing until the Emperor is wound for another day. No one else has ever seen it done. Bells ring across Plandor when the Keeper comes out, and the whole city, in four hundred wards on four hundred slightly different clocks, starts its day. The Emperor has been wound every morning for two hundred and eleven years. Whether there is a man inside the casing is the most dangerous question in the world. There are four answers to it in Plandor, and which one you give tells people which side you are on.
- id: lore_pl_faces
  origin: allora1
  kind: lore
  name: The Palace of Faces
  icon: 🎭
  text: "Every wall of the Emperor’s palace is set with masks: one for every Sovereign of the Key, one for every minister who ever served, and one for every citizen who ever petitioned the Emperor and was answered. There are three hundred thousand of them. Behind the mirrors of the state rooms lies the Reverse Court, a palace inside the palace where servants are born, live and die without ever entering a room the court can see. They hear everything. The Palace says it has no Reverse Court. The Reverse Court says the same about the Palace."
- id: lore_pl_varndum
  origin: allora1
  kind: lore
  name: The Varndum Guard
  icon: 🤖
  text: "A thousand battle-golems of bronze and crystal stand in the Varndum Yards in ranks of fifty, and march only to the Emperor’s own beat: they keep time with his mechanism, and would stop dead if it ever did. No army in the East has ever stood against them. The Winders’ Guild tends them; the Warrant Archive holds the sealed orders inside each one. There are a thousand golems and a thousand and one warrants. The extra warrant names a golem that is not in the ranks, and the Guild does not discuss it."
- id: lore_pl_bowl
  origin: allora1
  kind: lore
  name: The Bowl and its Factions
  icon: 🏟️
  text: "Plandor’s racing arena holds two hundred thousand people, and four factions race chariots in it: Cinnabar, Verdigris, Lapis and Orpiment. The factions organise guilds, charities, fire-watches and riots, and vote, through their members, in every Ministry; colours are worn, not spoken. Each faction is quietly sworn to one of the Four Corners, which everyone knows and nobody says. The Emperor’s box above the finishing line is always empty, and races are always run to it."
- id: lore_pl_ministries
  origin: allora1
  kind: lore
  name: The Nine Ministries
  icon: 📜
  text: "There are nine ways to address the Emperor, and each belongs to a Ministry: Petitions, the Treasury, the Southern Lease, Magnates, Notices, the Wards, the Sea, Faces and the Key. A petition must be written in the right form for the right Ministry, or it is returned unread with a note explaining which form it should have been in, written in that form. The Ministries are staffed by eunuch-ministers, who cannot found dynasties and so are trusted with everything. They are the empire. The Emperor is its conscience; the Ministries are its hands."
- id: lore_pl_purple
  origin: allora1
  kind: lore
  name: The Purple Law
  icon: 🟣
  text: True imperial purple is dyed from a coral that grows only in the Crescent Bay, and by law it may be worn only by the Sovereign of the Key, his ministers, and princes. Selling it to anyone else is a crime. Shades near purple need a licence from the Mint of Colour, whose judge of shades rules on mauve, lilac and violet. The purple dolphins of the bay drive fish only towards boats flying a purple pennant, which makes the Purple Law a fishing law too. Nobody taught them.
- id: lore_pl_cisterns
  origin: allora1
  kind: lore
  name: The Cistern Canals
  icon: 🛶
  text: Beneath Plandor lie halls of stone columns older than the city, drowned to the capitals, which carry its canals from ward to ward. Ferries cross them by lamplight, and blind fishermen on the steps catch pale fish that have never seen the sun. The cisterns were here when Thoolma’s founders came out of the south; nobody knows who built them, and the Ministry of Notices keeps the answer, if it has one, in the Archive. Gondoliers are forbidden to sing on the canals, by a law nobody remembers the reason for, so they all hum the same tune.
- id: lore_pl_faceless
  origin: allora1
  kind: lore
  name: The Faceless Controversy
  icon: 🖼️
  text: The Exemplar has no face, because a perfect Pattern needs none. The Emperor is its living Copy. May the Copy be shown with a face? The Copyists say yes, and paint the Emperor on every icon. The Faceless say no, and paint the faces out, by night, in chapels across the city. It has been going on for ninety years. Nobody has ever been punished for it, because punishing the Faceless would mean admitting the question was serious.
- id: lore_pl_crabs
  origin: allora1
  kind: lore
  name: The Crab-Teams
  icon: 🦀
  text: Sledge-crabs are the size of carts, slow, patient and enormously strong, and the poor of the Crescent Bay harness them in teams of four to drag cargo barges along the shallow sea floor from the harbour to the reefs. Every spring the crabs moult, and the empty shells are rented as one-room cottages to families who cannot afford a ward. Crab-racing on the strand at low tide is the only sport in Plandor the factions have never managed to take over.
- id: lore_pl_garden
  origin: allora1
  kind: lore
  name: The Garden of Enclosed Climates
  icon: 🌿
  text: "A ring of glass domes on the eastern hill holds a sample of every climate of the Raizon: mist, rain, gold-river heat and the cold of the black river. The Garden is where Plandor learns what grows in the jungle it means to own. One dome, the Hum Dome, is closed: the plants inside grew too well, and something in the soil made the gardeners’ watches run backwards. It is still lit at night."
- id: lore_pl_roundcourts
  origin: allora1
  kind: lore
  name: The Round Courts
  icon: ⭕
  text: A corner is where two walls meet and something can get in; that is why rooms in the East are built round. The four powers that come in at corners — the Hinge, the Kiln, the Maw and the Unreckoned — are not worshipped in Thoolma, exactly. They are taxed. Their shrines stand in four round courts outside the chapel walls, licensed by the Ministry of Notices, and the people who visit them pay a fee at the gate and do not talk about it. Square rooms are cheap housing, and the poor hang charms in their corners.
- id: lore_pl_columbarium
  origin: allora1
  kind: lore
  name: The Columbarium Skyway
  icon: 🕯️
  text: "Plandor has no room to bury its dead, so it shelves them: a skyway between two hills is lined on both sides with niches, ward by ward, and the dead are laid there in sealed urns behind little doors. A Keeper’s Lantern burns at each end and is never allowed to go out. It is cool, quiet and nobody there repeats anything, which is why it is also the city’s favourite place for a first meeting."
- id: lore_pl_exemplar
  origin: allora1
  kind: lore
  name: The Exemplar
  icon: ⭕
  text: "Thoolma’s state faith worships the Exemplar: the one perfect Pattern of which everything in the world is an imperfect copy. It has no image, no name and no voice. Its chapels are perfect circles under gold domes, because a circle has no corner for anything else to come in by, and its clergy are called Copyists, because their work is to make better copies — of buildings, icons, laws and themselves. The Emperor is the Exemplar’s living Copy, the one thing in Thoolma supposed to be exactly what it should be."
- id: lore_pl_petitions
  origin: allora1
  kind: lore
  name: Petitioning the Emperor
  icon: 📨
  text: Any citizen of Thoolma, and any foreigner with a permit, may petition the Emperor. The petition is handed in at the Gate of Petitions in the right one of nine forms of address, read by the Ministry of Petitions, and — if it is answered — the petitioner’s face is cast in a mask and set in the walls of the Palace of Faces. To be “Answered” is the nearest thing to nobility a commoner can earn. Most petitions are about drains.
- id: lore_pl_walls
  origin: allora1
  kind: lore
  name: The Triple Walls
  icon: 🧱
  text: Plandor’s land side is closed by three walls, each higher than the one before, with a moat between the first two and a road between the second and third along which the golems can march to any threatened gate. The walls have never been breached. They have rarely been attacked; it is hard to besiege a city whose garrison is a thousand bronze soldiers that do not sleep. The Land Gate opens on Therama and the hill-roads east.
- id: lore_pl_ice
  origin: allora1
  kind: lore
  name: Ice in a Hot City
  icon: 🧊
  text: Every barge of ice in Plandor comes up the coast from the Negarro, a black river far to the south whose water is cold as winter in the hottest heat. It is packed in sawdust and sealed cellars and sold by weight. The rich eat sherbet every day; the middling eat it on feast days; the poor suck the shavings off the cellar floors. An ice-merchant is a rich man and a thief, in that order.
- id: lore_th_hives
  origin: allora1
  kind: lore
  name: The Hive-Hills
  icon: ⛰️
  text: "Therama’s hills are soft volcanic stone that cuts like cheese and hardens in the air, so Theramans live inside them. A hive-hill is a whole town in one hollowed cone: rooms cut in spirals up the inside, fields on top, dovecotes in the cliff-face and granaries in the roots. Addresses name rooms, not streets — “the third room left of the Old Oven” — and every hive keeps one room sealed for the guest who has not arrived yet. Opening it is the worst luck there is."
- id: lore_th_golems
  origin: allora1
  kind: lore
  name: Field-Golems
  icon: 🤖
  text: "Therama’s farms are worked by field-golems: slow iron labourers that plough, reap and carry, leased from the Lease Hall at Vel Ossira by the season. A family that loses its golem’s lease loses its farm, and the Lease Hall knows it. When a golem’s lease ends for good, Theramans give it a name, if it did not have one, and a funeral, and the Lease Hall takes it back to the foundry to be melted. Nobody in Therama thinks this is strange."
- id: lore_th_arch
  origin: allora1
  kind: lore
  name: The Thirsty Arch
  icon: 🌉
  text: Plandor drinks Therama’s water. The great aqueduct called the Thirsty Arch carries it forty miles from the springs above Doroskene to the domes of the city, on arches up to two hundred feet high. Its keepers walk the channel every day and know every crack in it. In a dry year the Arch takes everything, and Doroskene drinks the dregs; Theramans say the city would drink the hills themselves if the pipes were wide enough.
- id: lore_th_edge
  origin: allora1
  kind: lore
  name: The Edge of the Trees
  icon: 🌳
  text: "One mile south of Therama’s last terrace the grass stops, and a wall of trees three hundred feet tall begins as if drawn with a ruler: the Raizon. Nobody has ever explained the line. At its edge, in a hut on stilts, a Thoolman clerk has sat for a hundred and forty years — four clerks, father to son — recording each day exactly where one sloth-like giant in the canopy above has moved to. The Ministry of Magnates calls it the Ombudsman, and it has moved a little under fourteen miles."
- id: lore_sy_crystal
  origin: allora1
  kind: lore
  name: Seylon Crystal
  icon: 🔮
  text: Seylon’s mountains are veined with a crystal that hums faintly in the hand and stores enchantment better than any stone. Scholars argue over where it comes from; Seylonese lore says it is the Hum of the far south running north under the earth and freezing into stone where the mountains are cold. Either way it is the reason Thoolma keeps Seylon. It sings when carried south into the jungle, and cracks if carried too far.
- id: lore_sy_cords
  origin: allora1
  kind: lore
  name: The Cord-Readers
  icon: 🪢
  text: "Seylon keeps its records on knotted cords, not paper: each knot, its place, its colour and the way it is tied are a word. Every valley has a Cord-Reader who ties its births, deaths, harvests and debts, and who remembers every cord she has ever tied. A Cord-Reader can feel a false knot with her eyes shut. Thoolma’s Ministries have adopted the cords for their own accounts — and sometimes, when a valley’s taxes are due, the Cord-Readers misremember."
- id: lore_sy_dorums
  origin: allora1
  kind: lore
  name: The Dorums and Kalazt
  icon: 🃏
  text: A Dorum is a round gambling-hall cut into the rock, with one lamp and no corners, and in every one of them Kalazt is played. The deck has four suits — Hinges, Kilns, Maws and Knots, one for each Corner — and a fifth suit of Rounds, which beat everything and can only be played by someone who has bet all they own. The cards are backed with thin crystal; a good player can feel a card’s hum change when its holder is bluffing. Kalazt debts can be inherited. Some families have owed the same Dorum for six generations, and visit it on holidays.
- id: lore_sy_lapidary
  origin: allora1
  kind: lore
  name: The Three Houses
  icon: 💠
  text: "Seylon crystal is cut in three Houses in Khaderun: the House of the Clear Cut, the House of the Veiled Cut and the House of the Deep Cut. A crystal’s cut decides what it can hold, and each House teaches only its own cuts, to its own apprentices, under oath. Learning everything means joining — or leaving — all three. The Houses have not spoken to each other officially for two hundred years. Their apprentices play Kalazt together every night."
- id: lore_sy_lamp
  origin: allora1
  kind: lore
  name: The Lamp in the Stone
  icon: 🕯️
  text: Seylon’s old faith says a light burns inside the crystal mountains, deep down where no miner has ever reached, and that the hum in the crystal is its warmth. The monks of the Lamp keep vigil in the dark under their monastery every night. Thoolma declared the Lamp a Lesser Copy of the Exemplar two centuries ago, and the monks accepted this graciously, in public, and have been laughing about it in the Dorums ever since.
- id: lore_sy_apricots
  origin: allora1
  kind: lore
  name: The Apricot Day
  icon: 🍑
  text: "The King of Seylon has one power nobody disputes: he names the day the apricot harvest begins. On the morning he chooses, every bell in the kingdom rings, and every family in every terraced valley goes out to pick. The Resident of the Key has never once tried to sign after him. It would not occur to anyone in Seylon to let a Thoolman decide when an apricot is ripe."
- id: lore_hum
  origin: allora1
  kind: lore
  name: The Hum
  icon: 〰️
  text: "South of Therama, under the Raizon, there is a sound below hearing that you feel in your teeth and in anything made. Northerners call it the Hum. It is not an illness, not a curse, and not alive as far as anyone can prove; it simply bends what it touches. In the northern kingdoms it is only a Murmur: clocks drift by minutes a day, crystals glow at night, and spells cost a little more. Further south it deepens into the Drone, where clockwork runs backwards and crystal sings aloud, and in the Southern Reach into the Choir, where machines stop altogether. Hum-Reading — learned on the Tables of Topila, from the Frizata, and at the Stipend Stone — lets you feel its depth and suffer it less. Theories of the Hum are current in every roast-house in Plandor, and no two agree."
- id: lore_gr_bells
  origin: allora1
  kind: lore
  name: The Bells of Gramanna
  icon: 🔔
  text: "In Gramanna everything wears a bell: boats, doors, dancers, goats and the dead. Bells warn — of shoals, of a Magnate surfacing, of a fever in the house — and a Gramannan who hears an unfamiliar bell stops what they are doing until they have placed it. Every baby is given a bell at birth, and its note is that person’s signature for life: contracts are rung, not signed, and a forger needs a perfect ear. Cooks measure time in bell-strokes, so Gramannan recipes are written as songs."
- id: lore_gr_seam
  origin: allora1
  kind: lore
  name: The Bride’s Train
  icon: 🌊
  text: "At Campanara the black, ice-cold Negarro and the gold, blood-warm Lumbre meet and run side by side for nine miles without mixing, so that a boat on the seam has one hull in winter and one in summer. Gramannans call the two-coloured water the Bride’s Train, and marry in boats along it. Half the city floats: houses on rafts tied to houses on stilts, gardens on rafts tied to the houses. In a flood the gardens drift, and by law a garden belongs to whoever it fetches up against."
- id: lore_gr_pilots
  origin: allora1
  kind: lore
  name: The Pilots’ Lodge
  icon: ⚓
  text: "Gramanna’s river-pilots navigate the Raizon by sound. A sounding-bell lowered on a line rings one way over sand, another over rock, and a third, very quietly, over something asleep. A pilot’s whole training is learning those notes, and the best can tell a sleeping caiman from a sleeping Magnate a mile off. Thoolma’s southern fleet cannot move without a Gramannan pilot aboard, and the Lodge knows exactly what that is worth: when Gramanna wants a better treaty, the fleet sails a little slower. Gramanna’s queen is elected for life from the Lodge."
- id: lore_gr_stroke
  origin: allora1
  kind: lore
  name: The Guild of the Clean Stroke
  icon: ⚔️
  text: Gramanna’s executioners are orphans taken by the Guild, trained for nine years and forbidden mercy. They serve courts across the empire by treaty, which is part of Gramanna’s tribute to Thoolma. After every sentence the headsman rings one bell for the Mother of Bells. The Guild keeps the Book of Last Words, the only full record of what the condemned said, and journeymen wear ash-grey and masters the colour of wet slate. Its founding scandal, and its founding saint, is a journeyman who once spared a woman. The Guild has never said who she was.
- id: lore_gr_negarro
  origin: allora1
  kind: lore
  name: Old Negarro, the Black River
  icon: 🖤
  text: The Negarro runs north from the Southern Reach to the Crescent Bay, tar-black and ice-cold in the hottest heat, and smelling of snow. Nobody has found where its cold comes from. Gramannans cut ice from it in midsummer, freeze fruit and fish in ice-houses on its banks, and barge ice up the coast to Plandor’s sherbet-houses. It kills with frost-lock — limbs numb in minutes — with black ice that grows on a hull overnight, and with glacier caimans. Of the Five Rivers it is the most respected and the least trusted, and every Gramannan pilot salutes it, every morning, by name.
- id: lore_gr_lumbre
  origin: allora1
  kind: lore
  name: The Lumbre, the Gold River
  icon: 💛
  text: "The Lumbre glows faint gold at night and runs as warm as blood, and everything along it grows too fast: three harvests a year, fruit the size of a child’s head in a week, fish grown in a month. Strangler-blooms cover a hut overnight; wounds heal shut over thorns; and people who live on its banks age, the Gramannans say, a little faster than anyone else. They also say it is worth it."
- id: lore_gr_mother
  origin: allora1
  kind: lore
  name: The Mother of Bells
  icon: 🔔
  text: The Mother of Bells is Gramanna’s goddess of warning, of soundings and of the passage of the dead. Every bell is her voice. She does not save anyone; she tells them in time. Her temple at Campanara is a tower of nine hundred bells, one for each family of the city, and her priests, the Ringers, ring the warnings of the river, the hours of the day and the passing of each soul, which they say she walks with as far as the seam.
- id: lore_tp_tables
  origin: allora1
  kind: lore
  name: The Tables
  icon: 🏔️
  text: Topila’s table mountains rise sheer out of the jungle into cloud. The jungle below them is the Floor; the flat tops are the Tables; and between the Tables run ropes hung with poem-banners — strips of cloth inscribed with verses that the wind is said to recite. Letters cross between the Tables by kite. On the highest of them, the dawn mist freezes into rime-flowers that melt by breakfast, and picking one is a proposal of marriage.
- id: lore_tp_schools
  origin: allora1
  kind: lore
  name: The Five Schools of Poetry
  icon: 📜
  text: Topilan learning happens in roast-houses over cups of bitter black chorro. A teacher holds a table, students pay by the cup, and a school is nothing more than the room where a teacher sits; the great ones have kept the same chairs for three hundred years. There are five schools of poetry, bitter rivals all. The Single Line writes one line in a lifetime, revised daily until death. The Choir writes for forty voices that can only be understood all at once. The Burning Hand burns its poems into wood with a sun-lens, so every word costs heat and time. The Misremembering writes only from things remembered wrongly, because error is where the truth leaks through — and its archive holds the only honest history of the vanished Anquerrans. The Unwritten speaks its poems once and never repeats them; its members are the best-paid spies in the East. A poet who loses a contest sweeps the winner’s roast-house for a month.
- id: lore_tp_sun
  origin: allora1
  kind: lore
  name: Sun-Smithing
  icon: ☀️
  text: "On each Table stands a mirror-array: hundreds of polished bronze mirrors on frames, turned by hand to focus the sun onto one point hot enough to smelt metal and fuse glass. The Sun-Smiths work only at noon, when the light stands straight, and their blades are tempered by it. Topilan sun-glass is clearer than anything the furnaces of Marre can make, and Thoolma buys every pane."
- id: lore_tp_iru
  origin: allora1
  kind: lore
  name: Iru, the Listening Sun
  icon: ☀️
  text: Topila worships the sun as the one perfect reader. Poems are left out on the Tables for Iru to read, weighted with stones; and a poem the sun bleaches blank has been accepted. The Readers of Iru keep an altar of white stone on the Rime Table, where the light is strongest, and a library of blank pages, every one of them an accepted poem.
- id: lore_tp_chorro
  origin: allora1
  kind: lore
  name: Chorro
  icon: ☕
  text: "Chorro is a bitter black drink brewed from the roasted beans of a jungle shrub that grows on the Floor at the foot of the Tables. Every school in Topila runs on it, and students pay their teachers by the cup. The beans are graded by poets, not merchants: a sack is sold with a verse describing its taste, and a bad verse can ruin a harvest."
- id: lore_mg_heron
  origin: allora1
  kind: lore
  name: The Lantern Heron
  icon: 🪶
  text: The Lantern Heron is a wading bird three hundred feet tall that stalks the Five Rivers, and holds the rank of Grand Admiral in Plandor. When it fishes, a whole stretch of river goes silent. Its eyes are said to be crystal, because they shine at night. Gramannan pilots ring a particular bell when it is near — three short strokes and one long — and every boat on the river ships oars and waits.
- id: lore_mg_undertow
  origin: allora1
  kind: lore
  name: The Undertow
  icon: 🐊
  text: Somewhere under the Negarro sleeps the Magnate called the Undertow, the father of the glacier caimans. It holds no rank in Plandor and is unwelcome at court. The Negarro’s black ice, the Gramannans say, is its breath, and the river’s cold is its sleep. No pilot has ever sounded it. Several have heard it.
- id: lore_hum_drone
  origin: allora1
  kind: lore
  name: The Drone
  icon: 〰️
  text: "South of Gramanna and Topila the Hum deepens into the Drone. Clockwork runs backwards in the small hours, golems forget their orders, crystal sings aloud and most spells slip into one of the four Corners. This is why Thoolma has never conquered the south: its golems, clocks and crystals all fail here, and it must rule through people instead — tribes, monks and mercenaries, paid at the Stipend Stone. In the Drone, Horology is learned at less than half the speed, Gem-Cutting a third slower, and every Magic skill a quarter slower, and every danger is a little more dangerous. Hum-Reading softens all of it."
- id: lore_hum_choir
  origin: allora1
  kind: lore
  name: The Choir
  icon: 〰️
  text: "In the Southern Reach the Hum becomes the Choir. Machines stop. Crystal cracks. Time keeps its own count. Only the Frizata’s plant-craft and the old arts of the corners work reliably, and only someone who can read the Hum can walk there at all: without Hum-Reading 40 the Choir simply turns you round, and you find yourself walking north again. Every danger in the Reach is a quarter worse, less what your Hum-Reading spares you."
- id: lore_st_stipend
  origin: allora1
  kind: lore
  name: The Stipend Stone
  icon: 🧂
  text: "At the edge of the Drone stands a flat grey stone the size of a threshing-floor, and every spring Thoolma’s officers lay out the Stipend on it: salt, steel and Seylon crystal, in heaps counted to the grain. The tribes who come to take it hold the frontier for the empire for a year. Taking the Stipend is the southern way of being owned. Not coming is the southern way of saying no, and the officers write that down too."
- id: lore_st_greza
  origin: allora1
  kind: lore
  name: The Folded People
  icon: 🤫
  text: The Greza live in the mist gorges of the white Teira, in villages that hang in the canopy inside cocoons of silk and are folded shut by day. Outsiders walk beneath them and never look up. Nobody speaks above a whisper inside a folded village; laughter is a hand sign. Greza silk-moths feed on the Teira’s banks and the river spins their raw thread, so that Greza silk is the finest in Allora — and Thoolma’s purple is dyed onto it.
- id: lore_st_velatores
  origin: allora1
  kind: lore
  name: The Velatores
  icon: 🧵
  text: "The Velatores — “the Veiled” — are Greza’s mercenary shadow-warriors. A novice is a Filum, a thread; a sworn one is a Velator; a master is a Nodarius, a master of the knot. They work with silk cord and Teira thread, and take contracts only on Greza silk: the contract is woven into the Velator’s cloak, and is not unpicked until it is fulfilled. Plandor’s racing factions are their best customers. They are contractors, not vassals, and owe Thoolma nothing between jobs."
- id: lore_st_dapilla
  origin: allora1
  kind: lore
  name: The Orchard Kingdom
  icon: 🍐
  text: Dapillans believe only children dream truly. A king is chosen by dream at seven and reigns until their first dream they cannot tell from waking, usually around thirteen; then they become an Elder of Yesterday, who may not give advice unless a child asks for it first. Thoolman law voids any contract signed by a minor, so a Dapillan king can sign no treaty, swear no fealty and take no Stipend. Dapilla is the only free realm within reach of the golems, protected by a technicality, and Plandor’s lawyers have spent a century looking for a way round it. Adults ask a child’s permission to cross an orchard. The children are allowed to say no.
- id: lore_st_kilopa
  origin: allora1
  kind: lore
  name: The Climbers
  icon: 🐢
  text: "The Kilopa build their villages on the shells, spines and shoulders of the slowest Magnates and travel with them, a mile a year. Their births are timed by the Magnate’s stride — a child is born on the left foot or on the right, and it matters for life — and they get ground-sick on flat, still earth. They make the steadiest archers in the East, with longbows strung with Magnate sinew, and they watch the sun: it is yellowing, they say, a shade a century, and when it is fully yellow the Magnates will lie down and the Raizon will become an ordinary forest."
- id: lore_st_gualdara
  origin: allora1
  kind: lore
  name: The River Nomads
  icon: 🔪
  text: The Gualdara follow the fish of the Ayermar, the River of Yesterday, and never camp twice in the same clearing. They count distance in sleeps, and it is rude to ask one where they are going; you ask where they slept last. Every Gualdara carries a machete from birth to burial, and wherever they camp they cut a perfect square clearing, its four corners exactly true. A square is the only shape with all four Corners, and it is the door that summoning uses. Some squares are a mile across. Gualdara say they are written for the Magnates to read.
- id: lore_st_frizata
  origin: allora1
  kind: lore
  name: The Frizata
  icon: 🌱
  text: "The Frizata are monks drawn from every tribe, who give up their tribe at the gate. Their monasteries line the singing Ondoro, and they are the greatest herbalists and healers in Allora: the fever-bark Marre’s Lazaretto buys is theirs. Every monastery has four doors, one for each Corner, and opens one per season. The Frizata do not love the Four; they keep them fed, the way you keep a fire banked. Novices learn to tell the Corners apart by smell: hot brass, wet bread, ripe fruit, and rain on dust. Monks may own nothing with corners, so their books are round scrolls in round cases."
- id: lore_st_rivers
  origin: allora1
  kind: lore
  name: The Southern Rivers
  icon: 🌊
  text: "Three of the five rivers run through the tribes’ country. The Teira is milk-white and faintly sticky, and if you stir it it spins threads; its rapids hold thread-snares that bind a swimmer like a fly. The Ayermar is still as glass and reflects yesterday’s sky, not today’s; drinkers lose a day and live it twice, and the reflections of the drowned stay a day and call out. The Ondoro is clear and blue, and along its banks the Hum becomes audible: it is the only river that runs south, into the Reach and down the Throat, and no boat can row back up it."
- id: lore_st_kinsman
  origin: allora1
  kind: lore
  name: The Kinsman
  icon: 🌑
  text: The Kinsman is a jungle scavenger, long and low and grey, that digs up graves, and afterwards calls at dusk in the voices of the dead it has eaten. It does not mean anything by it, the Frizata say; it has simply learned that a dead man’s voice brings the living out of their houses. This is why the southern tribes bury their dead in the rivers, and why nobody in the south answers a voice they recognise after dark.
- id: lore_rc_oruvande
  origin: allora1
  kind: lore
  name: Oruvande, the Counting City
  icon: 🗝️
  text: Anquerra’s capital is a terrace-city of grey stone and counting-houses, perfectly tidy, perfectly empty. Every door has a key hanging on a nail beside it and a notice of vacancy above it. The counting-houses still hold seven hundred years of rent ledgers, paid to the day — and every year the ledgers get a new entry in fresh ink. Nobody has seen who writes them. The fireflies blink in Anquerran numerals, and Holdover children learn to count from them. Every doorstep is worn smooth in exactly the same spot, a little to the left, where seven hundred years of tenants stopped to find their keys.
- id: lore_rc_stair
  origin: allora1
  kind: lore
  name: The Stair of Seven Hundred
  icon: 🪜
  text: "North of Oruvande a stair-road climbs out of the jungle in seven hundred steps, one cut for each year of the Lease, each carved with the year’s rent. The last step is uncut. People who sit on it say they see the walking-out: a whole people closing their doors and going north, quietly, on schedule, with nobody chasing them."
- id: lore_rc_gate
  origin: allora1
  kind: lore
  name: The Last Gate
  icon: 🚪
  text: Beyond the Stair stands a gate in a wall that encloses nothing but jungle. Its lock is empty, and its keyhole is the shape of a key that is turned every dawn in Plandor. No Thoolman expedition has ever got this far. What is behind it is the same jungle as what is in front of it, as far as anyone can see.
- id: lore_rc_throat
  origin: allora1
  kind: lore
  name: The Throat
  icon: 🕳️
  text: The singing Ondoro ends in a sinkhole called the Throat, and pours into the earth with a sound you hear with your whole body. The Hum is loudest here; some say it begins here. On the rim the Gleaners camp, and below it, past the last monastery, the Hermits of the Last Door went down to live. They do not come back, but their herb-bundles sometimes float up the Ondoro against the current.
- id: lore_rc_grazing
  origin: allora1
  kind: lore
  name: The Grazing
  icon: ⛰️
  text: In the far south of the Reach the jungle opens onto ground where the largest Magnates feed. From the rim you can watch hills walk. The young ones — the Grandchildren, only as big as a house — graze at the edges, and a very good climber with a great deal of patience can sometimes persuade one to follow them home. It will outgrow every stable you own.
- id: lore_magnates
  origin: allora1
  kind: lore
  name: The Magnates
  icon: 🐢
  text: The Raizon’s giants are called Magnates in Plandor, because the Ministry of Magnates gives each named one a court rank and a stipend of offerings, as if they were nobles who had not yet been introduced. Jungle people call them all “Grandmother”, whatever their sex. Nobody has ever killed one. Old Corolla is a Duchess, a tortoise-shaped Magnate with a wooded hill for a shell and a Kilopa village of six hundred on her back. The Lantern Heron is Grand Admiral, a wading bird three hundred feet tall whose eyes are said to be crystal; when it fishes, a whole stretch of river goes silent. The Abbess, an honorary abbess, is a moth with wings the size of a valley, whose dust gives visions. The Ombudsman, a minister without portfolio, is the canopy-sloth whose clerk sits at the Edge of the Trees. And the Undertow, unranked and unwelcome at court, sleeps under the Negarro, the father of the glacier caimans, breathing black ice.
- id: lore_mag_heron
  origin: allora1
  kind: lore
  name: The Lantern Heron
  icon: 🪶
  text: The Grand Admiral of the Raizon stalks the five rivers on legs like towers, three hundred feet tall, and when it fishes a whole stretch of river goes silent for a day. Its eyes are said to be crystal, and the Lapidary Houses would give a great deal to know whether that is true. Gramannan pilots ring a particular bell when they see its legs, and every boat on the river ties up until it has passed.
- id: lore_mag_abbess
  origin: allora1
  kind: lore
  name: The Abbess
  icon: 🦋
  text: The Abbess is a moth with wings the size of a valley, who rests by day folded over a gorge of the Teira like a second sky. Its wing-dust, which falls like snow when it flies, gives visions to anyone who breathes it; the Frizata collect it for their dying, and the worshippers of Vespiro, the Unreckoned, prize it above crystal. The Ministry of Magnates made it an honorary abbess two hundred years ago, and the Frizata have never forgiven the joke.
- id: lore_mag_undertow
  origin: allora1
  kind: lore
  name: The Undertow
  icon: 🧊
  text: Something sleeps under the Negarro, and the black ice that grows on hulls overnight is said to be its breath. Gramannans call it the Undertow and do not ring bells over it. It is the father of the glacier caimans; it holds no rank in Plandor, because the one time the Ministry of Magnates sent a clerk to present it with a patent of nobility, the clerk came back with frost-lock in both hands and would not say what he had seen.
- id: lore_kw_1
  origin: allora1
  kind: lore
  name: "Vision: The Wrong History"
  icon: 🗝️
  text: "In the Misremembering School’s archive, among poems written wrong on purpose, you find the same mistake made eleven times by eleven poets in three centuries: that Anquerra did not fall but left, on a date, in good order, and that one key went north with it. Error, the School says, is where the truth leaks through. Reading it, for a moment, you see a man in a Steward’s grey walking out of the trees with something heavy on a cord round his neck."
- id: lore_kw_2
  origin: allora1
  kind: lore
  name: "Vision: The Ink Is Still Wet"
  icon: 🖋️
  text: "You read this year’s entry in the rent-ledger at Oruvande. The ink is wet. The rent is paid in full. The tenant is not named, and the hand is the same as last year’s, and the year before, back to the walking-out. You sit with the ledger until dawn and see nobody, and when you look again the ink is dry and there is a second line you did not see written: “Noted: a visitor.”"
- id: lore_kw_3
  origin: allora1
  kind: lore
  name: "Vision: The Seven Hundredth Step"
  icon: ⬜
  text: "On the uncut step you see it: a whole people closing their doors and hanging up their keys, going north in good order, a Steward at the back with a key on a cord. He stops on the seven hundredth step, which in the vision is already cut, and looks back at the city as if checking that everything is tidy. Then he looks at you, and nods, as one tenant to another, and walks on."
- id: lore_kw_4
  origin: allora1
  kind: lore
  name: "Vision: The Key in the Emperor’s Back"
  icon: 🦁
  text: From the gallery of the Hall of Lions, at dawn, you watch the Keeper of the Key go into the Winding Chamber, and hear a key turn, eleven times. For a moment the shape of it is the shape of a keyhole you have seen, a thousand miles south, in a gate in a wall around nothing. The Emperor’s golden hand lifts. The lions roar. Nobody else in the Hall seems to have noticed anything at all.
- id: lore_kw_5
  origin: allora1
  kind: lore
  name: "Vision: The Tenancy in Waiting"
  icon: 🚪
  text: You stand at the Last Gate with your hand on the empty lock. The Choir is very loud and then, for the space of one breath, perfectly silent, and you understand — not in words — that there was an offer once, and a term, and that the term is not yet up for anyone, and that the stair is not finished. Then the Hum comes back. Nothing has changed. The Gate is closed. The Key is in Plandor, turning in a golden Emperor’s back each dawn. You have seen what the Keyward Houses see, and you know exactly as much as they do, which is not enough.
- id: lore_answered
  origin: allora1
  kind: lore
  name: The Answered
  icon: 🎭
  text: Three hundred thousand masks hang in the Gallery of Faces, one for every petitioner the Emperor has ever answered in person. You are one of them now. Your mask was cast by the mask-makers of the Gallery from your own face, hung in its niche, and you were carried home through the wards on the shoulders of strangers. It is a personal honour and a title, “Answered”, and nothing in the empire has changed because of it — except that in Plandor, from now on, people bow to you in the third form, which is for those the Emperor has seen.
- id: lore_tp_verse
  origin: allora1
  kind: lore
  name: The Burned Verse
  icon: 📜
  text: The Burning Hand is the Topilan school that burns its poems into shell-wood with a sun-lens, so that every word costs heat and time and nobody writes carelessly. Three centuries ago one of its masters burned a verse about a steady hand into the handle of her own lens, and found her hand steadier. The school has been arguing ever since about whether that was poetry or magic. In the meantime its Verse-Wrights burn verses into blades, cloaks, boots, rings and instruments for anyone who can pay, and every thing they burn becomes, a little, what its verse says it is. A verse must be burned by daylight — Iru reads it as it is written — or, on the Lantern Reach of the Lumbre, by the river’s own gold glow at night.
- id: lore_tp_ashtable
  origin: allora1
  kind: lore
  name: The Ash Table
  icon: 🔥
  text: One Table in Topila is black from edge to edge. The Burning Hand says it was scorched by a single verse, burned wrong four hundred years ago, that said the Table was on fire. It burned for nine days and has never quite cooled. Students go there now to practise, on the grounds that nothing they burn wrong can make it any worse, and the Cinder Archive keeps every verse that has ever gone astray, so that nobody burns it twice.
- id: lore_gr_lanternreach
  origin: allora1
  kind: lore
  name: The Lantern Reach
  icon: 🛶
  text: Where the gold Lumbre glows brightest, a mile above Campanara, Gramannan verse-burners work at night by the river’s own light, which they say is the sun’s, kept overnight. They burn safe-passage verses into oars and boat-bells and pilots’ lines, and read the river from rafts moored along the Reach, where the light comes up through the water onto the page.
- id: lore_crop_seven
  origin: allora1
  kind: lore
  name: Wheat, Rye and the Crock-Wives’ Onions
  icon: 🌾
  text: "The Seven are a wheat country on the lowland and a rye country above the snow-line, and the two do not marry: a highland bride brings her own black bread to the wedding, and the lowland family pretend to like it. Every cottage has its plot of onions, leeks and turnips; Ostwick plaits its onions into strings on the same day it stamps its cabbage, and an Ostwick kitchen in winter is hung so thick with onion-strings you cannot see the ceiling. Spelt is the old grain, grown for the abbeys and the Duke, and nobody else can afford to eat it."
- id: lore_orchard_seven
  origin: allora1
  kind: lore
  name: The Long Orchards of Pomerell
  icon: 🍎
  text: Pomerell was an abbey before it was an orchard, and is now more orchard than abbey. The brothers graft, prune and press, and keep in their scriptorium a book of every tree they have ever planted, with its parents, like a peerage. Their cider goes down the Lugg in barrels marked with a pear, because the first abbot said apples were a temptation and pears were not, and nobody has had the heart to change the mark. The oldest tree, they say, gives one golden apple in a lifetime, and only to someone who has pruned it without being asked.
- id: lore_crop_gallar
  origin: allora1
  kind: lore
  name: The Drained Gardens of Kalvenhoek
  icon: 🥬
  text: "Kalvenhoek was fen until the drainage-mills came. Now it is the kitchen-garden of Ripla and half of Gallar: raised beds on black soil between dikes, forcing-houses of glass where cherries come in a month early, and a vegetable auction under a long roof where the price is called downwards until somebody shouts. The Fen-Wardens say the land wants to be water again and will be one day, and the gardeners plant leeks on top of their warnings."
- id: lore_crop_qoul
  origin: allora1
  kind: lore
  name: The Water-Wheels of Seret
  icon: 🍋
  text: Seret is a garden that the river turns. Great wheels of palm-wood lift the water into stone channels that run to every bed, every lemon-tree and every melon-hill, and the wheel-keepers sing a counting-song to keep them turning, because a wheel that stops for an hour loses a field. Lentils and chickpeas are Qoul’s bread; cumin and coriander are its salt; the citron is its pride, and the Citron Walk of Seret, by tradition, grows the fruit carried before the Two Thrones at the New Year.
- id: lore_crop_east
  origin: allora1
  kind: lore
  name: The Hive-Tops and the Orchard-Cones
  icon: 🍏
  text: Therama farms its own roofs. The tops of the hive-hills are flat fields of ash-wheat and sky-barley, worked by leased iron golems that walk the furrows all night. South of the hives, the orchard-cones of Velmira are hollow hills open to the sky, with trees on ledges all the way down, so that the bell-apples ripen on the top ledge a month before the bottom. Lantern squash is grown under hanging lamps at night, because, the growers say, it likes to be looked at.
- id: lore_cure_seven
  origin: allora1
  kind: lore
  name: Salt and Smoke in the Seven
  icon: 🥓
  text: The Seven run on salt. It comes off the Salzmoor pans in grey heaps, goes up the Lugg in barges, and comes back down as herring in barrels, hams from the smoke-lofts of Grell and stockfish dried on the racks of Kranzholm. Every town has its smoke-loft, every smoke-loft its wood — beech in Eintenn, oak in Grell, juniper in the highlands — and every smoker will tell you the others are doing it wrong.
- id: lore_pickle_seven
  origin: allora1
  kind: lore
  name: The Crock-Wives of Ostwick
  icon: 🫙
  text: In Ostwick the cabbage is shredded and stamped into stoneware crocks on the same autumn day every year, by every household at once, so that the whole village smells of salt and sour for a week. The crock-wives keep their mothers’ crocks and will not lend them. A crock that has made sauerkraut for a hundred years, they say, could make it from stones.
- id: lore_cure_gallar
  origin: allora1
  kind: lore
  name: The Smoke-Wives and the Long Ice
  icon: 🐟
  text: "Hæringhythe smokes herring in sheds as long as churches, tended by the Smoke-Wives, who can tell a kipper’s day from its colour. In the Knuckle there is no smoke to spare: the Far-North Kin bury their seal-meat in the ice and dig it up in spring, and on the Shellan tundra the behemoth is cut into strips and hung in a wind that has not stopped since the first winter."
- id: lore_pickle_gallar
  origin: allora1
  kind: lore
  name: Jellied Eels of the Stilt-Levels
  icon: 🐍
  text: Ripla eats its eels jellied, from bowls, on every landing of the Stilt-Levels, and argues about the vinegar. The fen-folk pickle their morels and starwort in crocks sunk in the cold mud of the meres, and leave them for a year; nobody who has eaten a fen-morel from a mud-crock eats them fresh again.
- id: lore_cure_qoul
  origin: allora1
  kind: lore
  name: Natron and the Dead
  icon: 🧂
  text: "The same natron that the House of Folding packs round the dead of Ahnara is packed round gulf fish on the Sealands racks, and nobody in Qoul finds this strange: what keeps a body keeps a mullet. Tunny are salted in loins on the shore and sent up-river, and the ibex of the high country is dried into strips so hard that drivers carry it in place of a knife."
- id: lore_pickle_qoul
  origin: allora1
  kind: lore
  name: The Fish-Sauce Pits of Ashqel
  icon: 🏺
  text: "Outside the walls of Ashqel, downwind, the fish-sauce pits are trodden every morning by men in tall boots: sardines and salt left to the sun for a season until they become the black sauce that goes into every dish of the Two Thrones. The best is aged in jars for years and sold by the spoonful. The caravans carry date-relish and pickled citrus, and the Fellowships judge a khan by its jars."
- id: lore_cure_east
  origin: allora1
  kind: lore
  name: The Ice-Houses of Negarro
  icon: 🧊
  text: "In Gramanna the hams are not smoked but frozen: Negarro ice, cut from the black water in the coldest month, is packed round shell-boar haunches in houses half underground, and the hams come out in summer sweet and dark. The Imperial ice-kitchen in Plandor keeps hams of the fourth form for three years, and a single slice is a gift that requires a reply."
- id: lore_pickle_east
  origin: allora1
  kind: lore
  name: The Pickle-Jars of the Nine Wards
  icon: 🫙
  text: "Every ward of Plandor pickles its own: the Strand its crab-claws, the Hanging Wards their giant-fruit rind, the Cistern Canals their pale fish. A ward’s pickle-jar, carried to another ward’s door, is an embassy; refused, it is an insult that has started riots. The Ministries keep, in a locked cellar of the Treasury, a vinegar said to be older than the city’s name."
- id: lore_build_seven
  origin: allora1
  kind: lore
  name: Barn-Raisings and the Masons’ Lodges
  icon: 🛖
  text: "In the Seven a barn goes up in a day: the village gathers, the frames are raised on ropes by forty hands, and the beer comes out when the ridge-beam is on. Stone is another matter. The masons’ lodges keep their secrets — the right angle by rope, the true level by water — and a lodge-mark cut on a keystone is a promise that the arch will stand. The Collegium has started teaching architecture from books, and the lodges have started laughing."
- id: lore_build_qoul
  origin: allora1
  kind: lore
  name: The Hall of True Lines
  icon: 📐
  text: "Ahnara builds with rope and stake. Every temple, field and house in the Angle-Grid is set out from the Hall of True Lines by architects who swear an oath on a knotted cord: a line drawn false is a lie told to the gods. Their drawings are kept in the College for a thousand years, so that any wall in the city can be checked against what it was meant to be, and many are."
- id: lore_build_east
  origin: allora1
  kind: lore
  name: Skyways and Hive-Cutters
  icon: 🌉
  text: "Plandor builds up and across: towers joined by hanging skyways, galleries slung on cables over streets three hundred feet down, roofs on roofs. Therama builds in: the hive-cutters follow the soft stone with chisels and the hard stone with their noses, and can tell from the sound of a wall where the next room wants to be. The Ministries license both, and both trades say the other is mad."
- id: lore_farmyard
  origin: allora1
  kind: lore
  name: The Farmyard
  icon: 🐄
  text: "Every farm in the Seven keeps a cow if it can, hens if it can’t, and a pig whatever happens. The great dairy breeds came down from the mountains and up from the polders, and the cheese followed them: Hohenkamm Brown makes the hard wheels that go down to the lowlands on mules; Polder Black-Pied makes the Luggish cheese that goes everywhere else. The autumn killing is a holiday in Ostwick, and the whole village eats pudding for a week."
- id: lore_householders
  origin: allora1
  kind: lore
  name: Below Stairs
  icon: 🧹
  text: "A great house runs on people nobody sees. In the palaces of Marre the housekeeper carries forty keys on her belt and knows what is behind every door; in the Carved Halls of Lomma the majordomo decides who sits where, which is to say who matters. Both say the same thing about cleaning: you can tell everything about a household from its floors."
- id: lore_fw_lamp
  origin: allora1
  kind: lore
  name: What the Keepers See
  icon: 🕯️
  text: "At the bottom of the deepest stair under the Monastery of the Lamp there is no light at all, and the Keepers sit there without a candle until they stop waiting for one. Those who reach Stone say that, once, they saw it: not a flame but a warmth with a colour, very small and very far down, that had been there before anyone came to look and did not mind being looked at. None of them describes it the same way. All of them go back."
- id: lore_vessi
  origin: allora1
  kind: lore
  name: The Vessi of the Under-Canopy
  icon: 🌑
  text: "Under the jungle south of Therama live the Vessi, a small dark people who sleep in hammocks in the roots of the giant trees. To be seen by a giant is to be stepped on, so for longer than anyone remembers the Vessi have practised not being looked at. Their magic is the Shade-Walk: Illusion turned inside out. Marre’s masquers make the eye see something; a Vessi hunter makes it see nothing, and their elders can send their own shadows ahead of them to walk where they dare not. They write nothing down. Every working is taught on a hunt in the dark of the moon, by an elder, to one person at a time."
- id: lore_rimewatch
  origin: allora1
  kind: lore
  name: The Rime-Watch
  icon: ❄️
  text: "The Deichmarsch is land taken from the sea, and in the winter storms the sea comes back for it. The Rime-Watch is a sworn watch of dike-reeves paid by the Republic of Luggen. On the worst nights they stand on the dike and change the water breaking over it, so that it stops and stands as ice. Nothing is taught: a working is granted, by the Watch, to those who have stood enough watches. Winter nights count double and the Surge five times over. They have never lost the Marsh."
- id: lore_longwake
  origin: allora1
  kind: lore
  name: The Long Wake
  icon: 🪱
  text: "On Hobb’s Furrow the dead are not buried in churchyards. They are ploughed into the fields they worked, and the Great Wake at the end of autumn is a feast over the new graves. The furrow-folk say nothing dies; it only changes fields. Their magic is rot made useful, hurrying dead things into living ones, and it is not taught at all: a working is planted, in a bundle of rot, and dug up when it is ripe. Seronia’s Ringed call it grave-theft. Every farmer in Gramall loves it."
- id: lore_hollowmasque
  origin: allora1
  kind: lore
  name: The Hollow Masque
  icon: 🎭
  text: Grell’s Mask-Wardens keep the death-masks of the great, and know that a mask of the dead, worn rightly, lends you a little of who they were. They lend masks only on the Hollow Nights, and only to Gruma’s Lantern-Bearers or those they honour. Each face you wear wears your own a little thinner; a Hollow Night gives it back.
- id: lore_crucible
  origin: allora1
  kind: lore
  name: The Crucible Art
  icon: 🏺
  text: "The Collegium’s proofs were born in Sillenian fire. A handful of Scorched School masters, matriculated at Kesselhaven, reunite the two in a palm-sized crucible: a calling held inside a closed proof, so that it can be kept, measured and released later. Nobody is taught a crucible working outright. You must bring a proof and a calling you already know, near the new working’s depth, and the masters re-forge them into it."
- id: lore_skytablets
  origin: allora1
  kind: lore
  name: The Tablets of the Sky
  icon: 🏺
  text: The priests of the Tell of Years hold that each Wanderer has a name, and that a name fired into star-clay at the right hour carries its Wanderer’s temper for as long as the tablet lasts. A tablet lasts until its Wanderer leaves the House it was fired in, and then it cracks.
- id: lore_lattice
  origin: allora1
  kind: lore
  name: The Singing Lattice
  icon: 💠
  text: In Khaderun some houses are built around crystal lattices that hum with the Murmur. A Lapidary House cuts the crystal and a Measurer of the Angles lays the figure; the lattice holds the hum and gives it back. Only someone who already knows a cut and a figure can learn to build one, and a lattice in the Drone cracks.
