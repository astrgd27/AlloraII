    - "The Four share one clock, the Count: twenty days, five ruled by each Corner in turn — the Hinge, the Kiln, the Maw, the Unreckoned — and in its own days a Corner’s devotion comes twice over. Then come two Unlit Days that are not counted at all: they belong to the Unreckoned, and the other three grant nothing. At their end every hearth is relit from the Kiln in the Round Courts; from the third rank, that New Fire must be kept."
    - "Cast lots at the Shelf before you gamble: if the lot permits, mishaps in that day’s gambling are halved. The Unlit Days are the Unreckoned’s feast, and its devotion comes three times over."
