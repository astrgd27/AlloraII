  domain: Love, death, the underworld, gems and precious ornaments
  ranks:
    - Mourner
    - Suitor
    - Ring-Bearer
    - Betrothed
    - Veil-Keeper
    - Beloved
  organisation: The Ringed are wed to Seronia at ordination with a ring set with a dark gem, and dress in black and white, mourning and wedding colours at once. They marry and bury all the Freeholds, for to the Bride these are one rite. Her great temple is the Bride-House at Fin, among the flower-farms; her shrines stand in the Tomb-Walks of Ripla, in Gramall’s funeral chapel, and in the Deep Chamber at the bottom of Lomma’s pits.
  text: "Seronia rules the afterlife of Gallar: death as a lover, death as a bride. Her statues show a beautiful woman with dark features and large wide eyes, always veiled, and it is accursed to see her face except at her greatest festival — and then only her priests may look. Like the gods of the underworld she owns what is buried, and above all the gems set in wedding rings. The Witch-Queens’ Larder steals the dead that are hers. And there is Bellor, who got away."
  mech: Devotion comes from serving at weddings and funerals, keeping death-watches at her shrines, and offering gems. Her priests set wedding rings in her name. Once a year, on the last night of autumn, the veil is lifted at the Bride-House.
  boons:
    - +8% Courtship, Goldsmithing and Appraisal per rank
    - "Rank 2: romance blossoms faster (+6% per rank)"
    - "Rank 3: once a season she turns a near-death back — “She is not ready for you yet”"
    - "Rank 4: grave-goods you appraise and sell fetch more (+10% sale prices)"
    - "Rank 5: Beloved — your marriage never sours while your ring is set"
  way:
    - At Ring-Bearer you are wed to her with a dark gem. Lose the ring and you hold no rank until you are wed again with finer stones.
    - Two services every six days, at weddings, funerals or the great laments, are the Ringed’s duty.
    - From Betrothed you must be at the Bride-House for the Unveiling at the end of autumn. Missing it costs half your devotion and three penitent death-watches; twice in a year, and only a great gift will bring you back.
- id: phorn
  origin: allora1
  kind: faith
  name: Phorn the Golden Eagle
  icon: 🦅
  sites:
    - eyrie
  join_requires:
    presence: 20
    climbing: 15
  domain: The sun’s rays, wind, flight and royal power
  ranks:
    - Fledgling
    - Brancher
    - Wind-Rider
    - Ray-Bearer
    - Talon
    - Golden Eye
  organisation: "The Eyrie of Phorn crowns the cliff-top at Lomma. Its priests keep golden eagles, read the sun and the wind, and own nothing below the treeline; they answer to the Sun-Warden. Every high place in the Freeholds has its sun-rite: the lantern of Castle Trollin, the crown of Drell’s Arch-Gate, the sun-stone of the Dorrian prairie, the head of Harrowgate’s Toll-Stair."
  text: "Phorn is the golden eagle of the sun, whose rays are his flight-feathers and whose wind is his wingbeat. He loves the high places and the lords who rule from them. No ruler’s claim in the Freeholds is lawful until the Eyrie seals it: at noon on midsummer the claimant stands at the cliff-edge, a sacred eagle is loosed, and if it comes down to the claimant the Golden Seal is pressed in gold wax. Harrowgate’s genealogies decide who may stand. The eagle decides the rest."
  mech: Devotion comes from greeting the sun at dawn or dusk from his high places, tending the sacred eagles, Paragliding on his wind, and carrying the Eyrie’s sealed letters.
  boons:
    - +8% Paragliding, Leadership and Presence per rank
    - "Rank 2: the great houses favour you — +25% standing with houses and realms of the Freeholds"
    - "Rank 3: dawn rites count double"
    - "Rank 4: Talon — glide-routes: travel between Phorn’s high places takes half the time"
    - "Rank 5: Golden Eye — +10% to all Social learning"
  way:
    - "The Sun-Round: greet the sun from all five of his high places in a single season. No one becomes a Ray-Bearer without having made it once."
    - At Wind-Rider the Eyrie gives you an eaglet to raise; a Talon must have a grown eagle that comes back to the arm. A grown eagle sometimes drops a golden feather.
    - "Before a glide between his high places, read the wind and the birds: a favourable reading halves the journey."
    - Phorn owns nothing below the treeline and takes no gifts of goods.
- id: bellor
  origin: allora1
  kind: faith
  name: Bellor the Lucky
  icon: 🍺
  sites:
    - bellor_stone
  join_requires:
    horsemanship: 20
    carousing: 15
  domain: Horsemanship, trickery, adventure and misadventure, warriors and feasting
  ranks:
    - Admirer
    - The Beard
    - The Height
    - The Laugh
    - The Misadventures
    - The Mantle
  organisation: "Bellor has small shrines and a small cult of Bellings — horse-breakers, soldiers, tavern champions, younger sons and daughters. There is no priesthood: whoever is oldest at the table leads the toast. His altars sit in corners of other gods’ temples, even, quietly, in Seronia’s Bride-House."
  text: "Bellor was a young man with a fighter’s beard who saddled the first horse by tricking the legendary steed Porceps, and went on from there. Half the landmarks of Gallar are his doing: a split cliff, a hoofprint spring, a pool he dug to win a drinking bet. His last trick was played on death itself: he courted Seronia, she said yes, and he went down to her on the wedding night and slipped out before dawn, leaving his body under a great stone on the Gramall prairie. The Ringed say he is with her still. The Bellings say he is out riding. And his most fervent admirers, following in his footsteps, begin to take on something of him: the beard, the height, the laugh — and at the last, his mantle."
  mech: "Devotion comes from riding, brawling, feasting and carousing — and above all from doing again, in his name, the Twelve Deeds he is said to have done. Each deed moves you along the track of bellorization; without new deeds, it slowly fades. Whoever completes it takes up Bellor’s Mantle, which nothing can take away. No one wears it now. The Mantle is Bellor’s own height and his own fame: it will not settle on anyone swollen by the Phrell’s Grandeur or half-forgotten by the Callum’s Hush, and whoever wears it can never work either art again."
  boons:
    - "Admirer: devotion from riding, brawling and revels"
    - "The Beard: whatever your pronouns, you grow a fighter’s beard"
    - "The Height: +12% Strength, Horsemanship and Brawling"
    - "The Laugh: +10% Social learning, and people remember you"
    - "The Misadventures: comic mishaps chase you, and usually turn out well"
    - "The Mantle: Bellor’s mortal portion — +25% Horsemanship, Brawling, Deception and Carousing, and feasts last twice as long. You can never refuse a dare."
  way:
    - "Bellor’s faith is a story you act out: the Twelve Deeds, each at its own landmark."
    - From The Height, when you feast or toast at his Headstone you lead the table, and people remember it.
    - No holy days, no relics, no duties, no rules except the Mantle’s dare. Bellor already played his trick on death; he does not do favours.
- id: threehead
