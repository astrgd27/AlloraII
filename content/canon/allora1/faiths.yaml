  mech: "Choose an aspect when you join — the Hearth at Ostwick or Valdora, or the Pyre at Aschau. Hearth: devotion from cooking, brewing, farming, gardening and beekeeping, and from tending her hearths. Pyre: devotion only from burning valuable offerings on the Pyre, doubled in autumn."
