  icon: 🦌
  sites:
    - bone_moot
    - barrow_downs
    - hornhall
  join_requires:
    lang_mearcish: 10
    survival: 15
  domain: "The Three-Headed Horned God: the hunt and the axe; witchcraft and sight; the hearth and diplomacy"
  ranks:
    - Kin
    - Horn-Bearer
    - Idol-Keeper
    - Face-Sworn
    - Three-Fold
    - Three-Sighted
  organisation: "The true god of the peninsula has no priesthood but the idol-keepers: three carved heads on a post, hung with real horns by the bonecrafters. Every tribe prays to all three faces but leans one way — the Praen to Torrad, the Molster and the mead-halls to Shure, the Witch-Queens to Leima alone. The great idols stand at the Bone-Moot (Shure), in the forest above the Barrow-Downs (Torrad) and in the Hornhall at Wocca (Leima)."
  text: "Three heads, joined and floating: Torrad the hunter and axeman, crowned with a musk ox’s horns; Leima the witch and seer, with a stag’s antlers; Shure the matron of the hearth and of peace-making, with the horns of a deer. The witches teach that Leima is the true face and the other two serve her. The Mearc holds that she is only one of three, and that Torrad and Shure keep her in check — which is the only safe way on the peninsula to speak against Wocca."
  mech: "You honour one face at a time; you take the face of the idol where you swear, and changing face later costs a quarter of your devotion. Devotion comes from the rites of your face’s idol and from its work: hunting and axes for Torrad, Witchlore and Divination for Leima, peace-making and the hearth for Shure. The highest rank, Three-Sighted, needs the rite of each face."
  boons:
    - "+8% per rank to your face’s skills (Torrad: Tracking, Survival, Hunting, Axes · Leima: Witchlore, Divination · Shure: Diplomacy, Mediation, Cooking)"
    - "Rank 2: Torrad — risks in the wild hurt less · Leima — +25% standing with the witch councils · Shure — the right to judge wergild at Eorlhall"
    - "Rank 3: welcome in every mead-hall — +25% standing with the three tribes"
    - "Rank 4: horn-bonecraft — +15% Bonecrafting"
    - "Rank 5: Three-Sighted — all three faces’ blessings at once"
  way:
    - "Each face is its own practice. Torrad: the first beast you hunt each season is his — its horns to the idol, its meat to the hall."
    - "Shure: from Face-Sworn, Shure’s people must be at the Bone-Moot for Horn-Fall at the end of winter. Missing it is a Lapse, mended by hosting a peace-feast."
    - "Leima: in spring, dance in antlers before her idol at the Hornhall. Her faithful study Witchlore; none of them work witchcraft."
    - "All three faces keep the idols hung with horn: one turn every six days."
- id: hiyam
