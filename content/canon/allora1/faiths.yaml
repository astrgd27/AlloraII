  organisation: "Norrae’s priestesses keep a handful of shrines at the water’s edge — a ford below Burg Tennfels, a pool on the timber-rivers of the Pine-March, the ferry-stage on the Luggen road — and each spring they wade into the current to bless the river and bind it to good ends for the year: no drownings, no floods, fish in the nets. The Sisters of the Ford are gentle with others and merciless with themselves. Their rule forbids drunkenness, violence, poisons, dealings with the dead and anything that would draw the watch’s eye; a sister who breaks it must wash for a day before she may serve again."
  text: Norrae is the maiden of the river — of the Tenn, and of the Lugg, and of the outflow of Lake Lumen, and of any river her faithful happen to be standing beside — and not one of them feels the slightest contradiction in this. She is young and clear and cold. She gives fish and fords and good water, and every year she takes what she is owed. Her faithful believe the rivers stay clean only so long as the people who love them do, and they keep themselves accordingly.
  mech: "Devotion comes from work in and on the rivers — fishing, rafting, ferrying, swimming — from meditation and self-denial, and from blessing the rivers at her shrines, which counts three times over in spring. Her rule is strict: drinking, violence, poisons, necromancy or any act that draws notoriety muddies your waters — you lose a little devotion and gain none for a day. The Sisters will not take anyone the watch is looking for."
  boons:
    - +8% Swimming, Fishing, Rowing, Timber-Rafting, Meditation and Asceticism per rank
    - "Rank 2: the river will not keep you — drowning risks halved"
    - "Rank 3: +30% fish and eels"
    - "Rank 4: the current washes you clean — notoriety fades twice as fast"
    - "Rank 5: Blessed Year — blessing the river in spring grants +20% to all learning until spring ends"
  way:
    - Your waters can be Clear, Rippled (by drink), Muddied (by violence, notoriety or the dead) or Fouled (by poison or necromancy). Fouled, nothing comes to you until you keep a full day of washing at one of her fords.
    - "Following the Water: in spring, bless the river at all six of her shrines. Completing it grants a Blessed Year — a smaller one below the highest rank."
    - "She takes no offerings and keeps no relics: a relic is a dead thing, and the river is alive."
- id: honna
  origin: allora1
  kind: faith
  name: Honna the Headlong
  icon: 🏃
  sites:
