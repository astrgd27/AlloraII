  domain: The sea-road, the bargain, the far port and the safe return
  ranks:
    - Deckhand
    - Oarsman
    - Helmsman
    - Horse-Holder
    - Rider of the Waves
    - Bridle of the God
  organisation: "The Grooms of the Waves keep Hiyam’s harbour-shrine on the rock of Ashqel: a bronze bridle no one can lift, a tithe-chest, and a wall of names of ships that did not come home. Every Ashqeli captain pays them a tenth; every Ashqeli sailor is, in some sense, a groom."
  text: "Hiyam is the sea as the Ashqeli know it: a white horse that has never been broken and carries whom it chooses. He loves a bargain struck at sea, a port nobody else has reached, and a voyage that goes on; he has no patience with a hull that stays in harbour."
  mech: Hiyam rewards range. Trading, sailing and navigating please him — and the more different markets you have traded in this season, the more each new bargain pleases him. Stay in one port and his favour thins; keep moving and it grows.
  boons:
    - +8% Bartering, Sailing and Navigation per rank
    - "Rank 2: a following sea — journeys are 10% shorter"
    - "Rank 3: the god’s tenth — 5% better prices when you sell"
    - "Rank 4: the horse’s gait — +15% Watercraft learning"
    - "Rank 5: Bridle of the God — the sea seldom keeps you: drowning risks halved"
  way:
    - "Once in each rank, a market you have never traded in pleases him greatly: the far port."
    - "Before you sail, read the white horses: a favourable reading shortens the voyage."
    - Seven days in one port and his favour thins.
    - "Only the Bridle of the God can lift the bronze bridle: once a season, ride the white horse, and any sea voyage takes a day."
- id: niche
  origin: allora1
