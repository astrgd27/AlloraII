  text: Pecutto is the god who arrives. He comes up the road with a cart and a cup; he is the stranger at the door and the best guest you ever had; and when he leaves, the vines hang heavier and someone is expecting. In Marre he is the patron of actors and travellers. In the countryside he is older and earthier, the god of the vintage and the furrow, and his plays are fertility rites with jokes in them. He has no commandments anyone can remember, which his priests regard as a theological position.
