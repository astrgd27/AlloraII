  domain: Youth, the body’s wisdom, games and races, courage, first love — everything done without stopping to think
  ranks:
    - Stripling
    - Runner
    - Wreath-Bearer
    - Headlong
    - Champion of the Course
    - Honna’s Own Body
  organisation: Honna has no priests. In every Rollan town the young belong to his confraternities, one to each ward, and the confraternities run his races, wrestle his matches, ride his Palio and keep his shrines swept. Membership ends at thirty, when you hang your wreath in the shrine and go home to be sensible; a few old men stay on as Wreath-Keepers to mind the course and break up the fights. The Hearth-Church grumbles about broken windows, the regency fines the confraternities every summer, and every summer pays the fines itself.
  text: "Honna was the most beautiful youth who ever lived, and the gods quarrelled over which of them should have his face. To settle it, he took off his head, handed it to them, and ran away laughing — and the gods are arguing over it still. Honna has never missed it. He is the god of everything you do without stopping to think: the sprint, the leap, the tackle, the dive into cold water, the charge, the dance, the first kiss. His statues are headless youths in the act of running, and nobody carves his head, because nobody remembers what it looked like and the gods will not give it back. His faithful say that heads are overrated."
  mech: "Devotion comes from sport, athletics and dancing, and half again from anything done headlong — work with real danger in it. Run his course and keep his games at the shrine in Castelvento. Honna has no patience with study: bookish work costs a little devotion."
  boons:
    - +8% Athletics and Dance per rank
    - "Rank 2: Headlong — risky ventures are 8% likelier to succeed"
    - "Rank 3: Heedless — injuries from sport and danger are halved"
    - "Rank 4: The body’s wisdom — your work trains your attributes twice as fast"
    - "Rank 5: Ever-Headlong — all devotion to Honna comes half again as fast"
  way:
    - From Runner you must ride or cheer for your ward at the Palio of Castelvento (days 9–10 of summer). Miss it and you Lapse, and must take your dunking in the shrine fountain.
    - Races and revels throw out dares. Take one and you may win his favour or a bruise; refuse, and nothing happens.
    - Run the course or keep the games twice every six days. Win at the Palio and you are crowned with a wreath; at Honna’s Own Body you hang it on the headless youth and go home to be sensible — and the body’s wisdom stays with you for good.
- id: laishma
  origin: allora1
  kind: faith
  name: Laishma, Mother of Monsters
  icon: 🐍
  sites:
    - tarsena
    - assar
  join_requires:
    animal_lore: 8
  domain: The salt deep before the world, serpents, monsters and beasts, birth, venom and its cure
  ranks:
    - Egg
    - Hatchling
    - Coil
    - Scale-Sister
    - Mouth of the Serpent
    - Laishma’s Own Child
  organisation: "In Raben her temples are serpent-houses, and in Tarsena there is one: a courtyard of warm stones and sleeping snakes at the landward end of the harbour, kept by the Coils — priestesses who handle the sacred serpents, milk their venom and dance with them on the holy nights. Their venom goes into the theriac that every physician in Sarlon quietly buys. The Hearth-Church calls the cult devil-worship; the Crown tolerates it in Tarsena and nowhere else; the Coils do not seem to mind either."
  text: "Before the world, the Rabenes say, there was only Laishma: the salt deep, coiled about herself in the dark. From her came the first things, and the first things were monsters — serpents, dragons, scorpion-men, the bull of heaven, every creature too strange to have been planned. The young gods made war on her, split her body and made the world from it, and she let them; but she has never stopped being the mother of everything strange and dangerous in it. Her faithful believe the world is her body and the monsters are her children, to be loved and understood, not hunted. They are not afraid of snakes. Parod the storm-chief led the young gods against her, and the two have been at war since before there was a world to fight in."
  mech: "Devotion comes from caring for beasts — animal lore, herding, kennels, falcons, bees — from venom and its cure — poisoncraft, physick, herbalism — and from the rites of the Serpent-House. Killing her children grieves her: hunting costs devotion."
  boons:
    - +8% Animal Lore, Poisoncraft, Physick and Herbalism per rank
    - "Rank 2: venom spares you — stings and serpent-bites do half harm"
    - "Rank 3: her children are generous — +25% from all Animals & Plants work"
    - "Rank 4: the cure in the venom — potions, poisons and remedies you make are of better quality"
    - "Rank 5: Mother’s favour — Animals & Plants and Poisoncraft work is 25% faster"
  way:
    - "At Hatchling the Coils give you a serpent’s egg. Raise it at her Serpent-Houses: a Coil must have a serpent half-grown, a Scale-Sister one full-grown — and a grown serpent can be milked."
    - Two venom-milking shifts every six days are her duty. On summer’s holy nights, the serpent dances count three times over.
    - When Parod rides the storm, her rites go indoors and wild work pleases her half as much. A Coil seen at Parod’s altar is not loved by either house.
- id: parod
  origin: allora1
  kind: faith
  name: Parod the Storm-Chief
  icon: 🐂
  sites:
    - tarsena
    - assar
  join_requires:
    leadership: 5
    strength: 10
  domain: Storm and rain, war-bands and their chiefs, oaths of war, the bull
  ranks:
    - Shield-Bearer
    - Spear-Brother
    - Thunder-Spear
    - Chief of Ten
    - Chief of a Hundred
    - Parod’s Right Arm
  organisation: "Parod has no priests apart from his chiefs. His faithful are bound into lodges of Spear-Brothers, each led by a chieftain who is also its priest; they drill together, feast together, swear to stand together, and when a storm comes in off the southern sea they climb to the Storm-Altar on the headland at Tarsena and offer the god a bull’s share. Many of Tarsena’s mercenaries and marines are Spear-Brothers. Northerners who meet them call Parod “the southern Orthun”. Orthun’s silent hermits would be appalled, and so would Parod: Orthun wants nothing from anyone; Parod wants deeds, loyalty and a good feast afterwards."
  text: Parod is the chieftain of the storm. He rides the thunderheads as a man rides a bull, swinging a mace of lightning, and the rain that falls behind him fills the canals of Raben and makes the barley grow. It was Parod who led the young gods against Laishma and split the deep to make the world, and he has led their war-band ever since. He loves courage, loyalty, loud feasts and oaths kept to the death; he despises cowards, oath-breakers and men who fight alone. In Tarsena his altar stands on the headland at the seaward end of the harbour, as far from Laishma’s serpent-house as the city allows.
  mech: "Devotion comes from fighting and martial training, from leadership and tactics, and from his rites — all doubled in a thunderstorm. Parod despises oath-breakers: failing or abandoning a quest costs devotion."
  boons:
    - +8% Martial skills and Leadership per rank
    - "Rank 2: in a thunderstorm, +10% to win every fight"
    - "Rank 3: war-band — violent ventures pay 30% more"
    - "Rank 4: your fights train your weapon twice as fast"
    - "Rank 5: Parod’s Right Arm — +10% to win every fight"
  way:
    - "Rank among the Spear-Brothers comes by acclamation: give the lodge a feast at the storm-altar when your devotion has earned the next rank, and they raise you."
    - Two drills with the lodge every six days. Miss three such spells in a row and you are shamed — no devotion until you give a feast.
    - Before a fight, the auspices may be taken from the storm. A good reading makes the next day’s fighting surer; a poor one is only a reason to wait.
- id: dolma
  origin: allora1
  kind: faith
  name: Dolma, the Serene Matron
  icon: 🦁
  sites:
    - marre_palace
    - marre_isles
  join_requires:
    etiquette: 5
    "@r_marre": 100
  domain: Marre itself — its glass, its prudence, its councils and its lagoon
  ranks:
    - Lagoon-Child
    - Citizen
    - Lion-Keeper
    - Procurator
    - Serene Counsellor
    - Daughter of the Matron
  organisation: Dolma is worshipped in Marre and nowhere else, as the Republic itself made divine. Her priests are the Procurators, chosen by the Great Council from among the Ten Families; the Doge is her first servant and walks behind her image on feast-days. Her basilica on the Piazza is walled with gold glass, and every guild of the city keeps her altar — the glassmakers above all, for whom she is the patron of the furnace. Once a year, at the Feast of the Lagoon, the Doge rows out in her golden barge and weds the sea in her name.
  text: The Serene Matron is a tall, calm woman in a gown of green glass, seated between two lions of glass, one awake and one sleeping. She is wisdom that does not hurry, judgement that does not shout, the patience that built a city on mud and made it shine. She taught the first Marreans to make glass from the sand of the lagoon, and the lagoon has kept them safe ever since. Foreigners find her cold. Marreans find foreigners loud.
  mech: Devotion comes from glassmaking, from service to the Republic — the Arsenal, the Cerdans, the Council, the Lazaretto — and from her rites in the basilica and on the Glass Isles. On the Feast of the Lagoon, the first three days of spring, her rites count five times over. Only citizens in good standing may join.
  boons:
    - +8% Glassblowing, Illusion, Diplomacy and Contracts per rank
    - "Rank 2: standing with the Republic of Marre rises half again as fast"
    - "Rank 3: the Matron’s lions — glass you make is of better quality"
    - "Rank 4: Serene — the Cerdans overlook small things: arrests in Marre are half as likely"
    - "Rank 5: Citizen of the Lagoon — buy and sell 10% better anywhere in Marre"
  way:
    - Every Citizen must be in Marre to watch the Doge wed the sea at the Feast of the Lagoon. Missing it is a Lapse — the Procurators fine you 200 pf — and missing it twice in a year casts you out, until a petition and 1,500 pf readmit you.
    - Three turns of civic office every six days — ballots, reports, the lions, the Council’s clerks — are what citizenship costs.
    - In the workshops of Marre her faithful make finer things.
- id: nim
