  domain: Dreams, sleep, the subconscious, prophecy and the inner voice
  ranks:
    - Waker
    - Drowser
    - Dreamer
    - Lucid
    - Oneiromancer
    - Nim’s Ear
  organisation: "The Nimians are recluses who keep a few temples across Gallar, the chief of them in the Ripla fens. They do not preach: the only teaching is what you dream in their cells. They brew the trance-draught from ghostcap, sell it to the Sleepers of Ripla, and despise what the Sleepers do with it."
  text: "The Nimians hold that the world is the dreamfuture: a conscious construction of Nim, dreamed through him, which everyone is already living. Waking is only a lighter kind of sleep. What you see in the deep dream is not a vision of things to come but a glimpse of the dream from nearer its dreamer, where the threads are still visible — which is why Nim’s dreams come true."
  mech: "Devotion comes from sleep: drink a Nimian draught and lie in the dream-cells, and from Dreaming and Meditation. Each deep dream foretells something real in the days ahead — a festival, a gathering, a sickness, where a friend will be — and is kept in your dream-journal in the Codex."
  boons:
    - +8% Dreaming, Meditation, Divination and Insight per rank
    - "Rank 2: your dreams see further ahead"
    - "Rank 3: the inner voice — +10% on every roll of a dangerous crossing"
    - "Rank 4: Nimian draughts you drink last twice as long"
    - "Rank 5: Nim’s Ear — every deep dream also teaches you half as much again"
  way:
    - "Nim dreams the world and does not step into it. The way to him is Lucidity, six stages from Drift to the Dreamer’s Room: dreaming and meditation carry you up to each plateau, and only a sleep-retreat in the cells takes you past it. Rank follows the stage."
    - A sleep-retreat begins with a Nimian draught and lasts a day or two. Leave the cells, or turn to other work, and you wake with nothing.
    - In the Dreamer’s Room, once a season, you may dream as Nim does — and for a day everything you learn comes half again.
    - "The Nimians despise the Sleepers of Ripla: dealing with them costs devotion. Nim takes no offerings and keeps no holy days."
- id: qo
  origin: allora1
