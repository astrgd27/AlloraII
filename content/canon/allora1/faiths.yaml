    - Shed
    - White-Coiled
    - Voice-Elect
  organisation: Until lately a small, rustic, little-known cult of the Shellan forests; now, since Queen Namere credits it with saving her son’s life, a church with a chapel in blue Onore and a prophet at the Queen’s side. Qo chooses one person in each generation as his voice against the dark quell. The present voice, Jonell, alone decides what the quell is, and what the faithful should fear.
  text: Qo is the white serpent who coils in the heavens and holds back the dark quell. That is what the hymns say, and what the Queen believes. The church keeps its deeper teaching for those who climb towards the prophet, one revelation at a time, and each is given only with Jonell’s approval. Those who have gone far in do not speak of what they were shown, but they are quieter afterwards, and they light more candles.
  mech: "Devotion comes from the white hymns, the serpent’s vigils, confession and Insight. No rank is given for devotion alone: at each step you must win the prophet’s approval in a private audience and shed a skin — give up one level of a skill of your choosing, for good. Each shedding reveals another piece of Qo’s teaching."
  boons:
    - +8% Insight and Willpower per rank
    - "Rank 2: once a season, Qo’s light cures a sickness at his church"
    - "Rank 3: the quell notices you (dread nights come)"
    - "Rank 4: White-Coiled — you resist witch-power as if your Countermagic were 15 higher"
    - "Rank 5: Voice-Elect — +25% to all Faith learning"
  way:
    - Every skin you shed is written on a white scale in the chapel at Onore, and the codex keeps the list.
    - From Scaled you must keep the White Vigil in the chapel on the last two nights of winter, every candle lit against the quell. Missing it costs nearly half your devotion and a private confession before Jonell — which the court hears about. Missing it twice in a year casts you out, and only two more skins will take you back.
    - Confess within a day and the dread night that would have come passes over you.
- id: seronia
  origin: allora1
  kind: faith
  name: Seronia, the Dark Bride
  icon: 💍
  sites:
