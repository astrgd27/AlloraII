  text: In the dockside wine-cellars they whisper of a god older than the Allorese emperors, whose followers pass through doors that are not there. The Veiled One asks nothing of coin or harvest. It asks for nights spent awake, for memories offered and kept, and for silence. Each grade of initiation is a death and a return; at each, something is shown that cannot be unseen. What initiates of the fourth grade learn first is a name.
