- id: gd_basics
  origin: allora1
  kind: guide
  name: How Life in Allora Works
  icon: 🧭
  text: "You live a life by choosing what to do. Every place has sub-locations, and each sub-location has activities: tap one to start it, and its bar fills over and over until you stop it or something prevents it. Each completion pays out — skill experience, coin, goods, standing — and the game keeps running while you are away, so a life goes on even when you close it: the first hour away counts in full, and every hour after that at half pace, for up to a day. The header always shows what you are doing, where you are, the date and your health."
- id: gd_skills
  origin: allora1
  kind: guide
  name: Skills & Learning
  icon: 📚
  text: |-
    Skills rise by doing. Every activity lists the skills it trains; the first is its main skill, and each level you gain in it makes that activity a little faster. Each level costs a little more than the last, so the first thirty come quickly and the last thirty are a life’s work. Learning is helped by good lodging, the right attributes, gear and food with “+%” effects, your god, and the company you keep. Failing a task still teaches you something. Open a skill on the Skills tab to see everywhere it can be trained.

    New skills are discovered by visiting the places where they are taught, by exploring, and by rising in faith and profession. Skills come in fourteen kinds, from Martial to Languages; every skill has four knacks, at 25, 50, 75 and 100 (see Knacks, Fine Work and Mastery).
- id: gd_attributes
  origin: allora1
  kind: guide
  name: Attributes
  icon: 💪
  text: Strength, Endurance, Agility, Vitality, Memory, Acuity, Intellect, Willpower and Presence rise slowly on their own from the skills that use them — a little of every lesson trickles into them. In return, each attribute makes its kind of skills easier to learn, Vitality raises your health, and some attributes give you extra focuses.
- id: gd_focus
  origin: allora1
  kind: guide
  name: Focuses
  icon: 🎯
  text: "You begin able to do one thing at a time. More focuses come as you grow: Acuity 15, Stewardship 25 and Memory 30 early on; Willpower 35, Meditation 45 and Leadership 50 in the middle years; and Acuity 60, Memory 70, Intellect 75 and Puppetry 75 for the masters. Two more are magic, cast once for good from Skills › Magic: the Bound Hand at Summoning 10 and the Second Self at Illusion 55. Use a focus to run another activity at once — or press ＋🎯 on an activity that is already running to put a spare focus on it: the first extra focus makes it 25% faster, the next 12.5% more, and so on, and each adds 10% to the skill it teaches. Each running activity has its own bar in the header."
- id: gd_explore
  origin: allora1
  kind: guide
  name: Exploring
  icon: 🔍
  text: Exploring a place slowly raises how well you know it. As the percentage climbs you find hidden sub-locations, new places nearby, people worth knowing, lore, items and recipes. Some finds only appear at night, or once you have the right skill or standing. Talking to travellers and doing quests also reveal places.
- id: gd_travel
  origin: allora1
  kind: guide
  name: Travel & Realms
  icon: 🗺️
  text: Tap a known place on the Map to travel there. Journeys take time and interrupt whatever you were doing; a horse, Pathfinding and Cartography shorten them. Crossing into another realm costs passage. You learn of new realms through Geography, exploration and the people you meet. Time away carries on for up to a day. The Almanac on the Map tab lists festivals and travelling shows.
- id: gd_money
  origin: allora1
  kind: guide
  name: Coin, Markets & Lodging
  icon: 🪙
  text: You earn coin from paid work, careers, quests and by selling what you gather and make at a market. Buying costs more than selling; Bartering narrows the gap. Every night you pay for your lodging — from sleeping rough for free to fine rooms — and better lodging helps you learn and heal. If you cannot pay, you sleep somewhere worse.
- id: gd_health
  origin: allora1
  kind: guide
  name: Health, Danger & Illness
  icon: ❤️
  text: "Risky work can hurt you; the activity shows its danger, and the right skill and armour make it less likely. Health returns with time, faster when you rest or sleep somewhere comfortable. If it runs out you collapse, lose hours, and may wake poorer. Some work and crowded places can make you ill: illnesses slow you down until they pass or are cured by a physician, a shrine or a remedy."
- id: gd_gear
  origin: allora1
  kind: guide
  name: Gear, Clothing & Quality
  icon: 🧥
  text: Clothing, accessories, tools, weapons and instruments can be worn or held from the Pack. Many give bonuses to learning, pay or safety, and some work or ranks require a kind of dress — formal attire, warm clothing, a mask. Crafted goods come in qualities from common to masterwork; better quality means better effects and a higher price.
- id: gd_food
  origin: allora1
  kind: guide
  name: Food, Drink & Buffs
  icon: 🍲
  text: Eating and drinking heals you, and many dishes and drinks give a lasting buff — faster learning in some skills, better yields, more health. Only one meal and one drink count at a time; a new one replaces the old. Books, potions and draughts give their own kinds of buff. Active buffs appear under your health bar.
- id: gd_crafting
  origin: allora1
  kind: guide
  name: Crafting & Recipes
  icon: 🔨
  text: |-
    Recipes turn materials into goods on the Craft tab. Each needs a skill level and a station — a forge, a loom, a hearth — which you find at workshops or install in your own home. You learn recipes by buying them, working in the right trade, or exploring. Higher skill and better stations make better-quality work.

    Many finer recipes call on a second skill: a swordsmith must know how a sword is held, a clockmaker their sums, a court tailor what is worn at court. The second skill is needed at about 40% of the recipe’s level, and making the piece trains it too.
- id: gd_careers
  origin: allora1
  kind: guide
  name: Careers
  icon: ⚒️
  text: A career is steady paid work with a guild, order or court. Each shift pays and trains a little. After enough experience in a rank you are promoted automatically, as long as you meet the next rank’s skill, standing and dress requirements. You can hold several careers and switch between them freely.
- id: gd_quests
  origin: allora1
  kind: guide
  name: Quests & Job Boards
  icon: 📋
  text: "Many places keep a job board of quests: bring goods, carry a parcel, or go and do something difficult a number of times. Quests have deadlines and pay in coin and standing; failing one costs standing. You can carry five at once, and decline offers you do not want. Harder quests (more stars) appear as your standing and skills grow; the rarest are posted only by the great powers, and only now and then."
- id: gd_rep
  origin: allora1
  kind: guide
  name: Reputation & Standing
  icon: 🏛️
  text: "Realms, guilds, orders, houses, faiths and underworld gangs all remember what you do for — and against — them. Standing rises slowly through honest work and devotion and falls quickly through crime and failure. It opens recipes, career ranks, homes, quests and hidden places. Some factions are rivals: pleasing one displeases the other."
- id: gd_crime
  origin: allora1
  kind: guide
  name: Crime & Notoriety
  icon: 👁️
  text: Theft, smuggling, forgery and their like pay well and raise your notoriety. The more notorious you are, the more likely the watch is to notice you, and some faiths and factions will not deal with a known criminal. Notoriety fades a little every day if you lie low.
- id: gd_faith
  origin: allora1
  kind: guide
  name: Faith & the Gods
  icon: 🕯️
  text: You may swear yourself to one god at a time, in person, at their holy place. Each god rewards different things — storms, the sea, coin, the dead, the hunt — and grants devotion when you do them. Devotion and standing with the god’s faithful raise your rank, and each rank brings blessings. Every faith works a little differently; read its page in the Codex. You can renounce a god, but you start again from nothing.
- id: gd_friends
  origin: allora1
  kind: guide
  name: Friends & Letters
  icon: 🤝
  text: People live their own lives across the world, keeping to their haunts and schedules. Work alongside someone often enough and you will meet. Once met, you can talk with them once a day when you are in the same place — each person enjoys some kinds of talk and dislikes others — give them gifts, and write letters when apart (you need to be able to write). As friendship grows they share their stories, and close friends will travel with you as companions. Talk once a day and give a gift once a week. The better your friendship and your social skills, the likelier someone is to say yes when you ask them along, and the more they help. Confidants give you a lasting gift of their own.
- id: gd_romance
  origin: allora1
  kind: guide
  name: Romance & Marriage
  icon: 💗
  text: Some of your close friends may want more. Flirt with them, and if they feel the same you may become sweethearts — one at a time. Court them with dates and romantic gifts; when they are ready, propose with a ring. Married, your spouse can live with you and helps you while you are together, but neglect makes them unhappy.
- id: gd_homes
  origin: allora1
  kind: guide
  name: Homes & Furniture
  icon: 🏠
  text: "You can buy a home in many towns. At home you sleep for free, heal faster and learn better, and you can install furniture: crafting stations, beds and comforts that raise learning in particular skills. Homes have room for only so much, and each has upkeep. Tap a property’s traits — Hearth, Workshop, Quiet, Fine View and the rest — to see what each one does."
- id: gd_events
  origin: allora1
  kind: guide
  name: Festivals & Happenings
  icon: 📅
  text: The year has festivals, travelling shows and random happenings — a carnival, a tourney, an outbreak of sickness, bandits on the roads. While one is on, its place gains new activities, prices change, and some work pays more. The Almanac on the Map tab shows what is coming.
- id: gd_magic
  origin: allora1
  kind: guide
  name: Magic
  icon: ✨
  text: Magic is real, rare and regulated. Each tradition is its own skill, learned in its own way — at a college, from a hedge-witch, by night in forbidden books — and most need other skills first. Some magic carries risks or costs of its own. The Arts of Magic section of the Codex describes each tradition you have found.
- id: gd_antiq
  origin: allora1
  kind: guide
  name: The Elder Ages
  icon: 🏺
  text: Before the Allorese Empire, older peoples built and fell. Their finds can be dug from ruins, deciphered with their lost languages, and given to the University or sold. Each civilisation’s finds unlock its history page by page in the Codex.
- id: gd_gallar
  origin: allora1
  kind: guide
  name: Gallar and the Tyer Pass
  icon: 🏔️
  text: "West of the Seven, beyond the Tyer Mountains, lies Gallar: a mid-game land where work, careers and quests are built for skills of 20 and more. The only road crosses the pass to Harrowgate, and House Vane tolls it each way; friends of Vane and a bribed clerk pay less. Two dangerous routes — the Hag’s Saddle over the ice and the Long Dark beneath the mountains — are free, but need high skills and the right gear. On the Map, an arrow switches between the Seven and Gallar."
- id: gd_qoul_faith
  origin: allora1
  kind: guide
  name: The Gods and Arts of Qoul
  icon: 🛕
  text: Qoul has its own gods, each of whom wants something different. Hetet in Meret-Ahn rewards exact work; the Voice in the Tent gives a Word to keep each season; Hiyam, the Horse of the Waves at Ashqel, rewards trading in many different markets; and the Mother at the Threshold in Qartosh asks for bread from your pack every morning. Laishma and Parod have their homeland temples in Assar. Qoul’s magic is Geomancy (Ahnara), Name-Binding (Raben) and Red-Reading (Elissar) — each begun at 45 in a related skill.
- id: gd_hawks
  origin: allora1
  kind: guide
  name: The Grim Hawks
  icon: 🦅
  text: "The Grim Hawks are a free company that travels Gallar, spending one whole season — about three months — encamped at each freehold before marching on. While they are camped you can stand watch, spar, drill militia and ride out after bandits with them, and two of their officers may become friends or more. Their depot, Hawk’s Rest below Harrowgate, is always there: train with the recruits and join the company as a career. The Almanac shows where they are."
- id: gd_tiers
  origin: allora1
  kind: guide
  name: Tiers & Generic Goods
  icon: 🏅
  text: "Crafted things have a tier from I to V — how advanced the work is — as well as a quality, which says how well this one was made. Some everyday goods come in a family of five tiers: candles, dye, parchment, ink, rope, cut gems, glass, cloth, planks, leather, iron and boats. Anything that needs, say, a candle will take any of the five, and uses the best one you have unless you choose a tier on the activity or recipe. Higher tiers pay off: +12% skill, pay and devotion for each tier above I, and finer work when you craft with them. Each tier is its own recipe, learned and made separately."
- id: gd_enchant
  origin: allora1
  kind: guide
  name: Enchanting
  icon: ✦
  text: |-
    Craft › Enchant binds magic into anything you wear or wield: clothes, armour, arms, rings, instruments.

    A piece holds at most two enchantments, and never two from the same school — a ward and a rune, say, but never two wards. Pick the piece, then a binding from any school whose magic you know.

    Each school belongs to a magic skill and has its own station (a desk for wards, a forge for runes, an easel for glamours, a lab for grave-work…) and its own reagents. Your skill level against the binding’s level sets the chance; a failed binding wastes the reagents but never harms the piece.

    Better-made pieces hold their bindings more strongly: the enchantment is scaled by the item’s quality. Casting a working from the same school first (it attunes you for a day) and reading a Grimoire of Bindings both make success likelier.

    You may unpick one binding, or all of them, at any time. The reagents are lost.
- id: gd_market
  origin: allora1
  kind: guide
  name: Selling What You Make
  icon: 🏪
  text: |-
    Markets remember. Sell the same crafted thing over and over in one town and its price there falls; it recovers over a few days. Spread your goods around.

    Things made in one realm fetch a fifth more anywhere else, and a little less at home. Every city market is short of one craft each day and pays 40% more for it — the Market page says which, and a Reading of the Markets tells you tomorrow’s.

    A stall (Home › Stall) at one of your homes in a market town sells what you leave on it every day, even while you are away. It costs 150 pf and a fair-copied charter; a shop-front later sells more, at full price. Thieves sometimes help themselves unless the home is sealed with a Warding seal.
- id: gd_arcana
  origin: allora1
  kind: guide
  name: "Magic: the Traditions"
  icon: ✦
  text: |-
    Magic is a skill: you train it by doing. But each tradition is also an art of its own, on Skills › Magic, with its own workings and its own rules.

    Hedge-charms are heard from wise-women and forgotten if unused. Hermetic proofs and seals are bought at the Collegium. Marrean reflections are caught in mirrors. Star-readings are charted at night. Pacts are read off the lintels of Vaelis. Grave-questions come page by page from the Black Codex. Green asks are learned at sacred groves, each in its season. Staves are cut by the Hohenkamm carvers. Wisps are caught in the Nachtwald. Fey bargains are only ever offered. Soft-Light lamps are taught in Dell’s churches. Descents are dreamt. Countersigns are told by survivors. Figures are proven at the College of Angles. Names are given. Blood is read at the Red Ledger.

    Your level decides which workings you may learn and how strong they are, and every tradition’s first working comes with the skill.
- id: gd_animals
  origin: allora1
  kind: guide
  name: "Animals: Keeping & Riding"
  icon: 🐾
  text: |-
    You can keep three animals to begin with, and up to twelve with stables, paddocks and barns at your homes (Standing › Animals). One goes with you in the companion slot (Pack › Equipment): a mount carries you nearly twice as fast, and any animal lends you the gifts of its kind.

    Horses count as your horse for jousting, cavalry and races; a bird of prey counts as your falcon. Dogs help you hunt, track and fight; cats keep you out of trouble; parrots teach you tongues; tortoises steady you; magical beasts do stranger things.

    Every animal has a species, a breed, a name, a personality and a grade. Breeds differ in strength; wild-bred animals are stronger than any market-bred one of the same grade.
- id: gd_workshop
  origin: allora1
  kind: guide
  name: The Workshop
  icon: ⚒
  text: |-
    Craft › Workshop works on things you have already made. Clients, commissions and great works are under Craft › Orders.

    Reforge: raise a piece’s quality one step — up to Masterwork — for half its recipe’s materials, at the recipe’s station. Enchantments survive. The better the piece already is, the harder the next step.

    Salvage: break a piece down for part of what went into it. Better pieces, and a known maker’s mark, give more back. You cannot salvage what you are wearing.

    Maker’s marks: every Masterwork or Legendary piece you make counts towards your mark in that craft. At 5, 15 and 40 your mark is known — a Journeyman’s, Master’s and then Famous mark — adding +3, +6 and +10 to the quality of everything you make in it.
- id: gd_clients
  origin: allora1
  kind: guide
  name: Clients & Commissions
  icon: 🤝
  text: |-
    Craft › Orders lists the people and guilds who want your work.

    Clients are named people — an alderwoman, a prior, a winder-captain, a laureate and many more — in every realm. You hear of them by rumour, once your craft is good enough and you are near where they live; or you meet them by walking in with the skill they want. Each has four orders, ending in a piece they will remember you for. Deliver in person. Work finer than they asked for is remembered: every quality step above an order adds 10% to everything they pay you afterwards. When every order is filled, you may hide them.

    Commissions are guild orders for particular goods at particular qualities, posted on job boards. Once you have seen a guild’s board, it writes to you when it posts work: Orders shows what is posted now, where, what it pays and when it comes down, and what you have in hand. Take a commission at its board. Each guild’s order-book remembers what it has asked of you.
- id: gd_works
  origin: allora1
  kind: guide
  name: Great Works
  icon: 🏗️
  text: |-
    Great Works are made in parts by several different crafts and then assembled by a master — ships, windows, clocks, regalia, tombs, and in the East engines, golems, lanterns, barges, organs and chariots.

    Nobody advertises their plans. You hear of a great work by rumour, once you are good enough at its assembly craft (or at two of its parts) and near where its plans are kept; a client whose great order needs one will also tell you where to find it. Then buy the plans from the guild or court that keeps them (it needs good standing). The plans teach every part and the assembly. Better parts make a better whole.

    Some great works are kept — the Carrack speeds the sea, the Verse-Barge the river-roads, the Chariot every road of the East — some furnish a home, and the rest are what certain clients are waiting for. Once made, a work may be hidden from the list.
- id: gd_arcana_cost
  origin: allora1
  kind: guide
  name: "Magic: Costs & Conditions"
  icon: 🌙
  text: |-
    Will is spent by the Hermetic arts, Pyromancy, Pact-Calling, the Masque and Witchlore. It refills with time, faster with Meditation, and fully with a Nimian descent. A bound spirit holds a fifth of it.

    Other traditions pay otherwise: herbs for charms, hours under the stars for readings, bones, candles and the watch’s notice for grave-questions, land-debt for the Green Way, Bulk for la Grandeur, Fade for the Hush, a drop of blood for Red-Reading, and a price the Gentry collect later for every fey bargain.

    Some workings need night, twilight, a clear sky, a wild place or one of your homes. Lamps and named places work only where you set them; figures only in the home where you built them; staves only while carried.

    The moon runs through eight phases. Most traditions are stronger at some and weaker at others — the Magic page shows which.

    Some magic harms: a misfired proof burns, a calling can scorch you, a reflection may wander off for a day.
- id: gd_arcana_lasting
  origin: allora1
  kind: guide
  name: "Magic: Lasting Workings"
  icon: ⭐
  text: |-
    Every tradition has one working that is cast once, for good, when your skill is deep enough — the Bound Hand at Summoning 10 and the Second Self at Illusion 55 each give you another focus; others give a lasting blessing.

    Two come with a price you can never undo: Giant’s Frame keeps you a little large for ever, and Half-Remembered keeps you a little forgotten. Either one, or any Bulk or Fade still on you, also keeps Bellor’s Mantle from you — and whoever wears the Mantle can never work la Grandeur or the Hush again.
- id: gd_animal_bond
  origin: allora1
  kind: guide
  name: "Animals: Bond & Care"
  icon: 🪮
  text: |-
    Groom and train each animal once a day (the Grooming and Animal Training skills), feed it the food its kind eats, and give it treats it loves. Its bond grows from Wary through Tolerant, Fond and Devoted to Soul-Bound, and each stage makes it better at everything.

    Three days without food, or four without grooming or training, and the bond fades. Grooming and training work out in the world — at stables, kennels and the Menagerie — count as care for your companion too.

    Cooked feeds win far more trust than plain food: fodder-mash for horses and other beasts of burden, hound-biscuits for dogs and cats, seed-cake for birds, fish-and-meat mince for hawks, reptiles and frogs. Treats: sugar cubes and stable stout for horses, palm-wine for elephants, catnip for cats, chew-bones and leather balls for dogs, feather lures for hawks, bell-toys and mirror baubles for birds, basking stones for reptiles.

    Personality matters: a Greedy animal loves food and gets hungry sooner; a Playful one loves toys; a Loyal one forgives neglect; a Proud one bonds slowly but gives more; a Wilful one gives a great deal and forgives nothing.
- id: gd_animal_grades
  origin: allora1
  kind: guide
  name: "Animals: Grades & Markets"
  icon: 🔎
  text: |-
    Grades run F, E, D, C, B, A, S, SS, SSS — each rarer than the last, in the markets and in the wild.

    Animal markets in many towns restock every six days, each with its own breeds; the great horse-fairs and southern markets sell finer stock. Dealers price an animal by what it looks like, which can be two grades from the truth. Your Animal Appraisal decides how clearly you see: no idea at first, a range of grades as you learn, the exact grade at mastery. Look an animal over before you buy; once it is yours, you see it plainly.

    Dogs and cats are only ever bought, save for their magical breeds. Elephants are found only in the south.
- id: gd_taming
  origin: allora1
  kind: guide
  name: "Animals: Taming"
  icon: 🪢
  text: |-
    The finest animals are only ever wild: Porceps-blood stallions, ghost-leopards, dream-lions, sea-mares, winged bulls.

    At a wild place, choose the animal you are after on the “Search for a wild animal” activity at the bottom of the list. It takes a focus and time — longer for rarer animals, less as your skill grows — and uses Tracking, or Climbing, Foraging or another fitting skill. When you find one, the search stops and your Animal Appraisal tells you its grade as best it can; let it go and search again if it is not good enough.

    Taming takes several steps, shown as step 2 of 5, and uses Taming with a second skill — Horsemanship for horses, Survival for wolves, Dreaming for dream-creatures. Some need bait or a tool: a tamer’s halter for anything you ride, a falconer’s hood for hawks and eagles. One failure and the animal is gone; dangerous ones may hurt you as they go.

    Wild horses can be taken early in Sarlon (the Plains of Torrecas, the Peñagris), in the middle years on the Gramall prairie, and at the last in the Red Land and the Mirror Shallows. Learn the trade at the Grand Menagerie of Fin and Drell.
- id: gd_animal_links
  origin: allora1
  kind: guide
  name: "Animals: Faith, Magic & Husbandry"
  icon: 🙏
  text: |-
    The gods of beasts favour their own creatures among their faithful: the Greenwife wild-tamed animals, Laishma reptiles and monsters, Bellor horses, Phorn birds, Torrad, Leima and Shure hounds and wolves, Parod bulls and elephants, Qo serpents, Norrae frogs; Hiyam makes animal markets cheaper.

    Every magical breed answers to an art — a Black Shuck to Necromancy, a Moon-Cat to Dreaming, a Winged Bull to Name-Binding — and grows stronger as you master it. Nature Magic eases taming; the Beast-Charm, Ask the Wild’s Favour and the Name of the Beast all help.

    Beast-Leechcraft and Herding make every animal a little stronger; Herding makes them bond faster, and Beast-Leechcraft slows the harm of neglect.
- id: gd_qoul
  origin: allora1
  kind: guide
  name: Qoul and the Sea-Seal
  icon: 🌴
  text: "Qoul is the endgame: everything there starts at skill 45 and runs to 75–80, and its quests are 7★ and 8★. To go, you need Raben’s Sea-Seal from the Consulate of the Winged Bulls in Tarsena: eight skills at level 45 and a 300 pf fee, and your first passage is paid. Then sail from the Bay of Tarsena (six days, 500 pf); you come home the same way from Port Abzu. Qoul and Thoolma are neighbours: Sealands galleys run between Dilmun and Plandor in four days, for those who hold both the Sea-Seal and Thoolma’s travel permit. Three empires share the continent — Raben, Ahnara and Beth-Arum — with two smaller, neutral powers between them: Ashqel of the Two Thrones on the north-west coast, and Elissar of the Long Night on the Western Gulf."
- id: gd_east
  origin: allora1
  kind: guide
  name: "The East: Thoolma"
  icon: 🏛️
  text: |-
    The East is the mid-endgame: everything there runs from skill 65 to 85, and its quests are 9★ and 10★.

    To go, apply to the Thoolman clerk at Ca’ Loredel’s water-gate on Marre’s Grand Canal. The imperial travel permit costs 10,000 pf, and the clerk will only issue it to someone with at least ten skills at level 65. Your first galley is included; after that the fare is 500 pf each way, from Marre or from Morena to Plandor’s Narrows Harbour.

    Plandor is a city of seventeen districts. Its new skill, Petitioning, is learned at the Gate of Petitions and the Ministries; the Map tab gains a panel for the East once you arrive.
- id: gd_hum
  origin: allora1
  kind: guide
  name: The Hum
  icon: 〰️
  text: |-
    South of Therama, under the Raizon, the Hum bends whatever it touches. Places in the jungle show its depth as a chip at the top of the Activities tab.

    In the Murmur (Gramanna and Topila), Horology is learned 12% slower and every Magic skill 8% slower, while Gem-Cutting goes 12% faster at night, because the crystals glow. Deeper in the jungle the Drone and the Choir are far worse.

    Hum-Reading softens all of it: every level takes away one percent of the penalty, up to four-fifths at 80. It is learned on the Listening Stone of the Rime Table, on the Floor, and by the cold Negarro, and it is learned faster the deeper the Hum.
- id: gd_south
  origin: allora1
  kind: guide
  name: The South and the Reach
  icon: 🗝️
  text: |-
    South of Gramanna and Topila the Hum deepens into the Drone. Horology is learned at less than half the speed, Gem-Cutting a third slower and every Magic skill a quarter slower, and every danger is a little worse. Hum-Reading softens all of it — learn it at the Stipend Stone’s Listening Ledge, from the Frizata on the Ondoro, and on Topila’s Rime Table.

    The Southern Reach lies beyond, in the Choir: you need Hum-Reading 40 to walk into it at all. Its language, Old Anquerran, can be begun on Topila’s High Table and in Oruvande itself; Anquerran finds can be deciphered in Oruvande’s counting-houses or at the University of Perlinburg.

    The Keyward visions are a short line of codex entries: begin in the Misremembering archive on the High Table (History 70, Topilan 50). They change nothing in the world but you.
- id: gd_golems
  origin: allora1
  kind: guide
  name: Golems
  icon: 🤖
  text: |-
    Golemcraft is learned at the Winders’ Hall in the Varndum Yards and the Vel Ossira foundries. Every golem is built from parts made by other masters: escapements (Horology 65), vorpal spring-coils (Smithing 70), crystal hearts (Gem-Cutting 75 or Facetcraft 65), warrants (Scribecraft 65, better with Name-Binding), sun-glass eyes (Sun-Smithing 60 or Glassblowing 75), bronze plating (Smithing 65) and sinew cabling (Leatherwork 65).

    The ladder: a brass mouse (1), a winding lark (10), the Second Hand (25, a focus for good), a bronze hound (35), a porter frame (45), the Bronze Apprentice (55, a focus for good), a field-golem for your home (65), a guard golem (75) and the Mirror Engine (85, a focus for good).

    Companion golems walk in your companion slot, where a friend would: taking one along sends any friend home, and asking a friend along sends your golem back to its bench. Keep up to six on the Friends page. They are wound with winding oil instead of fed, oiled and drilled instead of groomed and trained, and keep tune instead of bond. The Hum puts them out of tune; in the Drone they may stop for a day, and in the Choir they stop altogether. A guard golem needs a registration seal from the Winders’ Guild to enter Plandor.

    Maintenance makes every winding, oiling and drilling count for more, and slows the Hum’s hold on a golem. It is trained wherever something is kept running: the Standing Ranks in the Varndum Yards, the cistern-columns, the Thirsty Arch, the wall-engines, the mine winding-gear of Seylon, the mirror-arrays of Topila — and in every shipyard, clockmaker’s and mill in the West.
- id: gd_corners
  origin: allora1
  kind: guide
  name: Demonology and Facetcraft
  icon: ⬛
  text: |-
    Demonology is cast only in a square: the Licensed Square of Plandor’s Round Courts, a Gualdara square on the Ayermar, the Frizata gate-rooms on the Ondoro, the Holdovers’ rent-square — or any wild place in the Drone or the Choir. Each Corner’s bargains carry its price: the Hinge takes promises it collects later, the Kiln a chill, the Maw a hunger for one thing, the Unreckoned a memory (often a recipe you will have to learn again). The Hum makes bargains stronger. Calder, Qo and the Voice dislike it; Laishma and Gruma approve.

    Facetcraft is taught at the Lapidary Houses: each House teaches only its own cuts, in its own room, to its own sworn apprentices. To learn another House’s cuts, give back your oath in the public wheel-room. A learned cut is made at a Lapidary Wheel from a cut crystal, carried, and broken when you want it. The Vessel catches the last spell you cast today from any other tradition, to release later.
- id: gd_stars
  origin: allora1
  kind: guide
  name: The Ninth and Tenth Stars
  icon: ⭐
  text: |-
    The East adds two quest stars above the eighth. Ninth-star (9★) quests are offered across Plandor, Therama, Seylon, Gramanna and Topila; tenth-star (10★) quests run deeper — into the Round Courts, the Ministries’ secrets, the Southern Tribes and the Reach.

    Each star ends in a capstone. Complete eight 9★ quests, reach Petitioning 80 and 700 standing with the Nine Ministries, and you may petition for a mask in the Palace of Faces: sit for the mask-makers in the Gallery, then be carried home through the wards as one of the Answered. Complete six 10★ quests, and the last of the Keyward visions — your hand on the Last Gate’s empty lock — is open to you.

    Neither changes the empire. They change you.
- id: gd_corners2
  origin: allora1
  kind: guide
  name: The Four Corners as Faiths
  icon: 🚪
  text: "In Plandor’s Round Courts the Four Corners are licensed, taxed and worshipped: the Hinge (doors, locks, contracts), the Kiln (fire, ferment, dye), the Maw (growth and hunger) and the Unreckoned (luck and lost things). Each can be your patron, with ranks and boons like any faith — but each rank it gives you, it takes its price: a promise, your warmth, a hunger or a memory. A patron Corner charges you less for its own bargains, if you also practise Demonology."
- id: gd_verse
  origin: allora1
  kind: guide
  name: Verse-Burning
  icon: 📜
  text: |-
    Inscription is the Burning Hand’s art, learned on the Table of the Burning Hand (west of Topila’s High Table) and on the Lantern Reach of the Lumbre (upriver from the Gold Orchards). It needs Poetry 25 to begin.

    Its power is in enchantment: twenty Burned Verses, from the Single Line at level 1 to the Laureate’s Verse at 85, laid into gear at a mirror-array with poem-banners, sun-glass and other eastern materials. Like every school, it can sit beside one enchantment of another school on the same piece.

    A few verses are also read aloud, from the Magic page: by daylight, or anywhere on the Lantern Reach at night — and the noon verse only at noon.
- id: gd_harvest
  origin: allora1
  kind: guide
  name: Fields, Gardens and Orchards
  icon: 🌾
  text: |-
    Farming, gardening, herb-gathering and orchard work bring in kinds, not just “grain” or “herbs”: wheat or rye, onions or leeks, thyme or sage, apples or quinces. Each world grows its own, some kinds only from a certain level, and each has a legendary harvest.

    A recipe that asks for grain, vegetables, herbs or orchard fruit takes any kind you have, cheapest first. Some dishes want one kind — onion soup wants onions. The Catch Book (Skills › Finds) keeps every kind you have gathered.
- id: gd_languages
  origin: allora1
  kind: guide
  name: Languages
  icon: 🗣️
  text: |-
    There are thirty-three tongues in Allora: living languages, old tongues read more than spoken, scripts, a hand-speech, two trade-talks and the Liminal Tongue.

    Fluency comes in stages — Words at 25, Conversant at 50, Fluent at 75 and Native at 100. Speaking the tongue of the place you are in gets you better prices, friendlier people and more standing with everyone there, more with each stage. Rumours overheard in a tongue you barely know come to you in pieces until you are Conversant.

    Living somewhere teaches its tongue a little every day, up to Fluent, and twice as fast if you keep a home there. Related tongues help each other: knowing one tongue of the Seven, the Gallar, Qoul or the East makes the others in its family quicker to learn. The hand-speech and the scripts help the quiet trades; the old tongues help history; and the Liminal Tongue helps with what lives in doorways. Interpreters are paid in every port and court that has more than one tongue.
- id: gd_knacks
  origin: allora1
  kind: guide
  name: Knacks, Fine Work and Mastery
  icon: ✦
  text: |-
    Every skill has four knacks of its own, at 25, 50, 75 and 100. Some make the skill’s own work better — finer pieces, materials left over, a second catch, quieter feet. Many reach further: Augury helps you learn Falconry and tame wild animals, Courtship warms romance, Meditation deepens your Will, Bartering moves prices everywhere, and the crafts make their goods sell dearer. Every knack you hold works all the time, whatever you are doing. A skill’s page lists its knacks first, and says exactly what each one does. For a language, the knacks are its stages of fluency.

    When an activity trains more than one skill, all of them count. The better you are at every one of them, the more likely the work goes especially well — fine work pays half as much again and teaches a little more — and the better your odds at anything that can fail.

    Do the same activity 100, 500 and 2,000 times and you master it, a star at a time: each star makes it quicker and more rewarding. At the third star it has a flourish of its own, and now and then you find something rare while you are at it.
- id: gd_rivals
  origin: allora1
  kind: guide
  name: Rivals and Contests
  icon: 🏆
  text: |-
    Tourneys, regattas, bake-offs, cliff-races, bull-leaps, the Great Contest of the Tables: every world has its contests, held every six days at each venue, and every contest has a rival who wins it more often than they should.

    You meet a rival when you come to their venue good enough to give them a contest. Your score is your skill, your knacks and the best piece of that craft you carry, and a good deal of luck. Rivals get better with time — and faster after you beat them. The first time you win a contest you take its trophy home. Standing › Rivals keeps the record.
- id: gd_curios
  origin: allora1
  kind: guide
  name: Curios
  icon: 🗄️
  text: "Some skills turn up curios: a geode in a seam, a message in a bottle, a pawn-ticket in a stranger’s pocket, a fragment of a dead script. They come now and then while you work, once you are good at the skill, and more often the better you are. A complete set of five makes you 5% quicker at that skill for good — and for the old scripts, five fragments side by side are enough to read the script at last. Skills › Finds keeps the collection, with the Catch Book."
- id: gd_pursuits
  origin: allora1
  kind: guide
  name: Repertoire, Studies and Caravans
  icon: 🎭
  text: |-
    Skills › Repertoire lists the songs, tunes, poems, plays, dances, tales and puppet-plays you know, each with its genre. You pick pieces up while you practise their skill — most often while performing. Choose one to play: in a performance with its skill a known piece pays better, your own works best of all, and every town where you play it remembers you. Every audience has its tastes: some love a genre and pay nearly twice as much for it, some hate it and pay little and think less of you (Codex › Game Concepts › Genres and Audiences). You can write works of your own in any genre you know a piece of; a work grows as you practise its skills, and the better you are, the finer it comes out. Playwriting is learned in the theatres, Choreography wherever dances are made.

    Skills › Studies: at 50 in a Learning or Language skill you can write a treatise on it, at 75 a monograph, at 100 a tome — each longer and better paid than the last. A work grows a little every day and faster as you practise, using ink and parchment as it goes; if you run out, it stops until you have more. The first of each kind on a subject makes that subject 3% quicker to learn for good; after that you can keep writing, for less money.

    Home › Caravans: from a market town, send goods to another market in the same land and back. Bigger caravans pay more; now and then one comes back short. Caravaneering lets you run more at once.
- id: gd_genres
  origin: allora1
  kind: guide
  name: Genres and Audiences
  icon: 🎭
  text: |-
    Every piece in the Repertoire has a genre — a ballad or a lullaby, a farce or a tragedy, a fugue or a drinking tune, a saga or a ghost story, a sonnet or an epic, a reel or a masque. Audiences have tastes. In a performance, a piece in a genre the place loves pays nearly twice as much and makes your name there twice as fast; one it hates pays less than half, and they will think less of you for it. The activity tells you which.

    Taverns and inns love farces, drinking songs, shaggy-dog stories and reels, and hate tragedies, fugues and hymns. Courts and great halls love histories, arias, epics and court dances, and hate farces and drinking songs. Temples love mystery plays, spirituals, hymns and parables, and hate love songs and trickster tales. Streets and fairs love comedy, ballads, tall tales and round dances, and hate fugues and arias. Theatres love tragedy, melodrama and masques, and hate morality plays. Camps love marches, sagas and war dances, and hate love songs and lullabies. Mourners love laments, elegies and ghost stories, and hate comedy. Feasts and weddings love songs of love, romances and wedding dances, and hate laments. Quays love work songs and tall tales, and hate sonnets. Colleges love fugues, satire and riddles, and hate farce. Fields and villages love pastorals, folk airs and round dances, and hate arias and fugues. Quiet places love lullabies and nocturnes, and hate war dances.

    To write a piece in a genre, you must first know one.
- id: gd_cellar
  origin: allora1
  kind: guide
  name: Curing, Pickling and the Cellar
  icon: 🍷
  text: |-
    Curing keeps meat and fish with salt, smoke, ice and wind; Pickling keeps everything else with brine, vinegar and patience. Both run from the first salt fish and sauerkraut to the Imperial Board and the Jar of the Nine Wards, and their food keeps you well on the road.

    A home with a Cellar — or with a brewhouse installed — can lay things down. Wine, mead, brandy, cheese, hams, sausages, vinegar, fish-sauce and some pickles improve with time: after some days they become aged, and some, after many more, become something rare. Aged things are worth more and do more. The better you are at Curing, Pickling or Brewing, the faster your cellar works. Home › Home shows the cellar.
- id: gd_masterpieces
  origin: allora1
  kind: guide
  name: Guild Masterpieces
  icon: 🎖️
  text: "Twenty guilds across the four worlds — the Anvil and the Needle of Kesselhaven, the Glass Isles, the Clock-Carvers, the Bronze-Wrights, the Dye-Houses of the Snail, the Lapidary Houses, the Sun-Smiths, the Winders and others — will make you a Master of their craft if you bring them a masterpiece: a piece of the craft, Superior or better, with the skill of a master, good standing and the guild’s fee. A Master pays no bench fees in that craft anywhere, makes finer work in it, and is paid a quarter more for the guild’s commissions. Craft › Workshop lists the guilds you know."
- id: gd_projects
  origin: allora1
  kind: guide
  name: Building Projects
  icon: 🏗️
  text: |-
    Most houses can be improved. Each has one to three building projects of its own — repair a ruin, clear a field, raise a barn, add a storey, build a library, a sanctum, a bath — listed on its Home page and when it is for sale.

    Every project starts with plans: Architecture and a sheet of parchment. Then come the steps, done in your home as activities: most want Construction and another skill, and materials from other crafts — beams, nails, bricks, panes, doors and windows. A finished project changes the house for good: more space, comfort, rooms that give a bonus while you live there, set-aside places for one kind of furniture, fields and beds to sow, room for more animals, and new things to do at home.

    You keep three animals to begin with. A stable or a paddock makes room for one more, a barn for two, up to twelve in all.
- id: gd_farming
  origin: allora1
  kind: guide
  name: Farming at Home
  icon: 🌱
  text: |-
    Build a field, a garden, an orchard, a greenhouse or a mushroom cellar at one of your homes (Building projects) and you get plots to sow, on Home › Farming.

    Seed comes from gathering — every kind you bring in now and then gives you some to keep — and from markets in farming country. Field plots take grain and vegetables; garden beds take vegetables and herbs; tree plots take saplings, which bear year after year; mushroom beds take spawn and grow all year.

    Each crop grows in its own seasons and takes some days to ripen. Out of season it withers (trees just wait). Water and weed your plots (an activity at that home) and they grow faster and come in heavier and finer: the harvest depends on your skill, how often they were watered and how well they were cared for. Rain waters them sometimes; water-channels every day. A greenhouse grows anything in any season.

    In the wild, crops keep their seasons too: nothing is harvested in winter, and orchard fruit only in summer and autumn.
- id: gd_livestock
  origin: allora1
  kind: guide
  name: Livestock
  icon: 🐄
  text: |-
    Cows, goats, sheep, pigs, hens, geese, ducks, turkeys, llamas and alpacas are sold at animal markets. They cannot be tamed and never go with you: they live at your homes, so you need somewhere to keep them — a barn, paddock or stable for the big beasts, a hen-house (or barn) for poultry, a sty (or barn) for pigs.

    Once a day each gives what it gives — milk, eggs, wool, down or muck (pigs; spread it on a growing plot). The finer the breed, the higher its grade and the closer your bond, the more you get and the finer it is. Feed and groom them as you would any animal. Meat animals can be butchered on the Animals page for meat, fat, hides, bones and feathers; Butchery makes it go further. Butter, cheese, curds and cream are made at a dairy (a churn or press at home, a dairy you build, or a public one); hard cheeses improve in a cellar.

    Keep house: clean each home once a week for a little comfort. Leave it and it goes dusty, then filthy.
- id: gd_ways
  origin: allora1
  kind: guide
  name: The Ways of Faith
  icon: 🕯️
  text: |-
    No two faiths are practised alike. Each has one thing it is really about, and only the practices its gods care for: some have holy days you must keep, some have none at all; some keep relics and some think relics a sin; some gods intervene and some never do.

    Obligations. Some faiths have dates you must keep at a holy place — the Pyre’s Stubble-Burning, the Hollow Nights of winter in Grell, the Feast of the Lagoon, the Palio, the Unveiling, the New Fire of the Four Corners and others. Your faith tells you the day before. If you are not there by the end, you Lapse: you lose a large share of your devotion and earn none until you are restored by that faith’s own act of penance. The strictest faiths — the Pyre, Calder’s Order, Dolma’s Republic, Qo, Seronia and the Voice — cast you out if you Lapse twice in a year (or break their deepest rule): cast out, you hold no rank and no blessings until you are reconciled, which is costly. Anyone newly sworn has one season’s grace.

    Cultivation. The Lamp, Nim and Hetet never act in the world. Their faithful climb by practice to a plateau and need a retreat (or, for Hetet, a proof of exactness) to go further; rank follows.

    Circuits and pilgrimages. Phorn’s Sun-Round, Dell’s Lamp Circuit, Norrae’s Following the Water, Calder’s Bridge-Road, the Hearth’s Ember-Walk and the Voice’s wandering Tent are journeys with rules.

    Duties. Many faiths ask a few shifts every six days — the parish rota, the chapter watch, the copying office, the bells. Keeping them is rewarded; Parod’s lodge shames those who miss them.

    Faith skills. Augury, Exorcism, Keening and the rest have uses inside particular faiths. Five more are learned at holy places in every land: Channeling, Pilgrimage, Lot-Casting, Remembrance and Lustration.

    Anyone may leave a small offering at any shrine, whatever god they follow — it is how you learn what a faith is like before you swear to it. (Qo and the Voice dislike their faithful doing it.) Read each god’s codex entry for its way.
- id: gd_sky
  origin: allora1
  kind: guide
  name: The Sky
  icon: ☀️
  text: |-
    The sun walks through eight Houses in a year — the Plough, the Hart, the Ship, the Twin Lamps, the Sheaf, the Key, the Serpent and the Crown — six days in each. Five Wanderers circle the Houses at their own speeds: the quick Hound, the red Ember, the silver Pale Wife, the steady Judge and the faint Drowned Star. Each is at home in one House, and two in the same House are in conjunction. Three gathered in the sun’s own House make a Great Conjunction, about one day a year; a new moon while the Pale Wife stands in the sun’s House is the Darkened Sun.

    The sky touches only magic, and only some schools: the Hermetic Evocation, Pact-Calling, the Starward Reckoning, Pyromancy, the Crucible, Geomancy, Name-Binding, the Tablets of the Sky and the Burned Verse. A school that heeds the sky says so on its card; one that does not, does not mention it. Anyone can see the sun’s House; Astrology 20 shows the Wanderers, and Astrology 50 the next six days.
- id: gd_schools
  origin: allora1
  kind: guide
  name: Schools of Magic
  icon: ✨
  text: "Magic has two layers. Disciplines are plain skills — Illusion, Alteration, Fae Magic and the rest — trained like any other. Schools are the arts that peoples and orders have made of them: each blends a discipline with others, or with ordinary skills, and its level is the weighted sum. One discipline can feed several schools; the Shade-Walk and the Silvered Masque are both Illusion. Schools differ in almost everything else too. A few keep a grimoire, and each keeps it differently; a few need a focus in the hand; a few hold one working on a house of yours, a tag that lasts a season, and a property can hold only one. Some are learned from a book, some lent, some granted for service, some grown in a field, some only on a hunt in the dark of the moon. Most schools have only two or three such features, and none has them all. Some schools keep a calendar of their own: Corner-Work follows the Four’s Count, and the Rime-Watch the winter. A charm unworked for two seasons is forgotten, and a name bound in clay cracks its tablet each time."
