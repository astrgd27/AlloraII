- id: realm_eintenn
  origin: allora1
  kind: realm
  name: The Duchy of Eintenn
  icon: 🦅
  text: "Smallest of the Seven Principalities and among the richest, Eintenn clings to the northern coast between the Grauwald and the sea. Duke Albrecht IV von Tennfels, called the Salt-Duke, rules from Burg Tennfels through a web of feudal oaths: barons hold their manors of him, knights hold of the barons, and villeins owe labour on the demesne three days in seven. The duchy’s wealth flows from salt in the Salzmoor, silver at Silberhalde and the harbor-tolls of Kesselhaven, whose burghers chafe under ducal taxes and envy the liberties of the merchant-princes of Luggen."
- id: realm_sarlon
  origin: allora1
  kind: realm
  name: The Kingdom of Sarlon
  icon: 👑
  text: "One of the three great powers of the Seven: a vast land-kingdom of dry plateaus, wheat, sheep and windmills, studded with the square tower-castles of its innumerable quarrelsome lords. Its royal city, Valmonte, was taken from the Rabene governors three centuries ago by northern knights who kept the glazed-brick palaces, the terraced gardens, the star-priests and the bath-houses, and added keeps of their own. King Rowan III rules there over a court of five languages. Sarlon’s roads are famous for knights-errant, its inns for liars, and its army for winning wars it has no particular need to fight. The Duchy of Grell lies in its shadow."
- id: realm_luggen
  origin: allora1
  kind: realm
  name: The Republic of Luggen
  icon: ⛵
  text: "A league of brick harbor-towns along the northern coast and its great timber rivers, governed from the city of Luggen by a Prince elected by the merchant houses to serve six years — and then go back to trade. The present Prince, the stockfish-merchant Hartwig Kolbe, is four years into his six and counting the days. Luggen ships most of Allora’s lumber, pitch, furs, stockfish and grain; its Kontors stand in every port, Kesselhaven included. Its bankers learned double-entry from Marre and turned it, some say, into a religion: Luggen is the mother-city of the Currentists of Horro."
- id: realm_marre
  origin: allora1
  kind: realm
  name: The Republic of Marre
  icon: 🪞
  text: "One of the three great powers: the City of Sea-Glass, built on a hundred islands in a turquoise lagoon, its palaces faced with sea-glass and silvered mirror. The Doge is elected for life from one of the Ten Families and rules, with their councils, a colonial empire of islands and trading posts across the southern sea. Marrean galleys carry spice, silk and glass to every port of the Seven. Its illusionists work through mirrors, and its politics are much the same. The Kingdom of Rolla lies under its influence."
- id: realm_grell
  origin: allora1
  kind: realm
  name: The Duchy of Grell
  icon: 🐺
  text: "A small duchy deep in the forested mountains, ruled by the Perlin family for eleven generations — and, increasingly, by Chancellor Baltasar de Ocampo, the third Sarlonese envoy in a row to hold the seals. Grell is a land of crooked half-timbered towns, onion-domed chapels, bone-vaults, dark beer and darker woods, where the winters are long and the memories longer. Twice the Grey Death emptied its valleys, and the Grellish have never quite let their dead go: the year turns on the Hollow Nights, when the living wear the masks of their dead, the chapel bells toll every name, and the dead are said to walk the streets. Will-o’-wisps haunt its forests, its lantern-wrights know how to catch them, and its University at Perlinburg keeps the largest collection of antiquities in the Seven."
- id: realm_dellian
  origin: allora1
  kind: realm
  name: The Bishopric of Dellian
  icon: 🏮
  text: "The smallest of the three great powers in land and the greatest in influence. Dellian is ruled by the Arch-Bishop of the Church of Dell — for twenty years now the formidable Casimir Montfalco — from Dellmont, the white City of Soft Light on its still lake. As a neutral party — a neutrality maintained with great care and considerable cunning — the Arch-Bishop presides over the Dellian Diet, to which each of the Seven sends electors to decide common policy and resolve disputes. Dellian has almost no army and needs none: everyone needs it more than they would gain by taking it."
- id: realm_rolla
  origin: allora1
  kind: realm
  name: The Kingdom of Rolla
  icon: 🧚
  text: A middling kingdom of meadows, vineyards and red-roofed hill-cities, under the heavy influence of Marre. Rolla is famous for its painters, its calcio, its wine, its Hearth-Church — whose High Hearth-Mother, Agathe, keeps the Mother-Hearth in the capital, Valdora — and its fairies. Since old King Aurelio walked into a fairy hill and did not come out, Rolla has been ruled in the names of his twin children, Leto and Lia, aged nine, by a regency council under the Lady Regent, Contessa Beatrice Valcorvo — and a great many Marrean advisers.
- id: realm_qadir
  origin: allora1
  kind: realm
  name: Raben, Beyond the Southern Sea
  icon: 🌴
  text: "Not one of the Seven but far older: the land of two rivers beyond the southern sea, where brick cities rise in stepped temple-towers above canals and date-groves. The scribes of Raben wrote on clay before Allora had letters, its star-priests mapped the heavens from their temple-towers and taught the world to count in sixties, and its kings call themselves the shepherds of their people and rule from Assar of the Winged Bulls. Sarlon was a Rabene province for two centuries, and its court still speaks Rabena; in Tarsena’s Old Quarter, nobody ever stopped. From Raben come spice, frankincense, lapis and dates, the reckoning of the stars — and two of its gods: Laishma, the mother of monsters, and Parod the storm-chief. Marre’s colonies press ever closer to Raben’s shore."
- id: realm_thoolma
  origin: allora1
  kind: realm
  name: Thoolma, the Empire of the Key
  icon: ⚙️
  text: "Far to the east beyond Morena, at the Narrows where the cold Eastern Sea meets the warm Crescent Bay, lies Thoolma: an empire older than the Allorese, of gold-domed chapels, purple silk, mosaics, eunuch-ministers, chariot-races and a court ceremonial so elaborate that ambassadors have died of old age in the antechambers. It is ruled by the Wind-Up Emperor, Stefos Quinallia, from the megalopolis of Plandor; its hill-country of Therama feeds the city; and south of it, beyond a wall of trees three hundred feet high, the jungle of the Raizon runs to the end of the world. Thoolma has no rival in the East. Every other power there is ranked by how much of it Thoolma owns. Marre trades with it, fears it, copies its glass and its lions, and keeps the island of Morena halfway there to make sure Thoolma’s galleys never come any further west."
- id: realm_gallar
  origin: allora1
  kind: realm
  name: Gallar
  icon: 🏔️
  text: "West of the Seven, beyond the Tyer Mountains, lies Gallar: wide plains and rocky hills, ravines and deep northern forests, one great river — the Balm — and a crooked finger of land reaching north into the cold. It is rich in everything except peace. The Sillenians came over the sea long ago, conquered it, carved it into Freeholds and went native so completely that only historians remember how the present order began. Since then the Hide-Lords of the Freeholds have played the Great Old Game against one another without pause, and Gallar has stayed parochial, divided and poor beside its own wealth. One narrow pass crosses the Tyer, and House Vane charges whatever it likes to use it."
- id: realm_ripla
  origin: allora1
  kind: realm
  name: The Freehold of Ripla
  icon: ⭐
  text: "Gallar’s only port, a city on stilts where the Balm meets the ocean: walkways criss-cross above the marsh in many levels, the poor live where the spring tides flood, and Castle Trollin’s tower doubles as a lighthouse on stormy nights. King Rollo of House Doll (sigil: stars) rules one of Gallar’s more stable houses — but in Ripla even the King answers to the Sleepers, independent judges who hear testimony, drink a Nimian draught and dream their way to the true reading of the facts, bound by the rigid Waking Code."
- id: realm_findrell
  origin: allora1
  kind: realm
  name: The Twin Cities of Fin and Drell
  icon: 🌉
  text: "Two cities facing each other across the upper estuary of the Balm, joined by three great bridges, sharing one language and refusing to share anything else. Drell is crowded, urban and crime-ridden, home of the Scorched School of battle-mages and the Grand Menagerie, ruled by young Farris of House Chandice (sigil: a chalice). Fin is rural and spread out among the greatest flower-farms in Allora, ruled from Castle Yollin by young Nolan of House Greer (sigil: a wheel). The houses are cousins, both descended from the Casagnas who first took the estuary; each young lord claims to be the true heir. Against every other Freehold, they stand together."
- id: realm_gramall
  origin: allora1
  kind: realm
  name: The Freehold of Gramall
  icon: 🐎
  text: "A colossal castle-city alone in the middle of the Dorrian prairie, where you can see a storm coming a day away. Old Lord Tamlin of House Brall (sigil: a lance) rules it with the best cavalry in Gallar, which rides its fiefs in circuit to remind them who rules. Gramall is Gallar’s breadbasket: in a bad year, the price of bread everywhere is decided here. Its serfs are the most subjugated people in Gallar — by day. By night they hold the Night Wakes, their own festivals and justice, and the masked Hoppers come over the hedges for anyone who has wronged them."
- id: realm_shella
  origin: allora1
  kind: realm
  name: The Freehold of Shella
  icon: 🐟
  text: "The cold north of the Freeholds, near the source of the Balm, and Gallar’s bastion against the Witch-Queens. Queen Namere of House Joix (sigil: a leaping fish) rules from Onore, a tower-castle of native blue marble. Shellans are hard, live off the forests, and hunt the behemoth ox and the ghost leopard; they are culturally nearer the peninsula’s tribes than to the Freeholds, which leave Shella to bear the brunt of the north alone. The prophet Jonell of the white serpent Qo stands at the Queen’s side."
- id: realm_lomma
  origin: allora1
  kind: realm
  name: The Freehold of Lomma
  icon: 🗼
  text: "The cliff-hold that faces the sky: an ancient city cut into the rock of a ravine above an offshoot of the Balm, its oldest halls carved with faces turned upward by builders no one remembers. King Brace of House Renne (sigil: a tower) rules from the royal quarter on the cliff-top; his upstart father deposed the mad King Peller of House Frond (sigil: a sword). Below spreads Lower Lomma; nearby lie vast pit-mines of iron and rare vorpal bronze. Lomma’s gliders leap from the cliff on wings of waxed silk, and the Eyrie of Phorn crowns the heights."
- id: realm_harrowgate
  origin: allora1
  kind: realm
  name: The Freehold of Harrowgate
  icon: 🗝️
  text: "The Pass-Hold: a switchback fortress-town astride the one trade pass through the Tyer. House Vane (sigil: a key) is the only house in Gallar that can trace its line straight back to the Sillenian invasion, and keeps Gallar’s great archive of histories and genealogies — from which it can prove a royal line, or forge one. Vane is short-sighted and corrupt: it charges ruinous tolls on everything that crosses, wants this year’s money more than Sarlon’s dream of a great land route, and plays the Great Old Game as hard as anyone. In its hills the Grey Lances keep their mercenary camp at Varnholt."
- id: realm_mearc
  origin: allora1
  kind: realm
  name: The Mearc
  icon: 🦴
  text: "The southern half of the crooked finger: land of the Khilns of the bogs, the Molster of the herring coast and the Praen of the hill-forests, the last people of Gallar the Sillenians never conquered. Theirs is a world of mead-halls, oaths, blood-price and riddles, of bone carved into heirlooms and dead hidden in the bog — for the tribes are themselves subject to the Witch-Queens of Wocca, whose Larder takes their dead as tithe."
- id: realm_knuckle
  origin: allora1
  kind: realm
  name: The Knuckle
  icon: 🦌
  text: "The frozen north of the crooked finger, where it bends east. Here the Witch-Queens rule from Wocca, a fort-city of ice and timber: an ancient all-female order who govern through councils under the eldest sisters, the Striga, and whose magic is fed on human flesh. They rose to unite the tribes against the Sillenians, and broke invading armies with winters made to order. Lately they have been on the defensive. The Tithe-Road runs north to Wocca, lined with the houses where the tribes deliver their dead."
- id: realm_qoul
  origin: allora1
  kind: realm
  name: Qoul
  icon: 🌴
  text: "Across the Southern Sea lies Qoul, the old continent, where cities were already ancient when the Allorese Empire was young. Three powers share it and have never stopped quarrelling over it: Raben of the Two Rivers, the empire of clay, stars and winged bulls; Ahnara of the river and the desert, whose geomancer-kings are folded at death into tombs of perfect shape; and Beth-Arum, the covenant kingdoms of the caravan roads, whose capital is wherever their god’s Tent has wandered. Between them stand the Cedar Mountains, which no one has ever held, and to the east the Sealands, where the last of the sages who taught the world to write is said to sleep under an island at the edge of the dawn. Two smaller powers keep their independence by being useful to all three: Ashqel of the Two Thrones, the island city whose coins and dyes are the best in the world, and its daughter-kingdom Elissar in the far south-west, where the elephants march and the nobility is dead."
- id: realm_raben
  origin: allora1
  kind: realm
  name: Raben, the Land Between the Rivers
  icon: 🐂
  text: "The Shepherd-King of Raben rules from Assar of the Winged Bulls, a city of glazed brick and stepped temple-towers between two great rivers. Raben is the oldest empire in the world and the most organised: everything is written on clay, every tablet is sealed, every seal is filed, and the star-priests on the ziggurats read the will of the gods in the night sky. The empire’s power rests on Name-Binding: the colossal winged bulls at its gates are alive, bound by names written on tablets kept in the Tablet-House. A king rules only while the bulls of the gate bow to him. Every subject owes the crown their dreams, which are taken down on clay at dawn and read for omens; and above the south quarter of Assar the Hanging Gardens grow upside-down beneath a terrace held in the sky by names."
- id: realm_sealands
  origin: allora1
  kind: realm
  name: The Sealands
  icon: 🐚
  text: Where the Two Rivers die into a great salt gulf, the marsh-folk of the Sealands live on reed-islands and dive for pearls, nominally the King of Raben’s subjects and actually no one’s. Out in the gulf lies Dilmun, the clean island of sweet springs where the gods were young; and somewhere beyond it, past the Mirror Shallows where a reflection can walk away without you, the island where the last of the Seven Teachers sleeps under a hill, waking for one hour each month to answer a single question.
- id: realm_cedars
  origin: allora1
  kind: realm
  name: The Cedar Mountains
  icon: 🌲
  text: "North-west of Raben rise mountains clad in cedars so tall their crowns are lost in cloud. Every empire of Qoul wants their timber, and none has ever taken it: under the forest sleeps the Resin Mother, whose amber tides seal trespassers where they stand, and whose children are the cedars themselves, which move, slowly, when no one is looking. On a high pass stands the Door of Oaths: while it is shut, the three powers keep the peace. Woodcutters, smugglers and adventurers come; some return with timber worth its weight in silver."
- id: realm_betharum
  origin: allora1
  kind: realm
  name: Beth-Arum, the Covenant Kingdoms
  icon: ⛺
  text: Twelve hill-kingdoms and caravan cities bound by a covenant with a god who has no name and no image, only a Voice that speaks from inside an empty Tent. The Tent wanders by itself across the hills and steppe, and Beth-Arum’s capital is wherever it stands; the twelve Judges follow it with their courts. Its prophets carry their god’s words tattooed on their skin as they receive them, until some of them are more scripture than flesh. Its merchants carry the Arumi tongue, and incense, everywhere in Qoul. In six cities of refuge no blade will leave its sheath; and every year the people’s wrongs are laded onto goats that wander the southern wilderness, growing huge and black with what they carry.
- id: realm_ahnara
  origin: allora1
  kind: realm
  name: Ahnara of the Perfect Shapes
  icon: 🔺
  text: "South along a long green river through the desert lies Ahnara, the kingdom of geomancers. Its rulers, the Apexes, draw power from perfect shapes: every true angle holds something, and a perfect solid holds a soul. When an Apex dies, she is folded into a tomb that is a giant geometric solid — a pyramid, a cube, an octahedron, a twenty-sided star — and the tombs together hold the river’s flood in balance. The present Apex, Merit-Ahn the Ninth, is building her own: a dodecahedron, which no Apex has ever dared. Her subjects send clay doubles inscribed with their names to labour in their place — doubles which have lately begun to hold assemblies of their own — and her embalmers keep not only the dead, but perfect hours of the living, sealed in jars."
- id: realm_redland
  origin: allora1
  kind: realm
  name: The Red Land
  icon: 🏜️
  text: "East of Ahnara’s river the desert is red and endless, and across it stand the tomb-fields: the Valley of Solids, where thirty generations of Apexes lie folded in their shapes, humming faintly at dusk. Tomb-robbers, geomancers, desert-guides and the god-weighers of the Hall of Two Truths all work here; the desert itself is said to be the shadow of a shape too large to see."
- id: realm_ashqel
  origin: allora1
  kind: realm
  name: Ashqel of the Two Thrones
  icon: 🪙
  text: "Ashqel is two cities and two kings. The old city stands on a rock island a mile out to sea; the new one, Ushq, sprawls along the shore opposite; a causeway of cut stone joins them. The island is ruled by the Salt King, who reigns from dawn to dusk, and the shore by the Sand King, who reigns from dusk to dawn, and no law of Ashqel is good until it bears both the noon seal and the midnight seal. By the oldest custom of the city the two kings may never look upon each other: a curtain of fixed mood-cloth hangs across the middle of the causeway, and if ever the kings’ eyes meet, both reigns end that hour. Ashqel has no army worth the name. It is independent because every power in Qoul needs its coins, which are the truest in the world, and its mood multi-color, which shows what you feel."
- id: realm_elissar
  origin: allora1
  kind: realm
  name: Elissar of the Long Night
  icon: 🐘
  text: "Four hundred years ago a princess of Ashqel, Elishat, fled her brother the Salt King with a ship of loyal nobles and landed on a hill above the Western Gulf. The local chief offered her as much land as an oxhide could cover; she cut the hide into a single thread and walked it round the whole hill, and Qartosh, the New City, stands inside the thread still. When a foreign king demanded her hand she built her own pyre and climbed it. But in Elissar, as in all the old west of Qoul, the living feed their dead — bread and wine set in a niche at every threshold, every new moon — and Elishat’s people fed her so faithfully that she never left. Her nobles followed her into the dark the same way. They are the Rephaim, the Hundred and Four, the fed dead: they wake at dusk, rule by lamplight, keep the greatest library in the world, and drink the Red Cup that the citizens give them each new moon. Only the elephants are not afraid of them — and so the mahouts, who are the living, are the only power in Elissar the nobility cannot command."
- id: realm_plandor
  origin: allora1
  kind: realm
  name: Plandor, City of Wards
  icon: 🏛️
  text: "Plandor is the first megalopolis of Allora: four million people living under gold and glass domes on the hills that ring the Narrows and the Crescent Bay. It is built in wards, each a dome or a cluster of domes with its own climate, its own water and its own clock, and a citizen is born “of” a ward the way a Gallarian is born of a freehold. Arched skyways carry the streets between the domes; canals run beneath, through cisterns older than the city. Many people are born, live and die under the domes without seeing the open sky. At the city’s heart, walled off as a city of its own, the Imperial Quarter holds the Palace of Faces, where the Wind-Up Emperor sits between his golden lions and is wound each dawn with a golden key."
- id: realm_therama
  origin: allora1
  kind: realm
  name: Therama, the Hill-Country
  icon: ⛰️
  text: "Therama is the hill-country that keeps Plandor alive: grain terraces, silk farms, golem foundries and the head of the great aqueduct, all of it owned by city money. Its people call Plandor “the Mouth”. The hills are soft volcanic stone, so Theramans carve their towns into them — whole villages inside hollowed hill-cones, fields on top, dovecotes in the cliffs — and their farms are worked by slow iron field-golems leased from the Winders’ Guild. South of the last terrace, one mile off, the grass stops and a wall of trees three hundred feet high begins: the Raizon."
- id: realm_seylon
  origin: allora1
  kind: realm
  name: The Kingdom of Seylon
  icon: 🏔️
  text: Seylon is the oldest kingdom in the East and the most thoroughly owned. Its kings are crowned in Plandor, its heirs grow up there as honoured guests, and a Thoolman Resident of the Key lives in the king’s palace and signs after him. It is a high country of terraced valleys, glacier lakes and basalt monastery-fortresses, whose people keep their records on knotted cords and their ward-stones carved with knots that have no corners. Its mountains are veined with crystal that hums in the hand — the reason Thoolma keeps it. In the round, rock-cut gambling-halls called Dorums, Seylon plays Kalazt, loses to its masters, and listens.
- id: realm_gramanna
  origin: allora1
  kind: realm
  name: Gramanna, the Kingdom of Bells
  icon: 🔔
  text: "Gramanna is a loud, hot, river-born kingdom whose people live on boats as much as on land. Every boat, door and dancer wears bells, because bells warn: of shoals, of Magnates, and of death. Its queen is elected for life from the Pilots’ Lodge; its executioners serve courts across the empire by treaty; and at Campanara, its half-floating capital, the black Negarro and the gold Lumbre run side by side for nine miles without mixing. It is Thoolma’s ally, not its subject, because Thoolma’s southern fleet cannot sail one mile without a Gramannan pilot aboard."
- id: realm_topila
  origin: allora1
  kind: realm
  name: Topila, the Kingdom of Tables
  icon: 🏔️
  text: Topila is a land of sheer-sided table mountains rising out of the jungle into cloud. The jungle below is the Floor; the flat mesa-tops are the Tables, and on them stand monasteries, roast-houses, mirror-arrays and poem-banners strung on ropes between the peaks. Its ruler, the Abbot-Laureate, is chosen each decade by a poetry contest. Its tribute to Thoolma is one poem a year, delivered to the Ministry of Petitions; twice in history it was rejected, and twice there was war.
- id: realm_south
  origin: allora1
  kind: realm
  name: The Southern Tribes
  icon: 🌿
  text: In the deep Raizon, Thoolma rules by paying people. Each spring its officers carry salt, steel and Seylon crystal to the Stipend Stone at the edge of the Drone, and the tribes who take it hold the frontier for the empire. The Greza fold their silk villages shut in the canopy of the white Teira and sell their Velatores by the job; the Dapillans are ruled by a child, and so cannot sign a treaty; the Kilopa live on the backs of Magnates and travel with them; the Gualdara follow the River of Yesterday and never camp twice in the same clearing; and the Frizata, who belong to no tribe, heal all of them. Here the Hum is the Drone. Clockwork runs backwards in the small hours, crystal sings aloud, and spells slip. The Four are worshipped openly, in squares cut for the purpose.
- id: realm_reach
  origin: allora1
  kind: realm
  name: The Southern Reach
  icon: 🗝️
  text: "The Southern Reach is the vacated heart of Anquerra: whole cities closed up, tidied and left, with a key hanging on a nail beside every door and a notice of vacancy above it. Anquerra did not fall. Its Lease with the Four ran out after seven hundred years, the jungle sent notice, and it left on time. Now the Reach is held by the Choir-depth Hum, by Magnates as tall as towers, by two hundred Holdovers who still pay the rent, and by Gleaners who loot the houses and are careful to put every key back. No golem or clock has ever worked here. Nobody from Plandor has reached the Last Gate."
