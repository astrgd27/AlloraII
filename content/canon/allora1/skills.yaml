  category: crafting
  order: 307
  requires:
    physick: 40
- id: psalmody
  origin: allora1
  kind: skill
  name: Psalmody
  icon: 🪕
  description: "The sung poetry of Beth-Arum: psalms, laments and songs of ascent to the lyre, sung before the Wandering Tent."
  category: performance
  order: 308
  requires:
    singing: 40
- id: geomancy
  origin: allora1
  kind: skill
  name: Geomancy
  icon: 🔺
  description: "Power in measure, angle and stone: figures that hold a house true."
  category: magic
  order: 309
  requires:
    mathematics: 45
- id: namebinding
  origin: allora1
  kind: skill
  name: Name Magic
  icon: 🗿
  description: "Power over what is named: a friend, a place, a beast, a Wanderer in the sky, or yourself."
  category: magic
  order: 310
  requires:
    lang_qadiri: 45
    willpower: 40
- id: scribecraft
  origin: allora1
  kind: skill
  name: Scribecraft
  icon: 📜
  description: "The clay-and-reed bureaucracy of Raben: wedge-script, tablet-filing, sealing and the endless art of finding the right tablet in the right house."
  category: learning
  order: 311
  requires:
    literacy: 45
- id: lang_ahnari
  origin: allora1
  kind: skill
  name: Ahnari
  icon: 🔺
  description: The language of Ahnara, written in pictures that are also angles; its geometers say every word is a shape.
  category: languages
  order: 312
  requires:
    literacy: 30
- id: lang_arumi
  origin: allora1
  kind: skill
  name: Arumi
  icon: ⛺
  description: The trade-tongue of Beth-Arum’s caravan cities, spoken from the Cedar Mountains to the Sealands by everyone who buys or sells.
  category: languages
  order: 313
  requires:
    bartering: 20
- id: irrigation
  origin: allora1
  kind: skill
  name: Canal-Craft
  icon: 🌊
  description: "Canals, sluices, shadufs and the river-law that governs who may drink: the work on which every city of Qoul stands."
  category: landcraft
  order: 314
  requires:
    farming: 30
- id: prophecy
  origin: allora1
  kind: skill
  name: Prophecy
  icon: 📢
  description: "Speaking for a god who speaks back: the trance, the burden and the terrible plainness of the prophets of the Tent."
  category: faith
  order: 315
  requires:
    theology: 40
- id: bullleaping
  origin: allora1
  kind: skill
  name: Bull-Leaping
  icon: 🐂
  description: Vaulting the horns of a charging bull — a sacred sport of the Rabene courts, where the bulls are sometimes winged.
  category: athletics
  order: 316
  requires:
    acrobatics: 40
- id: shieldwall
  origin: allora1
  kind: skill
  name: Shield-Wall
  icon: 🛡️
  description: "Fighting locked shoulder to shoulder behind overlapping shields: the hearth-troops of the Mearc, the Grey Lances on foot, the bridge-guards of Drell."
  category: martial
  order: 317
  requires:
    shieldwork: 10
- id: curing
  origin: allora1
  kind: skill
  name: Curing
  icon: 🐟
  description: "Salt, smoke, ice and wind: hams in the smoke-loft, stockfish on the racks, kippers over oak, fish packed in natron, venison hung in the north wind, and the ice-hams of Negarro. Cured food keeps for a season and travels anywhere, and the best of it is worth more than fresh."
  category: crafting
  order: 318
  requires:
    cooking: 10
- id: intrigue
  origin: allora1
  kind: skill
  name: Intrigue
  icon: ♟️
  description: "The Great Old Game played in person: whose cousin owes whom, which house is about to turn, and how to be useful to both sides of a quarrel."
  category: social
  order: 319
  requires:
    insight: 15
- id: riddling
  origin: allora1
  kind: skill
  name: Riddling
  icon: ❓
  description: "The mead-hall art of the peninsula: riddles, kennings and word-contests, where a clever tongue wins mead and a slow one buys it."
  category: performance
  order: 320
  requires:
    poetry: 5
- id: graverobbing
  origin: allora1
  kind: skill
  name: Grave-Robbing
  icon: ⚰️
  description: Taking back from the dead what the living buried with them. In Gallar the rich go to Seronia in their jewels, so it pays — and it is the worst crime there is.
  category: skullduggery
  order: 321
  requires:
    sneaking: 15
- id: factoring
  origin: allora1
  kind: skill
  name: Corn-Factoring
  icon: 🌾
  description: "The grain trade of Gallar: buying the harvest before it is cut, holding it against the lean months, and knowing that in Gramall the price of bread is power."
  category: trade
  order: 322
  requires:
    bartering: 15
- id: genealogy
  origin: allora1
  kind: skill
  name: Genealogy
  icon: 🌳
  description: "Lines of descent: who begat whom, which marriages were real, and which great house is two generations old. The currency of the Great Old Game, kept at Harrowgate."
  category: learning
  order: 323
  requires:
    literacy: 15
- id: floristry
  origin: allora1
  kind: skill
  name: Floristry
  icon: 🌺
  description: "The craft of the Fin florists: breeding named blooms, keeping their secrets, and dressing weddings and graves in them."
  category: nature
  order: 324
  requires:
    gardening: 15
- id: icecraft
  origin: allora1
  kind: skill
  name: Ice-Craft
  icon: 🧊
  description: "Living and moving on ice: crampons and crevasses, snow-holes and sledges, reading a frozen ford, fishing through the floe."
  category: landcraft
  order: 325
  requires:
    survival: 10
- id: keening
  origin: allora1
  kind: skill
  name: Keening
  icon: 😢
  description: "The art of mourning aloud: the funeral laments of the Ringed, the name-chants of the Dread-Nights, the boat-songs of the Molster dead."
  category: faith
  order: 326
  requires:
    singing: 10
- id: minting
  origin: allora1
  kind: skill
  name: Coin-Striking
  icon: 🪙
  description: "Assaying silver, cutting dies and striking coin: the craft of the Mint of True Weight, whose shekels ring true on any scale in Qoul — and false in a liar’s hand."
  category: crafting
  order: 327
  requires:
    goldsmithing: 40
- id: elephantry
  origin: allora1
  kind: skill
  name: Elephantry
  icon: 🐘
  description: The training and riding of war-elephants, as the mahouts of Elissar practise it. Elephants are bought or tamed only in the south.
  category: nature
  order: 328
  requires:
    animal_lore: 40
- id: lang_ashqeli
  origin: allora1
  kind: skill
  name: Ashqeli
  icon: 🐚
  description: The sea-tongue of Ashqel and its daughter-city Elissar, written in the twenty-two letters of the first alphabet, which Ashqeli sailors carried to every shore that would buy something.
  category: languages
  order: 329
  requires:
    literacy: 30
- id: redreading
  origin: allora1
  kind: skill
  name: Blood Magic
  icon: 🩸
  category: magic
  order: 330
  description: "Power in blood, freely given: reading a life in a drop."
  requires:
    insight: 45
    willpower: 40
- id: grooming
  origin: allora1
  kind: skill
  name: Grooming
  icon: 🪮
  description: Brushing, bathing, hoof and claw. Grooming once a day builds an animal’s bond; a grooming kit helps.
  category: nature
  order: 331
- id: beast_training
  origin: allora1
  kind: skill
  name: Animal Training
  icon: 🦮
  description: Teaching an animal to answer and to work. Training once a day builds its bond; a training whistle helps.
  category: nature
  order: 332
- id: taming
  origin: allora1
  kind: skill
  name: Taming
  icon: 🪢
  description: Winning a wild animal over, step by step, at the places where the finest animals live. One mistake and it is gone.
  category: nature
  order: 333
- id: animal_appraisal
  origin: allora1
  kind: skill
  name: Animal Appraisal
  icon: 🔎
  description: Judging an animal’s true grade at a glance — in the market before you pay, or in the wild before you spend the day taming it.
  category: nature
  order: 334
- id: petitioning
  origin: allora1
  kind: skill
  name: Petitioning
  icon: 📨
  category: social
  order: 335
  description: "The Thoolman art of asking: how a request is worded, which of the nine forms of address it wears, when it is handed in, and which usher is tipped. In Plandor anyone may petition the Emperor, and a petition that is answered earns the petitioner a mask in the Palace of Faces."
  requires:
    lang_thoolmic: 40
    rhetoric: 45
- id: lang_seylonese
  origin: allora1
  kind: skill
  name: Seylonese
  icon: 🏔️
  description: "The old tongue of Seylon: guttural, exact, with a separate set of numbers for counting on cords. The Dorums swear in it; the Lapidary Houses teach in it; the king’s heir has forgotten it."
  category: languages
  order: 336
  requires:
    literacy: 30
- id: cordreading
  origin: allora1
  kind: skill
  name: Cord-Reading
  icon: 🪢
  description: Reading and tying knotted-cord records — the script of Seylon’s valleys and of Thoolma’s Ministries. A good Cord-Reader remembers everything she has ever tied, and can feel a lie in a knot.
  category: learning
  order: 337
  requires:
    memory: 30
- id: kalazt
  origin: allora1
  kind: skill
  name: Kalazt
  icon: 🃏
  description: "The card game of the Dorums: four suits for the four Corners and a fifth suit of Rounds that can only be played all-in. Its cards are backed with thin crystal, and a great player feels a bluff in the card’s hum — and learns to bluff the crystal."
  category: skullduggery
  order: 338
  requires:
    dicing: 30
- id: lang_gramannan
  origin: allora1
  kind: skill
  name: Gramannan
  icon: 🔔
  description: "The river-tongue of Gramanna: fast, musical and built so that every sentence can be rung on a bell. Pilots talk across a river in it with a hand-bell; judges pass sentence in it from a hammock."
  category: languages
  order: 339
  requires:
    literacy: 30
- id: lang_topilan
  origin: allora1
  kind: skill
  name: Topilan
  icon: 📜
  description: The poets’ tongue of the Tables, with eleven tenses — one of them for things remembered wrongly. Every roast-house argument in Topila is conducted in it, and most of them in that tense.
  category: languages
  order: 340
  requires:
    literacy: 30
- id: bellfounding
  origin: allora1
  kind: skill
  name: Bell-Founding
  icon: 🔔
  description: "Casting bells, from a child’s birth-bell to the sounding-bells of the pilots and the great bells of Campanara: moulding, pouring, and the long, patient tuning that decides what a bell will say."
  category: crafting
  order: 341
  requires:
    smithing: 30
- id: sunsmithing
  origin: allora1
  kind: skill
  name: Sun-Smithing
  icon: ☀️
  description: "Forging and fusing with focused sunlight on the mirror-arrays of Topila: sun-glass clearer than any furnace makes, and blades tempered at noon. A Sun-Smith works only while the sun is high."
  category: crafting
  order: 342
  requires:
    smithing: 30
- id: mosaic
  origin: allora1
  kind: skill
  name: Mosaic
  icon: 🧩
  description: Setting tesserae of glass, stone and gold into floors, walls and domes, as the Copyists do under the Dome of the Exemplar and the Gramannans do in the Temple of the Mother of Bells.
  category: crafting
  order: 343
  requires:
    masonry: 20
- id: sway
  origin: allora1
  kind: skill
  name: The Sway
  icon: 💃
  description: Gramanna’s dance that is also a fight, done in a ring of bell-ringers. Disputes are settled by it; Thoolman officers learn it badly. Every step is on a bell-stroke, and a missed stroke is a fall.
  category: athletics
  order: 344
  requires:
    dance: 30
- id: humreading
  origin: allora1
  kind: skill
  name: Hum-Reading
  icon: 〰️
  description: "Feeling the depth of the Hum and moving through it: knowing by your teeth where clocks will drift, crystals sing and spells slip. A good Hum-Reader suffers its effects far less than anyone else."
  category: landcraft
  order: 345
  requires:
    willpower: 30
- id: lang_stipend
  origin: allora1
  kind: skill
  name: Stipend-Talk
  icon: 🧂
  description: "The trade pidgin of the southern frontier: Thoolmic bones, Gramannan music and a dozen tribal tongues hung on them. Nobody’s first language and everybody’s second, it is spoken at the Stipend Stone, in Gualdara camps and over Greza contracts."
  category: languages
  order: 346
  requires:
    persuasion: 20
- id: lang_velator
  origin: allora1
  kind: skill
  name: Velator Hand
  icon: 🤫
  description: The silent sign language of the Greza, made with the fingers inside a sleeve. Laughter in a folded village is a hand sign; so is a contract, and so is a death. The Unwritten School’s spies pay well to learn it.
  category: languages
  order: 347
  requires:
    sneaking: 30
- id: lang_anquerran
  origin: allora1
  kind: skill
  name: Old Anquerran
  icon: 🗝️
  description: "The language of the Lease: a legal tongue with no word for “forever”, kept alive only by the Holdovers of the Southern Reach and seven hundred years of rent-ledgers. Every sentence in it has a term and a date of expiry."
  category: languages
  order: 348
  requires:
    archaeology: 30
    literacy: 40
- id: canopy
  origin: allora1
  kind: skill
  name: Canopy-Craft
  icon: 🕸️
  description: "Living, moving and building in the high canopy: rope-ways, silk pods and falls you mean to take. The Greza fold their villages shut by day three hundred feet above the ground; Canopy-Craft is how you get there, and how you stay."
  category: landcraft
  order: 349
  requires:
    climbing: 30
- id: magnateclimb
  origin: allora1
  kind: skill
  name: Magnate-Climbing
  icon: 🐢
  description: Scaling a living, moving giant — shell, spine and shoulder — and keeping your footing while it walks. The Kilopa are born to it, and get ground-sick on still earth; everyone else learns it on the flanks of Old Corolla, slowly.
  category: athletics
  order: 350
  requires:
    climbing: 40
- id: machete
  origin: allora1
  kind: skill
  name: Machete
  icon: 🔪
  description: The Gualdara blade, carried from birth to burial. Its fighting style comes from clearing trees, so it is deadliest in thick growth where swords catch, and it cuts the truest squares on the Ayermar.
  category: martial
  order: 351
  requires:
    woodcutting: 20
- id: silkcord
  origin: allora1
  kind: skill
  name: Silk-Cord
  icon: 🧵
  description: "The Velatores’ art of the cord: binding, climbing, disarming and holding, with a strand of Teira silk thin enough to hide in a sleeve and strong enough to hang a man from a gorge."
  category: martial
  order: 352
  requires:
    sneaking: 20
- id: sericulture
  origin: allora1
  kind: skill
  name: Sericulture
  icon: 🐛
  description: "Raising silk-moths and reeling their silk: the mulberry-fed worms of Saltrou, and the great dog-sized moths of the Greza gorges that feed on the banks of the Spinning River."
  category: nature
  order: 353
  requires:
    farming: 20
- id: golemcraft
  origin: allora1
  kind: skill
  name: Golemcraft
  icon: 🤖
  description: "Building golems: engineering, not magic. Every golem needs parts only master crafters can make — escapements, spring-coils, crystal hearts, warrants, sun-glass eyes, plating and sinew cabling — so even a brass mouse asks for the work of masters. A golem is wound, not fed, and keeps tune, not bond."
  category: crafting
  order: 354
  requires:
    horology: 30
- id: demonology
  origin: allora1
  kind: skill
  name: Demonology
  icon: ⬛
  description: Bargains with powers from outside, made in a square and paid for later.
  category: magic
  order: 355
  requires:
    willpower: 30
- id: facetcraft
  origin: allora1
  kind: skill
  name: Crystal Magic
  icon: 💠
  description: "Storing and shaping power in cut crystal: a working kept in a facet until it is broken."
  category: magic
  order: 356
  requires:
    gemcutting: 40
- id: maintenance
  origin: allora1
  kind: skill
  name: Maintenance
  icon: 🔧
  category: crafting
  order: 357
  description: "Keeping made things running: oiling, truing, winding, patching and shoring. A good hand makes every winding, oiling and drilling of a golem count for more, and keeps the Hum from putting it out of tune. Learned on every quay, wall, mill and workshop where something must be kept going."
- id: verseburning
  origin: allora1
  kind: skill
  name: Inscription
  icon: 📜
  category: magic
  order: 358
  description: "Power in written words: a verse burned, carved or fired into something so that it keeps saying itself."
  requires:
    poetry: 25
- id: baking
  origin: allora1
  kind: skill
  name: Baking
  icon: 🥖
  category: crafting
  order: 3.5
  description: "Bread, pies, cakes and pastries: the craft of the oven. Every culture has its loaf — the ward loaves of Plandor, numbered by ward; the bread set out for the dead in the Seven; ash-bread baked in the sand in Qoul — and every bakehouse its night shift."
- id: playwriting
  origin: allora1
  kind: skill
  name: Playwriting
  icon: 🖋️
  category: performance
  order: 6.5
  description: "Writing for the stage: mummers’ plays, pageants, judgement-plays, puppet-plays and the long dramas of the fourth form. A playwright writes works of their own for the Repertoire, and players across the realms will pay to perform them."
- id: choreography
  origin: allora1
  kind: skill
  name: Choreography
  icon: 🩰
  category: performance
  order: 8.5
  description: "Making dances: steps, figures, the shape of a set and the order of a masque. A dancer performs a dance; a choreographer makes one, and the best are remembered longer than any dancer."
- id: pickling
  origin: allora1
  kind: skill
  name: Pickling
  icon: 🫙
  category: crafting
  order: 318.5
  description: "Brine, vinegar, salt and patience: sauerkraut in the crock, herring in the barrel, olives in brine, oranges in salt, fish-sauce in the pits of Ashqel and the pickle-jars of the Nine Wards. A good pickler can make a summer last until spring, and a great one can make it better."
- id: architecture
  origin: allora1
  kind: skill
  name: Architecture
  icon: 📐
  category: learning
  order: 1.5
  description: "Drawing a building before it exists: proportion, load and line, the fall of light and the run of water. An architect’s blueprint is the first step of every building project; a good one saves a year of mistakes, and a great one is still standing in five hundred years."
- id: construction
  origin: allora1
  kind: skill
  name: Construction
  icon: 🏗️
  category: crafting
  order: 1.5
  description: "Raising what the architect drew: footings, frames, floors, roofs, stairs, arches and vaults. Construction gathers the work of every other craft — the smith’s nails, the joiner’s beams, the glazier’s panes — and makes them into a house."
- id: butchery
  origin: allora1
  kind: skill
  name: Butchery
  icon: 🔪
  category: crafting
  order: 3.3
  description: "Killing cleanly, jointing well and wasting nothing: steaks and chops, sausages and puddings, lard, suet and tallow, hides for the tanner and bones for the stock-pot. A good butcher gets a third more from a beast than a bad one, and the beast never knows."
- id: cleaning
  origin: allora1
  kind: skill
  name: Cleaning
  icon: 🧹
  category: trade
  order: 4.5
  description: "Sweeping, scrubbing, polishing and putting things where they belong. It is a trade like any other, and the great houses pay for it: a household is judged by its floors, its silver and what it does not see under the beds."
- id: channeling
  origin: allora1
  kind: skill
  name: Channeling
  icon: 🌀
  description: Letting something else speak or act through you for a while — a god at a revel, the dead on a Hollow Night or at a feast — and coming back to yourself afterwards. The better you are, the more often it happens and the more you keep.
  category: faith
  order: 467
  requires:
    meditation: 10
- id: pilgrimage
  origin: allora1
  kind: skill
  name: Pilgrimage
  icon: 🥾
  description: "The craft of the sacred road: walking circuits and journeys in the right order and the right season, finding the shrine at the end of a hard day, and arriving in a fit state to pray."
  category: faith
  order: 468
- id: lotcasting
  origin: allora1
  kind: skill
  name: Lot-Casting
  icon: 🎲
  description: "Casting and drawing lots: the bowl of stones, the knucklebones, the marked rods. Lots do not tell the future; they decide, and permit, and the skill is in casting them cleanly."
  category: faith
  order: 469
- id: remembrance
  origin: allora1
  kind: skill
  name: Remembrance
  icon: 📜
  description: "Keeping the names of the dead: finding the forgotten, saying them in order, knowing which bell rings for which family and which mask belongs to whom."
  category: faith
  order: 470
- id: lustration
  origin: allora1
  kind: skill
  name: Lustration
  icon: 💧
  description: "Ritual washing and purification: the cold ford at dawn, the natron water on a tomb floor, the closing of circles, the smoke that takes the stain."
  category: faith
  order: 471
  requires:
    prayer: 5
- id: alteration
  origin: allora1
  kind: skill
  name: Alteration
  icon: 🦋
  description: "Changing a living thing’s shape or nature, or the nature of a thing: the giant’s swelling, the Rime-Watch’s standing wave, the mask that becomes a face."
  category: magic
  order: 572
- id: transmutation
  origin: allora1
  kind: skill
  name: Transmutation
  icon: 🔄
  description: "Changing one substance into another: ore into better ore by fire, rot into soil, fen-water into iron."
  category: magic
  order: 573
- id: restoration
  origin: allora1
  kind: skill
  name: Restoration
  icon: 💚
  description: "Mending bodies and things: closing wounds, drawing out fevers, setting the broken right."
  category: magic
  order: 574
