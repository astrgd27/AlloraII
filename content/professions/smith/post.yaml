# The Smith, and its first post: Guild-smith of the Anvil in Kesselhaven (design bible, The Smith).
- id: post_kesselhaven_guild_smith
  origin: allora2
  kind: post
  roots:
    - g_anvil
    - kess_market
  name: Guild-smith of the Anvil
  trade: smith
  skill: skill_smithing
  place: kess_market
  sub: guilds
  group: g_anvil
  patron: person_eintenn_reinhild
  text: "A bench at the guild forges of Kesselhaven, under guild law and a master's eye."
  # Dues to the Anvil each season, by rank: a guild keeps its own.
  ranks:
    - name: Apprentice
      pay: 0.4
      dues: 2
    - name: Journeyman
      pay: 0.8
      dues: 6
      trial: A journeyman's piece, judged by a master.
    - name: Master
      pay: 1.6
      dues: 15
      trial: A masterpiece, judged by the guild.
    - name: Grandmaster
      pay: 3.5
      dues: 40
      trial: A legendary work.
  # Every piece is forged from a bar the smith brings: better iron, better work.
  materials:
    - { item: iron_ingot, quality: 0 }
    - { item: iron_t2, quality: 1 }
    - { item: iron_t3, quality: 2 }
  # The work of a commission: each step is a check, and each offers a safe way and a bold one.
  work:
    - id: heat
      name: Heat and draw
      hours: 1
      approaches:
        - { id: safe_heat, name: A safe heat, dc: 0 }
        - { id: hot_heat, name: A hotter heat, dc: 5, bold: true }
        # For those who know Hermetic Evocation: the heat brought up by a proof, rolled with that art.
        - { id: proof_heat, name: A heat by proof, dc: 2, magic: skill_evocation }
    - id: weld
      name: Shape and weld
      hours: 2
      approaches:
        - { id: plain_weld, name: A plain weld, dc: 0 }
        - { id: folded_weld, name: A folded weld, dc: 5, bold: true }
        # A technique the guild teaches its masters.
        - { id: pattern_weld, name: A pattern-weld, dc: 9, bold: true, rank: 2, quality: 1 }
    - id: quench
      name: Quench
      hours: 1
      approaches:
        - { id: oil, name: In oil, dc: 0 }
        - { id: water, name: In water, dc: 5, bold: true }
    - id: temper
      name: Temper
      hours: 1
      approaches:
        - { id: even_temper, name: An even temper, dc: 0 }
    - id: finish
      name: Finish
      hours: 1
      approaches:
        - { id: plain_finish, name: Polished and marked, dc: 0 }
        - { id: fine_finish, name: Engraved, dc: 5, bold: true }
