# Tools: things carried that help a skill's work, and wear out with it. `edge` is added to the roll
# of a check that skill makes (shown as the tool's name), and paid work done with it pays a quarter more.
# `wear` is the hours of work before it is spent. Canon items (Allora I) and a few new ones (items.yaml).
