  home: place_eintenn_mud_chapel
  hint: 'a monk with his habit tucked up and mud to the knee'
  meet: '“Boots off,” he says. “The floor is the cleanest thing for a mile.” Then: “Brother Ansgar. I ring the bell and I cut the names.”'
  talk:
    - 'Ansgar has pulled eleven people off the flats by following his own bell back.'
    - '“The tide keeps no hours you can trust,” Ansgar says. “So I keep mine.”'
  sched:
    - at: [place_eintenn_mud_chapel, nave]
      h: [6, 20]
    - at: [place_eintenn_mud_chapel, belfry]
