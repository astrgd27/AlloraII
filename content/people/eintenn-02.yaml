  talk:
    - 'Anselm says a good barrel is tight without glue or nails, and so is a good guild.'
    - '“Everything in this town travels in my work,” Anselm says. “Nobody looks at the barrel.”'
  sched:
    - at: [place_eintenn_coopers_yard, fire]
      h: [6, 20]
    - at: [place_eintenn_coopers_yard, sheds]
- id: person_eintenn_frauke
  origin: allora2
  kind: person
  roots:
    - place_eintenn_eelwater
  name: 'Frauke Fenn'
  title: 'Eel-Smoker of Eelwater'
  region: eintenn
  home: place_eintenn_eelwater
  hint: 'a woman with smoke-red eyes and a string of eels over her shoulder'
  meet: '“Shut the door,” she says. “The smoke is the money.” Then: “Frauke Fenn. You get used to it.”'
  talk:
    - 'Frauke sells half her catch in the market and the other half, she says, to people who do not use the market.'
    - '“Alder, not oak,” Frauke says. “Oak is for people who do not like eels.”'
  sched:
    - at: [place_eintenn_eelwater, smokehouses]
      h: [6, 20]
    - at: [place_eintenn_eelwater, dykes]
- id: person_eintenn_konrad
  origin: allora2
  kind: person
  roots:
    - place_eintenn_inkwell_row
