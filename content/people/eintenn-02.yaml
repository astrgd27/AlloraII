# Eintenn, second batch: twenty-one small places round Kesselhaven, the river, the mines, the hills and the south.
- id: person_eintenn_jost
  origin: allora2
  kind: person
  roots:
    - place_eintenn_salters_gate
  name: 'Jost Marsh'
  title: "Toll-Clerk of the Salters' Gate"
  region: eintenn
  home: place_eintenn_salters_gate
  hint: 'a young man counting carts aloud without moving his lips'
  meet: '“Forty-one,” he says, to nobody. Then, to you: “Jost Marsh. Do not speak to me while a cart is under the arch.”'
  talk:
    - 'Jost knows which carters water their salt, and charges them by the wet weight.'
    - '“Salt goes out, silver comes in,” Jost says. “I am the hinge.”'
  sched:
    - at: [place_eintenn_salters_gate, arch]
      h: [6, 20]
    - at: [place_eintenn_salters_gate, tollhouse]
- id: person_eintenn_wiebke
  origin: allora2
  kind: person
  roots:
