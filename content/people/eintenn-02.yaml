  name: 'Wiebke Tarn'
  title: 'Netmender of the Strand'
  region: eintenn
  home: place_eintenn_netmenders_strand
  hint: 'a woman with a bone needle in her teeth and a net over her knees'
  meet: 'She speaks round the needle. “Wiebke Tarn. Hold that end. No, the other end.”'
  talk:
    - 'Wiebke can tell which boat a net came off by the knots.'
