  home: place_eintenn_inkwell_row
  hint: 'a dusty man reading his own stock with a finger on the line'
  meet: 'He keeps his finger where it is. “Konrad Vellum. You may read standing up for nothing. Sitting down costs.”'
  talk:
    - 'Konrad buys the same books back from the same students every spring.'
    - '“A scholar sells his books in this order,” Konrad says. “Theology first. Then the rest.”'
  sched:
    - at: [place_eintenn_inkwell_row, stalls]
      h: [6, 20]
    - at: [place_eintenn_inkwell_row, garrets]
- id: person_eintenn_lena
  origin: allora2
  kind: person
  roots:
