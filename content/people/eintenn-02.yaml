  title: 'Salt-Panner of the Row'
  region: eintenn
  home: place_eintenn_panners_row
  hint: 'a man with cracked hands and a wide wooden rake'
  meet: 'He shows you his palms. “Ebbo Rake. That is what salt does. Still better than the mines.”'
  talk:
    - 'Ebbo says the moor gives salt to anyone and takes a cart, a horse or a man every few years in exchange.'
    - '“Wind and sun do the work,” Ebbo says. “I only tidy up after them.”'
