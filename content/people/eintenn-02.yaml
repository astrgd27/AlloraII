  region: eintenn
  home: place_eintenn_starwatch_hill
  hint: 'a young woman with a crook, scratching numbers on a slate'
  meet: '“They pay me to keep the sheep off the stones,” she says. “Lena Hale. I learned the rest by listening.”'
  talk:
    - 'Lena can name more stars than most of the students who climb the hill.'
    - '“The sheep do not care which way is north,” Lena says. “I do, now.”'
  sched:
    - at: [place_eintenn_starwatch_hill, fold]
      h: [6, 20]
    - at: [place_eintenn_starwatch_hill, stones]
- id: person_eintenn_ebbo
  origin: allora2
  kind: person
  roots:
