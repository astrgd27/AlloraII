- id: person_marre_menega
  origin: allora2
  kind: person
  roots:
    - morena
  name: 'Menega Gomm'
  title: 'Mastic-Gatherer of Morena'
  region: marre
  home: morena
  hint: 'a woman scraping pale beads of resin from a scored trunk'
  meet: '“Do not step on the tears,” she says. “Menega Gomm. The trees weep, we gather, both empires chew it. Nobody asks the trees.”'
  talk:
    - 'Menega sells to the Fondaco and says the Thoolman quarter pays better and the castle must not know.'
