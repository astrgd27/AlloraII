# Residents for the canon places of Eintenn and Marre that had none with a routine (Phase 1 gate).
- id: person_eintenn_zaneto
  origin: allora2
  kind: person
  roots:
    - kess_fondaco
  name: 'Zaneto Brag'
  title: 'Warehouse Clerk of the Fondaco'
  region: eintenn
  home: kess_fondaco
  hint: 'a neat Marrean with a ledger in each of four languages'
  meet: 'He closes one ledger on his finger. “Zaneto Brag. I count what comes from home, and I am locked in with it at curfew.”'
  talk:
    - 'Zaneto says the compound is Marre with worse weather and better beer.'
    - '“They lock the gate from outside,” Zaneto says. “I have never decided who it protects.”'
  sched:
    - at: [kess_fondaco, warehouses]
      h: [6, 20]
    - at: [kess_fondaco, court]
- id: person_eintenn_kord
  origin: allora2
  kind: person
  roots:
    - kess_undercroft
  name: 'Kord Nail'
  title: 'Door-Keeper of the Cellars'
  region: eintenn
  home: kess_undercroft
  hint: 'a big man on a stool by a door, paring his nails with a knife'
  meet: 'He does not get up. “Kord Nail. You came in by the right stair, so somebody sent you. Keep your hands where I can count them.”'
  talk:
    - 'Kord knows every face that has passed his door and what it owed.'
    - '“Up there they have the Salt Council,” Kord says. “Down here we are quicker.”'
  sched:
    - at: [kess_undercroft, cellars]
      h: [6, 20]
    - at: [kess_undercroft, backroom]
- id: person_eintenn_walburg
  origin: allora2
  kind: person
  roots:
    - aschau
  name: 'Walburg Stock'
  title: 'Vine-Dresser of Aschau'
  region: eintenn
  home: aschau
  hint: 'a woman tying a vine to its stake with a twist of straw'
  meet: '“Mind the ash on your boots,” she says. “Walburg Stock. The Church says the fire is sin. The vines say otherwise.”'
  talk:
    - 'Walburg will not say whether she walks the embers, and nobody asks twice.'
    - '“Wine and ash,” Walburg says. “You cannot have this town without both.”'
  sched:
    - at: [aschau, vineyards]
      h: [6, 20]
    - at: [aschau, vineyards]
- id: person_eintenn_eckart
  origin: allora2
  kind: person
  roots:
    - grauwald
  name: 'Eckart Clamp'
  title: 'Charcoal-Burner of the Grauwald'
  region: eintenn
  home: grauwald
  hint: 'a black-faced man watching a smoking mound as if it might run away'
  meet: '“Do not stand downwind,” he says. “Eckart Clamp. Five days and nights I sit by each one. A clamp that flames is firewood.”'
  talk:
    - 'Eckart sees the verderers and the outlaws both, and tells neither about the other.'
    - "“The wood is the Duke's,” Eckart says. “The smoke is mine.”"
  sched:
    - at: [grauwald, clearing]
      h: [6, 20]
    - at: [grauwald, clearing]
- id: person_eintenn_trudel
  origin: allora2
  kind: person
  roots:
    - wisewoman_hut
  name: 'Trudel Moss'
  title: "Mother Brindl's carrier"
  region: eintenn
  home: wisewoman_hut
  hint: 'a sturdy young woman with a basket on her back and mud to the shin'
  meet: '“She is by the fire,” she says. “Bring something useful. Trudel Moss. I fetch and carry and do not ask foolish questions.”'
  talk:
    - 'Trudel walks to Ostwick and back most days with things wrapped in leaves.'
    - '“She taught me three plants in a year,” Trudel says. “I know them very well.”'
  sched:
    - at: [wisewoman_hut, hut]
      h: [6, 20]
    - at: [wisewoman_hut, hut]
- id: person_eintenn_henner
  origin: allora2
  kind: person
  roots:
    - greenwife_grove
  name: 'Old Henner'
  title: 'Ribbon-Bearer of the Oaks'
  region: eintenn
  home: greenwife_grove
  hint: 'an old man standing at the edge of the trees with a fistful of ribbons, saying nothing'
  meet: 'He puts a finger to his lips and leads you out of the ring before he speaks. “Henner. I tie them for those who cannot walk this far.”'
  talk:
    - 'Henner has never spoken under the oaks and does not mean to start.'
    - '“There is no priest,” Henner says. “That is why people come.”'
  sched:
    - at: [greenwife_grove, oaks]
      h: [6, 20]
    - at: [greenwife_grove, oaks]
- id: person_eintenn_jockel
  origin: allora2
  kind: person
  roots:
    - hohenkamm
  name: 'Jockel Fell'
  title: 'Goat-Herd of the High Meadows'
  region: eintenn
  home: hohenkamm
  hint: 'a wiry man whistling to goats on a slope you would not walk across'
  meet: 'He whistles, and forty heads turn. “Jockel Fell. If the bells stop, look at the sky. If the goats run, do not look. Run.”'
  talk:
    - 'Jockel winters with the stave-carvers and has a rune over his own door he will not explain.'
    - '“Storms do not come here,” Jockel says. “They are made here.”'
  sched:
    - at: [hohenkamm, meadows]
      h: [6, 20]
    - at: [hohenkamm, carvers]
- id: person_eintenn_ruprecht
  origin: allora2
  kind: person
  roots:
    - thunder_caves
  name: 'Ruprecht Load'
  title: 'Iron-Bearer of the Caves'
  region: eintenn
  home: thunder_caves
  hint: 'a broad man with a sack of rusted iron on his back, climbing without hurry'
  meet: 'He sets the sack down with care. “Ruprecht Load. Nails, horseshoes, a ploughshare. The valley sends it. I carry it. They up there do not talk.”'
  talk:
    - 'Ruprecht has carried iron up for twenty years and never been inside when the storm came.'
    - '“I asked one what they wait for,” Ruprecht says. “He looked at the sky.”'
  sched:
    - at: [thunder_caves, caves]
      h: [6, 20]
    - at: [thunder_caves, caves]
- id: person_eintenn_kathe
  origin: allora2
  kind: person
  roots:
    - silberhalde
  name: 'Kathe Wedge'
  title: "Pot-Woman of the Miner's Lamp"
  region: eintenn
  home: silberhalde
  hint: 'a woman filling mugs before the men ask'
  meet: '“Shift is up,” she says, and the door opens. Later: “Kathe Wedge. I count them in. Some nights the count is short.”'
  talk:
    - 'Kathe keeps a slate of what each miner owes and wipes it clean when a shaft takes one.'
    - '“They drink like it is the last,” Kathe says. “Sometimes they are right.”'
  sched:
    - at: [silberhalde, lamp]
      h: [6, 20]
    - at: [silberhalde, lamp]
- id: person_eintenn_harm
  origin: allora2
  kind: person
  roots:
    - salzmoor
  name: 'Harm Sedge'
  title: 'Eel-Catcher of the Salzmoor'
  region: eintenn
  home: salzmoor
  hint: 'a man walking the mud on boards strapped to his feet'
  meet: '“Stop there,” he calls. “That ground is not ground. Harm Sedge. Walk where I walked or go back.”'
  talk:
    - 'Harm knows the hour of every tide and whose boat was in the coves last night, and volunteers only the first.'
    - '“Everyone else drowns,” Harm says. “It is not a saying. It is a count.”'
  sched:
    - at: [salzmoor, flats]
      h: [6, 20]
    - at: [salzmoor, pans]
- id: person_eintenn_jobst
  origin: allora2
  kind: person
  roots:
    - vaelis_ruins
  name: 'Jobst Spade'
  title: 'Digger at Old Vaelis'
  region: eintenn
  home: vaelis_ruins
  hint: 'a sunburnt man sieving earth beside a fallen column'
  meet: '“Mine,” he says, of a hole. “Jobst Spade. That one is mine too. Dig anywhere else. Not after dark.”'
  talk:
    - 'Jobst has found eleven coins, one bronze hand and nothing that would make him stay after sunset.'
    - '“I do not know who carries the lights,” Jobst says. “I have decided not to.”'
  sched:
    - at: [vaelis_ruins, forum]
      h: [6, 20]
    - at: [vaelis_ruins, forum]
- id: person_eintenn_notker
  origin: allora2
  kind: person
  roots:
    - threshold_sanctum
  name: 'Notker Latch'
  title: 'Lamp-Trimmer of the Sanctum'
  region: eintenn
  home: threshold_sanctum
  hint: 'a quiet man filling lamps in an empty hall, counting painted doors under his breath'
  meet: '“By day there is only me,” he says. “Notker Latch. I fill the lamps. At dusk I leave. What they do then is theirs.”'
  talk:
    - 'Notker has counted the painted doors every day and never reached the same number twice.'
    - '“Most are shut,” Notker says. “I do not look long at the open ones.”'
  sched:
    - at: [threshold_sanctum, hall]
      h: [6, 20]
    - at: [threshold_sanctum, hall]
- id: person_eintenn_brida
  origin: allora2
  kind: person
  roots:
    - wp_ferry
