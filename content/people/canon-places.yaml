  title: "Cook of the Ferryman's Inn"
  region: eintenn
  home: wp_ferry
  hint: 'a red-faced woman stirring a pot big enough to bathe in'
  meet: '“Three languages out there,” she says, “and all of them say stew. Brida Ladle. Sit. The ferry will be an hour. It is always an hour.”'
  talk:
    - 'Brida hears the news of three realms a week before the Duke does.'
    - '“He has opinions about everyone who crossed,” Brida says, of the ferryman. “I have them about him.”'
  sched:
    - at: [wp_ferry, taproom]
      h: [6, 20]
    - at: [wp_ferry, taproom]
- id: person_eintenn_florin
