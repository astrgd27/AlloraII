  title: 'Orchard-Brother of Pomerell'
  region: eintenn
  home: pomerell
  hint: 'a monk on a ladder, reading a number painted on a trunk'
  meet: '“Two hundred and six,” he says. “A good bearer. Brother Florin. We know them by number. I also have names for them, which is not allowed.”'
  talk:
    - 'Florin grafted a third of the long ranks himself and can taste which tree a pear came from.'
    - '“Forty brothers,” Florin says, “and four thousand trees. The trees are less trouble.”'
