  region: marre
  home: xonia_shore
  hint: 'a woman wading between drowned columns with a basket on her head'
  meet: '“Low water,” she says. “Come and see the steps. Bona Sass. They go down further than anyone has walked.”'
  talk:
    - 'Bona sells shells to the bead-makers and keeps the carved stones she finds to herself.'
    - '“Somebody built a stair into the sea,” Bona says. “Or the sea came up the stair.”'
