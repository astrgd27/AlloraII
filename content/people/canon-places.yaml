- id: person_marre_tadeo
  origin: allora2
  kind: person
  roots:
    - xonia_sunken
  name: 'Tadeo Rin'
  title: 'Listener at the Crucible'
  region: marre
  home: xonia_sunken
  hint: 'a thin man lying with his ear to the ground'
  meet: 'He holds up a hand for quiet, then sits up. “Tadeo Rin. It rings. Strike it there and listen. Like glass. I have been listening nine years.”'
  talk:
    - 'Tadeo says the ringing changes with the tide, and that nobody will pay him to find out why.'
    - '“The divers bring up statues,” Tadeo says. “I would rather know what the vessel held.”'
