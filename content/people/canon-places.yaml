    - at: [pomerell, orchards]
      h: [6, 20]
    - at: [pomerell, church]
- id: person_marre_zorza
  origin: allora2
  kind: person
  roots:
    - wp_lighthouse
  name: 'Zorza Lant'
  title: 'Wick-Trimmer of the Lantern'
  region: marre
  home: wp_lighthouse
  hint: "a woman polishing a mirror the size of a church door, a hand's breadth at a time"
  meet: '“Do not breathe on it,” she says. “Zorza Lant. The old man keeps the lamp. I keep the glass. One smear and a ship is on the rocks.”'
  talk:
    - 'Zorza has watched three ships break below and trimmed the wick through each.'
    - '“The rocks were here first,” Zorza says. “We only argue with them.”'
  sched:
    - at: [wp_lighthouse, tower]
      h: [6, 20]
    - at: [wp_lighthouse, tower]
- id: person_marre_bona
