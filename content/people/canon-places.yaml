  region: marre
  home: marre_canal
  hint: 'a broad-backed man carrying a bale up wet steps'
  meet: 'He sets the bale down on its mark. “Toma Fach. Thoolman cloth, by the smell. Every wall up there has a map on it. I carry what the maps are about.”'
  talk:
    - 'Toma can tell what a house is buying by how its barges sit in the water.'
    - '“Three palazzi on this bend,” Toma says. “I am welcome at the back of one.”'
