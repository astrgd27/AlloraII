  name: 'Mother Gundel'
  title: 'Keeper of the Sisters'
  region: eintenn
  home: place_eintenn_standing_sisters
  hint: 'an old woman untying faded rags and tying on fresh ones'
  meet: '“Do not walk between them,” she says, not unkindly. “Round. Mother Gundel. I keep count of the wishes.”'
  talk:
    - 'Mother Gundel says the stones lean a finger further each year, toward each other.'
    - '“People ask them for small things,” she says. “That is why it works.”'
  sched:
    - at: [place_eintenn_standing_sisters, thorn]
      h: [6, 20]
    - at: [place_eintenn_standing_sisters, stones]
- id: person_eintenn_falk
