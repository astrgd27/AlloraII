  region: eintenn
  home: place_eintenn_cloudgate_pass
  hint: 'a lean man watching a cloud as if it had spoken'
  meet: '“Not today,” he says, before you ask. “Falk Scree. Tomorrow before noon, or not at all.”'
  talk:
    - 'Falk leaves firewood in the shelter every autumn and has never found out who uses it.'
    - '“The mountain does not hate you,” Falk says. “It has not noticed you.”'
  sched:
    - at: [place_eintenn_cloudgate_pass, shelter]
      h: [6, 20]
    - at: [place_eintenn_cloudgate_pass, cairns]
