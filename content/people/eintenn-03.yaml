  home: place_eintenn_brackenfell
  hint: 'a stooped man with a long narrow spade'
  meet: '“Step on the brown, not the green,” he says. “Ortwin Peat. The green is water with a skin on.”'
  talk:
    - 'Ortwin once cut a pair of boots out of the moor, a thousand years old and better made than his.'
    - '“It burns slow and it burns all night,” Ortwin says. “Like a grudge.”'
