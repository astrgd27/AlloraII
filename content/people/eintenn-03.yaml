  hint: 'a red-armed woman carrying four mugs in each hand'
  meet: 'She puts eight mugs down without spilling. “Imke Spile. Sit anywhere that is not under the big one. It falls.”'
  talk:
    - 'Imke settles every argument about who shot what by pointing at the wall.'
    - '“Foresters drink like men who work alone,” Imke says. “All at once.”'
