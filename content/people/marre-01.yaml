# Marre, first batch: twenty small places round the Piazza, the city, the Lazaretto, the mainland and the Glass Isles.
- id: person_marre_tonina
  origin: allora2
  kind: person
  roots:
    - place_marre_calle_inchiostro
  name: 'Tonina Sgarb'
  title: 'Scrivener of the Calle'
  region: marre
  home: place_marre_calle_inchiostro
  hint: 'a woman with a black thumb and a pen behind each ear'
  meet: 'She blots the line before she looks up. “Tonina Sgarb. I copy what I am given and forget it by supper. That is the trade.”'
  talk:
    - 'Tonina can tell a clerk of the Council from a clerk of the Cerdans by the paper they bring.'
    - '“A fair hand is worth more than a fair face here,” Tonina says. “Faces change at Carnevale.”'
  sched:
    - at: [place_marre_calle_inchiostro, desks]
      h: [6, 20]
    - at: [place_marre_calle_inchiostro, stair]
- id: person_marre_bortolo
  origin: allora2
  kind: person
  roots:
    - place_marre_molo_grano
  name: 'Bortolo Pes'
  title: 'Measurer of Grain'
  region: marre
  home: place_marre_molo_grano
  hint: 'a broad man with chaff in his beard and a tally-board on a cord'
  meet: '“Stand off the plank,” he says, and then, when the sack has passed: “Bortolo Pes. I measure. The Republic believes me, so the bargemen must.”'
  talk:
    - 'Bortolo says the barges ride lower in a good year, and that he can read the harvest from the bridge.'
    - '“Level measure,” Bortolo says. “Not heaped, not shaken. Level.”'
  sched:
    - at: [place_marre_molo_grano, quay]
      h: [6, 20]
    - at: [place_marre_molo_grano, measure]
- id: person_marre_marietta
  origin: allora2
  kind: person
  roots:
    - place_marre_campo_leoni
  name: 'Marietta Zan'
  title: 'Lion-Keeper of the Matron'
  region: marre
  home: place_marre_campo_leoni
  hint: 'an old woman polishing a stone lion with her sleeve'
  meet: '“Rub his nose,” she says. “This one you may.” She watches you do it. “Marietta Zan. I keep the glass ones. These keep me.”'
  talk:
    - 'Marietta has dusted the sleeping lion every morning for forty years and says he has never once stirred.'
    - '“One awake, one asleep,” Marietta says. “That is how to run a city.”'
  sched:
    - at: [place_marre_campo_leoni, well]
      h: [6, 20]
    - at: [place_marre_campo_leoni, houses]
- id: person_marre_nane
  origin: allora2
  kind: person
  roots:
    - place_marre_riva_ombra
  name: 'Nane Tosat'
  title: 'Boatman of the Riva'
  region: marre
  home: place_marre_riva_ombra
  hint: 'a boatman resting on his oar with his cap over his eyes'
  meet: 'He lifts the cap an inch. “Nane Tosat. I carry bread in and letters out. I do not read either.”'
  talk:
    - 'Nane knows which families have been waiting a week and which a year, by where they moor.'
    - '“In summer the roof is the punishment,” Nane says. “The judge only chooses how long.”'
  sched:
    - at: [place_marre_riva_ombra, steps]
      h: [6, 20]
    - at: [place_marre_riva_ombra, grating]
- id: person_marre_catina
  origin: allora2
  kind: person
  roots:
    - place_marre_osteria_bauta
  name: 'Catina Fol'
  title: 'Keeper of the Bauta'
  region: marre
  home: place_marre_osteria_bauta
  hint: 'a woman who fills your cup without asking and listens without seeming to'
  meet: 'She sets the cup down. “Catina Fol. Drink, pay, and talk about the weather. Everyone here does.”'
  talk:
    - 'Catina can tell who is watching whom by which bench they choose.'
    - '“I hear nothing,” Catina says. “I am paid twice for it.”'
  sched:
