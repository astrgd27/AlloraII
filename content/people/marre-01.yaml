    - at: [place_marre_ash_isle, tips]
      h: [6, 20]
    - at: [place_marre_ash_isle, sieves]
- id: person_marre_vettor
  origin: allora2
  kind: person
  roots:
    - place_marre_guard_boats
  name: 'Vettor Stagn'
  title: 'Captain of the Guard Boats'
  region: marre
  home: place_marre_guard_boats
  hint: 'a patient man counting lit windows on the far shore'
  meet: 'He finishes counting first. “Vettor Stagn. Every master is at his furnace tonight. That is all I am asked.”'
  talk:
    - 'Vettor has rowed round the Isles for eleven years and knows every glassmaker by his silhouette.'
    - '“They are the richest prisoners in the world,” Vettor says. “I am the poorest gaoler.”'
