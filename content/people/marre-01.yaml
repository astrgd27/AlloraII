  title: 'Cullet-Picker of Ash Isle'
  region: marre
  home: place_marre_ash_isle
  hint: 'a girl with rag-bound hands and a sack that clinks'
  meet: 'She shakes the sack at you. “Nineta Scoa. Do not pick anything up. You will bleed, and then you will know why.”'
  talk:
    - 'Nineta can tell which furnace a shard came from by its green.'
    - '“They burn it, they break it, they buy it back,” Nineta says. “I am the only one who gets paid twice.”'
