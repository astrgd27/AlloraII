    - at: [place_marre_barge_stair, stair]
      h: [6, 20]
    - at: [place_marre_barge_stair, sheds]
- id: person_marre_orsetta
  origin: allora2
  kind: person
  roots:
    - place_marre_silk_sheds
  name: 'Orsetta Brun'
  title: 'Silk-Wife of the Sheds'
  region: marre
  home: place_marre_silk_sheds
  hint: 'a woman carrying a tray of leaves as if it were asleep'
  meet: '“Softly,” she says. “They can hear you.” She sets the tray down. “Orsetta Brun. No shouting, no smoke, no thunder if you can help it.”'
  talk:
    - 'Orsetta has not slept a whole night in silk season since she was a girl.'
    - '“The city wears it,” Orsetta says. “We raise it. Ask which is harder.”'
