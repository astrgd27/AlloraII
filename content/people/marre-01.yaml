      h: [6, 20]
    - at: [place_marre_osteria_bauta, snug]
- id: person_marre_menego
  origin: allora2
  kind: person
  roots:
    - place_marre_squero_storto
  name: 'Menego Rui'
  title: 'Boatwright of the Squero'
  region: marre
  home: place_marre_squero_storto
  hint: 'a man sighting along a plank with one eye shut'
  meet: '“Crooked,” he says, pleased, and puts the plank down. “Menego Rui. If it were straight it would go in circles.”'
  talk:
    - 'Menego builds one boat in a season and says the Arsenal builds a galley a day because nobody has to love a galley.'
    - '“Eight woods in a gondola,” Menego says. “And one man’s temper.”'
  sched:
    - at: [place_marre_squero_storto, slip]
      h: [6, 20]
    - at: [place_marre_squero_storto, loft]
- id: person_marre_betta
  origin: allora2
  kind: person
  roots:
    - place_marre_pescaria
  name: 'Betta Guss'
  title: 'Fishwife of the Pescaria'
  region: marre
  home: place_marre_pescaria
  hint: 'a woman gutting sardines faster than you can count them'
  meet: '“Fresh,” she says, before you ask. “Betta Guss. If it winks at you it is too fresh.”'
  talk:
    - 'Betta knows which cook buys for which palazzo, and what each house is eating less of this month.'
    - '“The Ten Families eat what I say is good,” Betta says. “They think their cooks choose.”'
  sched:
    - at: [place_marre_pescaria, slabs]
      h: [6, 20]
    - at: [place_marre_pescaria, boats]
- id: person_marre_zuane
  origin: allora2
  kind: person
  roots:
    - place_marre_corte_tinta
  name: 'Zuane Tinto'
  title: 'Dyer of the Corte'
  region: marre
  home: place_marre_corte_tinta
  hint: 'a man whose hands are blue to the wrist and red above it'
  meet: 'He holds up both hands. “Zuane Tinto. Do not shake them. It does not come off.”'
  talk:
    - 'Zuane will not say which house’s colour is hardest to match, only that one of them never pays on time.'
    - '“Every house has a colour,” Zuane says. “I am the only man in Marre who wears them all.”'
  sched:
    - at: [place_marre_corte_tinta, vats]
      h: [6, 20]
    - at: [place_marre_corte_tinta, lines]
- id: person_marre_lucieta
  origin: allora2
  kind: person
  roots:
    - place_marre_ponte_maschere
  name: 'Lucieta Bas'
  title: 'Mask-Maker of the Ponte'
  region: marre
  home: place_marre_ponte_maschere
  hint: 'a young woman painting a white mask with a brush of three hairs'
  meet: '“Hold still,” she says, and measures your face with her thumb. “Lucieta Bas. You would suit a plain one. Most people do.”'
  talk:
    - 'Lucieta remembers every face she has fitted, which is more than her customers would like.'
    - '“By law nobody may ask who you are in a mask,” Lucieta says. “Nobody said I could not know.”'
  sched:
    - at: [place_marre_ponte_maschere, stalls]
      h: [6, 20]
    - at: [place_marre_ponte_maschere, span]
- id: person_marre_anzolo
  origin: allora2
  kind: person
  roots:
    - place_marre_fondamenta_specchi
  name: 'Anzolo Fri'
  title: 'Mirror-Dealer of the Fondamenta'
  region: marre
  home: place_marre_fondamenta_specchi
  hint: 'a thin man who looks at your reflection instead of at you'
  meet: 'He speaks to the glass. “Anzolo Fri. Every mirror here is honest. That is why they are dear.”'
  talk:
    - 'Anzolo can name the master of any mirror by the colour of its silver.'
    - '“A cheap mirror flatters,” Anzolo says. “Ours do not, and people pay for it. Explain that.”'
  sched:
    - at: [place_marre_fondamenta_specchi, shops]
      h: [6, 20]
    - at: [place_marre_fondamenta_specchi, landing]
- id: person_marre_stae
  origin: allora2
  kind: person
  roots:
    - place_marre_waiting_roads
  name: 'Stae Dolfi'
  title: 'Oarsman of the Health Boat'
  region: marre
  home: place_marre_waiting_roads
  hint: 'a sunburnt man who keeps an oar’s length from everyone'
  meet: 'He holds up a hand before you come closer. “Stae Dolfi. I row the officers round. Stay upwind and we shall get on.”'
  talk:
    - 'Stae counts days for forty ships at once and has never been wrong by one.'
    - '“Day thirty-nine is the long one,” Stae says.'
