    - at: [place_marre_silk_sheds, sheds]
      h: [6, 20]
    - at: [place_marre_silk_sheds, reels]
- id: person_marre_bepi
  origin: allora2
  kind: person
  roots:
    - place_marre_chiusa_vecchia
  name: 'Bepi Sguaz'
  title: 'Keeper of the Chiusa'
  region: marre
  home: place_marre_chiusa_vecchia
  hint: 'a man in mud to the knee with a heron standing beside him'
  meet: '“Mind the heron,” he says. “He was here first. Bepi Sguaz. I let the water in and I let it out.”'
  talk:
    - 'Bepi is offered a bribe by every farmer each spring and takes them all, in order.'
    - '“Water is patient,” Bepi says. “Farmers are not. I stand between.”'
  sched:
    - at: [place_marre_chiusa_vecchia, gates]
      h: [6, 20]
    - at: [place_marre_chiusa_vecchia, dyke]
