    - at: [place_marre_quiet_isle, pits]
      h: [6, 20]
    - at: [place_marre_quiet_isle, hut]
- id: person_marre_agnesina
  origin: allora2
  kind: person
  roots:
    - place_marre_isle_of_simples
  name: 'Agnesina Rov'
  title: 'Herb-Wife of the Simples'
  region: marre
  home: place_marre_isle_of_simples
  hint: 'a small woman in a straw hat, crushing a leaf under your nose'
  meet: '“Smell,” she says. “Now you will not forget it. Agnesina Rov. Half of physic is not picking the wrong one.”'
  talk:
    - 'Agnesina sends a basket to the wards every dawn and gets it back empty every dusk.'
    - '“The fever-bark comes from across the sea,” Agnesina says. “Everything else comes from me.”'
  sched:
    - at: [place_marre_isle_of_simples, beds]
      h: [6, 20]
    - at: [place_marre_isle_of_simples, stillroom]
- id: person_marre_checo
  origin: allora2
  kind: person
  roots:
    - place_marre_stilt_huts
  name: 'Checo Bisat'
  title: 'Eel-Man of the Shallows'
  region: marre
  home: place_marre_stilt_huts
  hint: 'a wiry man hauling a wicker trap hand over hand'
  meet: '“Wet feet,” he says, looking at yours. “Checo Bisat. Sit on the dry side. There is one.”'
  talk:
    - 'Checo knows the lagoon’s channels by the colour of the water and has never owned a chart.'
    - '“The city thinks the lagoon is its moat,” Checo says. “It is its larder.”'
  sched:
    - at: [place_marre_stilt_huts, platform]
      h: [6, 20]
    - at: [place_marre_stilt_huts, traps]
- id: person_marre_iseppo
  origin: allora2
  kind: person
  roots:
    - place_marre_pilots_rest
  name: 'Iseppo Lanz'
  title: 'Pilot of the Bar'
  region: marre
  home: place_marre_pilots_rest
  hint: 'a grey man watching the water as if it owed him money'
  meet: 'He does not turn round. “Iseppo Lanz. The bar moved a boat’s length last winter. Nobody told the charts.”'
  talk:
    - 'Iseppo has brought in every spice-galley for twenty autumns and says they ride lower each year.'
    - '“A foreign captain asks how deep,” Iseppo says. “A wise one asks me to take the helm.”'
  sched:
    - at: [place_marre_pilots_rest, lookout]
      h: [6, 20]
    - at: [place_marre_pilots_rest, boathouse]
- id: person_marre_gasparo
  origin: allora2
  kind: person
  roots:
    - place_marre_barge_stair
  name: 'Gasparo Ton'
  title: 'Barge-Master of the Stair'
  region: marre
  home: place_marre_barge_stair
  hint: 'a heavy man shouting at a barge as if it could hear'
  meet: 'He stops shouting to look you over. “Gasparo Ton. If it floats and it is slow, it is mine.”'
  talk:
    - 'Gasparo says the city would starve in a week without his barges and has said so to a senator.'
    - '“Glass goes out on galleys,” Gasparo says. “Supper comes in on me.”'
