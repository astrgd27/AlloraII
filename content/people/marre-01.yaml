      h: [6, 20]
    - at: [place_marre_waiting_roads, anchorage]
- id: person_marre_tita
  origin: allora2
  kind: person
  roots:
    - place_marre_quiet_isle
  name: 'Tita Nard'
  title: 'Corpse-Bearer of the Quiet Isle'
  region: marre
  home: place_marre_quiet_isle
  hint: 'a big, gentle man with lime on his boots and a ledger under his arm'
  meet: 'He takes off his cap. “Tita Nard. I write them all down. Somebody comes asking, in the end.”'
  talk:
    - 'Tita says the island is the only place in the lagoon where nobody lies to him.'
    - '“A name and a day,” Tita says. “It is not much. It is more than the sea gives.”'
