      h: [8, 18]
    - at: [marre_palace, cerdans]
- id: person_marre_felicita
  origin: allora2
  kind: person
  roots: [marre_palace, o_cerdans]
  name: Felicita Brol
  title: Mirror-Scryer of the Cerdans
  region: marre
  home: marre_palace
  group: o_cerdans
  hint: a pale young woman who blinks in daylight like someone come up from a cellar
  meet: '“You are standing in my light,” she says, though the room has none. “Felicita Brol. I watch the glasses. Do not ask what I see.”'
  talk:
    - 'Felicita says the mirrors show what is there, which on feast nights is less than you would think.'
    - '“The Blind Mirror sees further than any of us,” Felicita says. “I only see sooner.”'
