- id: person_marre_chiara
  origin: allora2
  kind: person
  roots: [marre_palace, o_cerdans]
  name: Chiara Dand
  title: Constable of the Cerdans
  region: marre
  home: marre_palace
  group: o_cerdans
  hint: a square-shouldered woman who stands where she can see both doors
  meet: '“You walk too fast,” she says. “People look at fast.” A nod. “Chiara Dand. Constable. Slow down and you will see more.”'
  talk:
    - 'Chiara has walked the Piazza every day for nine years and can tell a stranger by his shoes.'
    - '“Arrest the right one,” Chiara says. “The Capo forgives slow. He does not forgive wrong.”'
  sched:
