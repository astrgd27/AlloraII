name: Balance report

# Runs the balance bot on every pull request and posts its report as a comment.
# The comment is updated in place on later pushes.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: balance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm balance --out balance-report.md
      - name: Post the report
        if: always() && hashFiles('balance-report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- allora-balance-report -->';
            const body = fs.readFileSync('balance-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
